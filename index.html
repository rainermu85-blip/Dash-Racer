*{margin:0;padding:0;box-sizing:border-box;touch-action:none}
body{background:#000;display:flex;align-items:center;justify-content:center;height:100dvh;overflow:hidden;font-family:'Gravity Pixel',monospace}
#wrap{position:relative;width:100%;max-width:480px;height:100dvh;-webkit-tap-highlight-color:transparent}
canvas{position:absolute;top:0;left:0;width:100%;height:100%}
#hud{position:absolute;top:0;left:0;right:0;display:grid;grid-template-columns:1fr .85fr 1fr 44px;align-items:center;gap:10px;padding:max(10px,env(safe-area-inset-top)) 12px 14px;background:linear-gradient(to bottom,rgba(8,3,18,.85),rgba(8,3,18,.38) 70%,transparent);pointer-events:none;z-index:5}
.hb{display:flex;flex-direction:column;gap:6px;min-width:0}
.hl{font-size:7px;color:#a6c9e4;letter-spacing:1px;text-shadow:1px 1px 0 #000}
.hv{font-size:20px;font-weight:700;line-height:1.15;color:#f7edff;text-shadow:2px 2px 0 #10091b;font-variant-numeric:tabular-nums}
#spdVal{font-size:22px}
#placeVal{color:#ffe066;text-shadow:2px 2px 0 #10091b,0 0 6px rgba(255,224,102,.3)}
#lapVal{color:#e3bdf0;font-size:18px}
#progBar{position:absolute;top:76px;left:14px;right:14px;pointer-events:none;z-index:5}
#progLabel{font-size:7px;color:#a6c9e4;letter-spacing:1px;margin-bottom:9px;text-shadow:1px 1px 0 #000}
#racePercent{float:right;letter-spacing:0;color:#e4d6eb}
#progTrack{position:relative;height:4px;background:rgba(255,79,216,.17);box-shadow:0 0 5px rgba(255,79,216,.25);border-radius:2px;overflow:visible}
.progMarker{position:absolute;top:-1px;width:6px;height:6px;border-radius:50%;transform:translateX(-50%);box-shadow:0 0 3px currentColor;transition:left .1s linear}
#markerPlayer{width:9px;height:9px;top:-2.5px;border:1px solid #fff3b8}
#timeBoard{position:absolute;top:111px;right:14px;text-align:right;pointer-events:none;z-index:5;display:flex;flex-direction:column;gap:7px}
.lapTime{font-size:12px;line-height:1.35;color:rgba(232,216,239,.46);text-shadow:1px 1px 0 #000;letter-spacing:0;font-variant-numeric:tabular-nums}
.lapTime.current{color:#f5eafa}
.lapTime.best{color:#84dbe8}
#segmentBoard{position:absolute;bottom:14px;left:14px;pointer-events:none;z-index:5;display:flex;align-items:baseline;gap:6px;opacity:.65}
.segmentTitle{font-size:6px;color:#a6c9e4;letter-spacing:1px;text-shadow:1px 1px 0 #000}
#segmentVal{font-size:8px;color:#e8d8ef;text-shadow:1px 1px 0 #000}
#energyBoard{position:absolute;left:0;bottom:24px;margin:0!important;white-space:nowrap}
#energyBoard .segmentTitle{font-size:7px;margin-bottom:6px}
#energyVal{font-size:11px!important;color:#8ce5e8!important}
@media(max-width:350px){#hud{gap:8px}.hv{font-size:18px}#spdVal{font-size:20px}#lapVal{font-size:16px}.hl{font-size:6px}}

/* Boost Meter UI */
#turboGauge{--turbo-bar-width:16px;--turbo-button-size:calc(var(--turbo-bar-width)*2.2);position:absolute;right:14px;top:48%;display:flex;flex-direction:column;align-items:center;z-index:10;background:rgba(0,0,0,.6);padding:8px;border-radius:12px 12px 25px 25px;box-shadow:0 0 10px rgba(0,0,0,.5)}
#boostContainer{display:flex;justify-content:center;cursor:pointer;touch-action:none}
#boostBarWrap{width:var(--turbo-bar-width);height:100px;background:rgba(255,255,255,0.1);border-radius:3px;display:flex;flex-direction:column-reverse;overflow:hidden;box-shadow:inset 0 0 5px #000;}
.bSeg{width:100%;height:33.33%;border-bottom:2px solid #000;background:#2a0f62;transition:background 0.1s;}
.bSeg.on{background:#ff6b35;box-shadow:0 0 8px #ff6b35;}

#btns{position:absolute;bottom:0;left:0;right:0;height:150px;display:flex;z-index:5;background:linear-gradient(to top,rgba(0,0,0,.25),transparent)}
.btn{flex:1;display:flex;align-items:center;justify-content:center;font-size:30px;user-select:none;cursor:pointer;color:rgba(255,255,255,.3)}
.steerArrow{transition:color .08s,text-shadow .08s}
#bL.on .steerArrow{color:#9bcee1;text-shadow:0 0 4px rgba(126,203,255,.35)}
#bR.on .steerArrow{color:#e8a99c;text-shadow:0 0 4px rgba(255,107,53,.3)}
.race-control{position:absolute;z-index:10;visibility:hidden;touch-action:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
#wrap.racing .race-control{visibility:visible}
#turboButton{position:relative;width:var(--turbo-button-size);height:var(--turbo-button-size);flex:none;margin-top:-1px;border:2px solid #fd765f;border-radius:50%;background:linear-gradient(#f34542,#b51328);box-shadow:0 2px 0 #620d23,0 0 6px rgba(238,45,68,.25);display:flex;align-items:center;justify-content:center;transition:box-shadow .08s,filter .15s}
#turboButton svg{width:20px;height:20px;fill:#ffdf47;filter:drop-shadow(0 0 2px rgba(255,210,52,.45))}
#turboButton.empty{filter:saturate(.65);opacity:.72}

let skyGrad, vigGrad, hGlowGrad, seaGrad;
let sunCanvas, sunR;
let moonCanvas, moonR;
let currentProgressRatio = 0;
const bgStars = [];

function renderOffscreenSun() {
  sunR = Math.min(W, H) * 0.14;
  sunCanvas = document.createElement('canvas');
  sunCanvas.width = sunR * 2.2;
  sunCanvas.height = sunR * 2.2;
  const sCtx = sunCanvas.getContext('2d');
  const cx = sunCanvas.width / 2, cy = sunCanvas.height / 2;

  const sGrad = sCtx.createRadialGradient(cx, cy, sunR * 0.1, cx, cy, sunR);

  sCtx.fillStyle = '#ffcc4d';

  sCtx.globalCompositeOperation = 'destination-out';

    const gapY = cy + sunR * 0.05 + i * sunR * 0.11;
    sCtx.fillRect(cx - sunR, gapY, sunR * 2, stripeH);
  }
}

function renderOffscreenMoon() {
  moonR = Math.min(W, H) * 0.10; // slightly smaller than the sun for elegance
  moonCanvas = document.createElement('canvas');
  moonCanvas.width = moonR * 3.0; // wider canvas for the beautiful glow
  moonCanvas.height = moonR * 3.0;
  const mCtx = moonCanvas.getContext('2d');
  const cx = moonCanvas.width / 2, cy = moonCanvas.height / 2;

  // 1. Draw soft outer cyan/blue celestial aura glow
  const auraGrad = mCtx.createRadialGradient(cx, cy, moonR * 0.2, cx, cy, moonR * 1.3);
  auraGrad.addColorStop(0, 'rgba(34, 212, 253, 0.45)');
  auraGrad.addColorStop(0.4, 'rgba(34, 212, 253, 0.15)');
  auraGrad.addColorStop(1, 'rgba(34, 212, 253, 0)');
  mCtx.fillStyle = auraGrad;
  mCtx.beginPath();
  mCtx.arc(cx, cy, moonR * 1.3, 0, Math.PI * 2);
  mCtx.fill();

  // 2. Draw outer circle of the moon (glowing pale-silver)
  mCtx.fillStyle = '#f0fbfd';
  mCtx.beginPath();
  mCtx.arc(cx, cy, moonR, 0, Math.PI * 2);
  mCtx.fill();

  mCtx.globalCompositeOperation = 'destination-out';
  mCtx.beginPath();

  mCtx.arc(cx + moonR * 0.38, cy - moonR * 0.12, moonR * 0.95, 0, Math.PI * 2);
  mCtx.fill();
  mCtx.globalCompositeOperation = 'source-over';
}

function getDreamZone(idx) {
  // Dream Odyssey is a point-to-point route; the runout stays in the final world.
  const i = Math.max(0, Math.trunc(idx));
  for(const tunnel of DREAM_TUNNELS){if(i<tunnel.start)return tunnel.from;if(i<tunnel.end)return 'tunnel';}
  return 'underwater';
}

// The three Dream Odyssey tunnels are portals: each one sits between two completely
// different worlds and morphs from the palette of the world it leaves to the
// palette of the world it opens into.
const DREAM_TUNNELS = [
  { start: 450, end: 660, from: 'steppe', to: 'arctic' },
  { start: 1320, end: 1490, from: 'arctic', to: 'dali' },
  { start: 2140, end: 2310, from: 'dali',   to: 'underwater' }

const DREAM_PORTAL_PALETTE = {
  steppe:     { wall: '#3b3830', accent: '#e0b871', light: '#ffeccb' },
  arctic:     { wall: '#152f49', accent: '#5fe0ff', light: '#dff6ff' },

// Palette + entrance/exit weighting at a given tunnel segment, or null outside.
function getTunnelStyle(segIdx) {
  const i = Math.max(0, Math.trunc(segIdx));
  let t = null;
  for (const cand of DREAM_TUNNELS) { if (i >= cand.start && i < cand.end) { t = cand; break; } }
  if (!t) return null;

  const p = (i - t.start) / (t.end - t.start); // 0 at entrance, 1 at exit
  const a = DREAM_PORTAL_PALETTE[t.from], b = DREAM_PORTAL_PALETTE[t.to];
  const entry = clamp(1 - p / 0.07, 0, 1);
  const exit = clamp((p - 0.88) / 0.12, 0, 1);
  const alpine = t.to === 'arctic';
  const wall = alpine ? interpolateColor('#555960','#394b5c',p) : interpolateColor(a.wall, b.wall, p);
  const light = interpolateColor(a.light, b.light, p);
  // Interpolating one accent straight into the other passes through mud at the
  // midpoint. Routing it through a vivid core instead makes the middle of the
  // tunnel — the point furthest from either world — read as the portal itself.
  const CORE = alpine ? '#bac4ca' : '#d8c2ff';
  const accent = p < 0.5
    ? interpolateColor(a.accent, CORE, p * 2)
    : interpolateColor(CORE, b.accent, (p - 0.5) * 2);
  return {
    p, entry, exit, start: t.start, end: t.end, from: t.from, to: t.to,
    accent,
    light,
    // Continuous material, without bright/dark striping at segment boundaries.
    wall
  };
}

// Which world the surroundings (sky, lighting, scenery) belong to at a segment.
// Sky and backdrop are picked from the camera's segment, so at a plain zone edge
// the whole environment flips in a single frame. Inside a portal barely any sky
// is visible, so the flip is moved a third of the way in: it happens while the
// tunnel hides it, and you drive out into a world that already finished changing.
const PORTAL_WORLD_SWITCH = 1 / 3;
function getDreamWorld(idx) {
  const i = Math.max(0, Math.trunc(idx));
  for (const t of DREAM_TUNNELS) {
    if (i >= t.start && i < t.end) {
      return (i - t.start) / (t.end - t.start) < PORTAL_WORLD_SWITCH ? t.from : t.to;
    }
  }
  return getDreamZone(i);
}

// Weather can't simply follow getDreamWorld — it is drawn over the tunnel, and
// snow indoors looks wrong. It stays off inside a portal and fades across the
// mouths instead of popping on the frame you cross them.
const PORTAL_WEATHER_FADE = 40;
function getDreamWeatherFade(idx) {
  const i = Math.max(0, Math.trunc(idx));
  for (const t of DREAM_TUNNELS) {
    if (i >= t.start && i < t.end) return 0;
    if (i >= t.start - PORTAL_WEATHER_FADE && i < t.start) return (t.start - i) / PORTAL_WEATHER_FADE;
    if (i >= t.end && i < t.end + PORTAL_WEATHER_FADE) return (i - t.end) / PORTAL_WEATHER_FADE;
  }
  return 1;
}

function initBackground() {
  bgMountains.length = 0; bgBuildings.length = 0; bgBirds.length = 0;
  for (let i = 0; i < 6; i++) {
    bgBirds.push({
      x: Math.random() * 800,
      y: 40 + Math.random() * 120,
      speed: 35 + Math.random() * 25,
      size: 5 + Math.random() * 5,
      phase: Math.random() * Math.PI * 2
    });
  }
  let mx = 0; 
  while (mx < BG_W) { 
    const h = 50 + Math.random() * 80; 
    const R = 1.0913 + Math.random() * 0.6408; 
    const w = 2 * h * R; 
    bgMountains.push({ 
      x: mx, 
      w: w, 
      h: h, 
      color: ['#0f051d','#130724','#0b0315'][~~(Math.random()*3)] 
    }); 
    mx += w * 0.45 + Math.random() * 50; 
  }
  
  if (currentLevel === 1 || currentLevel === LEVEL_HILLS || currentLevel === LEVEL_HIGHWAY) {
    let bx = 0;
    while (bx < BG_W) {
      const bW = 35 + Math.random() * 45; 
      const bH = 40 + Math.random() * 140; 
      
      // Choose building style:
      // 0: Elegant full neon window grid + sleek top horizontal bar
      // 1: Modern skyscraper with side neon banding + grid windows
      // 2: Sleek skyscraper with vertical center spine + sleek window rows
      const style = ~~(Math.random() * 3);
      const neonColor = ['#1ccdfd', '#ff4fd8', '#ffcc4d', '#00ffaa'][~~(Math.random()*4)];
      
      // Generate a beautiful, structured window grid centered on the building
      const windows = [];
      const padX = 5, padY = 8;
      const winW = 2, winH = 3;
      const gapX = 4, gapY = 6;
      
      const cols = Math.floor((bW - padX * 2) / (winW + gapX));
      const rows = Math.floor((bH - padY * 2) / (winH + gapY));
      
      const startX = (bW - (cols * (winW + gapX) - gapX)) / 2;
      const startY = (bH - (rows * (winH + gapY) - gapY)) / 2;
      
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          // Decide if this window is turned on (light up)
          let litProbability = 0.5;
          if (style === 0) litProbability = 0.62;
          else if (style === 1) litProbability = 0.38;
          else litProbability = 0.26;
          
          if (Math.random() < litProbability) {
            // Cohesive cyber color palette for windows: cyber pink, cyan, or warm amber
            const rColor = Math.random();
            let winColor = 'rgba(255, 238, 170, 0.85)'; // Warm cozy amber default
            if (rColor < 0.12) winColor = '#ff4fd8'; // Neon pink
            else if (rColor < 0.24) winColor = '#1ccdfd'; // Neon cyan
            
            windows.push({
              x: startX + c * (winW + gapX),
              y: startY + r * (winH + gapY),
              color: winColor
            });
          }
        }
      }
      
      bgBuildings.push({
        x: bx,
        w: bW,
        h: bH,
        color: '#05030d', // Ultra deep sleek dark building silhouette
        style: style,
        neonColor: neonColor,
        windows: windows
      });
      bx += bW + 8 + Math.random() * 15;
    }
  }

  weatherParticles = [];
  if (currentLevel === LEVEL_DREAM) {
    for (let i = 0; i < 150; i++) {
      weatherParticles.push({
        x: Math.random() * 1200,
        y: Math.random() * 700,
        speedY: 40 + Math.random() * 60,
        speedX: -20 + Math.random() * 40,
        size: 1.5 + Math.random() * 3.0,
        alpha: 0.3 + Math.random() * 0.7,
        phase: Math.random() * Math.PI * 2
      });
    }
  }
}

function drawTile(offset, y, drawFn) {
  ctx.save(); let shift = offset % BG_W; if (shift < 0) shift += BG_W;
  ctx.translate(-shift, y); for (let x = 0; x < shift + W; x += BG_W) { drawFn(); ctx.translate(BG_W, 0); }
  ctx.restore();
}

// Wrap only once an object's full silhouette/halo is beyond the screen edge.
function backdropX(base, offset, padding) {
  const span = W + padding * 2;
  return ((base - offset + padding) % span + span) % span - padding;
}

function drawLastLapBanner() {
  if(currentLevel===LEVEL_DREAM||lastLapElapsed===null||player.finished)return;
  if(lastLapElapsed>=1.5)return;
  ctx.save();ctx.translate(W*.5,H*.5);ctx.globalAlpha=1;
  const maxWidth=Math.min(W*.86,500)*.88;
  let size=Math.min(38,W*.068);ctx.font=`italic bold ${size}px "Gravity Pixel",monospace`;
  const measured=ctx.measureText('LAST LAP').width;
  if(measured>maxWidth)size*=maxWidth/measured;

  ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';
  ctx.fillStyle='rgba(82,196,255,.28)';ctx.fillText('LAST LAP',0,1);

}

function drawOceanShootingStar(progressDist) {
  // The shooting star accompanies the final straight, before the finish line.
  const starZStart = 3 * TRACK_LENGTH - OCEAN_SHOOTING_STAR_LEAD * SEGMENT_LENGTH;
  const starZEnd = 3 * TRACK_LENGTH - 6 * SEGMENT_LENGTH;
  if (progressDist >= starZStart && progressDist <= starZEnd) {
    const starRatio = (progressDist - starZStart) / (starZEnd - starZStart); // 0.0 to 1.0

    // Start top-left and streak down-right in the upper sky
    const startX = W * 0.22;
    const startY = H * 0.04;
    const endX = W * 0.48;
    const endY = H * 0.20;

    const headX = startX + (endX - startX) * starRatio;
    const headY = startY + (endY - startY) * starRatio;

    // Smooth trail that grows then shrinks at the end
    const trailOffset = Math.min(starRatio, 0.18, 1.0 - starRatio);
    const tailX = startX + (endX - startX) * (starRatio - trailOffset);
    const tailY = startY + (endY - startY) * (starRatio - trailOffset);

    ctx.save();
    const starGrad = ctx.createLinearGradient(tailX, tailY, headX, headY);
    starGrad.addColorStop(0, 'rgba(34, 212, 253, 0.0)');
    starGrad.addColorStop(0.4, 'rgba(34, 212, 253, 0.4)');
    starGrad.addColorStop(1, 'rgba(255, 255, 255, 1.0)');

    ctx.strokeStyle = starGrad;
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(tailX, tailY);
    ctx.lineTo(headX, headY);
    ctx.stroke();

    // Intense core bright spark with soft cyber glow
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = '#22d4fd';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(headX, headY, 1.8, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function makeSection(len, curve, hill) { const arr = []; for (let i = 0; i < len; i++) arr.push({ curve, hill }); return arr; }

let segments = [];
function buildSegments() {
    let trackDef;
    if (currentLevel === 1) {
        trackDef = [
            ...makeSection(100, 0, 0), ...makeSection(80, 0.4, 0), ...makeSection(40, 0, 0),
            ...makeSection(60, -0.9, 25), ...makeSection(40, 0, 40), ...makeSection(30, 0, 0),
            ...makeSection(90, 0.5, -30), ...makeSection(40, 0, -10), ...makeSection(60, 0, 0),
            ...makeSection(60, -1.1, 0), ...makeSection(30, 0, 0), ...makeSection(50, 0.8, 30),
            ...makeSection(50, -0.8, -30), ...makeSection(40, 0, 0), ...makeSection(100, -0.6, 0),       
            ...makeSection(30, 0, 0), ...makeSection(30, 0, 22), ...makeSection(120, 0, 0),
            ...makeSection(30, 0, -22), ...makeSection(70, 0.2, 0)
        ];
    } else if (currentLevel === 2) {
        // Level 2 Coastal Highway: sweeping long curves, beautiful crests and steep roller coaster drops!
        trackDef = [
            ...makeSection(120, 0, 0),
            ...makeSection(80, 0.5, 12),
            ...makeSection(60, 0.0, 26),
            ...makeSection(90, -0.7, -22),
            ...makeSection(50, -0.2, -8),
            ...makeSection(80, 0.8, 5),
            ...makeSection(100, 0, 0),
            ...makeSection(70, -0.9, 32),
            ...makeSection(40, 0, 0),
            ...makeSection(90, 0.6, -32),
            ...makeSection(120, -0.5, 0),
            ...makeSection(80, 0, -14),
            ...makeSection(100, 0.8, 18),
            ...makeSection(100, -0.4, -8),
            ...makeSection(110, 0, 0)
        ];
    } else if (currentLevel === LEVEL_HILLS || currentLevel === LEVEL_HIGHWAY) {
        // Closed harmonic routes: soft climbs through Beverly, fast sweeping
        // turns downtown. The start/finish has zero slope and zero curvature.
        trackDef = Array.from({ length: SEGMENT_COUNT }, (_, i) => {
            const t = i / SEGMENT_COUNT * Math.PI * 2;
            const envelope = 1 - Math.cos(t);
            return currentLevel === LEVEL_HILLS
                ? { curve: envelope * (0.40 * Math.sin(2 * t) - 0.20 * Math.sin(4 * t) + 0.08*Math.sin(6*t)),
                    hill: envelope * (16 * Math.sin(2 * t) - 13 * Math.sin(3 * t) + 5 * Math.sin(5 * t)) }
                : { curve: envelope * (0.24 * Math.sin(2 * t) - 0.08 * Math.sin(4 * t)),
                    hill: envelope * (2 * Math.sin(2 * t) - 2 * Math.sin(3 * t)) };
        });
    } else if (currentLevel === LEVEL_SPACE) {
        // Space Wave: undulating sci-fi track with deep dips and long S-curves.
        // Built with continuous, infinitely differentiable sine waves multiplied by a smooth envelope.
        // The repeating pseudo-3D profile joins smoothly in height, curvature and slope.
        trackDef = [];
        const N = SEGMENT_COUNT;
        for (let i = 0; i < N; i++) {
            const t = (i / N) * Math.PI * 2;
            const env = 1 - Math.cos(t); // smooth envelope that is 0 at start and end
            
            // Long sweeping S-curves
            const curve = env * (0.42 * Math.sin(t * 2) - 0.28 * Math.sin(t * 4) + 0.12 * Math.sin(t * 6));
            
            // Dramatic roller coaster dips, climbs, and valleys
            // Using integer-harmonic sines so the discrete sum is mathematically guaranteed to be exactly 0.
            const hill = env * (32.0 * Math.sin(t * 2) - 45.0 * Math.sin(t * 3) + 15.0 * Math.sin(t * 5));
            
            trackDef.push({ curve, hill });
        }
    } else {
        // Dream Odyssey Arctic Tunnel and Snow Desert
        // alternating zones:
        // Tundra [0,450), granite [450,660), snowy forest [660,1320),
        // Dalí portal [1320,1490), desert [1490,2140),
        // sea portal [2140,2310), deep sea [2310,2875].
        trackDef = [
            // Sparse tundra (450 segments)
            ...makeSection(150, 0, 0),       // starting flat straight
            ...makeSection(100, 0.15, 0),    // gentle curve left
            ...makeSection(100, -0.2, 0),    // gentle curve right
            ...makeSection(50, 0, 8),        // gentle hill
            ...makeSection(50, 0, -8),       // gentle downhill
            
            // Granite 210, snowy forest 660, Dalí portal 170, desert 650,
            // marine lock 170, deep sea 565. The total remains 2875 segments.
            ...makeSection(35, 0, -30), ...makeSection(70, -.4, 0), ...makeSection(70, .45, 0), ...makeSection(35, 0, 30),
            ...makeSection(100, 0, 0), ...makeSection(180, .35, 5), ...makeSection(180, -.4, -5), ...makeSection(200, 0, 0),
            ...makeSection(30, 0, -22), ...makeSection(55, .3, 0), ...makeSection(55, -.3, 0), ...makeSection(30, 0, 22),
            ...makeSection(60, 0, 12), ...makeSection(60, 0, -18), ...makeSection(60, 0, 6),
            ...makeSection(95, .45, 0), ...makeSection(95, -.45, 0), ...makeSection(280, 0, 0),

function roadPreview(car,profile){
    const horizon=Math.max(1800,car.speed*(profile.lookAhead||1.1));

    const objects=[];
    for(let n=0;n<=Math.ceil(horizon/SEGMENT_LENGTH);n++){

        const seg=getSeg(car.z+n*SEGMENT_LENGTH),limits=getRoadLimits(car.z+n*SEGMENT_LENGTH);

function evaluateRaceLane(car,lane,snapshot,road){

        const crosses=other.x>Math.min(car.x,lane)-bodyClearance&&other.x<Math.max(car.x,lane)+bodyClearance;

                if(gap<Math.max(1400,headway+600))score-=3.5*(1-gap/Math.max(1500,headway+700));
                if(gap<headway+350)limit=Math.min(limit,Math.max(0,other.speed+(gap-headway)*2));

            }
        }
        // Two rivals must not both reserve the same passing slot.
        if(other.car!==player&&Math.abs(other.target-lane)<bodyClearance-.03&&Math.abs(gap)<650&&Math.abs(other.x-lane)>.3)score-=3;
    }

        const onLane=Math.abs(lane-object.x)<object.width;
        if(object.pickup){
            if(onLane){score+=7*(1-clamp(object.distance/road.horizon,0,1)*.6);collect=true;}

const OPP_RANDOM_TURBO={chancePerFrame:.0015,referenceFps:60,range:4000,duration:TURBO_DURATION,

    if(car.trafficLimit<Infinity||car.obstacleLimit<Infinity)return;
    if(car.passTarget&&Math.abs(car.x-(car.passTarget===player?getPlayerCollisionX():car.passTarget.x))<getCarCollisionRange(car,car.passTarget)+.05)return;

    if(recent>=OPP_RANDOM_TURBO.windowCap)return;
    if(Math.abs(getRaceDistance(car)-getRaceDistance(player))>=OPP_RANDOM_TURBO.range)return;
    const chance=1-Math.pow(1-OPP_RANDOM_TURBO.chancePerFrame,dt*OPP_RANDOM_TURBO.referenceFps);

        const acceleration=!boost&&speed>=base?Math.min(accel*mod,base*CLEAN_SPEED_LIMIT/CLEAN_SPEED_BUILD_TIME):accel*mod;
        return Math.min(target,speed+acceleration*dt);

    let target=Math.min(ceiling,base*(1+car.cleanSpeedBonus),limit)*(offroad?.36:1);

function updateOpponentRacecraft(car,dt,snapshot){

    car.raceAge+=dt;car.decisionTimer-=dt;car.laneHold=Math.max(0,car.laneHold-dt);

let opponentContacts=new Set();
function checkOpponentPairContacts(before,dt){
    const touching=new Set();
    for(let i=0;i<opponents.length;i++)for(let j=i+1;j<opponents.length;j++){
        const a=opponents[i],b=opponents[j];if(racerFinished(a)||racerFinished(b))continue;
        const p=before[i],q=before[j],relX=b.x-a.x,relZ=getRaceDistance(b)-getRaceDistance(a);

        if(!hit)continue;
        const key=i+':'+j;touching.add(key);
        const relative=hit.axis==='x'?((b.x-q.x)-(a.x-p.x))/dt:b.speed-a.speed;
        const closing=Math.max(0,-hit.side*relative);
        if(!opponentContacts.has(key)&&closing>.01&&a.collisionCooldown<=0&&b.collisionCooldown<=0){
            const severity=clamp(closing/(hit.axis==='x'?3:player.maxSpeed),0,1);
            if(hit.axis==='z'){

function initChapterTraffic() {
    chapterTime = 0;
    crossingEvents = new Map();
    highwayPolice = null;
    highwayPoliceLaps = new Set();
    highwayTraffic = currentLevel === LEVEL_HIGHWAY ? Array.from({ length: 22 }, (_, i) => ({
        z: (i * TRACK_LENGTH / 22 + 3000) % TRACK_LENGTH,
        x: HIGHWAY_ONCOMING_LANES[i % HIGHWAY_ONCOMING_LANES.length],
        speed: 1850 + (i % 5) * 150,
        color: ['#a68acc', '#df8cab', '#809ebe', '#ddd0bb'][i % 4]
    })) : [];
}

function updateChapterTraffic(dt) {
    chapterTime += dt * 1000;
    if (currentLevel !== LEVEL_HIGHWAY) return;
    for (const car of highwayTraffic) car.z = (car.z - car.speed * dt + TRACK_LENGTH) % TRACK_LENGTH;
    // One fly-by per player lap. Absolute race distance prevents a departed
    // patrol car from wrapping around and appearing a second time.
    const raceZ = getRaceDistance(player);
    if (!player.finished && player.z >= HIGHWAY_POLICE_TRIGGER * SEGMENT_LENGTH && !highwayPoliceLaps.has(player.lap)) {
        highwayPoliceLaps.add(player.lap);
        highwayPolice = { z: raceZ + 14000, x: HIGHWAY_ONCOMING_LANES[2], speed: HIGHWAY_POLICE_SPEED, color: '#e1e5f2', police: true };
    }
    if (highwayPolice) {
        highwayPolice.z -= highwayPolice.speed * dt;
        if (highwayPolice.z < raceZ - 1800) highwayPolice = null;
    }
    updateHighwayTrains(dt);
}

function updateHighwayTrains(dt, countdown = false) {
    if (currentLevel !== LEVEL_HIGHWAY) return;
    for (const event of crossingEvents.values()) event.elapsed += dt;
    for (const crossing of HIGHWAY_CROSSINGS) {
        if (crossing.kind !== 'train' || player.finished) continue;
        if (countdown) {
            // One opening fly-by as "2" changes to "1". Only the train clock
            // advances here; racing cars and the player remain on the grid.
            const key = `1:${crossing.index}`;
            if (crossing.countdown && cntVal === 2 && !crossingEvents.has(key)) {
                crossingEvents.set(key, { elapsed: 0 });
            }
            continue;
        }
        const localDistance = crossing.index * SEGMENT_LENGTH - player.z;
        const distance = localDistance < 0 ? localDistance + TRACK_LENGTH : localDistance;
        const lap = localDistance < 0 ? player.lap + 1 : player.lap;
        const key = `${lap}:${crossing.index}`;
        // A shorter lead keeps the fast crossing visible on approach. Wrapped
        // distance also schedules the opening bridge before later lap starts.
        if (lap <= 3 && distance <= clamp(player.speed * HIGHWAY_TRAIN_APPROACH_TIME, 2500, 10500) && !crossingEvents.has(key)) {
            crossingEvents.set(key, { elapsed: 0 });
        }
    }
}

function crossingTrainPhase(index) {
    // The last slice of the current deck stays ahead of the camera briefly;
    // farther past it, a visible wrapped deck belongs to the following lap.
    const lap = (index + 1) * SEGMENT_LENGTH <= player.z ? player.lap + 1 : player.lap;
    const event = crossingEvents.get(`${lap}:${index}`);
    return event ? Math.min(1.01, event.elapsed / HIGHWAY_TRAIN_DURATION) : null;
}

const curveCamera={look:0};

  let center=0,heading=0;
  for(let i=0;i<steps;i++){
    heading+=getSeg(player.z+i*SEGMENT_LENGTH).curve*5;
    center+=heading;heading*=.85;
  }
  // Aim toward the upcoming road centre, with a bounded, gradual pan.
  const target=clamp(center/W*.8,-CAMERA_LOOK_LIMIT,CAMERA_LOOK_LIMIT);
  curveCamera.look+=(target-curveCamera.look)*(1-Math.exp(-dt*3));

function project(worldZ, worldX, worldY, camZ, camX, camY, projY, rawY = false) {
  const tz = worldZ - camZ; if (tz <= 0) return null;
  const scale = (CAMERA_DEPTH + player.fovOffset) / tz;

function getProjAt(segIdx, t) {

  return {
    x: s.proj_rx1 + (s.proj_rx2 - s.proj_rx1) * t,
    y: s.proj_y1 + (s.proj_y2 - s.proj_y1) * t,

function getPlayerRoadProjection(footprint){
  const start=Math.floor(player.z/SEGMENT_LENGTH),base=segments[start%SEGMENT_COUNT];
  const fraction=player.z/SEGMENT_LENGTH-start,camY=CAMERA_HEIGHT+base.worldY+base.hillDelta*fraction,horizon=Math.trunc(H*.5)+player.pitch*1.5;
  const projected=new Map();let offset=0,delta=0,maxY=H,stop=Infinity;
  for(let n=0;n<450;n++){
    if(n>stop+2)break;
    const index=start+n,seg=segments[index%SEGMENT_COUNT],z=index*SEGMENT_LENGTH;
    let p1=project(z,0,seg.worldY,player.z,player.x*ROAD_WIDTH*.82,camY,horizon);
    const p2=project(z+SEGMENT_LENGTH,0,seg.worldY+seg.hillDelta,player.z,player.x*ROAD_WIDTH*.82,camY,horizon);
    if(!p1&&p2)p1=project(player.z+1,0,seg.worldY,player.z,player.x*ROAD_WIDTH*.82,camY,horizon);
    if(!p1||!p2)continue;
    const x1=p1.x+offset-curveCamera.look*W;delta+=seg.curve*5;offset+=delta;delta*=.85;
    const x2=p2.x+offset-curveCamera.look*W,clipY=maxY,visible=p1.y>=0&&p2.y<maxY;
    projected.set(index,{p1,p2,x1,x2,clipY,visible});
    if(visible)maxY=p2.y;
    if(maxY<footprint.top&&stop===Infinity)stop=n;
  }
  const at=(index,t)=>{const p=projected.get(index);return p?{x:p.x1+(p.x2-p.x1)*t,y:p.p1.y+(p.p2.y-p.p1.y)*t,w:p.p1.w+(p.p2.w-p.p1.w)*t}:null;};
  return{projected,at};
}
function getPlayerChevronContact(){
  if(currentLevel!==LEVEL_SPACE||player.finished)return null;
  const footprint=getPlayerChevronFootprint(),{projected,at}=getPlayerRoadProjection(footprint);
  for(const lapOffset of[0,SEGMENT_COUNT])for(let panel=0;panel<panelStarts.length;panel++)for(const arrow of[0,2,4]){
    const index=lapOffset+panelStarts[panel]+arrow,slice=projected.get(index);

    const shape=getChevronShape(index,panel%2?1:-1,at);if(!shape)continue;

}

function drawEstateWallSlice(x1,y1,w1,x2,y2,w2,index,narrow){
  const limit=(CAMERA_DEPTH+player.fovOffset)/64*ROAD_WIDTH*W/2;
  if(w2>limit)return;
  if(w1>limit){
    // Clip along the actual projected edge, including its bend and road offset.
    const t=(w1-limit)/(w1-w2);
    x1+=(x2-x1)*t;y1+=(y2-y1)*t;w1=limit;
  }
  if(index>=500&&index<570)return; // Keep the advance warning and closure visible.
  for(const side of[-1,1]){
    const period=narrow?30:34,phase=(index+(side<0?13:0))%period;
    const block=Math.floor((index+(side<0?13:0))/period),variant=(block+(side<0?2:0))%4;

function drawFantasyGlyph(x, y, size, seed, strokeWidth = 1.6) {

function drawNeonGlyph(x, y, size, seed, color, weight = 1.9, illuminated = true) {
    if (!illuminated) {

        drawFantasyGlyph(x, y, size, seed, weight);

    ctx.strokeStyle = color; ctx.globalAlpha = alpha * 0.2;
    drawFantasyGlyph(x, y, size, seed, weight + 4);

    drawFantasyGlyph(x, y, size, seed, 0.45);

function drawAdvertSymbol(x, y, size, shape, color) {
    ctx.save(); ctx.translate(x, y); ctx.scale(size, size);
    ctx.strokeStyle = color; ctx.lineWidth = 0.12; ctx.beginPath();
    if (shape === 'circle' || shape === 'sun') {
        ctx.arc(0, 0, 0.65, 0, Math.PI * 2);
        if (shape === 'sun') for (let i = 0; i < 8; i++) {
            const angle = i * Math.PI / 4;
            ctx.moveTo(Math.cos(angle) * 0.83, Math.sin(angle) * 0.83);
            ctx.lineTo(Math.cos(angle), Math.sin(angle));
        }
    } else if (shape === 'diamond') {
        ctx.moveTo(0, -0.85); ctx.lineTo(0.75, 0); ctx.lineTo(0, 0.85); ctx.lineTo(-0.75, 0); ctx.closePath();
    } else if (shape === 'arrow') {
        ctx.moveTo(-0.8, 0); ctx.lineTo(0.8, 0); ctx.lineTo(0.1, -0.55);
        ctx.moveTo(0.8, 0); ctx.lineTo(0.1, 0.55);
    } else {
        for (let i = 0; i < 10; i++) {
            const angle = i * Math.PI / 5 - Math.PI / 2, radius = i % 2 ? 0.38 : 0.85;
            const px = Math.cos(angle) * radius, py = Math.sin(angle) * radius;
            if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.closePath();
    }
    ctx.stroke(); ctx.restore();
}

function drawHighwayAdvert(x, y, width, height, seed) {
    const style = getHighwayAdStyle(seed);
    const base = (seed * 5 + Math.floor(seed / 12)) % HIGHWAY_NEON_COLORS.length;
    // One in five signs is a backlit color panel with dark, high-contrast ink.
    const coloredBackground = seed % 5 === 2;
    const primary = coloredBackground ? '#10091c' : HIGHWAY_NEON_COLORS[base];
    const secondary = style.colors > 1 ? (coloredBackground ? '#2b143e' : HIGHWAY_NEON_COLORS[(base + 3) % HIGHWAY_NEON_COLORS.length]) : primary;
    const accent = style.colors > 2 ? (coloredBackground ? '#341949' : HIGHWAY_NEON_COLORS[(base + 6) % HIGHWAY_NEON_COLORS.length]) : secondary;
    const tall = height > width * 1.15, weight = style.bold ? 3.8 : 1.35;
    ctx.save();
    // Frameless signs have a quiet mounting plate; their lettering is the light.
    ctx.fillStyle = coloredBackground ? HIGHWAY_NEON_COLORS[base] : (style.frame === 'none' ? '#120b1f' : '#080613');
    ctx.fillRect(x, y, width, height);
    if (style.frame === 'single' || style.frame === 'double') {
        drawNeonFrame(x + 1, y + 1, width - 2, height - 2, secondary, secondary);
        if (style.frame === 'double') {
            ctx.strokeStyle = primary; ctx.lineWidth = Math.min(width, height) * 0.015;
            ctx.strokeRect(x + width * 0.07, y + height * 0.05, width * 0.86, height * 0.9);
        }
    } else if (style.frame === 'corners') {
        ctx.strokeStyle = secondary; ctx.lineWidth = Math.max(0.6, Math.min(width, height) * 0.035);
        const arm = Math.min(width, height) * 0.22;
        ctx.beginPath();
        for (const [dx, dy] of [[0, 0], [1, 0], [0, 1], [1, 1]]) {
            const px = x + dx * width, py = y + dy * height;
            ctx.moveTo(px + (dx ? -arm : arm), py); ctx.lineTo(px, py); ctx.lineTo(px, py + (dy ? -arm : arm));
        }
        ctx.stroke();
    }
    if (tall) {
        const top = style.icon ? height * 0.24 : height * 0.12;
        const bottom = style.caption ? height * 0.14 : height * 0.08;
        const rows = style.columns === 2 ? 3 : 4;
        const rowHeight = (height - top - bottom) / rows;
        const size = Math.min(width / style.columns * 0.55, rowHeight * 0.76);
        if (style.icon) drawAdvertSymbol(x + width / 2, y + height * 0.12, Math.min(width * 0.22, height * 0.075), style.icon, accent);
        for (let col = 0; col < style.columns; col++) {
            for (let row = 0; row < rows; row++) {
                const gx = x + width * (col + 0.5) / style.columns;
                const gy = y + top + rowHeight * (row + 0.5);
                drawNeonGlyph(gx, gy, size, seed + col * 3 + row, col === 0 ? primary : secondary, weight, !coloredBackground);
            }
        }
    } else {
        const iconWidth = style.icon ? width * 0.24 : 0;
        const textX = x + width * 0.1 + iconWidth, textWidth = width * 0.8 - iconWidth;
        const centerY = y + height * (style.caption ? 0.42 : 0.5);
        if (style.icon) drawAdvertSymbol(x + width * 0.16, centerY, Math.min(width * 0.085, height * 0.23), style.icon, accent);
        if (style.wordmark) {
            const brand = HIGHWAY_AD_BRANDS[seed % HIGHWAY_AD_BRANDS.length];
            const fontSize = Math.min(height * 0.38, textWidth / (brand.length * 0.62));
            ctx.font = `${style.bold ? '900' : '400'} ${fontSize}px monospace`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.strokeStyle = primary; ctx.lineWidth = fontSize * 0.12;
            const alpha = ctx.globalAlpha; ctx.globalAlpha = alpha * 0.18;
            if (!coloredBackground) ctx.strokeText(brand, textX + textWidth / 2, centerY);
            ctx.globalAlpha = alpha; ctx.fillStyle = primary;
            ctx.fillText(brand, textX + textWidth / 2, centerY);
        } else {
            const rows = style.columns === 2 ? 2 : 1, columns = style.columns === 2 ? 2 : 4;
            const size = Math.min(textWidth / columns * 0.75, height * (rows === 2 ? 0.3 : 0.4));
            for (let col = 0; col < columns; col++) for (let row = 0; row < rows; row++) {
                drawNeonGlyph(textX + textWidth * (col + 0.5) / columns,
                    centerY + (row - (rows - 1) / 2) * height * 0.34, size, seed + col + row * 3,
                    style.columns === 2 && col === 1 ? secondary : primary, weight, !coloredBackground);
            }
        }
    }
    if (style.caption && width >= 25) {
        const fontSize = Math.min(width * 0.09, height * 0.1);
        ctx.font = `${style.bold ? 'bold' : 'normal'} ${fontSize}px monospace`;
        ctx.fillStyle = secondary; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(tall ? ['24H', 'OPEN', '1989'][seed % 3] : ['AFTER DARK', 'OPEN 24H', 'EST. 1989'][seed % 3], x + width / 2, y + height * (tall ? 0.93 : 0.84));
    }
    ctx.restore();
}

function drawHighwayIndustry(x, y, scale, seed, ts) {

function drawHighwayCrossing(x, y, roadWidth, kind, phase, ts) {
    if (roadWidth < 2) return;
    const scale = roadWidth / 120;
    // Continue beyond both screen edges, even on curves and distant approaches.
    const left = Math.min(-1000, (-80 - x) / scale);
    const right = Math.max(1000, (W + 80 - x) / scale);
    const slope = kind === 'train' ? 0 : 0.055;
    const frontY = px => -158 + px * slope;
    const deckY = px => -171 + px * slope;
    beginChapterSprite(x, y, scale);
    ctx.fillStyle = '#161226';
    ctx.beginPath(); ctx.moveTo(left, frontY(left)); ctx.lineTo(right, frontY(right));
    ctx.lineTo(right, frontY(right) + 25); ctx.lineTo(left, frontY(left) + 25); ctx.fill();
    for (const px of [-164, 164]) {
        const top = frontY(px) + 11;
        ctx.fillStyle = '#201a31'; ctx.fillRect(px - 8, top, 16, -top);
        ctx.fillStyle = '#403052'; ctx.fillRect(px - 8, top, 3, -top);
        ctx.fillStyle = '#a964d1'; ctx.fillRect(px - 7, -35, 2, 23);
    }
    ctx.fillStyle = '#393049';
    ctx.beginPath(); ctx.moveTo(left, frontY(left)); ctx.lineTo(left + 24, frontY(left + 24) - 25);
    ctx.lineTo(right, frontY(right) - 25); ctx.lineTo(right, frontY(right)); ctx.fill();
    ctx.strokeStyle = '#d38bff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(left, frontY(left) + 22); ctx.lineTo(right, frontY(right) + 22); ctx.stroke();
    ctx.save();
    // Clip to the visible span; the complete train enters and leaves offscreen.
    const viewLeft = (-60 - x) / scale, viewRight = (W + 60 - x) / scale;
    ctx.beginPath(); ctx.rect(viewLeft, -10000, viewRight - viewLeft, 20000); ctx.clip();
    if (kind === 'train' && phase !== null && phase >= 0 && phase <= 1) {
        const lead = viewLeft - 32 + phase * (viewRight - viewLeft + 812);
        for (let i = 0; i < 6; i++) {
            const tx = lead - i * 113, ty = deckY(tx);
            ctx.fillStyle = '#d7d0ef';
            ctx.beginPath(); ctx.moveTo(tx - 106, ty - 28); ctx.lineTo(tx - 16, ty - 28);
            ctx.quadraticCurveTo(tx + 10, ty - 22, tx + (i === 0 ? 28 : 0), ty - 3);
            ctx.lineTo(tx - 106, ty - 5); ctx.closePath(); ctx.fill();
            ctx.fillStyle = '#55447e'; ctx.fillRect(tx - 95, ty - 24, 75, 10);
            ctx.fillStyle = '#bd71e9'; ctx.fillRect(tx - 105, ty - 9, 94, 3);
            ctx.fillStyle = '#b9ecff'; ctx.fillRect(tx - 84, ty - 22, 18, 2);
        }
        ctx.strokeStyle = 'rgba(199,146,255,.3)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(lead - 760, deckY(lead) - 13); ctx.lineTo(lead - 660, deckY(lead) - 13); ctx.stroke();
    } else if (kind === 'road' && scale >= 0.06) {
        // Repeat traffic along the longer deck, with no visible reset at its ends.
        const offset = (ts * 0.08) % 213;
        const start = Math.floor((viewLeft - offset) / 213) * 213 + offset;
        for (let tx = start; tx < viewRight + 40; tx += 213) {
            const ty = deckY(tx), car = Math.round((tx - offset) / 213);
            const variant = ((car % 3) + 3) % 3;
            drawCrossingCar(tx, ty - 1, ['#7855ae', '#c569a4', '#7797b2'][variant], variant, slope);
        }
    }
    ctx.restore();
    ctx.strokeStyle = '#7c6093'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(left, frontY(left) - 42); ctx.lineTo(right, frontY(right) - 42); ctx.stroke();
    // Only draw railing posts that can be visible, regardless of bridge length.
    const postSpacing = Math.max(32, Math.ceil(3 / scale / 32) * 32);
    for (let px = Math.ceil(viewLeft / postSpacing) * postSpacing; px < viewRight; px += postSpacing) {
        ctx.beginPath(); ctx.moveTo(px, frontY(px) - 42); ctx.lineTo(px, frontY(px) - 26); ctx.stroke();
    }
    if (kind === 'train') {
        ctx.strokeStyle = '#5f527d'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(left, frontY(left) - 61); ctx.lineTo(right, frontY(right) - 61); ctx.stroke();
    }
    ctx.restore();
}

function isHighwayTunnel(index) {
    return currentLevel === LEVEL_HIGHWAY && index >= HIGHWAY_TUNNEL.start && index < HIGHWAY_TUNNEL.end;
}

function paintHighwayPolygon(points, color, seal = false) {
    ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(points[0].x, points[0].y);
    for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
    ctx.closePath(); ctx.fill();
    if (seal) { ctx.strokeStyle = color; ctx.lineWidth = 0.8; ctx.stroke(); }
}

// Longitudinal walls use the same world projection as the road, so nearby
// facades move continuously rather than appearing as isolated billboards.
function drawHighwayDistrictSegment(x1, y1, w1, x2, y2, w2, p1Scale, p2Scale, index) {
    if (isHighwayTunnel(index)) return;
    const city = index < HIGHWAY_TUNNEL.start;
    if (city ? index < 8 || index > HIGHWAY_TUNNEL.start - 12 : index < HIGHWAY_TUNNEL.end + 12) return;
    const nearScale = (CAMERA_DEPTH + player.fovOffset) / 64;
    if (p2Scale > nearScale) return;
    if (p1Scale > nearScale) {
        const ratio = nearScale / p1Scale;
        x1 = W / 2 + (x1 - W / 2) * ratio; w1 *= ratio; p1Scale = nearScale;
    }
    for (const side of [-1, 1]) {
        if(!city&&side>0&&index>=875&&index<=949)continue; // The grid station has an open forecourt.
        const offset = index + (side < 0 ? 13 : 0), period = city ? 28 : 42;
        const phase = offset % period, block = Math.floor(offset / period);
        if (phase >= period - (city ? 4 : 12)) continue; // Alleys and loading yards.
        // Keep the entire roadside billboard in front of the facade, including its wide panel.
        const lane = side < 0 ? -4.55 : 2.35;
        const variant=block%5;
        const height = city ? 3400 + (block * 7 % 5) * 720 : 1450 + block % 3 * 300;
        const near = (l, h) => ({ x: x1 + l * w1, y: y1 - h * p1Scale * H / 2 });
        const far = (l, h) => ({ x: x2 + l * w2, y: y2 - h * p2Scale * H / 2 });
        const a = near(lane, 0), b = far(lane, 0);
        if (Math.min(a.x, b.x) > W + 2 || Math.max(a.x, b.x) < -2) continue;
        const wall = (low, high, color, seal = false) => paintHighwayPolygon([near(lane, low),near(lane,high),far(lane,high),far(lane,low)],color,seal);
        const palette = city ? ['#21172f','#30213e','#29223b','#36223f'] : ['#29283a','#2f293e','#242a39'];
        wall(0, height, palette[block % palette.length], true);
        const outward = lane + side * (city ? 0.55 : 0.9);
        paintHighwayPolygon([near(lane,height),far(lane,height),far(outward,height-180),near(outward,height-180)], city ? '#53415e' : '#565267');
        if (phase === 0 || phase === period - (city ? 5 : 13)) {
            const pt = phase === 0 ? near : far;
            paintHighwayPolygon([pt(lane,0),pt(lane,height),pt(outward,height-180),pt(outward,0)],'#181323');
        }
        if (w2 < 6) continue;
        if (city) {
            wall(0, 550, '#16101f');
            if(variant===1)wall(height-400,height,'#695068');
            if(variant===2&&phase%6<3)wall(550,height-130,'#293349');
            if(variant===3)for(let row=700;row<height;row+=430)wall(row,row+70,'#725064');
            if(variant===4&&phase%5===0)wall(550,height,'#947473');
            // Lit apartments, recessed bays and horizontal balcony ledges.
            for (let floor = 800; floor < height - 320; floor += variant===1?850:variant===3?500:650) {
                wall(floor - 60, floor, '#49364f');
                if (phase % (variant===2?5:3) !== 0) {
                    const lit = (block * 11 + Math.floor(floor / 650) * 7 + Math.floor(phase / 3)) % 5;
                    wall(floor + 100, floor + 370, lit < 2 ? '#272238' : lit === 2 ? '#b2899e' : lit === 3 ? '#668ca9' : '#c7a576');
                }
            }
            if (phase % 4 !== 0) wall(90, 360, block % 2 ? '#413349' : '#364550');
            wall(470, 505, HIGHWAY_NEON_COLORS[(block + (side < 0 ? 3 : 0)) % HIGHWAY_NEON_COLORS.length]);
            if (phase % 7 === 0) wall(580, height - 140, '#493548');
        } else {
            wall(height - 100, height - 65, '#779099');
            if (phase % 8 < 5) wall(height - 420, height - 190, block % 2 ? '#b88b57' : '#658d9d');
            if (phase % 10 === 0) wall(0, height, '#51475e');
            if (phase > 12 && phase < 18) {
                wall(0, 870, '#141320');
                for (let row = 160; row < 870; row += 160) wall(row,row+22,'#51465c');
            }
        }
    }
}

function drawHighwayTunnelSegment(x1, y1, w1, x2, y2, w2, p1Scale, p2Scale, index) {
    const nearScale = (CAMERA_DEPTH + player.fovOffset) / 64;
    if (p2Scale > nearScale) return;
    if (p1Scale > nearScale) {
        const ratio = nearScale / p1Scale;
        x1 = W / 2 + (x1 - W / 2) * ratio; w1 *= ratio; p1Scale = nearScale;
    }
    const h1 = p1Scale * HIGHWAY_TUNNEL.height * H / 2, h2 = p2Scale * HIGHWAY_TUNNEL.height * H / 2;
    const near = (lane, height = 0) => ({ x: x1 + lane * w1, y: y1 - height * h1 });
    const far = (lane, height = 0) => ({ x: x2 + lane * w2, y: y2 - height * h2 });
    const band = (left, right, height, color, seal = false) => paintHighwayPolygon([near(left, height), near(right, height), far(right, height), far(left, height)], color, seal);
    const wall = (lane, low, high, color) => paintHighwayPolygon([near(lane, low), near(lane, high), far(lane, high), far(lane, low)], color, low === 0 && high === 1);
    const wallGradient = ctx.createLinearGradient(0, y1 - h1, 0, y1);
    wallGradient.addColorStop(0, '#9e6718'); wallGradient.addColorStop(0.22, '#dda72e');
    wallGradient.addColorStop(0.72, '#b77a1b'); wallGradient.addColorStop(1, '#514536');
    wall(-3.62, 0, 1, wallGradient); wall(1.14, 0, 1, wallGradient);
    band(-3.62, 1.14, 1, '#0c0c0d', true);
    // Six lanes under one ceiling, with separate ducts over both carriageways.
    for (const lane of [-3.25, -1.6, -0.85, 0.8]) band(lane - 0.018, lane + 0.018, 0.985, '#302b26');
    wall(-3.62, 0.04, 0.075, '#8c7b5b'); wall(1.14, 0.04, 0.075, '#8c7b5b');
    wall(-3.62, 0.09, 0.105, '#e5ad3d'); wall(1.14, 0.09, 0.105, '#e5ad3d');
    if (w1 > 10 && w1 < W * 10) {
        if (index % 8 === 0) {
            ctx.strokeStyle = '#805820'; ctx.lineWidth = Math.max(0.5, Math.min(3, w1 * 0.007));
            ctx.beginPath();
            for (const lane of [-3.62, 1.14]) {
                const a = near(lane, 0.12), b = near(lane, 0.95);
                ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
            }
            ctx.stroke();
        }
        if (index % 12 === 0) {
            for (const lane of [...HIGHWAY_ONCOMING_LANES, -2 / 3, 0, 2 / 3]) {
                band(lane - 0.13, lane + 0.13, 0.982, '#55452b');
                band(lane - 0.095, lane + 0.095, 0.975, '#ffc35f');
                band(lane - 0.064, lane + 0.064, 0.972, '#fff0ad');
            }
        }
        if (index % 36 === 12) {
            const at = near(1.14, 0.48), width = Math.max(2, w1 * 0.035), height = Math.max(4, h1 * 0.11);
            ctx.fillStyle = '#152e26'; ctx.fillRect(at.x - width, at.y, width, height);
            ctx.fillStyle = '#64ec9a'; ctx.fillRect(at.x - width * 0.82, at.y + height * 0.15, width * 0.55, height * 0.68);
            ctx.fillStyle = '#e1f5c5'; ctx.fillRect(at.x - width * 0.65, at.y + height * 0.25, width * 0.17, height * 0.3);
        }
    }
    // Columns fill only the divider. Three consecutive road slices give each
    // support depth, while the gaps preserve views of approaching traffic.
    const columnPhase = (index - HIGHWAY_TUNNEL.start - 6 + 16) % 16;
    if (columnPhase < 3) {
        wall(-1.415, 0, 1, '#4c4132'); wall(-1.095, 0, 1, '#b49154');
        band(-1.415, -1.095, 0.025, '#6b5b43');
        if (columnPhase === 0) {
            paintHighwayPolygon([near(-1.415), near(-1.415, 1), near(-1.095, 1), near(-1.095)], '#d1ad68');
            paintHighwayPolygon([near(-1.13), near(-1.13, 1), near(-1.095, 1), near(-1.095)], '#e0c084');
            const a = near(-1.415, 0.16), b = near(-1.095, 0.16);
            ctx.strokeStyle = '#4d4438'; ctx.lineWidth = Math.max(1, Math.min(5, w1 * 0.02));
            ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        }
    }

// Faceted vaults use world-space height: their proportions stay consistent on

const DREAM_TUNNEL_HEIGHT = 2100;
function dreamTunnelProfile(marine, alpine = false) {
    if (alpine) return [[-1.22,0],[-1.30,0.50],[-1.16,0.78],[-0.83,1.03],[-0.35,1.17],[0.26,1.18],[0.76,1.05],[1.09,0.85],[1.28,0.56],[1.22,0]];

function paintDreamPolygon(points, color, seal = false) {
    ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(points[0].x, points[0].y);
    for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);

}
function drawDreamTunnelSegment(x1, y1, w1, x2, y2, w2, p1Scale, p2Scale, index, visible, tun) {
    const nearScale = (CAMERA_DEPTH + player.fovOffset) / 64;

        const ratio = nearScale / p1Scale;
        x1 = W / 2 + (x1 - W / 2) * ratio; w1 *= ratio; p1Scale = nearScale;
    }
    const h1 = p1Scale * DREAM_TUNNEL_HEIGHT * H / 2, h2 = p2Scale * DREAM_TUNNEL_HEIGHT * H / 2;
    const near = (lane, h = 0) => ({ x: x1 + lane * w1, y: y1 - h * h1 });
    const far = (lane, h = 0) => ({ x: x2 + lane * w2, y: y2 - h * h2 });
    const band = (left, right, h, color) => paintDreamPolygon([near(left,h), near(right,h), far(right,h), far(left,h)], color);
    const wallBand = (side, low, high, color) => {
        const marine = tun.to === 'underwater';
        const lane = h => side * (1.22 + (tun.to === 'arctic' ? (side<0 ? 0.08*h/0.50 : 0.06*h/0.56) : marine ? 0.08*h/0.55 : 0.12*h/0.52));

    const marine = tun.to === 'underwater', alpine = tun.to === 'arctic', phase = index - tun.start;
    const profile = dreamTunnelProfile(marine,alpine);
    if (visible) {
        // Only local road surfaces: no full-screen bands or lighting overlays.

        band(-1,1,0,alpine ? '#181e25' : marine ? '#0b171d' : '#16131c');

        if (Math.floor(index / 4) % 2 === 0) for (const lane of [-1/3,1/3]) band(lane-0.008,lane+0.008,0,interpolateColor(tun.light,'#8b8b96',0.35));

        const shade = wall ? 0 : j === 1 || j === profile.length - 3 ? 0.20 : 0.57;

    }

function isOceanRockTunnel(index) {
    return currentLevel === 2 && index >= OCEAN_ROCK_TUNNEL.start && index < OCEAN_ROCK_TUNNEL.end;
}

function makeOceanCliffProfile(index) {
    // Integer harmonics close the headland at the lap seam. Broad coves and
    // shorter ribs vary the silhouette without random changes between frames.
    const t = index / SEGMENT_COUNT * Math.PI * 2;
    const cove = Math.pow((1 + Math.sin(t * 5 + 0.6)) / 2, 6);
    const rib = Math.sin(t * 23) * 0.5 + Math.sin(t * 37 + 0.8) * 0.25;
    const peak = 5900 + Math.sin(t * 7 + 0.3) * 1100 + rib * 420 - cove * 2100;
    return [[-1.2 - cove * 0.22,0],[-1.5 - rib * 0.08 - cove * 0.4,550 + rib * 140],

            [-2.35 - Math.sin(t * 13) * 0.18 - cove * 0.7,peak * (0.59 + Math.sin(t * 17) * .1)],

}

function paintOceanPolygon(points, color, seal = false) {

    if (seal) { ctx.strokeStyle = color; ctx.lineWidth = 0.8; ctx.stroke(); }

function clipOceanSlice(x1,y1,w1,x2,y2,w2,p1Scale,p2Scale) {
    const nearScale = (CAMERA_DEPTH + player.fovOffset) / 64;
    if (p2Scale > nearScale) return null;
    if (p1Scale > nearScale) {
        const ratio = nearScale / p1Scale, horizon = H * 0.5 + player.pitch * 1.5;
        x1 = W/2 + (x1-W/2)*ratio; y1 = horizon + (y1-horizon)*ratio;
        w1 *= ratio; p1Scale = nearScale;
    }
    return [x1,y1,w1,x2,y2,w2,p1Scale,p2Scale];
}

function drawOceanCliffSegment(x1,y1,w1,x2,y2,w2,p1Scale,p2Scale,index) {
    const clipped = clipOceanSlice(x1,y1,w1,x2,y2,w2,p1Scale,p2Scale);
    if (!clipped) return;
    [x1,y1,w1,x2,y2,w2,p1Scale,p2Scale] = clipped;
    const source = oceanCliffProfiles[index], b = oceanCliffProfiles[(index+1)%SEGMENT_COUNT];
    if (!source || !b) return;
    const cut=clamp((player.z+64-segments[index].worldZReal)/SEGMENT_LENGTH,0,1);
    const a=cut>0?source.map(([lane,height],j)=>[lane+(b[j][0]-lane)*cut,height+(b[j][1]-height)*cut]):source;
    const near = ([lane,height]) => ({x:x1+lane*w1,y:y1-height*p1Scale*H/2});
    const far = ([lane,height]) => ({x:x2+lane*w2,y:y2-height*p2Scale*H/2});
    const face = (band,t,z) => {
        const laneA=a[band][0]+(a[band+1][0]-a[band][0])*t, laneB=b[band][0]+(b[band+1][0]-b[band][0])*t;
        const heightA=a[band][1]+(a[band+1][1]-a[band][1])*t, heightB=b[band][1]+(b[band+1][1]-b[band][1])*t;
        const pa=near([laneA,heightA]),pb=far([laneB,heightB]);
        return {x:pa.x+(pb.x-pa.x)*z,y:pa.y+(pb.y-pa.y)*z};
    };
    const topA=near(a[4]),topB=far(b[4]),footA=near(a[0]),footB=far(b[0]);
    // A grounded rock apron covers the gap behind recessed toes.
    paintOceanPolygon([{x:x1-w1*1.16,y:y1},footA,footB,{x:x2-w2*1.16,y:y2}],oceanRockPalette[0],true);
    paintOceanPolygon([topA,{x:0,y:topA.y},{x:0,y:topB.y},topB],oceanRockPalette[4],true);
    if (Math.min(footA.x,footB.x)>W && Math.min(topA.x,topB.x)>W) return;
    for (let band=0;band<4;band++) {
        const color = oceanRockPalette[[0,2,1,3][band]];
        paintOceanPolygon([near(a[band]),near(a[band+1]),far(b[band+1]),far(b[band])],color,true);
        if (w2 > 7) {
            // Broad slanted slabs are clipped across successive road slices,
            // instead of repeating a tiny triangle on each face.
            const cell=index+band*9, phase=(cell%17)/17, nextPhase=(cell%17+1)/17;
            const low=.08+Math.sin(Math.floor(cell/17)*1.7)*.06;
            const level=low+.7*phase, nextLevel=low+.7*nextPhase;
            const shade=oceanRockPalette[(Math.floor(cell/17)+band)%3===0?3:1];
            paintOceanPolygon([face(band,low,0),face(band,level,0),face(band,nextLevel,1),face(band,low,1)],shade);
            if (cell%17<16) paintOceanPolygon([face(band,level,0),face(band,level+.018,0),face(band,nextLevel+.018,1),face(band,nextLevel,1)],oceanRockPalette[5]);
            if ((index+band*7) % 23 === 0) {
                ctx.strokeStyle=oceanRockPalette[6]; ctx.lineWidth=Math.max(0.6,Math.min(2,w2*0.009));
                ctx.beginPath(); const p=face(band,0.1,0.25),q=face(band,0.5,0.57),r=face(band,0.95,0.76);
                ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.lineTo(r.x,r.y);ctx.stroke();
            }
        }
    }
    if(w2<7)return;
    for(const leaf of oceanCliffVegetation[index]){
        if(leaf.z<cut)continue;
        const along=(leaf.z-cut)/(1-cut),scale=1/((1-along)/p1Scale+along/p2Scale);
        const band=Math.min(3,Math.floor(leaf.u)),depth=along*scale/p2Scale;
        // The upper ground is the same plateau painted behind the last rock node.
        // Its plants keep that height instead of floating above the cliff silhouette.
        const spread=Math.max(0,leaf.u-4)*4;
        const pa=near([a[4][0]-spread,a[4][1]]),pb=far([b[4][0]-spread,b[4][1]]);
        const p=leaf.u<4?face(band,leaf.u-band,depth):{x:pa.x+(pb.x-pa.x)*depth,y:pa.y+(pb.y-pa.y)*depth};
        const r=Math.min(48,scale*H/2*leaf.radius);
        if(r<.6 || p.x < -r*2 || p.x>W+r*2 || p.y < -r*2 || p.y>H+r*2)continue;
        const leafShape=(size,color,dx=0,dy=0)=>{
            const vx=Math.cos(leaf.angle)*r*size,vy=Math.sin(leaf.angle)*r*size;
            const px=p.x+dx*r,py=p.y+dy*r;

function makeOceanCliffVegetation() {
    const foliage=Array.from({length:SEGMENT_COUNT},()=>[]);
    let seed=0x4d414445;
    const random=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296;};
    // Broad, overlapping islands of growth have jagged edges and bare pockets.
    // Fractional anchors and independent scatter remove segment/height rows.
    for(let center=-8;center<SEGMENT_COUNT;center+=5+random()*18){
        const u=.25+random()*3.15,width=.28+random()*.63,span=3+random()*9;
        const phase=random()*Math.PI*2,bloom=random()<.31,dark=random()<.37;
        const count=65+Math.floor(random()*100);
        for(let j=0;j<count;j++){
            const angle=random()*Math.PI*2,radius=Math.sqrt(random());
            let z=center+Math.cos(angle)*radius*span;
            const slope=u+Math.sin(angle)*radius*width+Math.sin((z-center)*.75+phase)*.16;
            // Holes within a patch and satellite tufts give it an uneven outline.
            if(random()<.14+Math.max(0,Math.sin(z*1.13+slope*4+phase))*.15)continue;
            z=(z%SEGMENT_COUNT+SEGMENT_COUNT)%SEGMENT_COUNT;
            const leaf={z:z%1,u:slope,radius:48+random()*105,
                angle:-1.2+random()*2.4,aspect:.65+random()*.55,dark,
                flower:bloom&&random()<.36,bud:random()<.16};
            if(slope>=.06 && slope<=3.94)foliage[Math.floor(z)].push(leaf);
        }
    }
    // New colonies climb higher faces and spill across the ground behind the rim.
    // The original patches stay in place, with no shared row/height grid.
    for(let center=-12;center<SEGMENT_COUNT;center+=10+random()*23){
        const upper=random()<.7,u=upper?1.25+random()*4.8:.6+random()*2.7;
        const width=.38+random()*.9,span=5+random()*12,phase=random()*Math.PI*2;
        const bloom=random()<.24,dark=random()<.4,count=70+Math.floor(random()*65);
        for(let j=0;j<count;j++){
            const angle=random()*Math.PI*2,radius=Math.sqrt(random());
            let z=center+Math.cos(angle)*radius*span;
            const slope=u+Math.sin(angle)*radius*width+Math.sin((z-center)*.54+phase)*.22;
            if(slope<.08||slope>6.8||random()<.2+Math.max(0,Math.sin(z*.77+slope*3+phase))*.13)continue;
            z=(z%SEGMENT_COUNT+SEGMENT_COUNT)%SEGMENT_COUNT;
            foliage[Math.floor(z)].push({z:z%1,u:slope,radius:48+random()*95,angle:-1.3+random()*2.6,
                aspect:.65+random()*.6,dark,flower:bloom&&random()<.32,bud:random()<.12});
        }
    }
    for(const leaves of foliage)leaves.sort((a,b)=>b.z-a.z);
    return foliage;
}

function drawOceanTunnelGraffiti(index,near,far) {
    const start=523,end=529;
    if(index<start||index>=end)return;
    const cut=clamp((player.z+64-segments[index].worldZReal)/SEGMENT_LENGTH,0,1);
    const u0=(end-index-cut)/(end-start)*320,u1=(end-index-1)/(end-start)*320;
    if(Math.abs(u1-u0)<.001)return;
    const lane=h=>h>.38?1.27-.11*(h-.38)/.35:1.22+.05*h/.38;
    const top=.52875,bottom=.42125;
    const points=[near(lane(top),top),near(lane(bottom),bottom),far(lane(top),top),far(lane(bottom),bottom)];
    const texture=getOceanTunnelGraffiti();
    // Two clipped triangles conform the paint to each existing wall slice.
    const triangle=(source,target)=>{
        const [p,q,r]=source,[a,b,c]=target;
        const sx=q.x-p.x,sy=q.y-p.y,tx=r.x-p.x,ty=r.y-p.y,det=sx*ty-sy*tx;
        if(Math.abs(det)<.001)return;
        const dx=b.x-a.x,dy=b.y-a.y,ex=c.x-a.x,ey=c.y-a.y;
        const ma=(dx*ty-ex*sy)/det,mb=(dy*ty-ey*sy)/det;
        const mc=(ex*sx-dx*tx)/det,md=(ey*sx-dy*tx)/det;
        const me=a.x-ma*p.x-mc*p.y,mf=a.y-mb*p.x-md*p.y;
        if(![ma,mb,mc,md,me,mf].every(Number.isFinite))return;
        ctx.save();ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.lineTo(c.x,c.y);ctx.closePath();ctx.clip();
        ctx.transform(ma,mb,mc,md,me,mf);ctx.drawImage(texture,0,0);ctx.restore();
    };
    const uv=[{x:u0,y:0},{x:u0,y:160},{x:u1,y:0},{x:u1,y:160}];
    triangle([uv[0],uv[1],uv[2]],[points[0],points[1],points[2]]);
    triangle([uv[2],uv[1],uv[3]],[points[2],points[1],points[3]]);
}

function drawOceanRockTunnelSegment(x1,y1,w1,x2,y2,w2,p1Scale,p2Scale,index) {

const coastalScreenModels=new Map();
function makeCoastalScreenModel(seed) {

// Clip the complete marina mesh into depth slices once. Every component uses
// the same coordinates: the house sits on the deck, and pilings meet the water.
function makeOceanPierSlices() {
    const slices=Array.from({length:OCEAN_PIER_LENGTH},()=>[]),faces=[];
    const add=(points,color,role='deck')=>faces.push({points:points.map(([lane,h,z])=>[2.05+(lane-2.05)*.82,h,z]),color,role});
    const flat=(left,right,back,front,height,color,role='deck')=>add([[left,height,back],[right,height,back],[right,height,front],[left,height,front]],color,role);
    const box=(left,right,back,front,bottom,top,color,role)=>{
        add([[left,bottom,back],[right,bottom,back],[right,top,back],[left,top,back]],color,role);
        add([[left,bottom,back],[left,bottom,front],[left,top,front],[left,top,back]],color,role);
        add([[right,bottom,back],[right,bottom,front],[right,top,front],[right,top,back]],color,role);
        flat(left,right,back,front,top,color,role);
    };
    const center=OCEAN_PIER_CENTER-OCEAN_PIER_INDEX;
    const support=(lane,z)=>box(lane-.035,lane+.035,z-.18,z+.18,-60,240,'#533338','support');
    // A straight walkway across the beach, exactly perpendicular to the road.
    for(let lane=2.05;lane<5.85;lane+=.15){
        const next=Math.min(5.85,lane+.15),h=Math.min(240,(lane-2.05)*170),h2=Math.min(240,(next-2.05)*170);
        add([[lane,h,center-2],[next,h2,center-2],[next,h2,center+2],[lane,h,center+2]],'#956342');
        add([[lane,h,center-2],[next,h2,center-2],[next,h2-70,center-2],[lane,h-70,center-2]],'#4d3037');
    }
    box(4.15,5.85,center-5,center+5,165,240,'#9f704d','deck');
    // Two narrow fingers branch along the shore for mooring small boats.
    box(3.84,4.12,center-13,center-2,150,240,'#936344','berth');
    box(5.35,5.63,center+2,center+13,150,240,'#936344','berth');
    for(const z of[center-12,center-8,center-4,center+4,center+8,center+12]){
        for(const lane of[z<center?3.98:5.49])support(lane,z);
    }
    for(const z of[center-5,center+5])for(const lane of[4.2,5.8])support(lane,z);
    for(const z of[center-1.8,center+1.8])for(const lane of[3.55,4.4,5.3])support(lane,z);
    // Planks continue across the landing and both boat fingers.
    for(let z=center-13;z<=center+13;z+=.85){
        if(Math.abs(z-center)<=5)flat(4.15,5.85,z,z+.06,241,'#d0a67b');
        if(z<center-2)flat(3.84,4.12,z,z+.06,241,'#d0a67b','berth');
        if(z>center+2)flat(5.35,5.63,z,z+.06,241,'#d0a67b','berth');
    }
    const rail=(lane,z,h)=>box(lane-.015,lane+.015,z-.07,z+.07,h,h+325,'#dfb68f','rail');
    for(const z of[center-2,center+2]){
        for(let lane=2.15;lane<4.15;lane+=.42)rail(lane,z,Math.min(240,(lane-2.05)*170));
        for(let lane=2.15;lane<4.15;lane+=.1){
            const h=Math.min(240,(lane-2.05)*170)+285;
            add([[lane,h,z-.04],[lane+.1,Math.min(240,(lane+.1-2.05)*170)+285,z-.04],[lane+.1,Math.min(240,(lane+.1-2.05)*170)+310,z-.04],[lane,h+25,z-.04]],'#e8c39c','rail');
        }
    }
    for(const z of[center-5,center+5]){
        for(let lane=4.2;lane<5.85;lane+=.42)rail(lane,z,240);
        add([[4.15,525,z],[5.85,525,z],[5.85,550,z],[4.15,550,z]],'#e8c39c','rail');
    }
    // Sea-blue boathouse with a gabled terracotta roof, fully on its platform.
    box(4.35,5.55,center-3,center+3,240,1200,'#257e87','house');
    add([[4.35,1200,center-3],[4.35,1850,center],[4.35,1200,center+3]],'#36a6a5','house');
    add([[5.55,1200,center-3],[5.55,1850,center],[5.55,1200,center+3]],'#246471','house');
    add([[4.15,1180,center-3.8],[5.75,1180,center-3.8],[5.75,1890,center],[4.15,1890,center]],'#c56672','roof');
    add([[4.15,1890,center],[5.75,1890,center],[5.75,1180,center+3.8],[4.15,1180,center+3.8]],'#874451','roof');
    // Door faces the walkway; near-side windows face the passing player.
    add([[4.34,240,center-1],[4.34,930,center-1],[4.34,930,center+1],[4.34,240,center+1]],'#182e48','house');
    for(const lane of[4.48,4.85,5.22]){
        add([[lane,600,center-3.02],[lane+.23,600,center-3.02],[lane+.23,1010,center-3.02],[lane,1010,center-3.02]],'#ffe2a6','window');
        add([[lane+.105,600,center-3.025],[lane+.125,600,center-3.025],[lane+.125,1010,center-3.025],[lane+.105,1010,center-3.025]],'#623d43','window');
    }
    // Low moored boats sit in the sea, alongside the fingers rather than on deck.
    for(const [lane,z,color]of[[4.42,center-9,'#20c4bc'],[5.97,center+9,'#e86b9d']]){
        const hull=[[lane-.22,60,z-3.3],[lane+.22,60,z-3.3],[lane+.3,60,z+1.8],[lane,60,z+3.7],[lane-.3,60,z+1.8]];
        add(hull,'#f1dcad','boat');
        for(let i=0;i<hull.length;i++){
            const a=hull[i],b=hull[(i+1)%hull.length];
            add([a,b,[b[0],-40,b[2]],[a[0],-40,a[2]]],color,'boat');
        }
        flat(lane-.15,lane+.15,z-1.8,z+1.3,90,'#25293e','boat');
        add([[lane-.17,90,z-.9],[lane+.17,90,z-.9],[lane+.15,310,z-.35],[lane-.15,310,z-.35]],'#77c9d1','boat');
        flat(lane-.15,lane+.15,z-.35,z+.75,310,'#f1dcad','boat');
        if(lane>5){
            box(lane-.012,lane+.012,z-.06,z+.06,90,2600,'#e6c998','boat');
            add([[lane,2470,z],[lane+.73,330,z],[lane+.02,330,z]],'#ffe5bb','boat');
            add([[lane-.025,2360,z],[lane-.48,420,z],[lane-.025,420,z]],'#f792b5','boat');
        }
        // Cleats and a short mooring line visibly tie each boat to the dock.
        const dock=lane<5?4.1:5.62;
        add([[dock,250,z-.08],[lane-.17,85,z-.08],[lane-.17,85,z+.04],[dock,250,z+.04]],'#f0cd9f','boat');
    }
    // Attach a lamp to either corner of the platform, above a rooted post.
    for(const z of[center-5,center+5]){
        box(4.2,4.23,z-.08,z+.08,240,900,'#d5b38e','rail');
        box(4.16,4.27,z-.25,z+.25,860,990,'#ffdfa3','window');
    }
    for(const face of faces)for(let i=0;i<slices.length;i++){
        const points=clipOceanPierPolygon(clipOceanPierPolygon(face.points,i,true),i+1,false);
        if(points.length>=3)slices[i].push({...face,points});
    }
    const layers={support:0,deck:1,berth:1,boat:2,house:3,roof:4,rail:5,window:6};
    for(const slice of slices)slice.sort((a,b)=>b.points.reduce((n,p)=>n+p[2],0)/b.points.length-a.points.reduce((n,p)=>n+p[2],0)/a.points.length||layers[a.role]-layers[b.role]);
    return slices;
}

function clipOceanPierPolygon(points,z,greater) {
        const out=[];
        for(let i=0;i<points.length;i++){
            const a=points[i],b=points[(i+1)%points.length],inside=greater?a[2]>=z:a[2]<=z,nextInside=greater?b[2]>=z:b[2]<=z;
            if(inside)out.push(a);
            if(inside!==nextInside){const t=(z-a[2])/(b[2]-a[2]);out.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,z]);}
        }
        return out;
}

function drawOceanPier(x1,y1,w1,x2,y2,w2,p1Scale,p2Scale,index,anchor) {
    const slice=index-OCEAN_PIER_INDEX;
    if(currentLevel!==2 || slice<0 || slice>=OCEAN_PIER_LENGTH || !anchor)return;
    const cut=clamp((player.z+64-segments[index].worldZReal)/SEGMENT_LENGTH,0,1);
    for(const face of oceanPierSlices[slice]){
        const visible=cut>0?clipOceanPierPolygon(face.points,slice+cut,true):face.points;
        if(visible.length<3)continue;
        const points=visible.map(([lane,height,z])=>{
            const t=clamp((z-slice-cut)/(1-cut),0,1),scale=1/((1-t)/p1Scale+t/p2Scale),along=t*scale/p2Scale;
            return {x:W/2+(anchor.rx1+anchor.lookOffset-W/2)*scale/anchor.p1Scale-anchor.lookOffset+lane*scale*ROAD_WIDTH*W/2,
                y:y1+(y2-y1)*along-height*scale*H/2};
        });
        if(points.every(p=>p.x<-3)||points.every(p=>p.x>W+3)||points.every(p=>p.y<-3)||points.every(p=>p.y>H+3))continue;
        paintOceanPolygon(points,face.color,true);
    }
}

function getOceanShoreLane(index) {
    const distance=Math.abs(index-OCEAN_PIER_CENTER);
    return distance<55?3.8-1.1*(1+Math.cos(Math.PI*distance/55))*.5:3.8;
}

function drawOceanWaterSegment(x1,y1,w1,x2,y2,w2,isAlt,index) {
    const cut=clamp((player.z+64-segments[index].worldZReal)/SEGMENT_LENGTH,0,1);
    const shore1=x1+w1*getOceanShoreLane(index+cut),shore2=x2+w2*getOceanShoreLane(index+1);
    ctx.fillStyle=interpolateColor(isAlt?'#1a416b':'#122d4f',isAlt?'#060e18':'#040a12',currentProgressRatio);
    trapezoid(shore1,y1,W,shore2,y2,W);
    if(!isAlt && index%12===0){
        ctx.fillStyle='rgba(33,212,253,.25)';
        trapezoid(shore1+w1*.25,y1,shore1+w1*.70,shore2+w2*.25,y2,shore2+w2*.70);
    }
}

function drawRoadSegment(x1, y1, w1, x2, y2, w2, isAlt, isStart, isBridge, p1Scale, p2Scale, isPillar, segIdx, isVisible = true) {
    if (currentLevel === LEVEL_HILLS || currentLevel === LEVEL_HIGHWAY) {
        if (isVisible) drawChapterRoad(x1, y1, w1, x2, y2, w2, isAlt, isStart, segIdx);
        if (currentLevel === LEVEL_HIGHWAY) drawHighwayDistrictSegment(x1, y1, w1, x2, y2, w2, p1Scale, p2Scale, segIdx);
        if (isHighwayTunnel(segIdx)) drawHighwayTunnelSegment(x1, y1, w1, x2, y2, w2, p1Scale, p2Scale, segIdx);
        if (currentLevel === LEVEL_HIGHWAY && [HIGHWAY_TUNNEL.start, HIGHWAY_TUNNEL.end].includes(segIdx) && player.z < segIdx * SEGMENT_LENGTH - 64) {
            drawHighwayTunnelPortal(x1, y1, w1, p1Scale * HIGHWAY_TUNNEL.height * H / 2, segIdx === HIGHWAY_TUNNEL.end);
        }
        return;
    }
    if (currentLevel === LEVEL_DREAM) {
        // --- DREAM ODYSSEY: ARCTIC TUNNEL AND SNOW DESERT SURROUNDINGS & ROADBED ---
        const tun = getTunnelStyle(segIdx);

        if (tun) {
            drawDreamTunnelSegment(x1,y1,w1,x2,y2,w2,p1Scale,p2Scale,segIdx,isVisible,tun);
        } else {
            // --- OUTSIDE THE TUNNEL: STEPPE, ARCTIC, DALI, OR UNDERWATER ---
            const zone = getDreamZone(segIdx);
            if (isVisible) {
                const snowHillL1 = x1 - w1 * 1.18;
                const snowHillR1 = x1 + w1 * 1.18;
                const snowHillL2 = x2 - w2 * 1.18;
                const snowHillR2 = x2 + w2 * 1.18;
                
                let grassColor, marginColor, roadColor, edgeColor, centerColor;
                
                if (zone === 'steppe') {
                    // Soft warm grassy-grey fields of the winter steppe
                    grassColor = isAlt ? '#a29a82' : '#978f77';
                    marginColor = isAlt ? '#6e6757' : '#635c4e';
                    roadColor = isAlt ? '#2c2b29' : '#232220';
                    edgeColor = '#ffffff';
                    centerColor = '#ffcc00';
                } else if (zone === 'arctic') {
                    // Soft snow-fields scrolling out to screen boundaries
                    grassColor = isAlt ? '#f0f5fa' : '#e6eef5';
                    marginColor = isAlt ? '#dce6f0' : '#d2dcf0';
                    roadColor = isAlt ? '#1d1c26' : '#14141c';
                    edgeColor = '#00ffd2';
                    centerColor = '#ffcc00';
                } else if (zone === 'dali') {
                    // Surreal warm amber/violet/gold desert sands
                    grassColor = isAlt ? '#e5989b' : '#b5828c'; // dusty rose/gold desert
                    marginColor = isAlt ? '#e07a5f' : '#f4f1de'; // terracotta & cream margins
                    roadColor = isAlt ? '#2d2d3a' : '#1f2026'; // dark asphalt with violet undertone
                    edgeColor = '#f4a261'; // glowing warm orange edges
                    centerColor = '#ff007f'; // melting neon pink dashes
                } else { // 'underwater'
                    // Deep sea floor with bioluminescent blue/teal ground
                    grassColor = isAlt ? '#051923' : '#001219'; // dark abyss base
                    marginColor = isAlt ? '#005f73' : '#0a9396'; // deep teal coral shelf
                    roadColor = isAlt ? '#111e25' : '#091116'; // slick deep-sea glass track
                    edgeColor = '#00f5d4'; // neon cyan edge guides
                    centerColor = '#7b2cbf'; // glowing violet dashes
                }

                // Draw the ground
                ctx.fillStyle = grassColor;
                trapezoid(0, y1, snowHillL1, 0, y2, snowHillL2);
                trapezoid(snowHillR1, y1, W, snowHillR2, y2, W);
                
                // Draw margins
                ctx.fillStyle = marginColor;
                trapezoid(x1 - w1 * 1.18, y1, x1 + w1 * 1.18, x2 - w2 * 1.18, y2, x2 + w2 * 1.18);
                
                // Draw road pavement
                ctx.fillStyle = roadColor;
                trapezoid(x1 - w1, y1, x1 + w1, x2 - w2, y2, x2 + w2);
                
                // Edge lines
                ctx.fillStyle = edgeColor;
                const e1 = w1 * 0.038, e2 = w2 * 0.038;
                trapezoid(x1 - w1, y1, x1 - w1 + e1, x2 - w2, y2, x2 - w2 + e2);
                trapezoid(x1 + w1 - e1, y1, x1 + w1, x2 + w2 - e2, y2, x2 + w2);
                
                // Center line
                if (!isAlt) {
                    ctx.fillStyle = centerColor;
                    const d1 = w1 * 0.015, d2 = w2 * 0.015;
                    trapezoid(x1 - d1, y1, x1 + d1, x2 - d2, y2, x2 + d2);
                }
                
                // Lane dividers
                ctx.fillStyle = zone === 'underwater' ? 'rgba(0, 245, 212, 0.25)' : (zone === 'dali' ? 'rgba(244, 162, 97, 0.25)' : 'rgba(255, 255, 255, 0.2)');
                for (let l = 1; l < LANES; l++) {
                    const lr = l / LANES;
                    const lx1 = x1 - w1 + 2 * w1 * lr;
                    const lx2 = x2 - w2 + 2 * w2 * lr;
                    const lw1 = Math.max(1, w1 * 0.007);
                    const lw2 = Math.max(1, w2 * 0.007);
                    trapezoid(lx1 - lw1, y1, lx1 + lw1, lx2 - lw2, y2, lx2 + lw2);
                }

                if (isStart) drawCheckeredLine(x1, y1, w1, x2, y2, w2, isAlt);
            }
            // Elevated structures remain visible over the exit crest even when
            // the road beneath them is hidden. Nearer road/tunnel segments still
            // occlude their bases through the normal back-to-front drawing.
            if (zone === 'underwater') {
                if (segIdx % 8 === 0 || segIdx === DREAM_TUNNELS[DREAM_TUNNELS.length - 1].end) drawUnderwaterArch(x1, y1, w1);
            }
        }
        const mouth = DREAM_TUNNELS.find(t => segIdx === t.start || segIdx === t.end);
        if (mouth && player.z < segIdx * SEGMENT_LENGTH - 64) {
            drawDreamTunnelPortal(x1,y1,w1,p1Scale * DREAM_TUNNEL_HEIGHT * H / 2,mouth.to === 'underwater',segIdx === mouth.end,mouth.to === 'arctic');
        }
        return;
    }
    if (currentLevel === LEVEL_SPACE) {
        // --- SPACE WAVE: SPACE WAVE SURROUNDINGS ---
        // Do nothing! Let the beautiful starfield and planets remain visible on the sides.
    } else if (currentLevel === 2) {
        // --- LEVEL 2: COASTAL ROAD SURROUNDINGS ---
        // 1. Right side: Golden Sandy Beach (40m strip)
        const beachL1 = x1 + w1 * 1.15;
        const beachL2 = x2 + w2 * 1.15;
        const cut=clamp((player.z+64-segments[segIdx].worldZReal)/SEGMENT_LENGTH,0,1);
        const beachR1=x1+w1*getOceanShoreLane(segIdx+cut);
        const beachR2=x2+w2*getOceanShoreLane(segIdx+1);
        ctx.fillStyle=isAlt?'#eac68a':'#dfbe81';
        trapezoid(beachL1,y1,beachR1,beachL2,y2,beachR2);

        // Stratified headlands and attached vegetation share the road's depth.
        drawOceanCliffSegment(x1,y1,w1,x2,y2,w2,p1Scale,p2Scale,segIdx);
    } else {
        // --- LEVEL 1: STANDARD CITY/BRIDGE VOID SURROUNDINGS ---
        if (isVisible) {
            if (isBridge) {
                ctx.fillStyle = interpolateColor('#241038','#073249',.5+.5*Math.sin(segIdx*.065)); ctx.fillRect(0, y2 - 1.2, W, y1 - y2 + 1.5);
                ctx.fillStyle = segIdx%5===0?'rgba(255,91,206,.32)':'rgba(75,185,234,.10)';

let dreamFilterCanvas=null,dreamFilterCtx=null,dreamSampleCanvas=null,dreamSampleCtx=null;
