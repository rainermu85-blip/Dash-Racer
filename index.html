<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Dash Racer</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
*{margin:0;padding:0;box-sizing:border-box;touch-action:none}
body{background:#000;display:flex;align-items:center;justify-content:center;height:100dvh;overflow:hidden;font-family:'Press Start 2P',monospace}
#wrap{position:relative;width:100%;max-width:480px;height:100dvh}
canvas{position:absolute;top:0;left:0;width:100%;height:100%}
#hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:10px 14px;background:linear-gradient(to bottom,rgba(0,0,0,.85),transparent);pointer-events:none;z-index:5}
.hb{display:flex;flex-direction:column;gap:3px}
.hl{font-size:6px;color:#ff6b35;letter-spacing:2px;text-shadow:0 0 6px #ff6b35}
.hv{font-size:13px;color:#fff;text-shadow:2px 2px 0 #000}
#placeVal{color:#ffe066;text-shadow:2px 2px 0 #000,0 0 12px #ffe066}
#progBar{position:absolute;top:56px;left:12px;right:12px;pointer-events:none;z-index:5}
#progLabel{font-size:6px;color:#7ecbff;letter-spacing:2px;margin-bottom:3px}
#progTrack{position:relative;height:3px;background:rgba(255,79,216,0.3);box-shadow:0 0 8px rgba(255,79,216,0.5);border-radius:2px;overflow:visible;margin-top:6px}
.progMarker{position:absolute;top:-2.5px;width:8px;height:8px;border-radius:50%;transform:translateX(-50%);box-shadow:0 0 6px currentColor;transition:left 0.1s linear}
#markerPlayer::after{content:'P';position:absolute;top:-10px;left:50%;transform:translateX(-50%);font-size:6px;font-family:'Press Start 2P',monospace;color:#ffe066;text-shadow:1px 1px 0 #000}
#timeBoard{position:absolute;top:88px;right:12px;text-align:right;pointer-events:none;z-index:5;display:flex;flex-direction:column;gap:5px}
#segmentBoard{position:absolute;top:88px;left:12px;text-align:left;pointer-events:none;z-index:5;display:flex;flex-direction:column;gap:5px}
.segmentTitle{font-size:6px;color:#7ecbff;letter-spacing:2px;font-family:'Press Start 2P',monospace;text-shadow:0 0 6px #7ecbff}
#segmentVal{font-size:12px;color:#fff;text-shadow:2px 2px 0 #000;font-family:'Press Start 2P',monospace}
.lapTime{font-size:7px;color:rgba(255,255,255,0.6);text-shadow:1px 1px 0 #000;letter-spacing:1px;font-family:'Press Start 2P',monospace}
.lapTime.best{color:#21d4fd;text-shadow:0 0 8px #21d4fd}

/* Boost Meter UI */
#boostContainer{position:absolute;right:14px;top:38%;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:10;cursor:pointer;background:rgba(0,0,0,0.6);padding:8px;border-radius:8px;box-shadow:0 0 10px rgba(0,0,0,0.5);}
#boostIcon{font-size:18px;color:#ffe066;text-shadow:0 0 8px #ff6b35;}
#boostBarWrap{width:16px;height:100px;background:rgba(255,255,255,0.1);border-radius:3px;display:flex;flex-direction:column-reverse;overflow:hidden;box-shadow:inset 0 0 5px #000;}
.bSeg{width:100%;height:33.33%;border-bottom:2px solid #000;background:#2a0f62;transition:background 0.1s;}
.bSeg.on{background:#ff6b35;box-shadow:0 0 8px #ff6b35;}

#btns{position:absolute;bottom:0;left:0;right:0;height:150px;display:flex;z-index:5;background:linear-gradient(to top,rgba(0,0,0,.7),transparent)}
.btn{flex:1;display:flex;align-items:center;justify-content:center;font-size:30px;user-select:none;cursor:pointer;color:rgba(255,255,255,.3)}
#bL{border-right:1px solid rgba(255,255,255,.07)}
#bL.on{background:rgba(126,203,255,.2);color:#7ecbff}
#bR.on{background:rgba(255,107,53,.2);color:#ff6b35}
#overlay{position:absolute;inset:0;z-index:15;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:rgba(0,0,0,.92)}
#overlay.hide{display:none}
.menu-panel{width:90%;max-width:430px;margin:auto;padding:26px 0;display:flex;flex-direction:column;align-items:center;gap:18px}
#overlay{overflow-y:auto;padding:0 8px;background:radial-gradient(ellipse at 50% 35%,rgba(59,15,89,.97),rgba(5,2,13,.98));}
.menu-panel .otitle{font-size:clamp(19px,5vw,25px);color:#f8e7ff;text-shadow:3px 3px 0 #7c2db2,0 0 20px #ff4fd8;letter-spacing:2px}
.menu-kicker{font-size:6px;letter-spacing:2px;color:#fda8d5}
.campaign-select{width:100%;text-align:left}
.chapter-heading{border-left:3px solid #ff4fd8;padding:7px 10px;margin-bottom:10px;background:linear-gradient(90deg,rgba(255,79,216,.13),transparent)}
.chapter-heading span{display:block;font-size:5px;letter-spacing:1px;color:#bba6d6;margin-bottom:8px}
.chapter-heading strong{display:block;font-size:12px;line-height:1.5;color:#ffe3f8;text-shadow:0 0 12px #ff4fd8}
.level-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.level-card{position:relative;min-height:72px;padding:12px 9px 10px 28px;background:rgba(5,3,18,.7);border:1px solid #46344f;border-radius:3px;text-align:left;color:#c5b8d2;font-family:inherit;cursor:pointer}
.level-card.selected{border-color:var(--accent);color:var(--accent);background:linear-gradient(125deg,rgba(255,255,255,.09),rgba(17,5,28,.85));box-shadow:0 0 12px color-mix(in srgb,var(--accent) 30%,transparent),inset 0 0 15px rgba(255,255,255,.025)}
.level-number{position:absolute;left:7px;top:12px;font-size:7px;opacity:.65}
.level-name{display:block;font-size:8px;line-height:1.8;min-height:25px}
.level-tag{display:block;font-size:5px;line-height:1.8;letter-spacing:.2px;opacity:.65;margin-top:5px}
.worlds-heading{font-size:5px;line-height:1.8;letter-spacing:.7px;color:#94869f;margin:16px 0 8px}
.obtn.menu-start{width:100%;font-size:11px;padding:16px 12px;background:rgba(255,79,216,.12);border-color:#ff4fd8;color:#fff1fa;box-shadow:0 0 18px rgba(255,79,216,.25)}
.menu-hint{font-size:5px;line-height:2;color:#a494b7;text-align:center}
#pauseOverlay{position:absolute;inset:0;z-index:16;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:rgba(0,0,0,.75)}
#pauseOverlay.hide{display:none}
.otitle{font-size:22px;color:#ffe066;text-align:center;line-height:1.7;text-shadow:0 0 20px #ffe066,4px 4px 0 #ff6b35}
.osub{font-size:8px;color:rgba(255,255,255,.4);letter-spacing:2px;text-align:center;line-height:2}
.obtn{font-family:'Press Start 2P',monospace;font-size:11px;padding:13px 26px;background:transparent;border:2px solid #ff6b35;color:#ff6b35;cursor:pointer;letter-spacing:2px;box-shadow:0 0 16px rgba(255,107,53,.3)}
.obtn:active{background:rgba(255,107,53,.2)}
#cntWrap{position:absolute;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;pointer-events:none}
#cntNum{font-size:90px;color:#ffe066;opacity:0;text-shadow:0 0 40px #ffe066,4px 4px 0 #ff6b35;transition:opacity .15s,transform .25s;transform:scale(2)}
#cntNum.pop{opacity:1;transform:scale(1)}

#introScreen {position:absolute;inset:0;z-index:20;background-color:#0a0410;display:flex;align-items:center;justify-content:center;transition:opacity 0.5s}
#introScreen.hide {opacity:0;pointer-events:none}
#introBox {background:rgba(10,5,20,0.75);border:2px solid #ff4fd8;box-shadow:0 0 20px rgba(255,79,216,0.5);padding:24px 32px;border-radius:8px;opacity:0;transition:opacity 1s;cursor:pointer}
#introBox.show {opacity:1}
#introText {font-family:'Press Start 2P',monospace;font-size:14px;animation:neonPulse 4s infinite alternate;text-align:center;user-select:none;letter-spacing:1px;line-height:1.5}
@keyframes neonPulse {
  0% {color:#ff4fd8;text-shadow:0 0 12px #ff4fd8}
  33% {color:#21d4fd;text-shadow:0 0 12px #21d4fd}
  66% {color:#b026ff;text-shadow:0 0 12px #b026ff}
  100% {color:#ff6b35;text-shadow:0 0 12px #ff6b35}
}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="hud">
    <div class="hb"><div class="hl">PLACE</div><div class="hv" id="placeVal">1ST</div></div>
    <div class="hb" style="text-align:center"><div class="hl">LAP</div><div class="hv" id="lapVal">1/3</div></div>
    <div class="hb" style="text-align:right"><div class="hl">KM/H</div><div class="hv" id="spdVal">0</div></div>
  </div>
  <div id="progBar">
    <div id="progLabel">TRACK PROGRESS</div>
    <div id="progTrack">
      <div id="markerPlayer" class="progMarker" style="background:#ffe066; z-index:10; box-shadow:0 0 10px #ffe066; left: 0%;"></div>
      <div id="markerOpp0" class="progMarker" style="background:#ff4466; left: 0%;"></div>
      <div id="markerOpp1" class="progMarker" style="background:#44ddff; left: 0%;"></div>
      <div id="markerOpp2" class="progMarker" style="background:#ffcc22; left: 0%;"></div>
      <div id="markerOpp3" class="progMarker" style="background:#44ff88; left: 0%;"></div>
      <div id="markerOpp4" class="progMarker" style="background:#dd88ff; left: 0%;"></div>
    </div>
  </div>
  <div id="timeBoard">
    <div id="timeLap1" class="lapTime">LAP 1: --:--:--:--</div>
    <div id="timeLap2" class="lapTime">LAP 2: --:--:--:--</div>
    <div id="timeLap3" class="lapTime">LAP 3: --:--:--:--</div>
  </div>
  <div id="segmentBoard">
    <div class="segmentTitle">SEGMENT</div>
    <div id="segmentVal">0</div>
    <div id="energyBoard" style="margin-top: 10px; display: none;">
      <div class="segmentTitle" style="color: #00f0ff; text-shadow: 0 0 6px #00f0ff;">ENERGY</div>
      <div id="energyVal" style="font-size: 12px; color: #fff; text-shadow: 2px 2px 0 #000; font-family:'Press Start 2P',monospace">0/5</div>
    </div>
  </div>
  
  <div id="boostContainer">
    <div id="boostIcon">⚡</div>
    <div id="boostBarWrap">
      <div class="bSeg" id="b1"></div>
      <div class="bSeg" id="b2"></div>
      <div class="bSeg" id="b3"></div>
    </div>
  </div>

  <div id="btns">
    <div class="btn" id="bL">&#9664;</div>
    <div class="btn" id="bR">&#9654;</div>
  </div>
  <div id="cntWrap"><div id="cntNum">3</div></div>
  <div id="pauseOverlay" class="hide">
    <div class="otitle" style="font-size:18px;">PAUSED</div>
    <button class="obtn" id="resumeBtn" style="width: 220px;">RESUME</button>
    <button class="obtn" id="exitRaceBtn" style="width: 220px; border-color:#ff5ba5; color:#ff5ba5; box-shadow:0 0 16px rgba(255,91,165,.35); text-shadow:0 0 5px #ff5ba5;">EXIT RACE</button>
  </div>
  <div id="overlay" class="hide"></div>
  <div id="introScreen">
    <div id="introBox">
      <div id="introText">CLICK TO START</div>
    </div>
  </div>
</div>
<script>
const C = document.getElementById('c');
const ctx = C.getContext('2d', { alpha: false });
const wrap = document.getElementById('wrap');
let W, H;
let lastW = 0, lastH = 0;

let skyGrad, vigGrad, hGlowGrad, seaGrad;
let sunCanvas, sunR;
let moonCanvas, moonR;
let currentProgressRatio = 0;
const bgStars = [];

function renderOffscreenSun() {
  sunR = Math.min(W, H) * 0.14;
  sunCanvas = document.createElement('canvas');
  sunCanvas.width = sunR * 2.2;
  sunCanvas.height = sunR * 2.2;
  const sCtx = sunCanvas.getContext('2d');
  const cx = sunCanvas.width / 2, cy = sunCanvas.height / 2;

  const sGrad = sCtx.createRadialGradient(cx, cy, sunR * 0.1, cx, cy, sunR);
  sGrad.addColorStop(0, '#fff2a8'); sGrad.addColorStop(0.45, '#ffb347');
  sGrad.addColorStop(0.7, '#ff59a8'); sGrad.addColorStop(1, 'rgba(255,89,168,0)');
  sCtx.fillStyle = sGrad;
  sCtx.beginPath(); sCtx.arc(cx, cy, sunR, 0, Math.PI * 2); sCtx.fill();

  sCtx.fillStyle = '#ffcc4d';
  sCtx.beginPath(); sCtx.arc(cx, cy, sunR * 0.78, 0, Math.PI * 2); sCtx.fill();

  sCtx.globalCompositeOperation = 'destination-out';
  for (let i = 0; i < 7; i++) {
    const stripeH = sunR * (0.015 + i * 0.01);
    const gapY = cy + sunR * 0.05 + i * sunR * 0.11;
    sCtx.fillRect(cx - sunR, gapY, sunR * 2, stripeH);
  }
}

function renderOffscreenMoon() {
  moonR = Math.min(W, H) * 0.10; // slightly smaller than the sun for elegance
  moonCanvas = document.createElement('canvas');
  moonCanvas.width = moonR * 3.0; // wider canvas for the beautiful glow
  moonCanvas.height = moonR * 3.0;
  const mCtx = moonCanvas.getContext('2d');
  const cx = moonCanvas.width / 2, cy = moonCanvas.height / 2;

  // 1. Draw soft outer cyan/blue celestial aura glow
  const auraGrad = mCtx.createRadialGradient(cx, cy, moonR * 0.2, cx, cy, moonR * 1.3);
  auraGrad.addColorStop(0, 'rgba(34, 212, 253, 0.45)');
  auraGrad.addColorStop(0.4, 'rgba(34, 212, 253, 0.15)');
  auraGrad.addColorStop(1, 'rgba(34, 212, 253, 0)');
  mCtx.fillStyle = auraGrad;
  mCtx.beginPath();
  mCtx.arc(cx, cy, moonR * 1.3, 0, Math.PI * 2);
  mCtx.fill();

  // 2. Draw outer circle of the moon (glowing pale-silver)
  mCtx.fillStyle = '#f0fbfd';
  mCtx.beginPath();
  mCtx.arc(cx, cy, moonR, 0, Math.PI * 2);
  mCtx.fill();

  // 3. Subtract an offset circle to create a sharp, gorgeous crescent shape
  mCtx.globalCompositeOperation = 'destination-out';
  mCtx.beginPath();
  // Offset the carving circle slightly to the top-right to form a sleek crescent
  mCtx.arc(cx + moonR * 0.38, cy - moonR * 0.12, moonR * 0.95, 0, Math.PI * 2);
  mCtx.fill();
  mCtx.globalCompositeOperation = 'source-over';
}

function resize(){ 
  W = wrap.clientWidth; H = wrap.clientHeight; 
  if (lastW !== 0 && Math.abs(W - lastW) < 10 && Math.abs(H - lastH) < 60) return;
  lastW = W; lastH = H;
  C.width=W; C.height=H; 
  skyGrad = ctx.createLinearGradient(0, 0, 0, H * 0.6);
  skyGrad.addColorStop(0, '#120221'); skyGrad.addColorStop(0.3, '#2a0f62');
  skyGrad.addColorStop(0.6, '#7a1d8f'); skyGrad.addColorStop(0.85, '#ff4f7b'); skyGrad.addColorStop(1, '#162a80');
  vigGrad = ctx.createLinearGradient(0, H * 0.65, 0, H);
  vigGrad.addColorStop(0, 'rgba(0,0,0,0)'); vigGrad.addColorStop(1, 'rgba(0,0,0,0.45)');
  hGlowGrad = ctx.createLinearGradient(0, -H * 0.08, 0, H * 0.12);
  hGlowGrad.addColorStop(0, 'rgba(255, 79, 216, 0.0)'); hGlowGrad.addColorStop(0.4, 'rgba(255, 79, 216, 0.2)'); hGlowGrad.addColorStop(1, 'rgba(33, 212, 253, 0)');
  seaGrad = ctx.createLinearGradient(0, 0, 0, H * 0.15);
  seaGrad.addColorStop(0, 'rgba(42, 201, 255, 0.24)'); seaGrad.addColorStop(1, 'rgba(20, 26, 85, 0)');
  renderOffscreenSun();
  renderOffscreenMoon();
  bgStars.length = 0;
  for (let i = 0; i < 85; i++) bgStars.push({ x: ~~(((i * 137) % 997) / 997 * W), y: ~~(((i * 79) % 997) / 997 * H * 0.45), s: i % 10 === 0 ? 3 : (i % 3 === 0 ? 2 : 1), t: i * 1.5 });
}
resize(); window.addEventListener('resize', resize);

let SEGMENT_COUNT = 1150; const SEGMENT_LENGTH = 150; let TRACK_LENGTH = SEGMENT_COUNT * SEGMENT_LENGTH;
let panelStarts = [180, 380, 540, 700, 840, 1020];
const LANES = 3; const ROAD_WIDTH = 2250; const CAMERA_HEIGHT = 700; const CAMERA_DEPTH = 0.84; const DRAW_DISTANCE = 300; 
const LEVEL_HILLS = 3, LEVEL_HIGHWAY = 4, LEVEL_DREAM = 5, LEVEL_SPACE = 6;
const LEVELS = [
  { id: 1, name: 'NEON CITY', tag: 'DOWNTOWN / 1989', color: '#ffe066', segments: 1150 },
  { id: 2, name: 'OCEAN DRIVE', tag: 'PALMS / COASTLINE', color: '#ff4fd8', segments: 1150 },
  { id: LEVEL_HILLS, name: 'SUNSET HILLS', tag: 'BEVERLY / GOLDEN HOUR', color: '#ffb17e', segments: 1200 },
  { id: LEVEL_HIGHWAY, name: 'MIDNIGHT HIGHWAY', tag: 'VIOLET / AFTER HOURS', color: '#b88cff', segments: 1200 },
  { id: LEVEL_DREAM, name: 'DREAM ODYSSEY', tag: 'SURREAL WORLDS', color: '#00ffd2', segments: 2875 },
  { id: LEVEL_SPACE, name: 'SPACE WAVE', tag: 'COSMIC SPEED', color: '#ff00ff', segments: 1350 }
];
const HIGHWAY_CROSSINGS = [
  { index: 215, kind: 'road' }, { index: 475, kind: 'train' },
  { index: 735, kind: 'road' }, { index: 995, kind: 'train' }
];
const HIGHWAY_TRAIN_DURATION = 3.2;
const CLEAN_SPEED_LIMIT = 0.2;
const CLEAN_SPEED_BUILD_TIME = 10;
const BRIDGE_RAIL_HEIGHT = 108;
const BRIDGE_MASTS = [950, 1030];
const BRIDGE_STAY_DISTANCES = [8, 18, 28];
const HIGHWAY_NEON_COLORS = ['#ff527f', '#ffd65c', '#7aff9e', '#35ddff', '#568cff', '#bb80ff', '#ff54dc', '#ff9853'];
// Each business has one coherent identity, drawn consistently on every pass.
const HIGHWAY_AD_STYLES = [
  { wide: false, columns: 1, bold: true,  colors: 1, frame: 'none',    icon: null,      caption: false },
  { wide: false, columns: 2, bold: false, colors: 2, frame: 'single',  icon: null,      caption: true },
  { wide: true,  columns: 1, bold: true,  colors: 1, frame: 'double',  icon: 'circle',  caption: true, wordmark: true },
  { wide: false, columns: 1, bold: false, colors: 2, frame: 'corners', icon: 'diamond', caption: true },
  { wide: false, columns: 2, bold: true,  colors: 1, frame: 'none',    icon: null,      caption: false },
  { wide: true,  columns: 1, bold: false, colors: 3, frame: 'single',  icon: 'sun',     caption: true },
  { wide: false, columns: 1, bold: true,  colors: 2, frame: 'none',    icon: 'arrow',   caption: false },
  { wide: false, columns: 1, bold: false, colors: 1, frame: 'single',  icon: null,      caption: false },
  { wide: true,  columns: 1, bold: true,  colors: 2, frame: 'none',    icon: 'arrow',   caption: true, wordmark: true },
  { wide: true,  columns: 2, bold: false, colors: 2, frame: 'corners', icon: null,      caption: false },
  { wide: false, columns: 2, bold: false, colors: 3, frame: 'double',  icon: 'star',    caption: true },
  { wide: true,  columns: 1, bold: true,  colors: 1, frame: 'none',    icon: null,      caption: true, wordmark: true }
];
const HIGHWAY_AD_BRANDS = ['NOVA', 'RAMEN', 'ARCADE', 'HOTEL', 'ORBIT', 'NIGHT FM', 'KINO', 'DREAM TV'];
function getHighwayAdStyle(seed) {
  return HIGHWAY_AD_STYLES[(seed * 7 + Math.floor(seed / 11)) % HIGHWAY_AD_STYLES.length];
}
const HIGHWAY_NEON_GLYPHS = [
  [[-7,-9],[7,-9],[0,0],[7,8],[-7,8]],
  [[-7,-8],[-7,8],[7,8],[7,-8],[-7,-8],[0,0],[7,0]],
  [[0,-9],[0,9],[-7,4],[7,-4],[-7,-4],[7,4]],
  [[-7,-8],[7,-8],[-4,0],[7,0],[-7,9],[7,9]],
  [[-7,-9],[7,1],[0,9],[-7,1],[7,-9]],
  [[-7,-9],[-7,9],[0,3],[7,9],[7,-9],[0,-3],[-7,-9]]
];
let highwayTraffic = [], crossingEvents = new Map(), chapterTime = 0;
const BG_W = 1400; const bgMountains = []; const bgBuildings = []; const bgBirds = []; let bgOffset = 0; 

let activeFlyingPylons = [];
let blinkingBarriers = [];
let weatherParticles = [];

function getDreamZone(idx) {
  // Dream Odyssey is a point-to-point route; the runout stays in the final world.
  const i = Math.max(0, Math.trunc(idx));
  if (i < 450) return 'steppe';
  if (i >= 450 && i < 750) return 'tunnel';
  if (i >= 750 && i < 1250) return 'arctic';
  if (i >= 1250 && i < 1550) return 'tunnel';
  if (i >= 1550 && i < 2050) return 'dali';
  if (i >= 2050 && i < 2350) return 'tunnel';
  return 'underwater';
}

// The three Dream Odyssey tunnels are portals: each one sits between two completely
// different worlds and morphs from the palette of the world it leaves to the
// palette of the world it opens into.
const DREAM_TUNNELS = [
  { start: 450,  end: 750,  from: 'steppe', to: 'arctic' },
  { start: 1250, end: 1550, from: 'arctic', to: 'dali' },
  { start: 2050, end: 2350, from: 'dali',   to: 'underwater' }
];
const UNDERWATER_FLORA = ['coral_spire', 'sea_grass', 'kelp', 'fan_coral', 'tube_sponge'];
// Dream Odyssey: slow distant skies, livelier landscape and nearer sea life.
const DREAM_PARALLAX = {
  stars: 0.018, atmosphere: 0.055, sun: 0.10, birds: 0.20,
  landscape: 0.38, mountains: 0.42, reef: 0.30,
  jellyfish: 0.115, faunaMultiplier: 1.4
};

// What each world contributes to a portal it touches.
const DREAM_PORTAL_PALETTE = {
  steppe:     { wall: '#3b3830', accent: '#e0b871', light: '#ffeccb' },
  arctic:     { wall: '#152f49', accent: '#5fe0ff', light: '#dff6ff' },
  dali:       { wall: '#4a2a20', accent: '#ffab4d', light: '#ffdda0' },
  underwater: { wall: '#0a2d3a', accent: '#2ae2c6', light: '#c4fff2' }
};

// Palette + entrance/exit weighting at a given tunnel segment, or null outside.
function getTunnelStyle(segIdx) {
  const i = Math.max(0, Math.trunc(segIdx));
  let t = null;
  for (const cand of DREAM_TUNNELS) { if (i >= cand.start && i < cand.end) { t = cand; break; } }
  if (!t) return null;

  const p = (i - t.start) / (t.end - t.start); // 0 at entrance, 1 at exit
  const a = DREAM_PORTAL_PALETTE[t.from], b = DREAM_PORTAL_PALETTE[t.to];
  const entry = clamp(1 - p / 0.07, 0, 1);
  const exit = clamp((p - 0.88) / 0.12, 0, 1);
  const wall = interpolateColor(a.wall, b.wall, p);
  const light = interpolateColor(a.light, b.light, p);
  // Interpolating one accent straight into the other passes through mud at the
  // midpoint. Routing it through a vivid core instead makes the middle of the
  // tunnel — the point furthest from either world — read as the portal itself.
  const CORE = '#d8c2ff';
  const accent = p < 0.5
    ? interpolateColor(a.accent, CORE, p * 2)
    : interpolateColor(CORE, b.accent, (p - 0.5) * 2);
  return {
    p, entry, exit,
    accent,
    light,
    // Mouths of the portal glow in the light of the world on that side.
    wall: interpolateColor(wall, light, Math.max(entry, exit) * 0.45)
  };
}

// Which world the surroundings (sky, lighting, scenery) belong to at a segment.
// Sky and backdrop are picked from the camera's segment, so at a plain zone edge
// the whole environment flips in a single frame. Inside a portal barely any sky
// is visible, so the flip is moved a third of the way in: it happens while the
// tunnel hides it, and you drive out into a world that already finished changing.
const PORTAL_WORLD_SWITCH = 1 / 3;
function getDreamWorld(idx) {
  const i = Math.max(0, Math.trunc(idx));
  for (const t of DREAM_TUNNELS) {
    if (i >= t.start && i < t.end) {
      return (i - t.start) / (t.end - t.start) < PORTAL_WORLD_SWITCH ? t.from : t.to;
    }
  }
  return getDreamZone(i);
}

// Weather can't simply follow getDreamWorld — it is drawn over the tunnel, and
// snow indoors looks wrong. It stays off inside a portal and fades across the
// mouths instead of popping on the frame you cross them.
const PORTAL_WEATHER_FADE = 40;
function getDreamWeatherFade(idx) {
  const i = Math.max(0, Math.trunc(idx));
  for (const t of DREAM_TUNNELS) {
    if (i >= t.start && i < t.end) return 0;
    if (i >= t.start - PORTAL_WEATHER_FADE && i < t.start) return (t.start - i) / PORTAL_WEATHER_FADE;
    if (i >= t.end && i < t.end + PORTAL_WEATHER_FADE) return (i - t.end) / PORTAL_WEATHER_FADE;
  }
  return 1;
}

function initBackground() {
  bgMountains.length = 0; bgBuildings.length = 0; bgBirds.length = 0;
  for (let i = 0; i < 6; i++) {
    bgBirds.push({
      x: Math.random() * 800,
      y: 40 + Math.random() * 120,
      speed: 35 + Math.random() * 25,
      size: 5 + Math.random() * 5,
      phase: Math.random() * Math.PI * 2
    });
  }
  let mx = 0; 
  while (mx < BG_W) { 
    const h = 50 + Math.random() * 80; 
    const R = 1.0913 + Math.random() * 0.6408; 
    const w = 2 * h * R; 
    bgMountains.push({ 
      x: mx, 
      w: w, 
      h: h, 
      color: ['#0f051d','#130724','#0b0315'][~~(Math.random()*3)] 
    }); 
    mx += w * 0.45 + Math.random() * 50; 
  }
  
  if (currentLevel === 1 || currentLevel === LEVEL_HILLS || currentLevel === LEVEL_HIGHWAY) {
    let bx = 0;
    while (bx < BG_W) {
      const bW = 35 + Math.random() * 45; 
      const bH = 40 + Math.random() * 140; 
      
      // Choose building style:
      // 0: Elegant full neon window grid + sleek top horizontal bar
      // 1: Modern skyscraper with side neon banding + grid windows
      // 2: Sleek skyscraper with vertical center spine + sleek window rows
      const style = ~~(Math.random() * 3);
      const neonColor = ['#1ccdfd', '#ff4fd8', '#ffcc4d', '#00ffaa'][~~(Math.random()*4)];
      
      // Generate a beautiful, structured window grid centered on the building
      const windows = [];
      const padX = 5, padY = 8;
      const winW = 2, winH = 3;
      const gapX = 4, gapY = 6;
      
      const cols = Math.floor((bW - padX * 2) / (winW + gapX));
      const rows = Math.floor((bH - padY * 2) / (winH + gapY));
      
      const startX = (bW - (cols * (winW + gapX) - gapX)) / 2;
      const startY = (bH - (rows * (winH + gapY) - gapY)) / 2;
      
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          // Decide if this window is turned on (light up)
          let litProbability = 0.5;
          if (style === 0) litProbability = 0.62;
          else if (style === 1) litProbability = 0.38;
          else litProbability = 0.26;
          
          if (Math.random() < litProbability) {
            // Cohesive cyber color palette for windows: cyber pink, cyan, or warm amber
            const rColor = Math.random();
            let winColor = 'rgba(255, 238, 170, 0.85)'; // Warm cozy amber default
            if (rColor < 0.12) winColor = '#ff4fd8'; // Neon pink
            else if (rColor < 0.24) winColor = '#1ccdfd'; // Neon cyan
            
            windows.push({
              x: startX + c * (winW + gapX),
              y: startY + r * (winH + gapY),
              color: winColor
            });
          }
        }
      }
      
      bgBuildings.push({
        x: bx,
        w: bW,
        h: bH,
        color: '#05030d', // Ultra deep sleek dark building silhouette
        style: style,
        neonColor: neonColor,
        windows: windows
      });
      bx += bW + 8 + Math.random() * 15;
    }
  }

  weatherParticles = [];
  if (currentLevel === LEVEL_DREAM) {
    for (let i = 0; i < 150; i++) {
      weatherParticles.push({
        x: Math.random() * 1200,
        y: Math.random() * 700,
        speedY: 40 + Math.random() * 60,
        speedX: -20 + Math.random() * 40,
        size: 1.5 + Math.random() * 3.0,
        alpha: 0.3 + Math.random() * 0.7,
        phase: Math.random() * Math.PI * 2
      });
    }
  }
}

function drawTile(offset, y, drawFn) {
  ctx.save(); let shift = offset % BG_W; if (shift < 0) shift += BG_W;
  ctx.translate(-shift, y); for (let x = 0; x < shift + W; x += BG_W) { drawFn(); ctx.translate(BG_W, 0); }
  ctx.restore();
}

// Wrap only once an object's full silhouette/halo is beyond the screen edge.
function backdropX(base, offset, padding) {
  const span = W + padding * 2;
  return ((base - offset + padding) % span + span) % span - padding;
}

function makeSection(len, curve, hill) { const arr = []; for (let i = 0; i < len; i++) arr.push({ curve, hill }); return arr; }

let segments = [];
function buildSegments() {
    let trackDef;
    if (currentLevel === 1) {
        trackDef = [
            ...makeSection(100, 0, 0), ...makeSection(80, 0.4, 0), ...makeSection(40, 0, 0),
            ...makeSection(60, -0.9, 25), ...makeSection(40, 0, 40), ...makeSection(30, 0, 0),
            ...makeSection(90, 0.5, -30), ...makeSection(40, 0, -10), ...makeSection(60, 0, 0),
            ...makeSection(60, -1.1, 0), ...makeSection(30, 0, 0), ...makeSection(50, 0.8, 30),
            ...makeSection(50, -0.8, -30), ...makeSection(40, 0, 0), ...makeSection(100, -0.6, 0),       
            ...makeSection(30, 0, 0), ...makeSection(30, 0, 22), ...makeSection(120, 0, 0),
            ...makeSection(30, 0, -22), ...makeSection(70, 0.2, 0)
        ];
    } else if (currentLevel === 2) {
        // Level 2 Coastal Highway: sweeping long curves, beautiful crests and steep roller coaster drops!
        trackDef = [
            ...makeSection(120, 0, 0),
            ...makeSection(80, 0.5, 12),
            ...makeSection(60, 0.0, 26),
            ...makeSection(90, -0.7, -22),
            ...makeSection(50, -0.2, -8),
            ...makeSection(80, 0.8, 5),
            ...makeSection(100, 0, 0),
            ...makeSection(70, -0.9, 32),
            ...makeSection(40, 0, 0),
            ...makeSection(90, 0.6, -32),
            ...makeSection(120, -0.5, 0),
            ...makeSection(80, 0, -14),
            ...makeSection(100, 0.8, 18),
            ...makeSection(100, -0.4, -8),
            ...makeSection(110, 0, 0)
        ];
    } else if (currentLevel === LEVEL_HILLS || currentLevel === LEVEL_HIGHWAY) {
        // Closed harmonic routes: soft climbs through Beverly, fast sweeping
        // turns downtown. The start/finish has zero slope and zero curvature.
        trackDef = Array.from({ length: SEGMENT_COUNT }, (_, i) => {
            const t = i / SEGMENT_COUNT * Math.PI * 2;
            const envelope = 1 - Math.cos(t);
            return currentLevel === LEVEL_HILLS
                ? { curve: envelope * (0.34 * Math.sin(2 * t) - 0.16 * Math.sin(4 * t)),
                    hill: envelope * (10 * Math.sin(2 * t) - 8 * Math.sin(3 * t) + 3 * Math.sin(5 * t)) }
                : { curve: envelope * (0.24 * Math.sin(2 * t) - 0.08 * Math.sin(4 * t)),
                    hill: envelope * (2 * Math.sin(2 * t) - 2 * Math.sin(3 * t)) };
        });
    } else if (currentLevel === LEVEL_SPACE) {
        // Space Wave: undulating sci-fi track with deep dips and long S-curves.
        // Built with continuous, infinitely differentiable sine waves multiplied by a smooth envelope.
        // This guarantees a perfectly closed, continuous loop with extremely smooth curves and slope transitions!
        trackDef = [];
        const N = SEGMENT_COUNT;
        for (let i = 0; i < N; i++) {
            const t = (i / N) * Math.PI * 2;
            const env = 1 - Math.cos(t); // smooth envelope that is 0 at start and end
            
            // Long sweeping S-curves
            const curve = env * (0.42 * Math.sin(t * 2) - 0.28 * Math.sin(t * 4) + 0.12 * Math.sin(t * 6));
            
            // Dramatic roller coaster dips, climbs, and valleys
            // Using integer-harmonic sines so the discrete sum is mathematically guaranteed to be exactly 0.
            const hill = env * (32.0 * Math.sin(t * 2) - 45.0 * Math.sin(t * 3) + 15.0 * Math.sin(t * 5));
            
            trackDef.push({ curve, hill });
        }
    } else {
        // Dream Odyssey Arctic Tunnel and Snow Desert
        // alternating zones:
        // Zone 1: Tech Outpost [0, 450)
        // Zone 2: Portal Tunnel 1 [450, 750)
        // Zone 3: Arctic Aurora Desert [750, 1250)
        // Zone 4: Portal Tunnel 2 [1250, 1550)
        // Zone 5: Dali Surreal Landscape [1550, 2050)
        // Zone 6: Portal Tunnel 3 [2050, 2350)
        // Zone 7: Deep Underwater Dome [2350, 2875]
        trackDef = [
            // Zone 1: Tech Outpost (450 segments)
            ...makeSection(150, 0, 0),       // starting flat straight
            ...makeSection(100, 0.15, 0),    // gentle curve left
            ...makeSection(100, -0.2, 0),    // gentle curve right
            ...makeSection(50, 0, 8),        // gentle hill
            ...makeSection(50, 0, -8),       // gentle downhill
            
            // Zone 2: Portal Tunnel 1 (300 segments)
            ...makeSection(50, 0, -30),      // steep descent into the deep tech-shaft
            ...makeSection(100, -0.4, 0),    // flat deep curve left inside tunnel
            ...makeSection(100, 0.45, 0),    // flat deep curve right inside tunnel
            ...makeSection(50, 0, 30),       // steep ascent out of the tunnel

            // Zone 3: Arctic Aurora Desert (500 segments)
            ...makeSection(100, 0, 0),       // flat straight snowy road
            ...makeSection(150, 0.35, 6),    // sweeping right curve climbing the snow pass
            ...makeSection(150, -0.4, -6),   // sweeping left curve descending the snow valley
            ...makeSection(100, 0, 0),       // flat snow straight

            // Zone 4: Portal Tunnel 2 (300 segments)
            ...makeSection(50, 0, -22),      // gentle dip into surreal portal
            ...makeSection(100, 0.3, 0),     // curve right inside surreal tunnel
            ...makeSection(100, -0.3, 0),    // curve left inside surreal tunnel
            ...makeSection(50, 0, 22),       // climb out of surreal portal

            // Zone 5: Dali Surreal Landscape (500 segments)
            // Undulating wave pattern: 150 segments of hills
            ...makeSection(50, 0, 12),       // surreal climb
            ...makeSection(50, 0, -18),      // surreal drop
            ...makeSection(50, 0, 6),        // surreal climb
            // Surreal S-curves (150 segments)
            ...makeSection(75, 0.45, 0),     // weird sharp curve right
            ...makeSection(75, -0.45, 0),    // weird sharp curve left
            // Flat majestic straight
            ...makeSection(200, 0, 0),       // flat straight looking at the melted sun

            // Zone 6: Portal Tunnel 3 (300 segments)
            ...makeSection(50, 0, -32),      // deep dive into underwater trench portal
            ...makeSection(100, -0.35, 0),   // sweeping curve left inside dome portal
            ...makeSection(100, 0.35, 0),    // sweeping curve right inside dome portal
            ...makeSection(50, 0, 32),       // climb up into the subaquatic dome base

            // Zone 7: Deep Underwater Dome (525 segments)
            ...makeSection(150, 0, -5),      // gentle underwater rollercoaster dip
            ...makeSection(150, 0.35, 5),    // curving through beautiful glass arches
            ...makeSection(150, -0.35, 0),   // sweeping back to center under water shafts
            ...makeSection(75, 0, 0)         // final home stretch to the checkered flag!
        ];
    }
    while (trackDef.length < SEGMENT_COUNT) trackDef = [...trackDef, ...trackDef];
    trackDef = trackDef.slice(0, SEGMENT_COUNT);

    segments = []; let worldY = 0;
    let underwaterPlantCount = 0;
    for (let i = 0; i < SEGMENT_COUNT; i++) {
        const def = trackDef[i]; const isStartLine = i < 3 || i > SEGMENT_COUNT - 3;
        const isBridge = currentLevel === 1 && (i >= 930 && i <= 1050);
        const isPillar = currentLevel === 1 && (i === 950 || i === 1030);
        const isTunnel = currentLevel === LEVEL_DREAM && (getDreamZone(i) === 'tunnel');
        
        let sprite = null;
        let spriteX = 0;
        
        let seaSprite = null;
        let seaSpriteX = 0;

        if (currentLevel === 2) {
            // Place the majestic old gnarled tree at the end of the long starting straight leading into a right-hand curve
            if (i === 115) {
                sprite = 'gnarled_tree';
                spriteX = 1.9; // Visibly placed on the right-side beach, framing the upcoming right curve beautifully
            } else if (i === 290) {
                sprite = 'beach_bar';
                spriteX = 2.1;
            } else if (i === 298) {
                sprite = 'beach_jeep';
                spriteX = 2.6;
            } else if (i === 306) {
                sprite = 'beach_icecream';
                spriteX = 2.1;
            } else if (i === 577) {
                sprite = 'stranded_whale';
                spriteX = 2.3; // Placed perfectly on the beach, close enough to the track to be fully visible!
            } else if (i === 935) {
                sprite = 'beach_party';
                spriteX = 2.1;
            } else if (i === 952) {
                sprite = 'beach_volleyball';
                spriteX = 2.4;
            } else if (i === 960) {
                sprite = 'beach_jeep';
                spriteX = 2.6;
            } else if (Math.random() < 0.075 && !isStartLine) {
                const nearSpot1 = (i >= 286 && i <= 310);
                const nearSpot2 = (i >= 935 && i <= 965);
                const nearSpotWhale = (i >= 573 && i <= 581);
                if (!nearSpot1 && !nearSpot2 && !nearSpotWhale) {
                    sprite = 'tree';
                    // Level 2: palm trees ONLY on the right-side beach (1.45 to 2.55) to prevent wall clipping on the left
                    spriteX = 1.45 + Math.random() * 1.1;
                }
            }

            // Distribute beautiful yachts, sailboats, and windsurfers on the ocean (closer to the beach so they are fully visible!)
            // Cluster 1 (Yachts): around segment 80 to 110 (straight)
            if (i === 85) { seaSprite = 'yacht'; seaSpriteX = 4.5; }
            else if (i === 92) { seaSprite = 'yacht'; seaSpriteX = 5.2; }
            else if (i === 98) { seaSprite = 'yacht'; seaSpriteX = 4.8; }
            else if (i === 108) { seaSprite = 'yacht'; seaSpriteX = 4.4; } // Beautiful yacht framing the new gnarled tree
            // Cluster 2 (Sailboats): around segment 320 to 365 (left curve)
            else if (i === 325) { seaSprite = 'sailboat'; seaSpriteX = 4.2; }
            else if (i === 332) { seaSprite = 'sailboat'; seaSpriteX = 5.1; }
            else if (i === 340) { seaSprite = 'sailboat'; seaSpriteX = 4.6; }
            else if (i === 348) { seaSprite = 'sailboat'; seaSpriteX = 5.4; }
            else if (i === 358) { seaSprite = 'sailboat'; seaSpriteX = 4.9; }
            // Windsurfers and the Shark victim distributed here and there
            else if (i === 6) { seaSprite = 'windsurfer'; seaSpriteX = 3.6; } // Visible during start countdown and after finishing
            else if (i === SEGMENT_COUNT - 8) { seaSprite = 'windsurfer'; seaSpriteX = 3.8; } // Visible right before/at finishing
            else if (i === 200) { seaSprite = 'windsurfer'; seaSpriteX = 4.1; }
            else if (i === 215) { seaSprite = 'windsurfer'; seaSpriteX = 4.6; }
            else if (i === 335) { seaSprite = 'windsurfer_victim'; seaSpriteX = 4.3; } // Shark attack target (moved to segment 335)!
            else if (i === 650) { seaSprite = 'windsurfer'; seaSpriteX = 4.8; }
            else if (i === 670) { seaSprite = 'windsurfer'; seaSpriteX = 4.2; }
            else if (i === 740) { seaSprite = 'windsurfer'; seaSpriteX = 4.5; }
            // Cluster 3 (Yachts & Sailboats): around segment 815 to 870 (left curve)
            else if (i === 815) { seaSprite = 'yacht'; seaSpriteX = 4.3; }
            else if (i === 824) { seaSprite = 'sailboat'; seaSpriteX = 5.0; }
            else if (i === 842) { seaSprite = 'yacht'; seaSpriteX = 4.7; }
            else if (i === 855) { seaSprite = 'sailboat'; seaSpriteX = 5.3; }
            else if (i === 865) { seaSprite = 'sailboat'; seaSpriteX = 4.5; }
        } else if (currentLevel === LEVEL_HILLS) {
            if (!isStartLine) {
                if (i % 56 === 20) {

                    spriteX = (Math.floor(i / 56) % 2 ? -1 : 1) * 1.95;
                } else if (i % 56 === 34) {
                    sprite = 'bougainvillea'; spriteX = (Math.floor(i / 56) % 2 ? -1 : 1) * 1.55;
                } else if (i % 24 === 8) {
                    sprite = 'beverly_palm'; spriteX = (Math.floor(i / 24) % 2 ? -1 : 1) * 1.65;
                } else if (i % 64 === 44) {
                    sprite = 'hills_lamp'; spriteX = 1.4;
                }
                if ([105, 545, 1065].includes(i)) { sprite = 'beverly_sign'; spriteX = 1.85; }
            }
        } else if (currentLevel === LEVEL_HIGHWAY) {
            if (!isStartLine) {
                if (i % 52 === 8) {
                    sprite = 'neon_tower'; spriteX = 1.85 + (Math.floor(i / 52) % 3) * 0.25;
                } else if (i % 16 === 14) {
                    const sign = Math.floor(i / 16);
                    sprite = 'fantasy_sign';
                    // Slim signs fit on the divider; wide billboards sit
                    // beyond the carriageways, leaving both roads clear.
                    spriteX = getHighwayAdStyle(sign).wide ? (sign % 2 ? -3.85 : 1.65) : (sign % 2 ? -1.32 : 1.42);
                } else if (i % 48 === 20) {
                    sprite = 'highway_lamp'; spriteX = 1.22;
                }
            }
        } else if (currentLevel === LEVEL_DREAM) {
            const zone = getDreamZone(i);
            if (!isStartLine) {
                if (zone === 'steppe') {
                    if (Math.random() < 0.06) {
                        sprite = Math.random() < 0.7 ? 'tundra_shrub' : 'rock';
                        spriteX = Math.random() < 0.5 ? (-1.55 - Math.random() * 0.9) : (1.55 + Math.random() * 0.9);
                    }
                } else if (zone === 'arctic') {
                    if (Math.random() < 0.12) {
                        sprite = 'tree'; // Will draw snow pine tree automatically for Dream Odyssey
                        spriteX = Math.random() < 0.5 ? (-1.6 - Math.random() * 0.9) : (1.6 + Math.random() * 0.9);

                } else if (zone === 'dali') {

                    if (i >= 1565 && (i - 1565) % 32 === 0) {

                    }
                } else if (zone === 'underwater') {

            index: i, worldZ: i * SEGMENT_LENGTH, worldY: worldY, curve: def.curve, hillDelta: def.hill, color: i % 2, isStart: isStartLine,

    }

        // Append 200 extra flat straight underwater segments beyond the finish line
        const lastWorldY = worldY;
        for (let i = 0; i < 200; i++) {
            const idx = SEGMENT_COUNT + i;

                index: idx,
                worldZ: idx * SEGMENT_LENGTH,
                worldY: lastWorldY,
                curve: 0,
                hillDelta: 0,
                color: idx % 2,
                isStart: false,
                sprite: null,
                spriteX: 0,
                seaSprite: null,
                seaSpriteX: 0,
                isBridge: false,
                isPillar: false,
                isTunnel: false
            });
        }
    }

    const laneOffsets = [-0.65, 0.65];
    
    // Adaptive Baustellen und Blitz-Items für die verschiedenen Strecken

    let freeBolts = [150, 800];

        siteIndices = [350, 850, 1350, 1850, 2350];

    } else if (currentLevel === LEVEL_SPACE) {
        siteIndices = [];
        freeBolts = [];
    }
    
    if (currentLevel === LEVEL_SPACE) {
        // Place cones (pylons) as neon blue energy balls in Space Wave
        // Spawning 4 cones in a row at regular intervals
        for (let idx = 100; idx < SEGMENT_COUNT - 40; idx += 65) {
            const lane = laneOffsets[~~(Math.random() * 2)];
            for (let j = 0; j < 4; j++) {
                const s = segments[(idx + j * 4) % SEGMENT_COUNT];
                if (s) s.pylon = { active: true, x: lane };
            }
        }
    } else {
        siteIndices.forEach(idx => {
            if (idx >= SEGMENT_COUNT - 50) return;
            const lane = laneOffsets[~~(Math.random() * 2)];
            
            // Pylonen immer exakt auf der gleichen Spur VOR der Baustelle
            for (let j = 0; j < 8; j++) {
                const s = segments[idx + j * 4];

            }

function updateChapterTraffic(dt) {

    for (const car of highwayTraffic) car.z = (car.z - car.speed * dt + TRACK_LENGTH) % TRACK_LENGTH;

        const rowHeight = (height - top - bottom) / rows;
        const size = Math.min(width / style.columns * 0.55, rowHeight * 0.76);
        if (style.icon) drawAdvertSymbol(x + width / 2, y + height * 0.12, Math.min(width * 0.22, height * 0.075), style.icon, accent);
        for (let col = 0; col < style.columns; col++) {
            for (let row = 0; row < rows; row++) {
                const gx = x + width * (col + 0.5) / style.columns;
                const gy = y + top + rowHeight * (row + 0.5);
                drawNeonGlyph(gx, gy, size, seed + col * 3 + row, col === 0 ? primary : secondary, weight, !coloredBackground);
            }
        }
    } else {
        const iconWidth = style.icon ? width * 0.24 : 0;
        const textX = x + width * 0.1 + iconWidth, textWidth = width * 0.8 - iconWidth;
        const centerY = y + height * (style.caption ? 0.42 : 0.5);
        if (style.icon) drawAdvertSymbol(x + width * 0.16, centerY, Math.min(width * 0.085, height * 0.23), style.icon, accent);
        if (style.wordmark) {
            const brand = HIGHWAY_AD_BRANDS[seed % HIGHWAY_AD_BRANDS.length];
            const fontSize = Math.min(height * 0.38, textWidth / (brand.length * 0.62));
            ctx.font = `${style.bold ? '900' : '400'} ${fontSize}px monospace`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.strokeStyle = primary; ctx.lineWidth = fontSize * 0.12;
            const alpha = ctx.globalAlpha; ctx.globalAlpha = alpha * 0.18;
            if (!coloredBackground) ctx.strokeText(brand, textX + textWidth / 2, centerY);
            ctx.globalAlpha = alpha; ctx.fillStyle = primary;
            ctx.fillText(brand, textX + textWidth / 2, centerY);
        } else {
            const rows = style.columns === 2 ? 2 : 1, columns = style.columns === 2 ? 2 : 4;
            const size = Math.min(textWidth / columns * 0.75, height * (rows === 2 ? 0.3 : 0.4));
            for (let col = 0; col < columns; col++) for (let row = 0; row < rows; row++) {
                drawNeonGlyph(textX + textWidth * (col + 0.5) / columns,
                    centerY + (row - (rows - 1) / 2) * height * 0.34, size, seed + col + row * 3,
                    style.columns === 2 && col === 1 ? secondary : primary, weight, !coloredBackground);
            }
        }
    }
    if (style.caption && width >= 25) {
        const fontSize = Math.min(width * 0.09, height * 0.1);
        ctx.font = `${style.bold ? 'bold' : 'normal'} ${fontSize}px monospace`;
        ctx.fillStyle = secondary; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(tall ? ['24H', 'OPEN', '1989'][seed % 3] : ['AFTER DARK', 'OPEN 24H', 'EST. 1989'][seed % 3], x + width / 2, y + height * (tall ? 0.93 : 0.84));
    }
    ctx.restore();
}

function drawHighwayCrossing(x, y, roadWidth, kind, phase, ts) {
    if (roadWidth < 2) return;
    const scale = roadWidth / 120;
    // Continue beyond both screen edges, even on curves and distant approaches.
    const left = Math.min(-1000, (-80 - x) / scale);
    const right = Math.max(1000, (W + 80 - x) / scale);
    const slope = kind === 'train' ? 0 : 0.055;
    const frontY = px => -158 + px * slope;
    const deckY = px => -171 + px * slope;
    beginChapterSprite(x, y, scale);
    ctx.fillStyle = '#161226';
    ctx.beginPath(); ctx.moveTo(left, frontY(left)); ctx.lineTo(right, frontY(right));
    ctx.lineTo(right, frontY(right) + 25); ctx.lineTo(left, frontY(left) + 25); ctx.fill();
    for (const px of [-164, 164]) {
        const top = frontY(px) + 11;
        ctx.fillStyle = '#201a31'; ctx.fillRect(px - 8, top, 16, -top);
        ctx.fillStyle = '#403052'; ctx.fillRect(px - 8, top, 3, -top);
        ctx.fillStyle = '#a964d1'; ctx.fillRect(px - 7, -35, 2, 23);
    }
    ctx.fillStyle = '#393049';
    ctx.beginPath(); ctx.moveTo(left, frontY(left)); ctx.lineTo(left + 24, frontY(left + 24) - 25);
    ctx.lineTo(right, frontY(right) - 25); ctx.lineTo(right, frontY(right)); ctx.fill();
    ctx.strokeStyle = '#d38bff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(left, frontY(left) + 22); ctx.lineTo(right, frontY(right) + 22); ctx.stroke();
    ctx.save();
    // Clip to the visible span; the complete train enters and leaves offscreen.
    const viewLeft = (-60 - x) / scale, viewRight = (W + 60 - x) / scale;
    ctx.beginPath(); ctx.rect(viewLeft, -10000, viewRight - viewLeft, 20000); ctx.clip();
    if (kind === 'train' && phase !== null && phase >= 0 && phase <= 1) {
        const lead = viewLeft - 32 + phase * (viewRight - viewLeft + 812);
        for (let i = 0; i < 6; i++) {
            const tx = lead - i * 113, ty = deckY(tx);
            ctx.fillStyle = '#d7d0ef';
            ctx.beginPath(); ctx.moveTo(tx - 106, ty - 28); ctx.lineTo(tx - 16, ty - 28);
            ctx.quadraticCurveTo(tx + 10, ty - 22, tx + (i === 0 ? 28 : 0), ty - 3);
            ctx.lineTo(tx - 106, ty - 5); ctx.closePath(); ctx.fill();
            ctx.fillStyle = '#55447e'; ctx.fillRect(tx - 95, ty - 24, 75, 10);
            ctx.fillStyle = '#bd71e9'; ctx.fillRect(tx - 105, ty - 9, 94, 3);
            ctx.fillStyle = '#b9ecff'; ctx.fillRect(tx - 84, ty - 22, 18, 2);
        }
        ctx.strokeStyle = 'rgba(199,146,255,.3)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(lead - 760, deckY(lead) - 13); ctx.lineTo(lead - 660, deckY(lead) - 13); ctx.stroke();
    } else if (kind === 'road' && scale >= 0.06) {
        // Repeat traffic along the longer deck, with no visible reset at its ends.
        const offset = (ts * 0.08) % 213;
        const start = Math.floor((viewLeft - offset) / 213) * 213 + offset;
        for (let tx = start; tx < viewRight + 40; tx += 213) {
            const ty = deckY(tx), car = Math.round((tx - offset) / 213);
            ctx.fillStyle = ['#7855ae', '#c569a4', '#7797b2'][((car % 3) + 3) % 3]; ctx.fillRect(tx - 18, ty - 14, 39, 11);
            ctx.fillStyle = '#161b30'; ctx.fillRect(tx - 9, ty - 23, 19, 10);
            ctx.fillStyle = '#fff1b9'; ctx.fillRect(tx + 17, ty - 10, 4, 4);
            ctx.fillStyle = '#ff548e'; ctx.fillRect(tx - 18, ty - 10, 3, 4);
        }
    }
    ctx.restore();
    ctx.strokeStyle = '#7c6093'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(left, frontY(left) - 42); ctx.lineTo(right, frontY(right) - 42); ctx.stroke();
    // Only draw railing posts that can be visible, regardless of bridge length.
    const postSpacing = Math.max(32, Math.ceil(3 / scale / 32) * 32);
    for (let px = Math.ceil(viewLeft / postSpacing) * postSpacing; px < viewRight; px += postSpacing) {
        ctx.beginPath(); ctx.moveTo(px, frontY(px) - 42); ctx.lineTo(px, frontY(px) - 26); ctx.stroke();
    }
    if (kind === 'train') {
        ctx.strokeStyle = '#5f527d'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(left, frontY(left) - 61); ctx.lineTo(right, frontY(right) - 61); ctx.stroke();
    }
    ctx.restore();
}

function drawChapterRoad(x1, y1, w1, x2, y2, w2, isAlt, isStart, index) {
    const highway = currentLevel === LEVEL_HIGHWAY;
    const band = (left, right, color, height = 0) => {
        ctx.fillStyle = color;
        trapezoid(x1 + left * w1, y1 - height * w1, x1 + right * w1,
                  x2 + left * w2, y2 - height * w2, x2 + right * w2);
    };
    ctx.fillStyle = highway ? (isAlt ? '#10091c' : '#0b0715') : (isAlt ? '#50324c' : '#473045');
    ctx.fillRect(0, y2 - 1, W, y1 - y2 + 1.5);
    if (highway) {
        // Two real carriageways with a broad central divider. Approaching
        // traffic uses only the left pair of lanes, outside the race road.
        band(-3.55, -1.45, isAlt ? '#1b142c' : '#171022');
        if (Math.floor(index / 5) % 2 === 0) band(-2.52, -2.49, '#9d8bbd');
        band(-3.55, -3.52, '#716786'); band(-1.48, -1.45, '#716786');
        band(-1.45, -1.06, '#28182d');
        band(-1.4, -1.14, '#4e3154', 0.08);
        band(-1.4, -1.14, '#9b6acd', 0.095);
    } else {
        // Pale curbs, warm pavement and landscaped verges rather than a void.
        band(-1.65, 1.65, isAlt ? '#b77784' : '#ac7184');
        band(-2.3, -1.65, '#394641'); band(1.65, 2.3, '#394641');
        band(-1.19, -1.08, isAlt ? '#ffd1b7' : '#eaad9f');
        band(1.08, 1.19, isAlt ? '#ffd1b7' : '#eaad9f');
    }
    if (isStart) drawCheckeredLine(x1, y1, w1, x2, y2, w2, isAlt);
    else band(-1, 1, highway ? (isAlt ? '#171222' : '#120e1c') : (isAlt ? '#3b303f' : '#342b3b'));
    const edge = highway ? '#ad77fa' : '#ffd0ad';
    band(-1.025, -0.995, edge); band(0.995, 1.025, edge);
    if (!isStart && Math.floor(index / 5) % 2 === 0) {
        for (const lane of [-1 / 3, 1 / 3]) band(lane - 0.008, lane + 0.008, highway ? '#c8bce1' : '#efc6b3');
    }
    // Thin, broken reflection streaks on the violet asphalt.
    if (highway && index % 13 === 0 && !isStart) {
        band(0.66, 0.86, 'rgba(206,94,255,.12)'); band(-0.9, -0.77, 'rgba(109,171,255,.10)');
    }
    if (highway) {
        for (const side of [-1, 1]) {
            const edgeX = side * 1.06;
            band(edgeX - 0.025, edgeX + 0.025, '#322842', 0.08);
            band(edgeX - 0.035, edgeX + 0.035, '#c094f0', 0.09);
            if (index % 9 === 0) band(edgeX - 0.006, edgeX + 0.006, '#756487', 0.065);
        }
    }
}
