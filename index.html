function drawSpaceSaturn(satX,satY,satR){
  ctx.save();
  // Giant neon glowing bloom behind Saturn
  ctx.save();
  const satGlow = ctx.createRadialGradient(satX, satY, satR * 0.2, satX, satY, satR * 3.8);
  satGlow.addColorStop(0, 'rgba(255, 0, 127, 0.22)');
  satGlow.addColorStop(0.4, 'rgba(189, 0, 255, 0.11)');
  satGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = satGlow;
  ctx.beginPath();
  ctx.arc(satX, satY, satR * 3.8, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // 2a. Draw the back part of the rings (behind the planet, top half from Math.PI to 2*Math.PI)
  ctx.save();
  ctx.translate(satX, satY);
  ctx.rotate(-Math.PI * 0.15);

  // Ring Layer 2 (Main glowing magenta/purple ring)
  ctx.strokeStyle = '#bd00ff';
  ctx.lineWidth = satR * 0.32;
  ctx.shadowColor = '#bd00ff'; ctx.shadowBlur = 18;
  ctx.beginPath();
  ctx.ellipse(0, 0, satR * 2.2, satR * 0.40, 0, Math.PI, 2 * Math.PI);
  ctx.stroke();

  // Ring Layer 3 (Neon cyan inner ring)
  ctx.strokeStyle = '#00f0ff';
  ctx.lineWidth = satR * 0.12;
  ctx.shadowColor = '#00f0ff'; ctx.shadowBlur = 12;
  ctx.beginPath();
  ctx.ellipse(0, 0, satR * 1.65, satR * 0.30, 0, Math.PI, 2 * Math.PI);
  ctx.stroke();

  // Ring Layer 4 (Inner gold dusty ring)
  ctx.strokeStyle = '#ffe066';
  ctx.lineWidth = satR * 0.05;
  ctx.shadowColor = '#ffe066'; ctx.shadowBlur = 8;
  ctx.beginPath();
  ctx.ellipse(0, 0, satR * 1.38, satR * 0.25, 0, Math.PI, 2 * Math.PI);
  ctx.stroke();

  ctx.restore();

  // 2b. Draw Saturn sphere itself (glowing radial gradient)
  const satGrad = ctx.createRadialGradient(satX - satR * 0.2, satY - satR * 0.2, satR * 0.1, satX, satY, satR);
  satGrad.addColorStop(0, '#ffe066'); // yellow-orange highlight
  satGrad.addColorStop(0.4, '#ff4fd8'); // blending into pink
  satGrad.addColorStop(1, '#330044'); // dark purple shadow
  ctx.fillStyle = satGrad;
  ctx.beginPath();
  ctx.arc(satX, satY, satR, 0, Math.PI * 2);
  ctx.fill();

  // Draw horizontal shadow lines for classic synthwave styling
  ctx.save();
  ctx.strokeStyle = 'rgba(10, 4, 16, 0.45)';
  ctx.lineWidth = Math.max(1.5, satR * 0.09);
  for (let offset = -satR * 0.6; offset <= satR * 0.6; offset += satR * 0.25) {
      ctx.beginPath();
      const halfWidth = Math.sqrt(satR * satR - offset * offset);
      ctx.moveTo(satX - halfWidth, satY + offset);
      ctx.lineTo(satX + halfWidth, satY + offset);
      ctx.stroke();
  }
  ctx.restore();

  // 2c. Draw the front part of the rings (in front of the planet, bottom half from 0 to Math.PI)
  ctx.save();
  ctx.translate(satX, satY);
  ctx.rotate(-Math.PI * 0.15);

  // Main glowing magenta/purple ring
  ctx.strokeStyle = '#bd00ff';
  ctx.lineWidth = satR * 0.32;
  ctx.shadowColor = '#bd00ff'; ctx.shadowBlur = 18;
  ctx.beginPath();
  ctx.ellipse(0, 0, satR * 2.2, satR * 0.40, 0, 0, Math.PI);
  ctx.stroke();

  // Neon cyan inner ring
  ctx.strokeStyle = '#00f0ff';
  ctx.lineWidth = satR * 0.12;
  ctx.shadowColor = '#00f0ff'; ctx.shadowBlur = 12;
  ctx.beginPath();
  ctx.ellipse(0, 0, satR * 1.65, satR * 0.30, 0, 0, Math.PI);
  ctx.stroke();

  // Inner gold dusty ring
  ctx.strokeStyle = '#ffe066';
  ctx.lineWidth = satR * 0.05;
  ctx.shadowColor = '#ffe066'; ctx.shadowBlur = 8;
  ctx.beginPath();
  ctx.ellipse(0, 0, satR * 1.38, satR * 0.25, 0, 0, Math.PI);
  ctx.stroke();

  ctx.restore();

  ctx.restore();
}

// One shared panorama keeps celestial objects apart. Its motion comes only
// from the signed road curvature integrated by the driving simulation.
const SPACE_SKY_SPAN=8;
const SPACE_SKY_OBJECTS={saturn:.10,rocket:.93,galaxy:.15,enterprise:.955,earth:.02,sputnik:.055,giant:.85,astronaut:.84,dogfight:.12};
function getSpaceSkyTurn(){
  return bgOffset*.00010;
}
function spaceSkyX(azimuth,turn=getSpaceSkyTurn()){
  const delta=azimuth-turn;
  return W*.5+(delta-Math.floor(delta+.5))*W*SPACE_SKY_SPAN;
}
// Own motion is added to sky parallax; the horizontal speed is in screen widths/second.
const SPACE_SKY_FLIGHTS={
  sputnik:{speed:.018,angle:0,height:.32,padding:90},
  rocket:{speed:.050,angle:-.16,height:.17,padding:60},
  enterprise:{speed:.028,angle:-Math.PI*.04,height:.29,padding:70}
};
function getSpaceFlightPose(name,time){
  const flight=SPACE_SKY_FLIGHTS[name],distance=time*.001*W*flight.speed;
  const rawY=H*flight.height+Math.tan(flight.angle)*distance,span=H+flight.padding*2;
  // Re-enter only beyond the vertical canvas edge; the whole silhouette stays offscreen at the wrap.
  const y=((rawY+flight.padding)%span+span)%span-flight.padding;
  return{x:spaceSkyX(SPACE_SKY_OBJECTS[name]+distance/(W*SPACE_SKY_SPAN)),y,angle:flight.angle};
}
function drawSpaceStars(time){
  const turn=getSpaceSkyTurn();
  for(let i=0;i<680;i++){
    const x=spaceSkyX(polishHash(i+907),turn);if(x<-4||x>W+4)continue;
    const y=polishHash(i+2445)*H,size=i%10===0?3:i%3===0?2:1;
    const alpha=.12+(.5+.5*Math.sin(time*.004+i*1.5))*.78;
    ctx.fillStyle=`rgba(255,255,255,${alpha})`;ctx.fillRect(x,y,size,size);
  }
}
function drawSpacePolishBackdrop(horizonY,index){
  const r=W*.42,x=spaceSkyX(SPACE_SKY_OBJECTS.giant);
  if(x>-r*2.9&&x<W+r*2.9)drawSpaceGasGiant(x,H*.31+(horizonY-H*.5)*.15,r);
}
function drawSpaceSky(horizonY,index,time){
  ctx.save();
  const positions=Object.fromEntries(Object.entries(SPACE_SKY_OBJECTS).map(([name,angle])=>[name,spaceSkyX(angle)]));
  const flights=Object.fromEntries(Object.keys(SPACE_SKY_FLIGHTS).map(name=>[name,getSpaceFlightPose(name,time)]));
  const nebX=spaceSkyX(.93),nebY=H*.22,nebR=Math.min(W,H)*.48;
  const nebula=ctx.createRadialGradient(nebX,nebY,nebR*.1,nebX,nebY,nebR);
  nebula.addColorStop(0,'rgba(255,0,128,.22)');nebula.addColorStop(.4,'rgba(128,0,255,.11)');nebula.addColorStop(1,'rgba(0,0,0,0)');
  sceneEllipse(nebX,nebY,nebR,nebR,nebula);

  if(positions.galaxy>-W*.2&&positions.galaxy<W*1.2)drawSpiralGalaxy(positions.galaxy,H*.36,Math.min(W,H)*.125,time);
  // Earth has its own clear sector, beyond the giant's full ring silhouette.

  if(flights.rocket.x>-60&&flights.rocket.x<W+60)drawRocket(flights.rocket.x,flights.rocket.y,time,flights.rocket.angle);
  if(flights.enterprise.x>-70&&flights.enterprise.x<W+70)drawEnterprise(flights.enterprise.x,flights.enterprise.y,time,flights.enterprise.angle);
  if(flights.sputnik.x>-90&&flights.sputnik.x<W+90)drawSputnik(flights.sputnik.x,flights.sputnik.y,time);
  if(positions.dogfight>-W*.65&&positions.dogfight<W*1.65){
    ctx.save();ctx.translate(positions.dogfight,H*.40);ctx.scale(W/600,W/600);drawSpaceDogfight(time,0,0);ctx.restore();
  }
  const belt=clamp(Math.min((index-160)/140,(610-index)/140),0,1);
  if(belt>0){
    ctx.save();ctx.globalAlpha=belt*.50;
    for(let j=0;j<64;j++){
      const x=spaceSkyX(j/64),y=H*.17+j/64*H*.29+Math.sin(j*2.7)*H*.025,r=2+polishHash(j+71)*5;
      if(x<-r||x>W+r)continue;
      scenePoly([[x-r,y],[x-r*.4,y-r],[x+r*.7,y-r*.5],[x+r,y+r*.6],[x-r*.5,y+r]],j%2?'#796b8c':'#615775');
    }

const CAR_EXHAUST_X=[.28,.35,.65,.72];
function getCarExhausts(cx,cy,sc,isPlayer,lean=0){
  const g=getCarGeometry(cx,cy,sc,isPlayer),cos=Math.cos(lean),sin=Math.sin(lean);
  return CAR_EXHAUST_X.map(fraction=>{
    const x=g.px+g.bw*fraction,y=g.py+g.bh*.84;

function drawCarSprite(cx,cy,sc,color,isPlayer,lean=0,thrust=0,hit=0,isBoosting=false,isBraking=false,isChevronBoosting=false){

  const body=hit>0?'#ffd7d7':isPlayer?'#ffc521':color;
  const bumper=hit>0?'#ffffff':isPlayer?'#efa619':shadeColor(color,-18);
  const ports=getCarExhausts(cx,cy,sc,isPlayer);
  const screenPorts=getCarExhausts(cx,cy,sc,isPlayer,lean);
  const rect=(x,y,w,h)=>ctx.fillRect(px+bw*x,py+bh*y,bw*w,bh*h);
  const polygon=points=>{
    ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(px+bw*x,py+bh*y):ctx.moveTo(px+bw*x,py+bh*y));
    ctx.closePath();ctx.fill();
  };
  ctx.save();ctx.translate(cx,pivotY);ctx.rotate(lean);ctx.translate(-cx,-pivotY);
  ctx.fillStyle='rgba(0,0,0,.4)';rect(.045,.935,.91,.035);
  if(isPlayer)drawGlowRect(px+bw*.18,py+bh*.93,bw*.64,bh*.018,'#ff4fd8',4+thrust*4,.12);

  // Four jets follow the four mouths. Turbo colors and duration stay as before.
  if(isBoosting||isChevronBoosting){
    const flameColor=isChevronBoosting?'#ff00ff':'#21d4fd';
    const height=bh*(isChevronBoosting?1.6+Math.random()*.85:.6+Math.random()*.5);
    for(const port of ports){
      const halfWidth=port.radius*.95;
      ctx.fillStyle=flameColor;ctx.beginPath();ctx.moveTo(port.x-halfWidth,port.y);
      ctx.lineTo(port.x,port.y+height);ctx.lineTo(port.x+halfWidth,port.y);ctx.closePath();ctx.fill();
      if(isChevronBoosting){
        ctx.fillStyle='#ffffff';ctx.beginPath();ctx.moveTo(port.x-halfWidth*.45,port.y);
        ctx.lineTo(port.x,port.y+height*.42);ctx.lineTo(port.x+halfWidth*.45,port.y);ctx.closePath();ctx.fill();
      }

      const x=(pair[0].x+pair[1].x)/2;

    ctx.fillStyle = '#624331'; ctx.beginPath(); ctx.arc(1 - extension, y + 15, 2.5, 0, Math.PI * 2); ctx.fill();
  }
  // A characteristic forked crutch holds the outstretched hand.
  ctx.strokeStyle = '#e2b877'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(66, 0); ctx.lineTo(59, -161);
  ctx.lineTo(50, -174); ctx.moveTo(59, -161); ctx.lineTo(68, -175); ctx.stroke();
  ctx.restore();
}

function drawDaliEyeSprite(sx, sy, sc) {
  if (sc < 0.03) return;
  beginDaliSprite(sx, sy, sc, 60);
  ctx.strokeStyle = '#849485'; ctx.lineWidth = 7;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.bezierCurveTo(22, -45, -22, -75, 0, -128); ctx.stroke();
  ctx.fillStyle = '#668378';
  ctx.beginPath(); ctx.moveTo(1, -42); ctx.quadraticCurveTo(42, -82, 47, -58);
  ctx.quadraticCurveTo(28, -36, 1, -42); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-3, -75); ctx.quadraticCurveTo(-40, -114, -43, -82);
  ctx.quadraticCurveTo(-24, -65, -3, -75); ctx.fill();
  // An open eye nested in velvety, rust-gold petals.
  for (let i = 0; i < 8; i++) {
    const angle = i * Math.PI / 4;
    ctx.save(); ctx.translate(0, -147); ctx.rotate(angle);
    const petal = ctx.createLinearGradient(0, 0, 0, -60);
    petal.addColorStop(0, '#eab57b'); petal.addColorStop(1, i % 2 ? '#a55662' : '#c57561');
    ctx.fillStyle = petal;
    ctx.beginPath(); ctx.moveTo(-12, -8); ctx.bezierCurveTo(-35, -37, -16, -65, 0, -62);
    ctx.bezierCurveTo(20, -58, 26, -30, 12, -8); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  ctx.fillStyle = '#fff0d2'; ctx.strokeStyle = '#794656'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-45, -148); ctx.quadraticCurveTo(0, -185, 45, -148);
  ctx.quadraticCurveTo(0, -113, -45, -148); ctx.closePath(); ctx.fill(); ctx.stroke();
  const iris = ctx.createRadialGradient(-4, -154, 1, 0, -148, 17);
  iris.addColorStop(0, '#9fdbd6'); iris.addColorStop(0.6, '#4f929e'); iris.addColorStop(1, '#264c69');
  ctx.fillStyle = iris; ctx.beginPath(); ctx.arc(0, -148, 17, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#bfd9bd'; ctx.lineWidth = 1;
  for (let i = 0; i < 12; i++) {
    const a = i * Math.PI / 6;
    ctx.beginPath(); ctx.moveTo(Math.cos(a) * 9, -148 + Math.sin(a) * 9);
    ctx.lineTo(Math.cos(a) * 14, -148 + Math.sin(a) * 14); ctx.stroke();
  }
  ctx.fillStyle = '#192735'; ctx.beginPath(); ctx.arc(0, -148, 7, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff7e0'; ctx.beginPath(); ctx.arc(-4, -153, 3.5, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawCoralSpireSprite(sx, sy, sc) {
  const h = Math.max(10, ~~(sc * 200));
  const ts = Date.now();
  ctx.save();
  ctx.translate(sx, sy);
  
  // Base coral branches
  ctx.fillStyle = '#ff4d6d';
  ctx.strokeStyle = '#ff003c';
  ctx.lineWidth = Math.max(1, 3 * sc);
  
  ctx.beginPath();
  ctx.moveTo(-20 * sc, 0);
  ctx.quadraticCurveTo(-35 * sc, -h * 0.4, -15 * sc, -h * 0.65);
  ctx.quadraticCurveTo(-25 * sc, -h * 0.85, -30 * sc, -h);
  ctx.lineTo(-24 * sc, -h);
  ctx.quadraticCurveTo(-15 * sc, -h * 0.8, -10 * sc, -h * 0.55);
  ctx.quadraticCurveTo(5 * sc, -h * 0.85, 10 * sc, -h * 1.05); // another fork
  ctx.lineTo(16 * sc, -h * 1.05);
  ctx.quadraticCurveTo(12 * sc, -h * 0.7, 0, -h * 0.4);
  ctx.quadraticCurveTo(30 * sc, -h * 0.25, 20 * sc, 0);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  
  // Glowing bioluminescent polyps / dots
  const pulse = Math.sin(ts * 0.003) * 0.4 + 0.6;
  ctx.fillStyle = `rgba(0, 255, 210, ${pulse})`;
  ctx.shadowColor = '#00ffd2';
  ctx.shadowBlur = 12 * sc;
  
  const polyps = [
    {x: -24 * sc, y: -h * 0.45},
    {x: -16 * sc, y: -h * 0.75},
    {x: -27 * sc, y: -h * 0.95},
    {x: -5 * sc, y: -h * 0.52},
    {x: 6 * sc, y: -h * 0.75},
    {x: 12 * sc, y: -h * 0.98},
    {x: 10 * sc, y: -h * 0.25}
  ];
  
  for (const p of polyps) {
    ctx.beginPath();
    ctx.arc(p.x, p.y, Math.max(1, 4 * sc), 0, Math.PI * 2);
    ctx.fill();
  }
  
  ctx.restore();
}

function drawSeaGrassSprite(sx, sy, sc, ts, seed) {
  ctx.save(); ctx.translate(sx, sy); ctx.scale(sc, sc);
  ctx.fillStyle = '#123d36';
  ctx.beginPath(); ctx.ellipse(0, -2, 48, 9, 0, 0, Math.PI * 2); ctx.fill();
  for (let i = 0; i < 9; i++) {
    const root = (i - 4) * 9, height = 52 + (i * 23 % 51);
    const bend = (i - 4) * 5 + Math.sin(ts * 0.0018 + seed + i * 0.6) * 9;
    ctx.fillStyle = ['#167d68', '#29b890', '#75d6a6'][i % 3];
    ctx.beginPath(); ctx.moveTo(root - 4, 0);
    ctx.quadraticCurveTo(root + bend * 0.3 - 6, -height * 0.6, root + bend, -height);
    ctx.quadraticCurveTo(root + bend * 0.55 + 4, -height * 0.4, root + 4, 0);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function drawKelpSprite(sx, sy, sc, ts, seed) {
  ctx.save(); ctx.translate(sx, sy); ctx.scale(sc, sc);
  ctx.fillStyle = '#124a4c';
  ctx.beginPath(); ctx.ellipse(0, -3, 24, 9, 0, 0, Math.PI * 2); ctx.fill();
  for (let stalk = 0; stalk < 3; stalk++) {
    const root = (stalk - 1) * 17, height = 125 + stalk * 24;
    const sway = Math.sin(ts * 0.0013 + seed * 0.7 + stalk) * 13;
    ctx.strokeStyle = '#329f8b'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(root, 0);
    ctx.bezierCurveTo(root - sway, -height * 0.3, root + sway, -height * 0.65, root + sway, -height);
    ctx.stroke();
    for (let leaf = 1; leaf <= 5; leaf++) {
      const y = -height * leaf / 6, x = root + sway * leaf / 6;
      const side = (leaf + stalk) % 2 === 0 ? -1 : 1;
      ctx.fillStyle = leaf % 2 ? '#27ac91' : '#76cdb0';
      ctx.beginPath(); ctx.moveTo(x, y + 10);
      ctx.quadraticCurveTo(x + side * 35, y + 8, x + side * 30, y - 22);
      ctx.quadraticCurveTo(x + side * 7, y - 26, x, y + 10);
      ctx.fill();
      ctx.fillStyle = '#c8e490';
      ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.restore();
}

function drawFanCoralSprite(sx, sy, sc, ts, seed) {
  ctx.save(); ctx.translate(sx, sy); ctx.scale(sc, sc);
  ctx.rotate(Math.sin(ts * 0.001 + seed) * 0.025);
  ctx.strokeStyle = '#774684'; ctx.lineWidth = 9; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -35); ctx.stroke();
  ctx.fillStyle = 'rgba(128, 77, 186, 0.28)';
  ctx.beginPath(); ctx.moveTo(0, -20);
  ctx.bezierCurveTo(-96, -72, -68, -160, 0, -174);
  ctx.bezierCurveTo(68, -160, 96, -72, 0, -20);
  ctx.fill();
  for (let branch = -3; branch <= 3; branch++) {
    const tipX = branch * 20, tipY = -170 + Math.abs(branch) * 17;
    ctx.strokeStyle = branch % 2 ? '#b388dc' : '#dbb5ee'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, -24);
    ctx.quadraticCurveTo(branch * 12, -92, tipX, tipY); ctx.stroke();
    for (let twig = 1; twig <= 3; twig++) {
      const t = twig / 4, x = tipX * t, y = -28 + (tipY + 28) * t;
      for (const side of [-1, 1]) {
        ctx.strokeStyle = '#ad79c9'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(x, y + 12);
        ctx.quadraticCurveTo(x + side * 12, y, x + side * 16, y - 16); ctx.stroke();
        ctx.fillStyle = '#85eadc';
        ctx.beginPath(); ctx.arc(x + side * 16, y - 16, 2, 0, Math.PI * 2); ctx.fill();
      }
    }
  }
  ctx.restore();
}

function drawTubeSpongeSprite(sx, sy, sc) {
  ctx.save(); ctx.translate(sx, sy); ctx.scale(sc, sc);
  ctx.fillStyle = '#394848';
  ctx.beginPath(); ctx.ellipse(0, -3, 54, 12, 0, 0, Math.PI * 2); ctx.fill();
  for (const [x, height, radius] of [[-31, 69, 13], [26, 86, 15], [-3, 122, 17]]) {
    const body = ctx.createLinearGradient(x - radius, 0, x + radius, 0);
    body.addColorStop(0, '#986a28'); body.addColorStop(0.5, '#efbf57'); body.addColorStop(1, '#b88232');
    ctx.fillStyle = body;
    ctx.beginPath(); ctx.moveTo(x - radius * 0.8, -5);
    ctx.quadraticCurveTo(x - radius * 1.25, -height * 0.5, x - radius, -height);
    ctx.lineTo(x + radius, -height);
    ctx.quadraticCurveTo(x + radius * 1.25, -height * 0.5, x + radius * 0.8, -5);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#f9d984';
    ctx.beginPath(); ctx.ellipse(x, -height, radius, radius * 0.35, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#304250';
    ctx.beginPath(); ctx.ellipse(x, -height, radius * 0.62, radius * 0.22, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#956931';
    for (let pore = 0; pore < 7; pore++) {
      const px = x + Math.sin(pore * 2.4) * radius * 0.55;
      const py = -15 - pore * (height - 28) / 7;
      ctx.beginPath(); ctx.ellipse(px, py, 2, 3, 0, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.restore();
}

// --- DREAM ODYSSEY DEEP SEA FAUNA -------------------------------------------------
// All of these are drawn facing left (the direction the backdrop scrolls) and
// take a scale so the same sprite works as a distant silhouette or a close pass.

const TROPICAL_FISH_PALETTES = [
  { body: '#ffcc22', fin: '#ff7a00', stripe: '#1a1a2e' }, // butterflyfish
  { body: '#ff6b35', fin: '#ffffff', stripe: '#ffffff' }, // clownfish
  { body: '#2b8cff', fin: '#ffe066', stripe: '#0a2a5e' }, // regal tang
  { body: '#8f5cff', fin: '#00ffd2', stripe: '#2a0f52' }, // anthias
  { body: '#00e0a0', fin: '#ffe066', stripe: '#04503a' }  // parrotfish
];

function drawTropicalFish(x, y, sc, ts, idx) {
  const pal = TROPICAL_FISH_PALETTES[idx % TROPICAL_FISH_PALETTES.length];
  const wag = Math.sin(ts * 0.008 + idx * 1.7);
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(sc, sc);

  // Tail, hinged so it flicks
  ctx.save();
  ctx.translate(9, 0);
  ctx.rotate(wag * 0.5);
  ctx.fillStyle = pal.fin;
  ctx.beginPath();
  ctx.moveTo(0, 0); ctx.lineTo(9, -6); ctx.lineTo(7, 0); ctx.lineTo(9, 6);
  ctx.closePath(); ctx.fill();
  ctx.restore();

  // Dorsal + ventral fins
  ctx.fillStyle = pal.fin;
  ctx.beginPath(); ctx.moveTo(2, -5); ctx.lineTo(-2, -11); ctx.lineTo(-5, -4); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(1, 5); ctx.lineTo(-2, 10); ctx.lineTo(-4, 4); ctx.closePath(); ctx.fill();

  // Body
  ctx.fillStyle = pal.body;
  ctx.beginPath(); ctx.ellipse(0, 0, 10, 6, 0, 0, Math.PI * 2); ctx.fill();

  // Vertical stripes
  ctx.fillStyle = pal.stripe;
  ctx.globalAlpha = 0.85;
  for (let s = -1; s <= 1; s++) {
    ctx.beginPath();
    ctx.ellipse(s * 4.5 - 1, 0, 1.3, 5.4 - Math.abs(s) * 1.4, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Eye
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(-6, -1.5, 2, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#0a0a12';
  ctx.beginPath(); ctx.arc(-6.6, -1.5, 1, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

// A loose shoal: same fish repeated in a staggered formation, each on its own
// phase so the school ripples instead of moving as one rigid block.
function drawFishSchool(x, y, sc, ts, seed, count) {
  for (let i = 0; i < count; i++) {
    const a = seed * 2.3 + i * 1.9;
    const ox = Math.cos(a) * 46 + i * 13;
    const oy = Math.sin(a * 1.4) * 26 + Math.sin(ts * 0.002 + i) * 5;
    drawTropicalFish(x + ox * sc, y + oy * sc, sc * (0.65 + (i % 3) * 0.16), ts, seed + i);
  }
}

function drawSeaSerpent(x, y, sc, ts) {
  const SEGS = 26;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(sc, sc);

  const px = i => i * 15;
  const py = i => Math.sin(ts * 0.0016 + i * 0.42) * 22;

  // Dorsal frill, drawn first so the body overlaps its base
  ctx.fillStyle = 'rgba(120, 255, 120, 0.5)';
  ctx.beginPath();
  ctx.moveTo(px(0), py(0));
  for (let i = 0; i < SEGS; i++) ctx.lineTo(px(i), py(i) - (16 - i * 0.45));
  for (let i = SEGS - 1; i >= 0; i--) ctx.lineTo(px(i), py(i));
  ctx.closePath(); ctx.fill();

  // Body, tapering to the tail
  for (let i = SEGS - 1; i >= 0; i--) {
    const r = Math.max(1.5, 13 - i * 0.42);
    const shade = i / SEGS;
    ctx.fillStyle = interpolateColor('#2fbf5c', '#0d5c34', shade);
    ctx.beginPath(); ctx.arc(px(i), py(i), r, 0, Math.PI * 2); ctx.fill();
    // Bioluminescent spots along the flank
    if (i % 3 === 0) {
      ctx.fillStyle = 'rgba(180, 255, 210, 0.75)';
      ctx.beginPath(); ctx.arc(px(i), py(i) - r * 0.35, Math.max(0.8, r * 0.22), 0, Math.PI * 2); ctx.fill();
    }
  }

  // Head
  const hx = px(0), hy = py(0);
  ctx.fillStyle = '#39d768';
  ctx.beginPath(); ctx.ellipse(hx - 8, hy, 16, 11, 0, 0, Math.PI * 2); ctx.fill();
  // Jaw
  ctx.fillStyle = '#1f8f47';
  ctx.beginPath();
  ctx.moveTo(hx - 22, hy + 2); ctx.lineTo(hx - 4, hy + 4); ctx.lineTo(hx - 6, hy + 9);
  ctx.closePath(); ctx.fill();
  // Eye
  ctx.fillStyle = '#ffe066';
  ctx.beginPath(); ctx.arc(hx - 13, hy - 3, 3.4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#0a0a12';
  ctx.beginPath(); ctx.ellipse(hx - 13.6, hy - 3, 1.1, 3, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawSquid(x, y, sc, ts) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(sc, sc);
  const pulse = Math.sin(ts * 0.0012);

  // Arms trailing behind the mantle
  ctx.strokeStyle = '#c2306f';
  ctx.lineCap = 'round';
  for (let a = -4; a <= 4; a++) {
    ctx.lineWidth = 3.2 - Math.abs(a) * 0.3;
    ctx.beginPath();
    ctx.moveTo(14, a * 2.2);
    ctx.bezierCurveTo(
      26, a * 3.6 + pulse * 4,
      38, a * 5.2 - pulse * 5,
      50 + Math.abs(a), a * 7 + Math.sin(ts * 0.0015 + a) * 6
    );
    ctx.stroke();
  }
  // Two long hunting tentacles with paddles
  ctx.strokeStyle = '#e0508f';
  ctx.lineWidth = 2.2;
  for (const s of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(14, s * 4);
    ctx.bezierCurveTo(34, s * 8 + pulse * 6, 54, s * 4 - pulse * 8, 70, s * 12);
    ctx.stroke();
    ctx.fillStyle = '#ff7ab8';
    ctx.beginPath(); ctx.ellipse(70, s * 12, 5, 2.6, s * 0.5, 0, Math.PI * 2); ctx.fill();
  }

  // Mantle
  ctx.fillStyle = '#e0508f';
  ctx.beginPath();
  ctx.moveTo(-34, 0);
  ctx.quadraticCurveTo(-6, -13, 16, -7);
  ctx.lineTo(16, 7);
  ctx.quadraticCurveTo(-6, 13, -34, 0);
  ctx.closePath(); ctx.fill();

  // Swimming fins at the tip
  ctx.fillStyle = 'rgba(255, 150, 200, 0.85)';
  ctx.beginPath();
  ctx.moveTo(-30, -2);
  ctx.quadraticCurveTo(-44, -14 + pulse * 3, -50, -2);
  ctx.quadraticCurveTo(-44, 10 + pulse * 3, -30, 2);
  ctx.closePath(); ctx.fill();

  // Big squid eye
  ctx.fillStyle = '#ffe9a8';
  ctx.beginPath(); ctx.arc(8, -1, 5.4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#12060f';
  ctx.beginPath(); ctx.arc(6.6, -1, 2.6, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawReefShark(x, y, sc, ts) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(sc, sc);
  const sweep = Math.sin(ts * 0.0035);

  // A broad tail root overlaps the body, even at either extreme of the sweep.
  ctx.save();
  ctx.translate(28, 0);
  ctx.rotate(sweep * 0.23);
  const tailShade = ctx.createLinearGradient(0, -20, 0, 17);
  tailShade.addColorStop(0, '#6d869b'); tailShade.addColorStop(1, '#496477');
  ctx.fillStyle = tailShade;
  ctx.beginPath();
  ctx.moveTo(-5, -5);
  ctx.quadraticCurveTo(9, -5, 15, -11);
  ctx.quadraticCurveTo(23, -19, 29, -25);
  ctx.quadraticCurveTo(28, -11, 22, -2);
  ctx.quadraticCurveTo(24, 7, 28, 17);
  ctx.quadraticCurveTo(16, 13, 12, 6);
  ctx.quadraticCurveTo(5, 4, -5, 5);
  ctx.closePath(); ctx.fill();
  ctx.restore();

  // Body
  ctx.fillStyle = '#6d869b';
  ctx.beginPath();
  ctx.moveTo(-40, 0);
  ctx.bezierCurveTo(-24, -14, 1, -16, 22, -7);
  ctx.quadraticCurveTo(29, -4, 35, -3.5);
  ctx.lineTo(35, 3.5);
  ctx.bezierCurveTo(21, 7, 1, 14, -17, 8);
  ctx.quadraticCurveTo(-14, 12, -40, 0);
  ctx.closePath(); ctx.fill();

  // Pale underside
  ctx.fillStyle = '#c7d4dd';
  ctx.beginPath();
  ctx.moveTo(-34, 4);
  ctx.quadraticCurveTo(-8, 11, 30, 4.5);
  ctx.quadraticCurveTo(-8, 7, -34, 4);
  ctx.closePath(); ctx.fill();

  // Dorsal + pectoral fins
  ctx.fillStyle = '#5a7183';
  ctx.beginPath(); ctx.moveTo(2, -8); ctx.lineTo(10, -26); ctx.lineTo(16, -6); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-6, 5); ctx.lineTo(-2, 20); ctx.lineTo(10, 7); ctx.closePath(); ctx.fill();

  // Gills
  ctx.strokeStyle = 'rgba(30, 45, 60, 0.55)';
  ctx.lineWidth = 1.2;
  for (let g = 0; g < 5; g++) {
    ctx.beginPath();
    ctx.moveTo(-20 + g * 3.4, -5); ctx.lineTo(-21 + g * 3.4, 3);
    ctx.stroke();
  }

  // Eye and mouth
  ctx.fillStyle = '#0d1219';
  ctx.beginPath(); ctx.arc(-29, -2.5, 2.1, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(20, 30, 40, 0.7)';
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(-40, 3); ctx.quadraticCurveTo(-33, 6.5, -25, 5.5);
  ctx.stroke();
  ctx.restore();
}

function drawWhale(x, y, sc, ts) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(sc, sc);
  const glide = Math.sin(ts * 0.0012);

  // Fluke
  ctx.save();
  ctx.translate(72, 0);
  ctx.rotate(glide * 0.2);
  ctx.fillStyle = '#2c4a63';
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(22, -10, 40, -26);
  ctx.quadraticCurveTo(24, -8, 20, 0);
  ctx.quadraticCurveTo(24, 8, 40, 26);
  ctx.quadraticCurveTo(22, 10, 0, 0);
  ctx.closePath(); ctx.fill();
  ctx.restore();

  // Body
  ctx.fillStyle = '#38617f';
  ctx.beginPath();
  ctx.moveTo(-86, 4);
  ctx.quadraticCurveTo(-58, -34, 6, -30);
  ctx.quadraticCurveTo(58, -26, 74, -4);
  ctx.lineTo(74, 5);
  ctx.quadraticCurveTo(50, 26, -10, 30);
  ctx.quadraticCurveTo(-62, 30, -86, 4);
  ctx.closePath(); ctx.fill();

  // Pale belly with ventral grooves
  ctx.fillStyle = '#9fc0d2';
  ctx.beginPath();
  ctx.moveTo(-78, 8);
  ctx.quadraticCurveTo(-40, 28, -6, 27);
  ctx.quadraticCurveTo(40, 24, 66, 5);
  ctx.quadraticCurveTo(30, 14, -20, 14);
  ctx.quadraticCurveTo(-56, 14, -78, 8);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(45, 85, 110, 0.5)';
  ctx.lineWidth = 1.3;
  for (let g = 0; g < 7; g++) {
    ctx.beginPath();
    ctx.moveTo(-72 + g * 9, 10 + g * 0.7);
    ctx.quadraticCurveTo(-64 + g * 9, 20, -58 + g * 9, 25);
    ctx.stroke();
  }

  // Pectoral flipper
  ctx.fillStyle = '#2c4a63';
  ctx.save();
  ctx.translate(-24, 18);
  ctx.rotate(0.5 + glide * 0.18);
  ctx.beginPath(); ctx.ellipse(12, 0, 26, 7, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  // Eye and jawline
  ctx.fillStyle = '#0c1a24';
  ctx.beginPath(); ctx.arc(-64, 2, 3.2, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(20, 40, 55, 0.6)';
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  ctx.moveTo(-86, 6); ctx.quadraticCurveTo(-70, 12, -50, 13);
  ctx.stroke();
  ctx.restore();
}

function drawSputnik(x, y, ts) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(-40 * Math.PI / 180); // Tilt Sputnik by 40 degrees counter-clockwise
  
  // Define antennas: angles and lengths
  // Grouped in two pairs, starting from the surface of the sphere
  const rSphere = 11;
  const antennas = [
    { angle: Math.PI * 1.05, len: 54, socketColor: '#5a697f' },
    { angle: Math.PI * 1.10, len: 54, socketColor: '#5a697f' },
    { angle: Math.PI * 1.34, len: 54, socketColor: '#4e5b6e' },
    { angle: Math.PI * 1.39, len: 54, socketColor: '#4e5b6e' }
  ];

  for (let ant of antennas) {
    const cos = Math.cos(ant.angle);
    const sin = Math.sin(ant.angle);

    // 1. Draw mounting bracket sleeve (socket)
    ctx.strokeStyle = ant.socketColor;
    ctx.lineWidth = 2.8;
    ctx.beginPath();
    ctx.moveTo(cos * (rSphere - 1), sin * (rSphere - 1));
    ctx.lineTo(cos * (rSphere + 3.5), sin * (rSphere + 3.5));
    ctx.stroke();

    // 2. Draw the thin whip antenna extending outwards
    ctx.strokeStyle = '#c4ccd9';
    ctx.lineWidth = 1.0;
    ctx.beginPath();
    ctx.moveTo(cos * (rSphere + 3.5), sin * (rSphere + 3.5));
    ctx.lineTo(cos * (rSphere + ant.len), sin * (rSphere + ant.len));
    ctx.stroke();
    
    // Tiny tip of the antenna
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(cos * (rSphere + ant.len), sin * (rSphere + ant.len), 0.8, 0, Math.PI * 2);
    ctx.fill();
  }

  // Main Body Sphere with metallic satin gradient shading
  const grad = ctx.createRadialGradient(-3.5, -3.5, 1, 0, 0, rSphere);
  grad.addColorStop(0, '#ffffff');
  grad.addColorStop(0.35, '#a6b5c9');
  grad.addColorStop(0.75, '#5c6d84');
  grad.addColorStop(1, '#252f3d');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(0, 0, rSphere, 0, Math.PI * 2);
  ctx.fill();

  // Subtle metallic surface shine/seam across the middle (horizontal equator weld line)
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
  ctx.lineWidth = 0.8;
  ctx.beginPath();
  ctx.ellipse(0, 0, rSphere, rSphere * 0.25, -Math.PI * 0.15, 0, Math.PI * 2);
  ctx.stroke();

  // Blinking red transmitter light: off-centered, smaller, and less overwhelming
  const isLit = Math.floor(ts * 0.0018) % 2 === 0; // slower, more realistic beacon pulse
  if (isLit) {
    // Off-centered coordinates (placed beautifully on the front-right hemisphere)
    const lx = 4.0;
    const ly = 2.5;
    
    // Soft ambient glow
    ctx.fillStyle = 'rgba(255, 0, 85, 0.35)';
    ctx.beginPath();
    ctx.arc(lx, ly, 3.5, 0, Math.PI * 2);
    ctx.fill();
    
    // Intense core (smaller, 1.2px)
    ctx.fillStyle = '#ff3366';
    ctx.beginPath();
    ctx.arc(lx, ly, 1.2, 0, Math.PI * 2);
    ctx.fill();
  }
  
  ctx.restore();
}

function drawEarth(x, y, r, ts) {
  ctx.save();
  ctx.translate(x, y);

  // 1. Draw atmosphere outer corona glow
  const coronaGrad = ctx.createRadialGradient(0, 0, r * 0.9, 0, 0, r * 1.35);
  coronaGrad.addColorStop(0, 'rgba(0, 190, 255, 0.4)');
  coronaGrad.addColorStop(0.5, 'rgba(0, 140, 255, 0.15)');
  coronaGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = coronaGrad;
  ctx.beginPath();
  ctx.arc(0, 0, r * 1.35, 0, Math.PI * 2);
  ctx.fill();

  // 2. Base deep space back shadow (solid backing circle)
  ctx.fillStyle = '#05091a';
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fill();

  // 3. Create a clipping mask of Earth's sphere for rendering rotating contents
  ctx.save();
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.clip();

  // 3a. Deep ocean background gradient
  const oceanGrad = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.1, 0, 0, r);
  oceanGrad.addColorStop(0, '#1c88ff'); // bright royal blue ocean highlight
  oceanGrad.addColorStop(0.5, '#0c52eb'); // rich blue ocean body
  oceanGrad.addColorStop(1, '#02184a'); // deep shadowed navy ocean
  ctx.fillStyle = oceanGrad;
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fill();

  // 3b. Continents with continuous wrap-around rotation (Slowed down to 20% of original speed)
  const drift = (ts * 0.0024) % (r * 6.0);
  ctx.save();
  ctx.translate(-drift, 0);
  
  for (let cycle = 0; cycle <= 2; cycle++) {
    const ox = cycle * r * 3.0; // horizontal wrap distance

    // Americas-like landmass
    ctx.fillStyle = '#22c55e'; // emerald green
    ctx.beginPath();
    ctx.moveTo(ox - r * 0.8, -r * 0.6);
    ctx.bezierCurveTo(ox - r * 0.3, -r * 0.7, ox + r * 0.2, -r * 0.3, ox + r * 0.1, r * 0.1);
    ctx.bezierCurveTo(ox + r * 0.5, r * 0.3, ox - r * 0.1, r * 0.8, ox - r * 0.5, r * 0.5);
    ctx.bezierCurveTo(ox - r * 0.7, r * 0.2, ox - r * 1.1, -r * 0.2, ox - r * 0.8, -r * 0.6);
    ctx.closePath();
    ctx.fill();

    // Mountain/elevated terrain accent
    ctx.fillStyle = '#82a03c'; // olive/yellow-green
    ctx.beginPath();
    ctx.moveTo(ox - r * 0.4, -r * 0.4);
    ctx.lineTo(ox - r * 0.1, -r * 0.3);
    ctx.lineTo(ox - r * 0.2, 0);
    ctx.closePath();
    ctx.fill();

    // Europe & Africa-like landmass
    ctx.fillStyle = '#10b981'; // minty emerald green
    ctx.beginPath();
    ctx.moveTo(ox + r * 0.8, -r * 0.7);
    ctx.bezierCurveTo(ox + r * 1.4, -r * 0.5, ox + r * 1.5, r * 0.1, ox + r * 1.2, r * 0.4);
    ctx.bezierCurveTo(ox + r * 0.9, r * 0.8, ox + r * 0.6, r * 0.2, ox + r * 0.5, -r * 0.1);
    ctx.bezierCurveTo(ox + r * 0.4, -r * 0.4, ox + r * 0.6, -r * 0.6, ox + r * 0.8, -r * 0.7);
    ctx.closePath();
    ctx.fill();
    
    // Sandy dry desert region (Sahara)
    ctx.fillStyle = '#d4af37'; // gold
    ctx.beginPath();
    ctx.moveTo(ox + r * 0.8, -r * 0.4);
    ctx.bezierCurveTo(ox + r * 1.1, -r * 0.3, ox + r * 1.2, -r * 0.1, ox + r * 1.0, 0);
    ctx.closePath();
    ctx.fill();

    // Greenland/Arctic cold north ice cap
    ctx.fillStyle = '#f3f4f6'; // soft white
    ctx.beginPath();
    ctx.ellipse(ox + r * 0.2, -r * 0.85, r * 0.5, r * 0.15, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();

  // 3c. Atmospheric swirling clouds (drifting at slightly faster rate for dynamic parallax - slowed to 20% speed)
  const cloudDrift = (ts * 0.0036) % (r * 6.0);
  ctx.save();
  ctx.translate(-cloudDrift, 0);
  ctx.fillStyle = 'rgba(255, 255, 255, 0.52)';
  
  for (let cycle = 0; cycle <= 2; cycle++) {
    const ox = cycle * r * 3.0;
    
    // Cloud Band 1 (Northern Hemisphere swirl)
    ctx.beginPath();
    ctx.moveTo(ox - r * 1.2, -r * 0.35);
    ctx.bezierCurveTo(ox - r * 0.6, -r * 0.55, ox + r * 0.3, -r * 0.25, ox + r * 0.8, -r * 0.45);
    ctx.bezierCurveTo(ox + r * 0.5, -r * 0.15, ox - r * 0.2, -r * 0.15, ox - r * 1.0, -r * 0.25);
    ctx.closePath();
    ctx.fill();

    // Cloud Band 2 (Southern Hemisphere swirl)
    ctx.beginPath();
    ctx.moveTo(ox - r * 0.3, r * 0.35);
    ctx.bezierCurveTo(ox + r * 0.4, r * 0.55, ox + r * 1.1, r * 0.25, ox + r * 1.4, r * 0.45);
    ctx.bezierCurveTo(ox + r * 0.9, r * 0.75, ox + r * 0.1, r * 0.65, ox - r * 0.3, r * 0.45);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();

  ctx.restore(); // end of sphere clipping

  // 4. Shading terminator (3D spherical volume overlay)
  const shadowGrad = ctx.createLinearGradient(-r * 0.5, -r * 0.5, r * 0.8, r * 0.8);
  shadowGrad.addColorStop(0, 'rgba(0, 0, 0, 0)');
  shadowGrad.addColorStop(0.5, 'rgba(1, 8, 30, 0.15)');
  shadowGrad.addColorStop(1, 'rgba(0, 3, 15, 0.86)');
  ctx.fillStyle = shadowGrad;
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fill();

  // 5. Cinematic inner rim/atmospheric edge glow (cyan/blue)
  const rimGrad = ctx.createRadialGradient(0, 0, r * 0.84, 0, 0, r);
  rimGrad.addColorStop(0, 'rgba(120, 230, 255, 0)');
  rimGrad.addColorStop(0.5, 'rgba(120, 230, 255, 0.2)');
  rimGrad.addColorStop(1, 'rgba(100, 220, 255, 0.6)');
  ctx.fillStyle = rimGrad;
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function drawSpiralGalaxy(x, y, r, ts) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(-22 * Math.PI / 180); // Tilt the galaxy disk elegantly
  
  // 1. Draw background galactic haze / ambient glow
  const hazeGrad = ctx.createRadialGradient(0, 0, r * 0.1, 0, 0, r * 1.25);
  hazeGrad.addColorStop(0, 'rgba(130, 0, 190, 0.24)'); // deep violet core glow
  hazeGrad.addColorStop(0.4, 'rgba(0, 95, 210, 0.08)'); // cyan haze
  hazeGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = hazeGrad;
  ctx.beginPath();
  ctx.arc(0, 0, r * 1.25, 0, Math.PI * 2);
  ctx.fill();

  // 2. Slow majestic galactic rotation over time
  const rot = ts * 0.00005;

  // 3. Draw logarithmic spiral arms (2 main arms, tilted disk)
  const steps = 30;
  const numArms = 2;
  
  for (let arm = 0; arm < numArms; arm++) {
    const armOffset = arm * Math.PI;
    for (let i = 0; i < steps; i++) {
      // theta goes from 0 (core) to 2.2 * Math.PI (outer rim)
      const t = (i / steps) * 2.2 * Math.PI;
      const factor = i / steps; // 0 to 1
      
      // Logarithmic spiral distance scaling
      const dist = (0.12 + 0.88 * Math.pow(factor, 1.25)) * r;
      const angle = t + armOffset + rot;
      
      // Calculate coordinates (squashed vertically by 0.35 for stunning tilted aspect ratio)
      const gx = Math.cos(angle) * dist;
      const gy = Math.sin(angle) * dist * 0.35;
      
      // Wide soft gas cloud (magenta / violet)
      ctx.fillStyle = `rgba(230, 0, 255, ${0.10 * (1 - factor * 0.7)})`;
      ctx.beginPath();
      ctx.arc(gx, gy, r * (0.28 - factor * 0.18), 0, Math.PI * 2);
      ctx.fill();

      // Glowing star cluster nodes (cyan / blue)
      ctx.fillStyle = `rgba(0, 240, 255, ${0.21 * (1 - factor * 0.5)})`;
      ctx.beginPath();
      ctx.arc(gx, gy, r * (0.12 - factor * 0.07), 0, Math.PI * 2);
      ctx.fill();
      
      // Tiny hot-white star core dots
      if (i % 2 === 0) {
        ctx.fillStyle = `rgba(255, 255, 255, ${0.85 * (1 - factor * 0.4)})`;
        ctx.beginPath();
        ctx.arc(gx, gy, Math.max(0.6, 1.5 * (1 - factor * 0.6)), 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  // 4. Draw bright galaxy core
  const coreGrad = ctx.createRadialGradient(0, 0, 1, 0, 0, r * 0.24);
  coreGrad.addColorStop(0, '#ffffff'); // pure white-hot center
  coreGrad.addColorStop(0.2, '#ffe3b5'); // warm starburst glow
  coreGrad.addColorStop(0.5, 'rgba(255, 45, 145, 0.55)'); // hot pink/red transition
  coreGrad.addColorStop(1, 'rgba(70, 0, 190, 0)');
  ctx.fillStyle = coreGrad;
  ctx.save();
  ctx.scale(1.0, 0.42); // squash core to match the disk tilt
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.24, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  ctx.restore();
}

function drawRocket(x, y, ts, angle) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle !== undefined ? angle : -Math.PI * 0.12); // tilted upwards
  
  // Flame
  ctx.save();
  const flameLen = 15 + Math.sin(ts * 0.04) * 5;
  const fGrad = ctx.createLinearGradient(-12, 0, -12 - flameLen, 0);
  fGrad.addColorStop(0, '#ffffff');
  fGrad.addColorStop(0.3, '#ffcc00');
  fGrad.addColorStop(0.6, '#ff0055');
  fGrad.addColorStop(1, 'rgba(255, 0, 85, 0)');
  ctx.fillStyle = fGrad;
  ctx.beginPath();
  ctx.moveTo(-12, -4);
  ctx.lineTo(-12 - flameLen, 0);
  ctx.lineTo(-12, 4);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  // Rocket fins
  ctx.fillStyle = '#ff0055';
  ctx.beginPath();
  ctx.moveTo(-10, -3); ctx.lineTo(-18, -10); ctx.lineTo(-10, -8); ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-10, 3); ctx.lineTo(-18, 10); ctx.lineTo(-10, 8); ctx.closePath(); ctx.fill();
  
  // Fuselage (Sleek aerodynamic body)
  const bodyGrad = ctx.createLinearGradient(-12, 0, 18, 0);
  bodyGrad.addColorStop(0, '#cccccc');
  bodyGrad.addColorStop(0.5, '#f0f0f0');
  bodyGrad.addColorStop(1, '#ff0055'); // red nosecone!
  ctx.fillStyle = bodyGrad;
  ctx.beginPath();
  ctx.moveTo(-12, -5);
  ctx.quadraticCurveTo(5, -6, 18, 0);
  ctx.quadraticCurveTo(5, 6, -12, 5);
  ctx.closePath();
  ctx.fill();

  // Window
  ctx.fillStyle = '#00ffff';
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(0, 0, 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  ctx.restore();
}

function drawEnterprise(x, y, ts, angle = -Math.PI * 0.04) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle); // The flight path and bow share this heading.
  
  // Warp nacelles pylons
  ctx.strokeStyle = '#8ca3bc';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(-10, 2);
  ctx.lineTo(-15, -12);
  ctx.moveTo(-10, 3);
  ctx.lineTo(-12, 10); // secondary nacelle lower
  ctx.stroke();

  // Warp Nacelles (cylinders with glowing red domes and cyan warp grills)
  // Upper nacelle
  ctx.fillStyle = '#b0c4de';
  ctx.fillRect(-28, -16, 26, 4.5);
  // Glowing red collector dome
  ctx.fillStyle = '#ff003c';
  ctx.shadowColor = '#ff003c'; ctx.shadowBlur = 4;
  ctx.beginPath(); ctx.arc(-2, -13.75, 2.2, -Math.PI*0.5, Math.PI*0.5); ctx.fill();
  ctx.shadowBlur = 0;
  
  // Lower nacelle
  ctx.fillStyle = '#8ca3bc';
  ctx.fillRect(-25, 8, 23, 4);
  ctx.fillStyle = '#ff003c';
  ctx.beginPath(); ctx.arc(-2, 10, 2, -Math.PI*0.5, Math.PI*0.5); ctx.fill();

  // Connecting neck
  ctx.fillStyle = '#a1b5cc';
  ctx.beginPath();
  ctx.moveTo(5, -2);
  ctx.lineTo(8, -8);
  ctx.lineTo(14, -8);
  ctx.lineTo(11, -2);
  ctx.closePath();
  ctx.fill();

  // Engineering hull
  const hullGrad = ctx.createLinearGradient(-15, 2, 12, 2);
  hullGrad.addColorStop(0, '#7c94ad');
  hullGrad.addColorStop(1, '#b0c4de');
  ctx.fillStyle = hullGrad;
  ctx.beginPath();
  ctx.ellipse(-2, 2, 14, 5, 0, 0, Math.PI * 2);
  ctx.fill();

  // Glowing cyan deflector dish
  ctx.fillStyle = '#00f0ff';
  ctx.shadowColor = '#00f0ff'; ctx.shadowBlur = 6;
  ctx.beginPath();
  ctx.ellipse(12, 2, 1.5, 3.5, 0, -Math.PI*0.5, Math.PI*0.5);
  ctx.fill();
  ctx.shadowBlur = 0;

  // Saucer Section
  const saucerGrad = ctx.createLinearGradient(0, -10, 28, -10);
  saucerGrad.addColorStop(0, '#98afc7');
  saucerGrad.addColorStop(0.5, '#e5eef7');
  saucerGrad.addColorStop(1, '#b0c4de');
  ctx.fillStyle = saucerGrad;
  ctx.beginPath();
  ctx.ellipse(14, -10, 18, 3, 0, 0, Math.PI * 2);
  ctx.fill();

  // Bridge dome
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(14, -12, 1.8, Math.PI, 0);
  ctx.fill();

  ctx.restore();
}

function drawAstronaut(x, y, ts) {
  ctx.save();
  ctx.translate(x, y);
  // Gentle rotation & floating
  ctx.rotate(Math.sin(ts * 0.001) * 0.25);
  
  // Jetpack nozzles on the back/left
  ctx.fillStyle = '#556677';
  ctx.fillRect(-9, 3, 2, 3);
  ctx.fillRect(-6, 3, 2, 3);

  // Glowing blue rocket flame under jetpack
  ctx.save();
  const flameLen = 8 + Math.sin(ts * 0.05) * 4;
  const fGrad = ctx.createLinearGradient(0, 5, 0, 5 + flameLen);
  fGrad.addColorStop(0, '#ffffff');
  fGrad.addColorStop(0.3, '#00bfff');
  fGrad.addColorStop(0.7, '#0000ff');
  fGrad.addColorStop(1, 'rgba(0, 0, 255, 0)');
  ctx.fillStyle = fGrad;
  ctx.shadowColor = '#00bfff'; ctx.shadowBlur = 6;
  ctx.beginPath();
  ctx.moveTo(-9, 5);
  ctx.lineTo(-7.5, 5 + flameLen);
  ctx.lineTo(-6, 5);
  ctx.lineTo(-4.5, 5 + flameLen);
  ctx.lineTo(-3, 5);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  // Silver/white Jetpack body
  ctx.fillStyle = '#a6b0c3';
  ctx.fillRect(-10, -6, 5, 11);

  // Spacesuit body
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  // Torso
  ctx.roundRect(-5, -4, 9, 10, 2);
  ctx.fill();

  // Left arm reaching out
  ctx.save();
  ctx.translate(-5, -2);
  ctx.rotate(-0.5 + Math.sin(ts * 0.002) * 0.3);
  ctx.fillRect(-4, -1.5, 4, 3);
  ctx.restore();

  // Right arm holding an MTV flagpole!
  ctx.save();
  ctx.translate(4, -2);
  ctx.rotate(0.8 + Math.cos(ts * 0.002) * 0.4);
  
  // Draw arm
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, -1.5, 4, 3);
  
  // Flagpole (stretching upwards from the hand)
  ctx.strokeStyle = '#d1d5db';
  ctx.lineWidth = 0.8;
  ctx.beginPath();
  ctx.moveTo(3.5, 0);
  ctx.lineTo(3.5, -22);
  ctx.stroke();

  // Solidly attached MTV flag at the top of the pole
  ctx.save();
  ctx.translate(3.5, -22);
  
  // Flag Background: Black with rounded corners
  ctx.fillStyle = '#0a0a0c';
  ctx.beginPath();
  ctx.roundRect(0, 0, 16, 11, 1.2);
  ctx.fill();
  ctx.strokeStyle = '#33333f';
  ctx.lineWidth = 0.5;
  ctx.stroke();

  // Iconic Yellow 'M'
  ctx.fillStyle = '#ffff00';
  ctx.beginPath();
  ctx.moveTo(1.5, 1.5);
  ctx.lineTo(4.5, 1.5);
  ctx.lineTo(6.5, 4.5);
  ctx.lineTo(8.5, 1.5);
  ctx.lineTo(11.5, 1.5);
  ctx.lineTo(11.5, 9.5);
  ctx.lineTo(9.5, 9.5);
  ctx.lineTo(9.5, 5.5);
  ctx.lineTo(6.5, 9.0);
  ctx.lineTo(3.5, 5.5);
  ctx.lineTo(3.5, 9.5);
  ctx.lineTo(1.5, 9.5);
  ctx.closePath();
  ctx.fill();

  // Cyan 3D shadow for 'M'
  ctx.fillStyle = '#00f0ff';
  ctx.fillRect(11.5, 1.5, 1.0, 8.0);
  ctx.fillRect(3.5, 8.5, 6.0, 1.0);

  // Handwritten red 'TV' overlapping the 'M'
  ctx.strokeStyle = '#ff2255';
  ctx.lineWidth = 1.1;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  
  // T letter
  ctx.beginPath();
  ctx.moveTo(7.5, 4.2);
  ctx.lineTo(12.5, 2.5);
  ctx.moveTo(9.8, 3.2);
  ctx.lineTo(10.2, 8.8);
  ctx.stroke();

  // V letter
  ctx.beginPath();
  ctx.moveTo(11.8, 3.8);
  ctx.lineTo(13.2, 8.5);
  ctx.lineTo(15.2, 2.0);
  ctx.stroke();

  ctx.restore();
  ctx.restore();

  // Legs
  // Left leg
  ctx.fillRect(-4, 5, 3, 6);
  // Right leg
  ctx.fillRect(1, 5, 3, 6);

  // Helmet
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(0, -8, 5.5, 0, Math.PI * 2);
  ctx.fill();

  // Golden metallic visor
  const visorGrad = ctx.createLinearGradient(-3, -10, 3, -6);
  visorGrad.addColorStop(0, '#ffd700');
  visorGrad.addColorStop(0.5, '#ffa500');
  visorGrad.addColorStop(1, '#ff3c00');
  ctx.fillStyle = visorGrad;
  ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 3;
  ctx.beginPath();
  ctx.roundRect(-3, -10.5, 6, 4.5, 1.5);
  ctx.fill();
  ctx.shadowBlur = 0;

  ctx.restore();
}

function getShip1Pos(t, centerX, centerY) {
  // Give them more space to roam around smoothly with larger Lissajous orbits
  const x = centerX + Math.cos(t * 0.55) * 165 + Math.sin(t * 1.1) * 45;
  const y = centerY + Math.sin(t * 1.3) * 70 + Math.cos(t * 0.4) * 20;
  return { x, y };
}

function getShip2Pos(t, centerX, centerY) {
  // Base chasing trajectory for Ship 2
  const base_x = centerX + Math.cos(t * 0.55 - 0.9) * 165 + Math.sin(t * 1.1 - 0.9) * 45 - Math.cos(t * 0.28) * 65;
  const base_y = centerY + Math.sin(t * 1.3 - 0.9) * 70 + Math.cos(t * 0.4 - 0.9) * 20 - Math.sin(t * 0.28) * 35;
  
  const s1 = getShip1Pos(t, centerX, centerY);
  let dx = base_x - s1.x;
  let dy = base_y - s1.y;
  let dist = Math.sqrt(dx * dx + dy * dy);
  
  // Strictly enforce a minimum distance of 85px to NEVER let them overlap!
  const minDist = 85;
  if (dist < minDist) {
    if (dist < 1) { dx = 1; dy = 0; dist = 1; }
    const push = minDist - dist;
    const px = (dx / dist) * push;
    const py = (dy / dist) * push;
    return { x: base_x + px, y: base_y + py };
  }
  return { x: base_x, y: base_y };
}

function drawLaserBolt(fromX, fromY, toX, toY, progress, isCyan) {
  // Projectiles disappear/fade out after traveling some distance (reaches 0.85)
  if (progress < 0 || progress > 0.85) return;
  
  const px = fromX + (toX - fromX) * progress;
  const py = fromY + (toY - fromY) * progress;
  const pAngle = Math.atan2(toY - fromY, toX - fromX);
  
  ctx.save();
  ctx.translate(px, py);
  ctx.rotate(pAngle);
  
  // Fade out elegantly near the end
  const alpha = progress < 0.6 ? 1.0 : (0.85 - progress) / 0.25;
  ctx.globalAlpha = alpha;
  
  // Shiny glowing double-layer laser design
  ctx.shadowBlur = 24; // Triple-strength bright neon glow
  if (isCyan) {
    ctx.strokeStyle = '#00ffff';
    ctx.shadowColor = '#00f0ff';
    ctx.lineWidth = 4.2;
    ctx.beginPath();
    ctx.moveTo(-11, 0);
    ctx.lineTo(11, 0);
    ctx.stroke();
    
    // Core white hot ray
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-9, 0);
    ctx.lineTo(9, 0);
    ctx.stroke();
  } else {
    ctx.strokeStyle = '#ff0055';
    ctx.shadowColor = '#ff0055';
    ctx.lineWidth = 4.2;
    ctx.beginPath();
    ctx.moveTo(-11, 0);
    ctx.lineTo(11, 0);
    ctx.stroke();
    
    // Core white hot ray
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-9, 0);
    ctx.lineTo(9, 0);
    ctx.stroke();
  }
  ctx.restore();
}

function drawSpaceDogfight(ts, centerX, centerY) {
  const t = ts * 0.001; // Time in seconds

  // Get precise smooth positions for both ships
  const s1 = getShip1Pos(t, centerX, centerY);
  const s2 = getShip2Pos(t, centerX, centerY);

  // Derive exact heading orientations using forward derivatives
  const dt_val = 0.04;
  const s1_next = getShip1Pos(t + dt_val, centerX, centerY);
  const angle1 = Math.atan2(s1_next.y - s1.y, s1_next.x - s1.x);

  const s2_next = getShip2Pos(t + dt_val, centerX, centerY);
  const angle2 = Math.atan2(s2_next.y - s2.y, s2_next.x - s2.x);

  // --- LASER PROJECTILE SYSTEM ---
  // Burst cycles of 4 seconds:
  // Phase 1 (0.0 to 1.5s): Ship 1 (Cyan) fires rapid-fire bursts
  // Phase 2 (2.0 to 3.5s): Ship 2 (Red) fires rapid-fire bursts
  const Cycle = 4.0;
  const cycleIndex = Math.floor(t / Cycle);
  const t_cycle = t % Cycle;
  const travelDuration = 0.55; // flight speed

  // Ship 1 (Cyan) rapid laser projectile burst (fires 3 times)
  const fireTimes1 = [0.25, 0.60, 0.95];
  for (let i = 0; i < 3; i++) {
    const t_fire = cycleIndex * Cycle + fireTimes1[i];
    if (t >= t_fire && t < t_fire + travelDuration) {
      const u = (t - t_fire) / travelDuration;
      
      // Sample positions and headings at the EXACT instant of firing
      const shooterPos = getShip1Pos(t_fire, centerX, centerY);
      const targetPos = getShip2Pos(t_fire, centerX, centerY);
      const sAngle = Math.atan2(getShip1Pos(t_fire + dt_val, centerX, centerY).y - shooterPos.y, getShip1Pos(t_fire + dt_val, centerX, centerY).x - shooterPos.x);
      
      // Dual wingtip fire origins (scaled by 0.75 for ship scale)
      const wL1x = shooterPos.x - 7.5 * Math.cos(sAngle) + 9.75 * Math.sin(sAngle);
      const wL1y = shooterPos.y - 7.5 * Math.sin(sAngle) - 9.75 * Math.cos(sAngle);
      const wR1x = shooterPos.x - 7.5 * Math.cos(sAngle) - 9.75 * Math.sin(sAngle);
      const wR1y = shooterPos.y - 7.5 * Math.sin(sAngle) + 9.75 * Math.cos(sAngle);
      
      drawLaserBolt(wL1x, wL1y, targetPos.x, targetPos.y, u, true);
      drawLaserBolt(wR1x, wR1y, targetPos.x, targetPos.y, u, true);
    }
  }

  // Ship 2 (Red) rapid laser projectile burst (fires 3 times)
  const fireTimes2 = [2.25, 2.60, 2.95];
  for (let i = 0; i < 3; i++) {
    const t_fire = cycleIndex * Cycle + fireTimes2[i];
    if (t >= t_fire && t < t_fire + travelDuration) {
      const u = (t - t_fire) / travelDuration;
      
      // Sample positions and headings at the EXACT instant of firing
      const shooterPos = getShip2Pos(t_fire, centerX, centerY);
      const targetPos = getShip1Pos(t_fire, centerX, centerY);
      const sAngle = Math.atan2(getShip2Pos(t_fire + dt_val, centerX, centerY).y - shooterPos.y, getShip2Pos(t_fire + dt_val, centerX, centerY).x - shooterPos.x);
      
      // Dual wingtip fire origins (scaled by 0.75 for ship scale)
      const wL2x = shooterPos.x - 9.0 * Math.cos(sAngle) + 13.5 * Math.sin(sAngle);
      const wL2y = shooterPos.y - 9.0 * Math.sin(sAngle) - 13.5 * Math.cos(sAngle);
      const wR2x = shooterPos.x - 9.0 * Math.cos(sAngle) - 13.5 * Math.sin(sAngle);
      const wR2y = shooterPos.y - 9.0 * Math.sin(sAngle) + 13.5 * Math.cos(sAngle);
      
      drawLaserBolt(wL2x, wL2y, targetPos.x, targetPos.y, u, false);
      drawLaserBolt(wR2x, wR2y, targetPos.x, targetPos.y, u, false);
    }
  }

  // --- DRAW SHIP 1: CYAN FAST INTERCEPTOR (Crisp, Sleek, 25% Smaller) ---
  ctx.save();
  ctx.translate(s1.x, s1.y);
  ctx.rotate(angle1);
  ctx.scale(0.75, 0.75); // Scaled down slightly to look incredibly detailed and fast
  
  // Glowing blue engine and wing-tips bloom
  ctx.shadowColor = '#00ffff'; ctx.shadowBlur = 12;
  
  // Wings (sleek double-layered design)
  ctx.fillStyle = '#0099b2';
  ctx.beginPath();
  ctx.moveTo(-16, -5);
  ctx.lineTo(-24, -20);
  ctx.lineTo(-8, -4);
  ctx.closePath();
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(-16, 5);
  ctx.lineTo(-24, 20);
  ctx.lineTo(-8, 4);
  ctx.closePath();
  ctx.fill();

  // Wing panels/weapons
  ctx.fillStyle = '#00f0ff';
  ctx.fillRect(-12, -18, 5, 2);
  ctx.fillRect(-12, 16, 5, 2);

  // Main Fuselage (polished spacecraft frame)
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.moveTo(25, 0);       // Sleek long nose cone
  ctx.lineTo(-16, -8);     // Rear left corner
  ctx.lineTo(-7, 0);       // Engine recess center
  ctx.lineTo(-16, 8);      // Rear right corner
  ctx.closePath();
  ctx.fill();

  // Cockpit canopy (neon cyber blue shield glass)
  ctx.fillStyle = '#00ffff';
  ctx.beginPath();
  ctx.moveTo(10, 0);
  ctx.lineTo(-3, -4);
  ctx.lineTo(-3, 4);
  ctx.closePath();
  ctx.fill();

  // Engine exhaust nozzle and glowing plume
  ctx.fillStyle = '#ffffff';
  const engineWiggle = Math.sin(ts * 0.05) * 4;
  ctx.beginPath();
  ctx.moveTo(-7, -3);
  ctx.lineTo(-26 - engineWiggle, 0);
  ctx.lineTo(-7, 3);
  ctx.closePath();
  ctx.fill();
  
  ctx.restore();

  // --- DRAW SHIP 2: RED MENACING FIGHTER (Crisp, Armored, 25% Smaller) ---
  ctx.save();
  ctx.translate(s2.x, s2.y);
  ctx.rotate(angle2);
  ctx.scale(0.75, 0.75); // Scaled down slightly to look compact and aggressive

  // Glowing red aura
  ctx.shadowColor = '#ff0055'; ctx.shadowBlur = 12;

  // Armored swept-forward combat wings
  ctx.fillStyle = '#aa0033';
  ctx.beginPath();
  ctx.moveTo(-10, -5);
  ctx.lineTo(-22, -22);
  ctx.lineTo(-1, -7);
  ctx.closePath();
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(-10, 5);
  ctx.lineTo(-22, 22);
  ctx.lineTo(-1, 7);
  ctx.closePath();
  ctx.fill();

  // Wingtip gun barrels
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(-15, -21, 6, 2.5);
  ctx.fillRect(-15, 18.5, 6, 2.5);

  // Armored hull block (durable, aggressive heavy fighter shape)
  ctx.fillStyle = '#2d2d38'; // Dark metal frame
  ctx.beginPath();
  ctx.moveTo(22, 0);      // aggressive spike nose
  ctx.lineTo(-15, -7);    // left exhaust flank
  ctx.lineTo(-11, 0);     // dual engine recess
  ctx.lineTo(-15, 7);     // right exhaust flank
  ctx.closePath();
  ctx.fill();

  // Menacing red warning plating decals
  ctx.fillStyle = '#ff0055';
  ctx.beginPath();
  ctx.moveTo(12, 0);
  ctx.lineTo(-5, -5);
  ctx.lineTo(-5, 5);
  ctx.closePath();
  ctx.fill();

  // Solar shield cockpit canopy
  ctx.fillStyle = '#ffbb00';
  ctx.beginPath();
  ctx.moveTo(8, 0);
  ctx.lineTo(-1, -3);
  ctx.lineTo(-1, 3);
  ctx.closePath();
  ctx.fill();

  // Dual engine exhausts with double fire trails!
  ctx.fillStyle = '#ffffff';
  const fireWiggle = Math.cos(ts * 0.05) * 3;
  ctx.beginPath();
  // Left fire plume
  ctx.moveTo(-15, -4);
  ctx.lineTo(-30 - fireWiggle, -3);
  ctx.lineTo(-15, -2);
  // Right fire plume
  ctx.moveTo(-15, 2);
  ctx.lineTo(-30 - fireWiggle, 3);
  ctx.lineTo(-15, 4);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

function drawSpaceCrystalSprite(sx, sy, sc) {
  const h = ~~(sc * 180); if (h < 6) return;
  const w = ~~(h * 0.45);
  const cy = sy - h * 0.5; // vertical center of crystal
  
  ctx.save();
  // Floating animation: make the crystal float up and down slightly using ts/Date.now
  const floatOffset = Math.sin(Date.now() * 0.003 + sx * 0.05) * h * 0.08;
  const finalCy = cy + floatOffset;
  
  // Outer glowing aura
  drawGlowRect(sx - w*0.4, finalCy - h*0.2, w*0.8, h*0.4, '#00ffcc', 20, 0.25);
  
  // We'll draw 4 segments of a double octahedron (crystals)
  const topX = sx, topY = finalCy - h * 0.5;
  const botX = sx, botY = finalCy + h * 0.5;
  const midL_X = sx - w, midL_Y = finalCy;
  const midR_X = sx + w, midR_Y = finalCy;
  const midC_X = sx, midC_Y = finalCy - h * 0.05; // slightly raised center for 3D look
  
  // Left Top Face
  ctx.fillStyle = '#00f0ff';
  ctx.beginPath();
  ctx.moveTo(topX, topY);
  ctx.lineTo(midL_X, midL_Y);
  ctx.lineTo(midC_X, midC_Y);
  ctx.closePath();
  ctx.fill();
  
  // Right Top Face
  ctx.fillStyle = '#00aaff';
  ctx.beginPath();
  ctx.moveTo(topX, topY);
  ctx.lineTo(midR_X, midR_Y);
  ctx.lineTo(midC_X, midC_Y);
  ctx.closePath();
  ctx.fill();
  
  // Left Bottom Face
  ctx.fillStyle = '#0088cc';
  ctx.beginPath();
  ctx.moveTo(botX, botY);
  ctx.lineTo(midL_X, midL_Y);
  ctx.lineTo(midC_X, midC_Y);
  ctx.closePath();
  ctx.fill();
  
  // Right Bottom Face
  ctx.fillStyle = '#005599';
  ctx.beginPath();
  ctx.moveTo(botX, botY);
  ctx.lineTo(midR_X, midR_Y);
  ctx.lineTo(midC_X, midC_Y);
  ctx.closePath();
  ctx.fill();
  
  // Draw bright, sharp white neon edges
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = Math.max(1, ~~(sc * 3));
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(topX, topY); ctx.lineTo(midL_X, midL_Y); ctx.lineTo(botX, botY); ctx.lineTo(midR_X, midR_Y); ctx.closePath();
  ctx.moveTo(topX, topY); ctx.lineTo(midC_X, midC_Y); ctx.lineTo(botX, botY);
  ctx.moveTo(midL_X, midL_Y); ctx.lineTo(midC_X, midC_Y); ctx.lineTo(midR_X, midR_Y);
  ctx.stroke();
  
  // A glowing energy core floating inside
  ctx.fillStyle = '#ff00ff';
  ctx.beginPath();
  ctx.arc(sx, finalCy, w * 0.15, 0, Math.PI * 2);
  ctx.fill();
  
  ctx.restore();
}

function drawTreeSprite(sx, sy, sc) {
  const h = ~~(sc * 190); if (h < 6) return;
  const trunkH = ~~(h * 0.42), trunkW = Math.max(3, ~~(h * 0.06)), topY = sy - h;
  ctx.fillStyle = '#4b2243'; ctx.fillRect(sx - ~~(trunkW / 2), sy - trunkH, trunkW, trunkH);
  ctx.fillStyle = '#7b3c78'; for (let i = 0; i < 4; i++) ctx.fillRect(sx - ~~(trunkW / 2), sy - trunkH + i * Math.max(2, ~~(trunkH / 5)), trunkW, 1);
  const leafColors = ['#27d3ff', '#7a5cff', '#ff4fd8', '#27d3ff', '#7a5cff'];
  for (let i = 0; i < 5; i++) {
    ctx.strokeStyle = leafColors[i]; ctx.lineWidth = Math.max(2, ~~(sc * 4));
    ctx.beginPath(); ctx.moveTo(sx, sy - trunkH); const angle = (-80 + i * 40) * Math.PI / 180, len = h * (0.42 + (i % 2) * 0.05);
    ctx.lineTo(sx + Math.cos(angle) * len, topY + h * 0.38 + Math.sin(angle) * len * 0.3); ctx.stroke();
  }
}

function drawSnowTreeSprite(sx, sy, sc) {
  const h = ~~(sc * 250); if (h < 10) return;
  const trunkW = Math.max(4, ~~(sc * 18));
  const trunkH = ~~(h * 0.28);
  
  ctx.save();
  // Trunk
  ctx.fillStyle = '#2c1e1a';
  ctx.beginPath();
  ctx.moveTo(sx - trunkW / 2, sy);
  ctx.lineTo(sx + trunkW / 2, sy);
  ctx.lineTo(sx + trunkW * 0.3, sy - trunkH);
  ctx.lineTo(sx - trunkW * 0.3, sy - trunkH);
  ctx.closePath();
  ctx.fill();
  
  // Overlapping pine layers
  const numLayers = 4;
  for (let i = 0; i < numLayers; i++) {
      const layerY = sy - trunkH - i * (h * 0.18);
      const layerW = h * (0.42 - i * 0.08);
      const layerH = h * 0.3;
      
      const pL = sx - layerW / 2;
      const pR = sx + layerW / 2;
      const pT = sx;
      const pB = layerY - layerH;
      
      // Evergreen needles
      ctx.fillStyle = '#082a1c'; 
      ctx.beginPath();
      ctx.moveTo(pL, layerY);
      ctx.lineTo(pR, layerY);
      ctx.lineTo(pT, pB);
      ctx.closePath();
      ctx.fill();
      
      // Snowy blanket (ice blue shading)
      ctx.fillStyle = '#d2e3f5'; 
      ctx.beginPath();
      ctx.moveTo(sx, pB);
      ctx.lineTo(sx - layerW * 0.3, layerY - layerH * 0.3);
      ctx.quadraticCurveTo(sx, layerY - layerH * 0.05, sx + layerW * 0.3, layerY - layerH * 0.3);
      ctx.closePath();
      ctx.fill();
      
      // Pure white snow cap
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.moveTo(sx, pB);
      ctx.lineTo(sx - layerW * 0.18, layerY - layerH * 0.6);
      ctx.quadraticCurveTo(sx, layerY - layerH * 0.35, sx + layerW * 0.18, layerY - layerH * 0.6);
      ctx.closePath();
      ctx.fill();
  }
  ctx.restore();
}

// Eight fixed silhouettes keep the coastline varied without frame-to-frame
// randomness. Curved, feathered leaf masses replace the old colored wire spokes.
const miamiPalmModels = new Map();
function getMiamiPalmModel(seed) {
    const variant=((seed*13)^(seed>>>3))&7;
    if(miamiPalmModels.has(variant))return miamiPalmModels.get(variant);
    const height=205+variant*3,lean=(variant%2?-1:1)*(17+variant*2);
    const bend=-lean*.38,stem=new Path2D(),edge=new Path2D(),rings=new Path2D();
    stem.moveTo(-11,0);stem.quadraticCurveTo(bend-7,-height*.47,lean-4,-height);
    stem.lineTo(lean+4,-height);stem.quadraticCurveTo(bend+7,-height*.47,11,0);stem.closePath();
    edge.moveTo(-7,-3);edge.quadraticCurveTo(bend-5,-height*.47,lean-2,-height+3);
    for(let i=1;i<10;i++){
        const t=i/11+(i%2?.013:-.009),mt=1-t;
        const x=2*mt*t*bend+t*t*lean,y=-2*mt*t*height*.47-t*t*height;
        const w=9-t*5;
        rings.moveTo(x-w,y+1);rings.quadraticCurveTo(x,y+4,x+w,y-2);
    }
    const shapes=[[-112,43,-70,-55,15],[-99,4,-49,-47,16],[-69,-40,-28,-65,15],
        [-20,-61,-5,-56,12],[35,-54,9,-65,15],[91,-18,51,-52,17],
        [109,30,65,-33,16],[81,72,63,10,18],[26,83,33,27,14],[-46,77,-38,19,15]];
    const fronds=shapes.map(([ex,ey,cx,cy,width],index)=>{
        const stretch=.90+((variant*3+index*5)%9)*.026;
        ex*=stretch;ey+=((variant+index*3)%5-2)*3;
        cx*=stretch;const point=t=>{const mt=1-t;return{x:2*mt*t*cx+t*t*ex,y:2*mt*t*cy+t*t*ey}};
        const shape=new Path2D(),rib=new Path2D(),rim=new Path2D();
        // Slender curved leaflets overlap along each rib. Their swept tips and
        // uneven lengths leave the gaps of a feather palm, rather than saw teeth.
        const frame=t=>{
            const p=point(t),dx=2*(1-t)*cx+2*t*(ex-cx),dy=2*(1-t)*cy+2*t*(ey-cy),len=Math.hypot(dx,dy)||1;
            return{...p,tx:dx/len,ty:dy/len,nx:-dy/len,ny:dx/len};
        };
        for(const side of[-1,1])for(let j=0;j<11;j++){
            const t=.065+j*.078+((variant+index+j*3)%5-2)*.004,p=frame(t);
            const spread=Math.pow(Math.sin(Math.PI*t),.8)*width*(.87+((variant+index*2+j)%7)*.035);
            const tip={x:p.x+side*p.nx*spread+p.tx*(4+spread*.52),
                y:p.y+side*p.ny*spread+p.ty*(4+spread*.52)+2};
            shape.moveTo(p.x-p.tx*2,p.y-p.ty*2);
            shape.quadraticCurveTo(p.x+side*p.nx*spread*.7-p.tx*2,p.y+side*p.ny*spread*.7-p.ty*2,tip.x,tip.y);
            shape.quadraticCurveTo(p.x+side*p.nx*spread*.4+p.tx*5,p.y+side*p.ny*spread*.4+p.ty*5,p.x+p.tx*4,p.y+p.ty*4);shape.closePath();
            if(side===-1 && j%3===1){
                rim.moveTo(p.x,p.y);rim.quadraticCurveTo(p.x+side*p.nx*spread*.65,p.y+side*p.ny*spread*.65,tip.x,tip.y);
            }
        }
        // A narrow continuous blade joins the leaflets all the way to the tip.
        shape.moveTo(-1,1);shape.quadraticCurveTo(cx-2,cy-2,ex,ey);
        shape.quadraticCurveTo(cx+2,cy+2,1,-1);shape.closePath();
        rib.moveTo(0,0);rib.quadraticCurveTo(cx,cy,ex,ey);
        return{shape,rib,rim};
    });
    const model={height,lean,stem,edge,rings,fronds,variant};miamiPalmModels.set(variant,model);return model;
}

    {name:'pink',leaves:['#f933bc','#c72b97','#73174f','#fa60d0'],outline:'#3d1236',rib:'#92215f',tip:'#ffb7eb',glow:'#ff42d2'},

    {name:'purple',leaves:['#b65cff','#8544bc','#46236e','#cd89ff'],outline:'#2d164d',rib:'#62328c',tip:'#e8c5ff',glow:'#be6aff'},
    {name:'green',leaves:['#51ed71','#30b858','#175e3e','#7cf599'],outline:'#12382d',rib:'#25824d',tip:'#bdffd2',glow:'#60ff8c'},

];
// Loose neighborhoods favor pink/blue/purple, with green and yellow accents.
const NEON_CITY_PALM_GROUPS=[0,2,1,0,1,2,3,0,1,4,2,0,3,2,1,2];
function getNeonCityPalmPalette(seed){
    const group=NEON_CITY_PALM_GROUPS[Math.floor(seed/72)%NEON_CITY_PALM_GROUPS.length];
    if(polishHash(seed+452)<.68)return NEON_CITY_PALM_PALETTES[group];
    const mix=polishHash(seed+921);
    return NEON_CITY_PALM_PALETTES[mix<.27?0:mix<.54?1:mix<.80?2:mix<.93?3:4];
}
function drawNeonCityPalm(x,y,scale,seed,ts){
    drawMiamiPalm(x,y,scale,seed,ts,.85,false,getNeonCityPalmPalette(seed));
}

function drawMiamiPalm(x,y,scale,seed,ts,night,coastal,neon=null) {
    if(scale*240<8)return;
    const model=getMiamiPalmModel(seed);
    beginChapterSprite(x,y,scale);
    ctx.fillStyle='rgba(12,8,25,.22)';ctx.beginPath();ctx.ellipse(8,0,25,4,.04,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=neon?neon.leaves[1]:coastal?'#362033':'#59404a';ctx.fill(model.stem);
    ctx.strokeStyle=neon?neon.leaves[3]:coastal?'#b0517d':'#a46b78';ctx.lineWidth=2;ctx.stroke(model.edge);

    for(const [cx,cy,r]of[[-5,5,4],[3,7,4.5],[6,1,3]]){ctx.beginPath();ctx.ellipse(cx,cy,r,r*1.25,-.2,0,Math.PI*2);ctx.fill();}

let coastalOldTreeModel=null;
function makeCoastalOldTreeModel() {
  let seed=0x4f414b;
  const random=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296;};
  const crown=new Path2D(),leaves=Array.from({length:4},()=>new Path2D());
  const clusters=[[-191,-161,37,22],[-188,-200,44,26],[-134,-229,52,27],[-147,-267,37,24],
    [-74,-289,57,32],[-24,-312,48,29],[38,-285,55,34],[96,-320,38,25],
    [147,-289,47,31],[177,-252,46,27],[108,-225,57,29],[26,-241,66,30],
    [-77,-188,40,21],[195,-208,41,27],[163,-163,47,24]];
  for(const [cx,cy,rx,ry]of clusters){
    for(let i=0;i<24;i++){
      const a=i/24*Math.PI*2,r=.78+random()*.29,x=cx+Math.cos(a)*rx*r,y=cy+Math.sin(a)*ry*r;
      if(i===0)crown.moveTo(x,y);else crown.lineTo(x,y);
    }
    crown.closePath();
    // Small asymmetric leaf sprays break the edge of each overlapping canopy.
    for(let i=0;i<90;i++){
      const a=random()*Math.PI*2,r=Math.sqrt(random()),x=cx+Math.cos(a)*rx*r,y=cy+Math.sin(a)*ry*r;
      const size=2+random()*5,angle=random()*Math.PI,dx=Math.cos(angle)*size,dy=Math.sin(angle)*size*.65;
      const path=leaves[Math.floor(random()*4)];
      path.moveTo(x-dx,y-dy);path.quadraticCurveTo(x-dy*.9,y+dx*.55,x+dx,y+dy);
      path.quadraticCurveTo(x+dy,y-dx*.7,x-dx,y-dy);path.closePath();
    }
  }
  const trunk=new Path2D('M -68 3 C -42 -4 -29 -17 -24 -47 C -20 -73 -28 -94 -34 -117 L -14 -139 C -7 -111 2 -88 12 -111 L 29 -137 L 37 -118 C 23 -84 19 -57 30 -28 C 38 -13 50 -5 72 4 L 38 1 C 20 -3 18 -9 10 -18 L 7 5 L -13 3 L -18 -19 C -29 -5 -44 0 -68 3 Z');
  const branches=[
    ['M -12 -66 C -25 -110 -39 -144 -80 -160 C -120 -178 -158 -151 -198 -165',27],
    ['M -27 -119 C -54 -157 -100 -179 -148 -203 C -161 -211 -176 -210 -198 -207',18],
    ['M -56 -157 C -67 -192 -63 -225 -89 -270',15],
    ['M -78 -160 C -108 -171 -136 -187 -156 -232',10],
    ['M -9 -89 C 6 -139 29 -161 74 -165 C 111 -170 142 -151 181 -166',25],
    ['M 23 -128 C 40 -175 70 -199 115 -205 C 156 -213 175 -237 189 -252',18],
    ['M 62 -187 C 64 -223 93 -240 129 -280',12],
    ['M 111 -205 C 139 -201 167 -210 204 -211',10],
    ['M -19 -114 C -24 -158 -10 -192 -26 -226 C -40 -253 -49 -281 -35 -311',22],
    ['M -20 -193 C -45 -217 -78 -213 -116 -238',12],
    ['M -10 -174 C 14 -208 32 -218 53 -259',17],
    ['M 33 -227 C 59 -254 72 -290 94 -320',9]
  ].map(([d,width])=>({path:new Path2D(d),width}));
  const twigs=new Path2D();
  for(const [cx,cy,rx,ry]of clusters)for(let i=0;i<5;i++){
    const x=cx+(random()-.5)*rx,y=cy+ry*.8;
    twigs.moveTo(x,y);twigs.quadraticCurveTo(x-7+random()*14,y-ry*.6,x+(random()-.5)*rx*.8,y-ry*1.4);
  }
  const bark=new Path2D('M -9 -5 C -1 -48 -17 -68 -9 -103 M 10 -6 C 20 -33 1 -59 13 -87 M -36 -4 Q -18 -13 -15 -29 M 36 -4 Q 15 -20 17 -35 M -20 -78 Q -27 -118 -56 -146 M 13 -91 Q 32 -133 60 -148');
  return {crown,leaves,trunk,branches,twigs,bark};
}

function drawCoastalOldTreeSprite(sx,sy,sc,ts,approach,night=0) {
  if(sc<.03)return;
  if(!coastalOldTreeModel)coastalOldTreeModel=makeCoastalOldTreeModel();
  const m=coastalOldTreeModel;
  beginChapterSprite(sx,sy,sc);
  const wood=interpolateColor('#382c30','#1d1728',night);
  const foliage=['#213b32','#2d5143','#3c6955','#5b8770'].map((c,i)=>interpolateColor(c,['#102021','#192f30','#254340','#426359'][i],night));
  ctx.fillStyle='rgba(32,17,35,.24)';ctx.beginPath();ctx.ellipse(0,3,75,8,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=foliage[0];ctx.fill(m.crown);
  ctx.lineCap='round';ctx.lineJoin='round';
  for(const branch of m.branches){ctx.strokeStyle=wood;ctx.lineWidth=branch.width;ctx.stroke(branch.path);}
  ctx.fillStyle=wood;ctx.fill(m.trunk);
  ctx.strokeStyle=wood;ctx.lineWidth=1.5;ctx.stroke(m.twigs);
  for(let i=0;i<m.leaves.length;i++){ctx.fillStyle=foliage[i];ctx.fill(m.leaves[i]);}
  ctx.strokeStyle=interpolateColor('#8d6058','#614952',night);ctx.lineWidth=1.8;ctx.stroke(m.bark);
  // A small flock lifts out of the canopy as the car approaches the tunnel exit.
  for(let i=0;i<5;i++){
    const flight=clamp((58-approach-i*2)/42,0,1);
    if(flight<=0||flight>=1)continue;
    ctx.globalAlpha=Math.min(1,(1-flight)*4);
    const x=-110+i*27-flight*(160+i*20),y=-248-(i%3)*24-flight*(48+i*16);
    const flap=Math.sin(ts*.009+i*.8)*4;
    ctx.strokeStyle=interpolateColor('#e5ead7','#adcbc7',night);ctx.lineWidth=1.8;
    ctx.beginPath();ctx.moveTo(x-10,y+flap);ctx.quadraticCurveTo(x-5,y-4,x,y);
    ctx.quadraticCurveTo(x+5,y-4,x+10,y+flap);ctx.stroke();
    ctx.fillStyle=ctx.strokeStyle;ctx.beginPath();ctx.ellipse(x,y,2.8,1.2,0,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}

    ctx.strokeStyle=night>.7?'rgba(75,161,197,.22)':'rgba(138,217,230,.34)';
    ctx.lineWidth=Math.max(.6,pixelsPerMetre*.05);
    for(let i=0;i<3;i++){

    ctx.scale(boat.heading,1);
    if(boat.kind==='sailboat'){
        drawSailboatSprite(0,0,size/65,boat.variant,night);ctx.restore();return;

    ctx.scale(size,size);
    const poly=(points,color)=>paintOceanPolygon(points.map(([x,y])=>({x,y})),color);
    const accent=['#24bfc1','#df709e','#7697d1'][boat.variant%3];

        poly([[-.47,-.065],[.40,-.075],[.36,-.04],[-.45,-.035]],accent);
