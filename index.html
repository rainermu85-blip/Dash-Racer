        raceRunId++;clearTimeout(resultTimer);resultTimer=null;clearTimeout(fieldCompletionTimer);fieldCompletionTimer=null;
        state='intro';showMainMenu();updateControlUI();document.getElementById('startBtn').focus();
    };
}
function showResult(){
    if(state!=='playing'||!player.finished)return;
    if(paused){resultTimer=setTimeout(()=>{resultTimer=null;showResult();},100);return;}
    resetInputs();state='result';updateControlUI();
    const token=raceRunId,ov=document.getElementById('overlay');ov.style.background='';
    ov.innerHTML='<section class="result-panel"><div class="panel-kicker">RACE COMPLETED</div><div class="otitle">RESULTS</div><div class="results-loading" role="status">FINAL CLASSIFICATION…</div></section>';
    ov.classList.remove('hide');ov.scrollTop=0;
    const deadline=raceElapsed+360000;
    const finishField=()=>{
        fieldCompletionTimer=null;if(token!==raceRunId||state!=='result')return;
        // Run the same racing physics offscreen, in small batches, to obtain
        // actual crossings for cars still behind the player. No invented times.
        const budget=performance.now()+10;
        while(opponents.some(car=>car.finishTime==null)&&raceElapsed<deadline&&performance.now()<budget)advanceRaceStep(MAX_PHYSICS_STEP);
        if(opponents.some(car=>car.finishTime==null)&&raceElapsed<deadline){fieldCompletionTimer=setTimeout(finishField,0);return;}
        updateHUD(performance.now());renderScoreboard();
    };
    fieldCompletionTimer=setTimeout(finishField,0);
}

function getRaceDistance(car) {
  return currentLevel === LEVEL_DREAM ? car.z : (car.lap - 1) * TRACK_LENGTH + car.z;
}

// Convert the painted bodies at the player's contact plane into road units.
// Both drivers use the same viewport/projection; cosmetic lean and exhaust do
// not enlarge the collider. Keep a two-percent arcade allowance at the edges.
function getCarCollisionHalfWidth(car){
  const responsive=clamp(W/1000,.85,1),distance=getPlayerContactDistance();
  const projection=(CAMERA_DEPTH+player.fovOffset)/distance;
  const roadHalf=projection*ROAD_WIDTH*W/2;
  const scale=car===player?1.64*responsive:
    projection*(692*H/Math.max(10,H*.5-76))*responsive;
  return getCarGeometry(0,0,scale,car===player).bw*CAR_OUTLINE_HALF_WIDTH*(1-CAR_CONTACT_INSET)/roadHalf;
}
function getCarCollisionRange(a,b){return getCarCollisionHalfWidth(a)+getCarCollisionHalfWidth(b);}
function getPlayerCollisionX(){
  const distance=getPlayerContactDistance(),worldZ=player.z+distance;
  const roadHalf=(CAMERA_DEPTH+player.fovOffset)/distance*ROAD_WIDTH*W/2;
  const first=Math.floor(player.z/SEGMENT_LENGTH)*SEGMENT_LENGTH;
  let offset=0,delta=0;
  // Match the renderer's continuous road bend at the car's contact plane.
  for(let n=0;n<=Math.ceil(distance/SEGMENT_LENGTH)+1;n++){
    const z=first+n*SEGMENT_LENGTH,seg=getSeg(z),before=offset;
    delta+=seg.curve*5;offset+=delta;delta*=.85;
    if(z+SEGMENT_LENGTH>=worldZ){
      const bend=before+(offset-before)*clamp((worldZ-z)/SEGMENT_LENGTH,0,1);
      return player.x*.82+(getPlayerRenderPose().x-W/2+curveCamera.look*W-bend)/roadHalf;
    }
  }
  return player.x;
}

function getPlayerContactDistance() {
  const responsiveFactor = clamp(W / 1000, 0.85, 1.0);
  const playerScale = 1.64 * responsiveFactor;
  const horizonY = ~~(H * 0.5) + player.pitch * 1.5;
  const denom = Math.max(100, H - 76 - 12 * playerScale - horizonY);
  return (CAMERA_DEPTH + player.fovOffset) * CAMERA_HEIGHT * H / (2 * denom);
}

// Intersect the whole movement with a contact rectangle, including lateral
// motion. Returns the first contact and its normal, or null for a clean miss.
function sweepContact(x0, z0, x1, z1, halfWidth, minZ, maxZ) {
  let enter = 0, exit = 1, axis = null, side = 0;
  for (const [name, from, to, min, max] of [['x', x0, x1, -halfWidth, halfWidth], ['z', z0, z1, minZ, maxZ]]) {
    const delta = to - from;
    if (Math.abs(delta) < 1e-9) {
      if (from < min || from > max) return null;
      continue;
    }
    const a = (min - from) / delta, b = (max - from) / delta;
    const near = Math.min(a, b), far = Math.max(a, b);
    if (near > enter) { enter = near; axis = name; side = delta > 0 ? -1 : 1; }
    exit = Math.min(exit, far);
    if (enter > exit) return null;
  }
  if (exit < 0 || enter > 1) return null;
  if (!axis) {
    // An existing overlap uses the nearest face, not the driver's keys/lean.
    const xDepth = (halfWidth - Math.abs(x0)) / halfWidth;
    const zDepth = Math.min(z0 - minZ, maxZ - z0) / ((maxZ - minZ) / 2);
    axis = xDepth < zDepth ? 'x' : 'z';
    const position = axis === 'x' ? x0 : z0 - (minZ + maxZ) / 2;
    const delta = axis === 'x' ? x1 - x0 : z1 - z0;
    side = Math.sign(position) || -Math.sign(delta) || 1;
  }
  return { time: enter, axis, side };
}

function getRoadLimits(z) {
  const segment = getSeg(z);
  const enclosed = segment.isBridge || isOceanRockTunnel(segment.index) || (currentLevel === LEVEL_DREAM && segment.isTunnel);
  let left = enclosed ? 1.05 : 1.45, right = left;
  if (currentLevel === 2) left = 1.05;
  if (currentLevel === LEVEL_HIGHWAY) left = right = 0.88;
  if (currentLevel === LEVEL_SPACE) left = right = 0.98;
  if (currentLevel === LEVEL_HILLS) {
    const center=hillsDetourCenter(segment.index);
    left=1.27-.75*hillsNarrowness(segment.index)-center;
    right=segment.index<558&&segment.index>=522?1.27:1.27-.75*hillsNarrowness(segment.index)+center;
  }
  if (currentLevel === LEVEL_DREAM && getDreamZone(segment.index) === 'underwater') left = right = UNDERWATER_WALL_LIMIT;
  return { left, right };
}

function loseCleanSpeed(severity, car=player) {
  // A graze loses part of the earned headroom; a substantial hit loses it all.
  // Boosts keep their existing collision response and absolute speed targets.
  car.cleanSpeedBonus = severity < 0.18 ? (car.cleanSpeedBonus||0) * 0.65 : 0;
  car.cleanSpeedCooldown=Math.max(car.cleanSpeedCooldown||0,.18+severity*.22);
  const limit=(car.normalBaseSpeed??car.maxSpeed??player.maxSpeed)*(1+car.cleanSpeedBonus);
  if(!car.isBoosting&&!car.isChevronBoosting)car.speed=Math.min(car.speed,limit);
  // Damage applies to the normal trajectory too: turbo must not heal a hit.
  if(Number.isFinite(car.normalSpeed))car.normalSpeed=Math.min(car.normalSpeed,car.speed,limit);
}

function applyRoadContact(dt, lateralSpeed = 0, car = player) {
  const limits = getRoadLimits(car.z);
  const boundedX = clamp(car.x, -limits.left, limits.right);
  if (boundedX === car.x) {
    if (dt > 0 && car.x > -limits.left + 0.015 && car.x < limits.right - 0.015) car.wallContactSide = 0;
    return;
  }
  const side = car.x > boundedX ? 1 : -1;
  car.x = boundedX;
  if (car.wallContactSide !== side && car.wallHitCooldown <= 0) {
    const severity = clamp(Math.abs(lateralSpeed) / 3, 0, 1);
    scaleCarSpeed(car,1-(0.03+severity*.12));
    loseCleanSpeed(severity,car);
    car.hitFlash = Math.max(car.hitFlash, 0.2 + severity * 0.3);
    car.wallHitCooldown = 0.2;
  }
  car.wallContactSide = side;
  // Rubbing is a drag per second, not another full impact on every frame.
  scaleCarSpeed(car,Math.exp(-.9*dt));
  car.isSparking ||= car.speed > 150;
}

function getTrackContacts(from, to, fields) {
  const contacts = [];
  const first = Math.floor(Math.min(from.z, to.z) / SEGMENT_LENGTH);
  const last = Math.floor(Math.max(from.z, to.z) / SEGMENT_LENGTH);
  for (let index = first; index <= last; index++) {
    if (currentLevel === LEVEL_DREAM && (index < 0 || index >= SEGMENT_COUNT)) continue;
    const segment = segments[(index % SEGMENT_COUNT + SEGMENT_COUNT) % SEGMENT_COUNT];
    for (const type of fields) {
      const object = segment[type];
      if (!object?.active || (type === 'barrier' && object.state !== 'idle')) continue;
      const halfWidth = type === 'barrier' ? (object.halfWidth??0.45) : type === 'lightning' ? 0.3 : 0.25;
      const hit = sweepContact(from.x - object.x, from.z, to.x - object.x, to.z, halfWidth, index * SEGMENT_LENGTH, (index + 1) * SEGMENT_LENGTH);
      if (hit) contacts.push({ ...hit, type, object });
    }
  }
  return contacts.sort((a, b) => a.time - b.time);
}

function hitBarrier(car, barrier) {
  if (car.collisionCooldown <= 0) {
    const severity = clamp(car.speed / player.maxSpeed, 0, 1);
    scaleCarSpeed(car,1-(.35+severity*.35));
    car.collisionCooldown = 0.35 + severity * 0.15;
    car.isBoosting = car.isChevronBoosting = false;
    loseCleanSpeed(1,car);
    if (car === player) {
      player.hitFlash = Math.max(player.hitFlash, 0.45 + severity * 0.55);
    }
  }
  if(barrier.permanent)return; // A closed road stays closed for every racer and lap.
  barrier.state = 'blinking'; barrier.timer = 0.15;
  blinkingBarriers.push(barrier);
}

function checkOpponentCollision(previousPlayer, previousOpponents, dt) {
  if (player.finished) return;
  const playerVX = (player.x - previousPlayer.x) / dt;
  for (let i = 0; i < opponents.length; i++) {
    const opp = opponents[i], previous = previousOpponents[i];
    const playerVisualZ = getRaceDistance(player) + getPlayerContactDistance();
    const relX = opp.x - getPlayerCollisionX(), relZ = getRaceDistance(opp) - playerVisualZ;
    const contactWidth=getCarCollisionRange(player,opp);
    const hit = sweepContact(previous.x - (previousPlayer.collisionX??previousPlayer.x), previous.z - previousPlayer.z, relX, relZ, contactWidth, -COLLISION_Z_RANGE, COLLISION_Z_RANGE);
    if (!hit) {
      if (Math.abs(relX) > contactWidth + 0.025 || Math.abs(relZ) > COLLISION_Z_RANGE + 10) opp.contactAxis = null;
      continue;
    }
    const oppVX = (opp.x - previous.x) / dt;
    const closing = Math.max(0, -hit.side * (hit.axis === 'x' ? oppVX - playerVX : opp.speed - player.speed));
    if (!opp.contactAxis && opp.collisionCooldown <= 0 && player.collisionCooldown <= 0 && closing > 0.01) {
      const severity = clamp(closing / (hit.axis === 'x' ? 3 : player.maxSpeed), 0, 1);
      if (hit.axis === 'x') {
        const playerApproach = Math.max(0, hit.side * playerVX);
        const oppApproach = Math.max(0, -hit.side * oppVX);
        const responsibility = playerApproach / Math.max(0.01, playerApproach + oppApproach);
        const loss = 0.025 + severity * 0.12;
        scaleCarSpeed(player,1-loss*(.35+responsibility*.65));
        scaleCarSpeed(opp,1-loss*(1-responsibility*.65));
        player.steerLean -= hit.side * (0.08 + severity * 0.12);
        loseCleanSpeed(severity);loseCleanSpeed(severity,opp);
      } else {
        applyRearImpact(hit.side>0?opp:player,hit.side>0?player:opp,closing,severity);
      }
      player.hitFlash = Math.max(player.hitFlash, 0.15 + severity * 0.65);
      player.collisionCooldown = opp.collisionCooldown = 0.18 + severity * 0.22;
      opp.contactAxis = hit.axis; opp.contactSide = hit.side;
    }
    const axis = opp.contactAxis || hit.axis, side = opp.contactAxis ? opp.contactSide : hit.side;
    if (axis === 'x') {
      const separation = Math.max(0, contactWidth - side * (opp.x - getPlayerCollisionX()));
      player.x -= side * separation * 0.5;
      opp.x += side * separation * 0.5;
      const pLimits = getRoadLimits(player.z), oLimits = getRoadLimits(opp.z);
      player.x = clamp(player.x, -pLimits.left, pLimits.right);
      opp.x = clamp(opp.x, -oLimits.left, oLimits.right);
      // A car pinned against a wall cannot take its half of the separation.
      // Give the remaining space to the other car instead of overlapping it.
      let remaining = Math.max(0, contactWidth - side * (opp.x - getPlayerCollisionX()));
      opp.x = clamp(opp.x + side * remaining, -oLimits.left, oLimits.right);
      remaining = Math.max(0, contactWidth - side * (opp.x - getPlayerCollisionX()));
      player.x = clamp(player.x - side * remaining, -pLimits.left, pLimits.right);
    } else if (Math.abs(relX) < contactWidth) {
      const separation = Math.max(0, COLLISION_Z_RANGE - side * relZ);
      if (side > 0) player.z -= separation;
      else opp.z -= separation;
      // During protected contact, still match the closing speed. Otherwise a
      // car could display full speed while its position is held behind another.
      if (side * (opp.speed - player.speed) < 0) {
        player.speed = opp.speed = (player.speed + opp.speed) * 0.5;
      }
    }
  }
}

function advanceRaceStep(dt){
    const stepStart=raceElapsed,previousPlayerRaceZ=getRaceDistance(player);
    raceElapsed+=dt*1000;const ts=raceElapsed;
    prepareNormalPace(player);opponents.forEach(prepareNormalPace);
    const previousPlayer = { x: player.x, collisionX:getPlayerCollisionX(), z: getRaceDistance(player) + getPlayerContactDistance() };
    const previousOpponents = opponents.map(opp => ({ x: opp.x, z: getRaceDistance(opp) }));
    const trafficSnapshot=raceSnapshot();
    updateRacePickups(dt);
    updateChapterTraffic(dt);
    if (!player.finished) currentLapTime += dt * 1000;
    if(lastLapElapsed!==null){lastLapElapsed+=dt;if(lastLapElapsed>=1.5)lastLapElapsed=null;}
    player.collisionCooldown = Math.max(0, player.collisionCooldown - dt); player.hitFlash = Math.max(0, player.hitFlash - dt * 2.6);
    player.wallHitCooldown = Math.max(0, player.wallHitCooldown - dt);

    if ((keys.boost || boostRequested) && player.boosts > 0 && !player.isBoosting && !player.isChevronBoosting && player.collisionCooldown <= 0 && !player.finished) {
        player.isBoosting = true;
        player.boostTimer = TURBO_DURATION;
        player.boosts--;
        keys.boost = false; 
    }

    boostRequested=false;
    if (player.isBoosting) {
        player.boostTimer -= dt;
        if (player.boostTimer <= 0) player.isBoosting = false;
    }

    if (player.isChevronBoosting) {
        player.chevronBoostTimer -= dt;
        if (player.chevronBoostTimer <= 0) player.isChevronBoosting = false;
    }

    let targetFov = player.isChevronBoosting ? -0.56 : (player.isBoosting ? -0.4 : 0);
    player.fovOffset += (targetFov - player.fovOffset) * dt * 3.0;

    const softLimit = 0.94; 
    const offroad = Math.abs(player.x) >= softLimit;
    const steerInput = player.finished ? 0 : ((keys.right ? 1 : 0) - (keys.left ? 1 : 0));
    player.steerLean += (steerInput - player.steerLean) * Math.min(1, dt * 9.5);
    
    advanceNormalAndTurboSpeed(player,dt,player.maxSpeed,offroad);

    player.isSparking = (offroad && player.speed > 150);

    const currentSpeedRatio = Math.max(0, player.speed / player.maxSpeed);
    updatePolishHandling(player,dt);
    player.x += steerInput * polishSteeringGrip(player) * STEER_SENSITIVITY * dt * (0.48 + currentSpeedRatio * 0.82);

    let curveAhead = 0, pitchAhead = 0;
    for (let i = 0; i < 20; i++) { 
        const lookSeg = getSeg(player.z + i * SEGMENT_LENGTH); 
        curveAhead += lookSeg.curve; 
        pitchAhead += lookSeg.hillDelta; 
    }
    curveAhead /= 20; pitchAhead /= 20; 
    
    player.curveAheadSmooth += (curveAhead - player.curveAheadSmooth) * dt * 4.0;
    updateCurveCamera(dt);
    bgOffset += curveAhead * player.speed * dt * 0.15; 
    
    player.x -= curveAhead * 0.5 * dt * (0.35 + currentSpeedRatio * 1.65); player.pitch += (pitchAhead - player.pitch) * Math.min(1, dt * 5.0);

    const over = Math.max(0, Math.abs(player.x) - softLimit);
    if (over > 0) { scaleCarSpeed(player,Math.exp(-(3.6+over*3.2)*dt)); player.steerLean += (player.x > 0 ? -0.25 : 0.25) * Math.min(1, over) * dt; }
    applyRoadContact(dt, (player.x - previousPlayer.x) / dt);

    const nextContact = { x: player.x, z: getRaceDistance(player) + player.speed * dt + getPlayerContactDistance() };

    checkPolishContacts(player,previousPlayer,nextContact);

    // Use the same projected paint as rendering, against the visible car footprint.
    const chevronContact=getPlayerChevronContact();
    if(chevronContact&&(player.lastChevronPanelIdx!==chevronContact.index||player.lastChevronPanelLap!==chevronContact.lap)){
      spawnPopupText(player.isChevronBoosting&&player.chevronBoostTimer>0?'CHAINED!':'CHEVRON TURBO!','#ff00ff');
      player.isChevronBoosting=true;player.chevronBoostTimer=2;
      player.lastChevronPanelIdx=chevronContact.index;player.lastChevronPanelLap=chevronContact.lap;
    }

    let playerTravel = player.speed * dt;
    const trackContacts = player.finished ? [] : getTrackContacts(previousPlayer, nextContact, ['lightning', 'pylon', 'barrier']);
    for (const contact of trackContacts) {
      const object = contact.object;
      if (contact.type === 'lightning') {
        collectRacePickup(object);
        if (player.boosts < 3) player.boosts++;
      } else if (contact.type === 'pylon') {
        object.active = false;
        if (currentLevel === LEVEL_SPACE) {
          collectRacePickup(object);
          player.energyBallsCollected = (player.energyBallsCollected || 0) + 1;
          if (player.energyBallsCollected === 1) {
            spawnPopupText("1/5 Turbo", "#00ffd2");
          } else if (player.energyBallsCollected === 2) {
            spawnPopupText("2/5 Turbo", "#00ffd2");
          } else if (player.energyBallsCollected === 3) {
            spawnPopupText("3/5 Turbo", "#00ffd2");
          } else if (player.energyBallsCollected === 4) {
            spawnPopupText("4/5 Turbo", "#00ffd2");
          } else if (player.energyBallsCollected >= 5) {
            player.energyBallsCollected = 0;
            if (player.boosts < 3) player.boosts++;
            spawnPopupText("Turbo Charged!", "#ff00ff");
          }
          activeFlyingPylons.push({
            x: W/2 + object.x * W * 0.55, y: H - 90,
            vx: steerInput * 1600 + (Math.random() - 0.5) * 800, 
            vy: -2000 - Math.random() * 600, 
            scale: 1.8, 
            rot: 0, rotSpeed: (Math.random()-0.5)*20
          });
        } else {
          // A single mild slowdown; keep the earned-speed bonus and turbo active.
          const impactSpeed=player.speed;
          applyPylonPenalty(player);
          playerTravel-=(impactSpeed-player.speed)*dt*(1-contact.time);
          activeFlyingPylons.push({
            x: W/2 + object.x * W * 0.55, y: H - 90,
            vx: steerInput * 1600 + (Math.random() - 0.5) * 800, 
            vy: -2000 - Math.random() * 600, 
            scale: 1.8, 
            rot: 0, rotSpeed: (Math.random()-0.5)*20
          });
        }
      } else {
        const impactSpeed = player.speed;
        hitBarrier(player, object);
        playerTravel -= (impactSpeed - player.speed) * dt * (1 - contact.time);
        break;
      }
    }

    player.z += playerTravel;

    for (let oppIndex = 0; oppIndex < opponents.length; oppIndex++) {
      const opp = opponents[oppIndex];
      opp.cleanSpeedBonus??=0;
      opp.collisionCooldown = Math.max(0, opp.collisionCooldown - dt);
      const oTotal = getRaceDistance(opp);
      if(opp.isChevronBoosting){opp.chevronBoostTimer-=dt;if(opp.chevronBoostTimer<=0)opp.isChevronBoosting=false;}
      if(opp.isBoosting){opp.boostTimer-=dt;if(opp.boostTimer<=0)opp.isBoosting=false;}
      const oppOffroad=Math.abs(opp.x)>=.94;
      updateOpponentRacecraft(opp,dt,trafficSnapshot);
      advanceNormalAndTurboSpeed(opp,dt,getOpponentBaseSpeed(opp),oppOffroad,Math.min(opp.trafficLimit??Infinity,opp.obstacleLimit??Infinity));
      const oppSegIdx = currentLevel === LEVEL_DREAM ? ~~(opp.z / SEGMENT_LENGTH) : ~~(opp.z / SEGMENT_LENGTH) % SEGMENT_COUNT;
      const steerSpd=opp.maneuver==='avoid'?3.6:opp.maneuver==='pass'?3.0:2.3;
      updatePolishHandling(opp,dt);
      if(opp.dreamEffectTimer>0)opp.targetX+=Math.sin((5-opp.dreamEffectTimer)*3.8+opp.oppIdx)*.11;
      opp.x += (opp.targetX - opp.x) * dt * steerSpd * polishSteeringGrip(opp) * (opp.dreamEffectTimer>0?.65:1);
      if(opp.speed>0){opp.wallHitCooldown=Math.max(0,(opp.wallHitCooldown||0)-dt);applyRoadContact(dt,(opp.x-previousOpponents[oppIndex].x)/dt,opp);}
      checkPolishContacts(opp,previousOpponents[oppIndex],{x:opp.x,z:oTotal+opp.speed*dt});
      
      // Opponent Chevron crossing check
      if (currentLevel === LEVEL_SPACE) {
          let oppCrossedChevron = -1;
          for (let pIdx = 0; pIdx < panelStarts.length; pIdx++) {
              const start = panelStarts[pIdx];
              if (oppSegIdx >= start && oppSegIdx < start + 6) {
                  const side = (pIdx % 2 === 0) ? 'left' : 'right';
                  const targetX = (side === 'left') ? -0.5 : 0.5;
                  if (Math.abs(opp.x - targetX) < 0.35) {
                      oppCrossedChevron = pIdx;
                  }
                  break;
              }
          }
          if (oppCrossedChevron>=0&&(opp.lastChevronPanelIdx!==oppCrossedChevron||opp.lastChevronPanelLap!==opp.lap)) {
              opp.lastChevronPanelIdx=oppCrossedChevron;opp.lastChevronPanelLap=opp.lap;
              opp.isChevronBoosting = true;
              opp.chevronBoostTimer = 2.0;
              // A ground boost cannot immediately hand out a free normal turbo.
              opp.randomTurboReadyAt=Math.max(opp.randomTurboReadyAt||0,opp.raceAge+2+OPP_RANDOM_TURBO.cooldown);
          }
      }

      const nextOpponent = { x: opp.x, z: getRaceDistance(opp) + opp.speed * dt };
      let opponentTravel = opp.speed * dt;
      for (const contact of getTrackContacts(previousOpponents[oppIndex], nextOpponent, currentLevel===LEVEL_SPACE?['barrier']:['pylon','barrier'])) {
        const object = contact.object;
        if (contact.type === 'pylon') {
          object.active = false;
          const impactSpeed=opp.speed;
          applyPylonPenalty(opp);
          opponentTravel-=(impactSpeed-opp.speed)*dt*(1-contact.time);
          activeFlyingPylons.push({
            x: W/2 + object.x * W * 0.55, y: H * 0.65,
            vx: (Math.random()-0.5)*800, vy: -1500, scale: 1.0, rot: 0, rotSpeed: 15
          });
        } else {
          const impactSpeed = opp.speed;
          hitBarrier(opp, object);
          opponentTravel -= (impactSpeed - opp.speed) * dt * (1 - contact.time);
          opp.targetX = object.x > 0 ? -0.65 : 0.65;
          break;
        }
      }

      opp.z += opponentTravel;
    }

    checkOpponentPairContacts(previousOpponents,dt);
    checkOpponentCollision(previousPlayer, previousOpponents, dt);
    // Entry transitions and opponent pushes must respect the road's walls too.
    applyRoadContact(0, (player.x - previousPlayer.x) / dt);

    recordRaceFinish(player,previousPlayerRaceZ,stepStart,dt);
    opponents.forEach((car,i)=>recordRaceFinish(car,previousOpponents[i].z,stepStart,dt));
    for (const opp of opponents) {
      if (opp.z >= TRACK_LENGTH) {
        if (currentLevel === LEVEL_DREAM) { if (opp.lap === 1) opp.lap++; }
        else { opp.z -= TRACK_LENGTH; opp.lap++; }
      }
    }

    // Finalize laps after contact resolution, so an impact at the line cannot
    // award a lap or finish a race before the movement is actually complete.
    if (player.z >= TRACK_LENGTH && !player.finished) {
      const distance=getRaceDistance(player),boundary=player.lap*TRACK_LENGTH;
      const fraction=previousPlayerRaceZ>=boundary?0:clamp((boundary-previousPlayerRaceZ)/Math.max(.000001,distance-previousPlayerRaceZ),0,1);
      const lapEnd=stepStart+dt*1000*fraction,lapTime=lapEnd-playerLapStart;
      if (currentLevel !== LEVEL_DREAM) player.z -= TRACK_LENGTH;
      lapTimes[player.lap - 1] = lapTime;
      if (lapTime < bestLapTime) bestLapTime = lapTime;
      playerLapStart=lapEnd;currentLapTime=raceElapsed-lapEnd;player.lap++;
      if(player.lap===3&&currentLevel!==LEVEL_DREAM)lastLapElapsed=0;
      segments.forEach(s => {
        if (s.pylon) s.pylon.active = true;
        if (s.barrier) { s.barrier.active = true; s.barrier.state = 'idle'; s.barrier.blinkCount = 0; }
        if (s.lightning) s.lightning.active = true;
      });
      const maxLaps = currentLevel === LEVEL_DREAM ? 1 : 3;
      if (player.lap > maxLaps) {
        player.finished = true;currentLapTime=0;
        const finalPlace = updateHUD(ts);
        spawnConfetti(finalPlace);
        resultTimer = setTimeout(() => { resultTimer = null; showResult(); }, 1500);
      }
    }
}

function loop(ts) {
  if (lastTime === 0) lastTime = ts;
  let rawDt = Math.min((ts - lastTime) / 1000, 0.05);
  lastTime = ts;

  // Smooth dt using a moving average low-pass filter to completely eliminate visual micro-stuttering especially visible during acceleration
  smoothedDt = smoothedDt * 0.82 + rawDt * 0.18;
  const dt = smoothedDt;

  if (paused) {
    render(ts);
    requestAnimationFrame(loop);
    return;
  }

  if (state === 'countdown') {
    cntTimer += dt;
    if (cntTimer > 1) { cntTimer = 0; cntVal--; if (cntVal < 0) { state = 'playing'; document.getElementById('cntNum').classList.remove('pop'); } else { popNum(cntVal); } }
    if (state === 'countdown') updateHighwayTrains(dt, true);
  }

  if (state === 'playing') {
    // Render once, but advance contacts in short steps even on slower devices.
    const steps = Math.max(1, Math.ceil(dt / MAX_PHYSICS_STEP - 1e-8));
    const stepDt = dt / steps;
    for (let step = 0; step < steps; step++) {
      advanceRaceStep(stepDt);
    }
    updateHUD(ts);
  }

  for (let i = activeFlyingPylons.length - 1; i >= 0; i--) {
    let fp = activeFlyingPylons[i];
    fp.x += fp.vx * dt; fp.y += fp.vy * dt;
    fp.vy += 3200 * dt; 
    fp.scale = Math.max(0, fp.scale - dt * 1.1); 
    fp.rot += fp.rotSpeed * dt;
    if (fp.scale <= 0.05 || fp.y > H + 100) activeFlyingPylons.splice(i, 1);
  }

  for (let i = blinkingBarriers.length - 1; i >= 0; i--) {
    let b = blinkingBarriers[i];
    b.timer -= dt;
    if (b.timer <= 0) {
      b.timer = 0.15; b.blinkCount++;
      if (b.blinkCount >= 6) { 
        b.state = 'done'; b.active = false; blinkingBarriers.splice(i, 1);
      }
    }
  }

  for (let c of confettiParticles) {
      c.x += c.vx * dt;
      c.y += c.vy * dt;
      c.vy += 800 * dt; 
      c.vx *= Math.pow(0.8, dt);
      c.rot += c.rotV * dt;
  }

  for (let i = smokeParticles.length - 1; i >= 0; i--) {
      let p = smokeParticles[i];
      p.life += dt;
      if (p.life >= p.maxLife) {
          smokeParticles.splice(i, 1);
          continue;
      }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
  }

  for (let i = activePopups.length - 1; i >= 0; i--) {
      let p = activePopups[i];
      p.life += dt;
      if (p.life >= p.maxLife) {
          activePopups.splice(i, 1);
          continue;
      }
      p.y += p.vy * dt;
      p.vy *= Math.pow(0.85, dt); // Decelerate float upward speed
  }

  render(ts); requestAnimationFrame(loop);
}

function showMainMenu() {
  document.getElementById('introScreen').classList.add('hide');
  if(!driverTag){showDriverName('first');return;}
  driverNameContext=null;state='intro';
  const ov = document.getElementById('overlay');
  buildMainMenu();
  ov.classList.remove('hide');
}

initBackground(); buildSegments(); initOpponents();

// Vite fingerprints the artwork and applies the configured deployment base.
const introArt=document.getElementById('introArt');
let introArtFallback=false;
let introPromptTimer=null;
function positionIntroPrompt(){
  // Anchor to the contained artwork, including the letterboxing on tall phones.
  const aspect=introArt.naturalWidth>0?introArt.naturalHeight/introArt.naturalWidth:1535/1024;
  const artHeight=Math.min(introArt.clientHeight,introArt.clientWidth*aspect);
  document.getElementById('introBox').style.top=((introArt.clientHeight-artHeight)/2+artHeight*.66)+'px';
}
window.addEventListener('resize',positionIntroPrompt);
const showIntroPrompt=()=>{
  if(introPromptTimer!==null)return;
  positionIntroPrompt();
  introPromptTimer=setTimeout(()=>document.getElementById('introBox').classList.add('show'),1500);
};
const introArtLoaded=()=>introArt.decode().catch(()=>{}).then(showIntroPrompt);
introArt.addEventListener('load',introArtLoaded);
introArt.addEventListener('error',()=>{
  if(introArtFallback){showIntroPrompt();return;}
  introArtFallback=true;
  introArt.src=window.location.protocol==='file:'
    ?(window.location.pathname.includes('/dist/')?'./Welcome.png':'./public/Welcome.png')
    :new URL('../Welcome.png',introArt.src).href;
});
if(introArt.complete&&introArt.naturalWidth>0)introArtLoaded();
else if(introArt.complete)introArt.dispatchEvent(new Event('error'));

buildMainMenu();
document.getElementById('resumeBtn').onclick = togglePause;
document.getElementById('exitRaceBtn').onclick = exitRace;
document.getElementById('pauseOptionsBtn').onclick=showPauseOptions;

document.getElementById('introBox').onclick = e=>{e.stopPropagation();showMainMenu();};
document.getElementById('introScreen').onclick = (e) => {
  if (document.getElementById('introBox').classList.contains('show')) {
    showMainMenu();
  }
};

requestAnimationFrame(loop);
</script>
