    ctx.fillStyle = '#547c9e';
    ctx.fill();

    // 3. White Underbelly
    ctx.beginPath();
    ctx.moveTo(oceanX - r * 35, oceanY + r * 2);
    ctx.quadraticCurveTo(oceanX - r * 20, oceanY + r * 8, oceanX - r * 5, oceanY + r * 10);
    ctx.quadraticCurveTo(oceanX + r * 12, oceanY + r * 11, oceanX + r * 25, oceanY + r * 6);
    ctx.bezierCurveTo(oceanX + r * 12, oceanY + r * 18, oceanX - r * 20, oceanY + r * 18, oceanX - r * 35, oceanY + r * 2);
    ctx.closePath();
    ctx.fillStyle = '#f3f7f9';
    ctx.fill();

    // 4. Belly Grooves
    ctx.strokeStyle = '#cbdbe5';
    ctx.lineWidth = Math.max(1.0, r * 0.9);
    ctx.lineCap = 'round';
    for (let i = 0; i < 5; i++) {
      ctx.beginPath();
      const startX = oceanX - r * (30 - i * 4);
      const startY = oceanY + r * (4 + i * 1.5);
      const endX = oceanX - r * (25 - i * 5);
      const endY = oceanY + r * (15 - i * 0.5);
      ctx.moveTo(startX, startY);
      ctx.quadraticCurveTo((startX + endX) / 2 - r * 1.5, (startY + endY) / 2 + r * 1.5, endX, endY);
      ctx.stroke();
    }

    // 6. Symmetrical Tail Fluke Lobes (with swimming wag animation)
    ctx.save();
    ctx.translate(oceanX + r * 42, oceanY - r * 18);
    ctx.rotate(tailWag);
    // Draw top lobe
    ctx.fillStyle = '#618cb0';
    ctx.beginPath();
    ctx.ellipse(r * 4, -r * 6, r * 9, r * 5, -Math.PI / 4, 0, Math.PI * 2);
    ctx.fill();
    // Draw bottom lobe
    ctx.fillStyle = '#496f90';
    ctx.beginPath();
    ctx.ellipse(r * 4, r * 3, r * 9, r * 5, Math.PI / 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // 7. Front Flipper (with swimming animation)
    ctx.save();
    ctx.translate(oceanX - r * 8, oceanY + r * 10);
    ctx.rotate(Math.sin(ts / 150) * 0.12);
    ctx.fillStyle = '#496f90';
    ctx.beginPath();
    ctx.ellipse(0, 0, r * 10, r * 5, Math.PI / 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // 8. Fully Happy Eye - Sleek, sophisticated, no googly eyes!
    const eyeX = oceanX - r * 24;
    const eyeY = oceanY - r * 4;

    ctx.strokeStyle = '#2d475e';
    ctx.lineWidth = Math.max(1.5, r * 1.0);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(eyeX, eyeY + r * 0.5, r * 2.0, Math.PI * 1.1, Math.PI * 1.9);
    ctx.stroke();

    // 9. Gigantic Happy Smile Mouth
    ctx.strokeStyle = '#2d475e';
    ctx.lineWidth = Math.max(1.5, r * 1.15);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(oceanX - r * 32, oceanY + r * 3);
    ctx.quadraticCurveTo(oceanX - r * 22, oceanY + r * 10, oceanX - r * 14, oceanY + r * 3);
    ctx.lineTo(oceanX - r * 13, oceanY + r * 1.5);
    ctx.stroke();

    // 10. Warm Pink Blush Cheek
    ctx.fillStyle = 'rgba(255, 90, 150, 0.25)';
    ctx.beginPath();
    ctx.ellipse(oceanX - r * 14, oceanY + r * 1.5, r * 3.5, r * 2.3, 0, 0, Math.PI * 2);
    ctx.fill();

    // 11. Gloss Highlight on Back
    ctx.fillStyle = 'rgba(255, 255, 255, 0.32)';
    ctx.beginPath();
    ctx.ellipse(oceanX - r * 18, oceanY - r * 18, r * 6, r * 2, -Math.PI / 8, 0, Math.PI * 2);
    ctx.fill();

    // 12. Spouting Blowhole
    const bhX = oceanX - r * 10;
    const bhY = oceanY - r * 25;
    ctx.save();
    ctx.translate(bhX, bhY);
    ctx.fillStyle = '#2d475e';
    ctx.beginPath();
    ctx.ellipse(0, 0, r * 3, r * 1, 0, 0, Math.PI * 2);
    ctx.fill();

    const activeCycle = ts % 3000;
    if (activeCycle > 400 && activeCycle < 2000) {
      let blowProgress = 0;
      if (activeCycle < 1000) blowProgress = (activeCycle - 400) / 600;
      else if (activeCycle < 1400) blowProgress = 1.0;
      else blowProgress = 1.0 - (activeCycle - 1400) / 600;

      const sprayHeight = r * 14 * blowProgress;
      ctx.fillStyle = '#78c0ff';
      ctx.strokeStyle = '#a4d4ff';
      ctx.lineWidth = r * 0.8;

      // Center droplet
      ctx.beginPath();
      ctx.moveTo(0, -r * 1.5);
      ctx.bezierCurveTo(-r * 3.5, -sprayHeight * 0.5, -r * 4.5, -sprayHeight, 0, -sprayHeight);
      ctx.bezierCurveTo(r * 4.5, -sprayHeight, r * 3.5, -sprayHeight * 0.5, 0, -r * 1.5);
      ctx.fill();
      ctx.stroke();

      // Left curved droplet
      ctx.beginPath();
      ctx.moveTo(-r * 1, -r * 1.5);
      ctx.bezierCurveTo(-r * 6.5, -sprayHeight * 0.4, -r * 9, -sprayHeight * 0.7, -r * 7.5, -sprayHeight * 0.8);
      ctx.bezierCurveTo(-r * 4.5, -sprayHeight * 0.8, -r * 1.5, -sprayHeight * 0.4, -r * 1, -r * 1.5);
      ctx.fill();
      ctx.stroke();

      // Right curved droplet
      ctx.beginPath();
      ctx.moveTo(r * 1, -r * 1.5);
      ctx.bezierCurveTo(r * 6.5, -sprayHeight * 0.4, r * 9, -sprayHeight * 0.7, r * 7.5, -sprayHeight * 0.8);
      ctx.bezierCurveTo(r * 4.5, -sprayHeight * 0.8, r * 1.5, -sprayHeight * 0.4, r * 1, -r * 1.5);
      ctx.fill();
      ctx.stroke();

      // White highlights inside droplets
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.ellipse(0, -sprayHeight * 0.8, r * 0.9, r * 1.3, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(-r * 5.5, -sprayHeight * 0.65, r * 0.7, r * 1.0, -Math.PI/6, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(r * 5.5, -sprayHeight * 0.65, r * 0.7, r * 1.0, Math.PI/6, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    ctx.restore();

    // 13. Splashing water overlays around the happy swimming whale!
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
    ctx.lineWidth = Math.max(1.8, sc * 2.8);
    for (let i = -1.2; i <= 1.2; i += 0.4) {
      const wx = oceanX + i * r * 22;
      const wy = oceanY + r * 10 + Math.sin(ts / 200 + i * 4) * r * 2;
      ctx.beginPath();
      ctx.moveTo(wx - r * 14, wy);
      ctx.quadraticCurveTo(wx, wy - r * 3, wx + r * 14, wy);
      ctx.stroke();
    }

    // 14. Happy people cheering and waving from the Beach (at the original beach coordinates sx, shifted closer to water line)
    const helpersCenterX = (rx2 !== null && w !== null) ? (rx2 + 3.1 * w) : (sx + sc * 55);
    drawWhaleHelper(helpersCenterX - sc * 25, sy + sc * 12, 'wave_cheer', '#e63946', 1);
    drawWhaleHelper(helpersCenterX - sc * 8, sy + sc * 14, 'wave_cheer', '#2a9d8f', 2);
    drawWhaleHelper(helpersCenterX + sc * 8, sy + sc * 13, 'wave_cheer', '#f4a261', 3);
    drawWhaleHelper(helpersCenterX + sc * 25, sy + sc * 11, 'wave_cheer', '#457b9d', 4);
  }

  ctx.restore();
}

function drawPylonSprite(cx, cy, sc, rot = 0) {
  const w = ~~(sc * 12), h = ~~(sc * 22); if (w < 2) return;
  ctx.save(); ctx.translate(cx, cy); if (rot !== 0) ctx.rotate(rot);
  if (currentLevel === LEVEL_SPACE) {
    const r = Math.max(3, w * 0.85);
    if (rot === 0) {
      ctx.fillStyle = 'rgba(0, 240, 255, 0.22)';
      ctx.beginPath(); ctx.ellipse(0, 0, r * 1.6, r * 0.45, 0, 0, Math.PI * 2); ctx.fill();
    }
    // Hovering energy ball glow (centered around -h * 0.4)
    ctx.fillStyle = 'rgba(0, 240, 255, 0.35)';
    ctx.beginPath(); ctx.arc(0, -h * 0.4, r * 1.5, 0, Math.PI * 2); ctx.fill();
    
    ctx.fillStyle = '#21d4fd';
    ctx.beginPath(); ctx.arc(0, -h * 0.4, r, 0, Math.PI * 2); ctx.fill();
    
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(0, -h * 0.4, r * 0.45, 0, Math.PI * 2); ctx.fill();
  } else {
    if (rot === 0) { ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.beginPath(); ctx.ellipse(0, 0, w*0.6, w*0.2, 0, 0, Math.PI*2); ctx.fill(); }
    ctx.fillStyle = '#ff6b35'; 
    ctx.beginPath(); ctx.moveTo(0, -h); ctx.lineTo(w*0.5, 0); ctx.lineTo(-w*0.5, 0); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.moveTo(-w*0.25, -h*0.5); ctx.lineTo(w*0.25, -h*0.5); ctx.lineTo(w*0.35, -h*0.3); ctx.lineTo(-w*0.35, -h*0.3); ctx.fill();
  }
  ctx.restore();
}

function drawBarrierSprite(cx, cy, sc, blinkCount) {
  if (blinkCount % 2 !== 0) return; 
  const w = ~~(sc * 190), h = ~~(sc * 90); if (w < 4) return;
  ctx.save(); ctx.translate(cx, cy);
  ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(-w/2, -5, w, h*0.1); 
  ctx.fillStyle = '#555555'; 
  const postW = Math.max(2, w * 0.12);
  ctx.fillRect(-w*0.42, -h, postW, h); ctx.fillRect(w*0.42 - postW, -h, postW, h);
  const barH = Math.max(4, h * 0.28);
  const drawBar = (yOff) => {
    const sections = 4, secW = w / sections;
    for (let i=0; i<sections; i++) {
      ctx.fillStyle = i % 2 === 0 ? '#ff6b35' : '#ffffff'; 
      ctx.fillRect(-w/2 + i*secW, -h + yOff, secW, barH);
    }
  };
  drawBar(0); drawBar(h * 0.5);
  ctx.restore();
}

function drawLightningSprite(cx, cy, sc) {
  const w = ~~(sc * 28), h = ~~(sc * 60); if (w < 2) return;
  ctx.save(); ctx.translate(cx, cy - h/2);
  ctx.beginPath();
  ctx.moveTo(w*0.2, -h/2); ctx.lineTo(-w*0.5, 0); ctx.lineTo(-w*0.1, h*0.1);
  ctx.lineTo(-w*0.3, h/2); ctx.lineTo(w*0.5, -h*0.1); ctx.lineTo(w*0.1, -h*0.2);
  ctx.closePath();
  ctx.fillStyle = '#ffe066'; ctx.fill();
  ctx.lineWidth = Math.max(1, sc * 4); ctx.strokeStyle = '#ff6b35'; ctx.stroke();
  ctx.restore();
}

const spritePool = [];
const renderList = [];

function drawCruisingSpeedStream(time) {
  if (state !== 'playing' || player.finished || player.isBoosting || player.isChevronBoosting) return;
  const amount = clamp((player.speed / player.maxSpeed - 1.02) / 0.18, 0, 1);
  if (amount <= 0) return;
  const strength = amount * amount * (3 - 2 * amount);
  ctx.save(); ctx.lineCap = 'round'; ctx.lineWidth = 0.8;
  // Four steady air trails at the edges; no random bursts, shake or FOV pulses.
  for (const side of [-1, 1]) for (let i = 0; i < 2; i++) {
    const x0 = W / 2 + side * W * (0.39 + i * 0.045), y0 = H * (0.48 + i * 0.025);
    const x1 = W / 2 + side * W * (0.60 + i * 0.05), y1 = H * 0.96;
    const point = t => [x0 + (x1 - x0) * t, y0 + (y1 - y0) * t];
    const steady = ctx.createLinearGradient(x0, y0, x1, y1);
    steady.addColorStop(0, 'rgba(176,235,244,0)');
    steady.addColorStop(0.4, `rgba(176,235,244,${strength * 0.08})`);
    steady.addColorStop(1, 'rgba(176,235,244,0)');
    ctx.strokeStyle = steady; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
    const phase = (time * 0.0007 + i * 0.43 + (side > 0 ? 0.21 : 0)) % 1;
    const tail = point(Math.max(0, phase - 0.22)), head = point(phase);
    const alpha = strength * Math.sin(phase * Math.PI) ** 2 * 0.32;
    const jet = ctx.createLinearGradient(...tail, ...head);
    jet.addColorStop(0, 'rgba(190,241,250,0)');
    jet.addColorStop(0.8, `rgba(190,241,250,${alpha})`);
    jet.addColorStop(1, 'rgba(190,241,250,0)');
    ctx.strokeStyle = jet; ctx.beginPath(); ctx.moveTo(...tail); ctx.lineTo(...head); ctx.stroke();
  }
  ctx.restore();
}

function render(ts) {
  const dt = smoothedDt;
  const responsiveFactor = clamp(W / 1000, 0.85, 1.0);
  const startSegIdx = currentLevel === LEVEL_DREAM ? ~~(player.z / SEGMENT_LENGTH) : ~~(player.z / SEGMENT_LENGTH) % SEGMENT_COUNT;
  const percent = (player.z % SEGMENT_LENGTH) / SEGMENT_LENGTH;
  const baseSeg = segments[startSegIdx] || segments[segments.length - 1];
  const playerY = baseSeg.worldY + baseSeg.hillDelta * percent;
  const horizonY = ~~(H * 0.5) + player.pitch * 1.5;

  const maxLaps = currentLevel === LEVEL_DREAM ? 1 : 3;
  const progressDist = (player.lap - 1) * TRACK_LENGTH + player.z;
  const progressRatio = clamp(progressDist / (maxLaps * TRACK_LENGTH), 0, 1.0);

  currentProgressRatio = progressRatio;

  const sunBuffer = sunR * 2, sunLoopW = W + sunBuffer * 2;
  let sunX = (W / 2) - (bgOffset * 0.15);
  sunX = ((sunX + sunBuffer) % sunLoopW); if (sunX < 0) sunX += sunLoopW; sunX -= sunBuffer;

  // Dynamic sky selection or interpolation
  if (currentLevel === LEVEL_HILLS || currentLevel === LEVEL_HIGHWAY) {
    const colors = currentLevel === LEVEL_HILLS
      ? ['#1c0c39', '#683365', '#c86886', '#ffa57e', '#ffcf94']
      : ['#030209', '#10071f', '#241038', '#422058', '#583065'];
    const gradient = ctx.createLinearGradient(0, 0, 0, H * 0.6);
    [0, 0.3, 0.6, 0.85, 1].forEach((position, i) => gradient.addColorStop(position, colors[i]));
    ctx.fillStyle = gradient;
  } else if (currentLevel === 2) {
    const colorTop = interpolateColor('#42154c', '#070112', progressRatio);
    const colorMidTop = interpolateColor('#721e5e', '#14022a', progressRatio);
    const colorMid = interpolateColor('#c83e4a', '#2d064d', progressRatio);
    const colorHorGlow = interpolateColor('#fda228', '#5b0d87', progressRatio);
    const colorHorBase = interpolateColor('#ffe259', '#190e38', progressRatio);
    
    const currentSkyGrad = ctx.createLinearGradient(0, 0, 0, H * 0.6);
    currentSkyGrad.addColorStop(0, colorTop);
    currentSkyGrad.addColorStop(0.3, colorMidTop);
    currentSkyGrad.addColorStop(0.6, colorMid);
    currentSkyGrad.addColorStop(0.85, colorHorGlow);
    currentSkyGrad.addColorStop(1, colorHorBase);
    
    ctx.fillStyle = currentSkyGrad;
  } else if (currentLevel === LEVEL_DREAM) {
    const zone = getDreamWorld(startSegIdx);
    const currentSkyGrad = ctx.createLinearGradient(0, 0, 0, H * 0.6);
    if (zone === 'steppe') {
      currentSkyGrad.addColorStop(0, '#bcc5cf'); // silver gray
      currentSkyGrad.addColorStop(0.35, '#c8cbd4');
      currentSkyGrad.addColorStop(0.7, '#dacecf'); // soft rose
      currentSkyGrad.addColorStop(1, '#ebdbe0'); // delicate rose/silver
    } else if (zone === 'arctic') {
      currentSkyGrad.addColorStop(0, '#04020a');
      currentSkyGrad.addColorStop(0.35, '#070514');
      currentSkyGrad.addColorStop(0.7, '#07152d');
      currentSkyGrad.addColorStop(1, '#0e2646');
    } else if (zone === 'dali') {
      currentSkyGrad.addColorStop(0, '#1d0b1a'); // dark purple-violet top
      currentSkyGrad.addColorStop(0.4, '#6a3837'); // terracotta reddish-brown
      currentSkyGrad.addColorStop(0.75, '#b5654d'); // dusty sunset orange
      currentSkyGrad.addColorStop(1, '#e9c46a'); // golden yellow base
    } else if (zone === 'underwater') {
      currentSkyGrad.addColorStop(0, '#010915'); // deep abyss black-blue
      currentSkyGrad.addColorStop(0.4, '#031730'); // sapphire blue
      currentSkyGrad.addColorStop(0.8, '#05294c'); // bioluminescent teal-blue base
      currentSkyGrad.addColorStop(1, '#0b3c66');
    } else { // getDreamWorld only ever names a world, so this is a safety net
      currentSkyGrad.addColorStop(0, '#050308');
      currentSkyGrad.addColorStop(1, '#0e0b14');
    }
    ctx.fillStyle = currentSkyGrad;
  } else if (currentLevel === LEVEL_SPACE) {
    // Cosmic Synthwave Space Sky: uniform, symmetric cosmic void with a central deep space glow
    const currentSkyGrad = ctx.createLinearGradient(0, 0, 0, H);
    currentSkyGrad.addColorStop(0, '#040108'); // cosmic black top
    currentSkyGrad.addColorStop(0.5, '#0e031a'); // deep violet space center
    currentSkyGrad.addColorStop(1, '#040108'); // cosmic black bottom
    ctx.fillStyle = currentSkyGrad;
  } else {
    ctx.fillStyle = skyGrad;
  }
  ctx.fillRect(0, 0, W, H);

  // Synthwave Space Wave (Space Wave) Cosmic background rendering
  if (currentLevel === LEVEL_SPACE) {
      ctx.save();
      
      // Virtual width of the sky wrap span
      const VW = W * 3.5;

      // 1. Nebula / Galaxy (Background element, very slow scroll, far left)
      let nebX = ((W * 0.2 - bgOffset * 0.12) % VW + VW) % VW - W * 1.2;
      const nebY = H * 0.22;
      const nebR = Math.min(W, H) * 0.35;
      
      const nebGrad = ctx.createRadialGradient(nebX, nebY, nebR * 0.1, nebX, nebY, nebR);
      nebGrad.addColorStop(0, 'rgba(255, 0, 128, 0.22)'); // Glowing magenta center
      nebGrad.addColorStop(0.4, 'rgba(128, 0, 255, 0.11)'); // Deep indigo
      nebGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = nebGrad;
      ctx.beginPath();
      ctx.arc(nebX, nebY, nebR, 0, Math.PI * 2);
      ctx.fill();
      
      // 2. The Great Gas Giant with rings (Synthwave Saturn - epic neon design!)
      let satX = ((W * 1.1 - bgOffset * 0.18) % VW + VW) % VW - W * 1.2;
      const satY = H * 0.16;
      const satR = Math.min(W, H) * 0.125; // Majestic planet radius
      
      // Giant neon glowing bloom behind Saturn
      ctx.save();
      const satGlow = ctx.createRadialGradient(satX, satY, satR * 0.2, satX, satY, satR * 3.8);
      satGlow.addColorStop(0, 'rgba(255, 0, 127, 0.22)');
      satGlow.addColorStop(0.4, 'rgba(189, 0, 255, 0.11)');
      satGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = satGlow;
      ctx.beginPath();
      ctx.arc(satX, satY, satR * 3.8, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      
      // 2a. Draw the back part of the rings (behind the planet, top half from Math.PI to 2*Math.PI)
      ctx.save();
      ctx.translate(satX, satY);
      ctx.rotate(-Math.PI * 0.15);
      
      // Ring Layer 2 (Main glowing magenta/purple ring)
      ctx.strokeStyle = '#bd00ff';
      ctx.lineWidth = satR * 0.32;
      ctx.shadowColor = '#bd00ff'; ctx.shadowBlur = 18;
      ctx.beginPath();
      ctx.ellipse(0, 0, satR * 2.2, satR * 0.40, 0, Math.PI, 2 * Math.PI);
      ctx.stroke();
 
      // Ring Layer 3 (Neon cyan inner ring)
      ctx.strokeStyle = '#00f0ff';
      ctx.lineWidth = satR * 0.12;
      ctx.shadowColor = '#00f0ff'; ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.ellipse(0, 0, satR * 1.65, satR * 0.30, 0, Math.PI, 2 * Math.PI);
      ctx.stroke();
 
      // Ring Layer 4 (Inner gold dusty ring)
      ctx.strokeStyle = '#ffe066';
      ctx.lineWidth = satR * 0.05;
      ctx.shadowColor = '#ffe066'; ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.ellipse(0, 0, satR * 1.38, satR * 0.25, 0, Math.PI, 2 * Math.PI);
      ctx.stroke();
      
      ctx.restore();
      
      // 2b. Draw Saturn sphere itself (glowing radial gradient)
      const satGrad = ctx.createRadialGradient(satX - satR * 0.2, satY - satR * 0.2, satR * 0.1, satX, satY, satR);
      satGrad.addColorStop(0, '#ffe066'); // yellow-orange highlight
      satGrad.addColorStop(0.4, '#ff4fd8'); // blending into pink
      satGrad.addColorStop(1, '#330044'); // dark purple shadow
      ctx.fillStyle = satGrad;
      ctx.beginPath();
      ctx.arc(satX, satY, satR, 0, Math.PI * 2);
      ctx.fill();
      
      // Draw horizontal shadow lines for classic synthwave styling
      ctx.save();
      ctx.strokeStyle = 'rgba(10, 4, 16, 0.45)';
      ctx.lineWidth = Math.max(1.5, satR * 0.09);
      for (let offset = -satR * 0.6; offset <= satR * 0.6; offset += satR * 0.25) {
          ctx.beginPath();
          const halfWidth = Math.sqrt(satR * satR - offset * offset);
          ctx.moveTo(satX - halfWidth, satY + offset);
          ctx.lineTo(satX + halfWidth, satY + offset);
          ctx.stroke();
      }
      ctx.restore();
 
      // 2c. Draw the front part of the rings (in front of the planet, bottom half from 0 to Math.PI)
      ctx.save();
      ctx.translate(satX, satY);
      ctx.rotate(-Math.PI * 0.15);
      
      // Main glowing magenta/purple ring
      ctx.strokeStyle = '#bd00ff';
      ctx.lineWidth = satR * 0.32;
      ctx.shadowColor = '#bd00ff'; ctx.shadowBlur = 18;
      ctx.beginPath();
      ctx.ellipse(0, 0, satR * 2.2, satR * 0.40, 0, 0, Math.PI);
      ctx.stroke();
 
      // Neon cyan inner ring
      ctx.strokeStyle = '#00f0ff';
      ctx.lineWidth = satR * 0.12;
      ctx.shadowColor = '#00f0ff'; ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.ellipse(0, 0, satR * 1.65, satR * 0.30, 0, 0, Math.PI);
      ctx.stroke();
 
      // Inner gold dusty ring
      ctx.strokeStyle = '#ffe066';
      ctx.lineWidth = satR * 0.05;
      ctx.shadowColor = '#ffe066'; ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.ellipse(0, 0, satR * 1.38, satR * 0.25, 0, 0, Math.PI);
      ctx.stroke();
      
      ctx.restore();
      
      // 3. Planet Earth (replaces boring icy planet with detailed, rotating Earth)
      let earthX = ((W * 1.9 - bgOffset * 0.22) % VW + VW) % VW - W * 1.2;
      const earthY = H * 0.32;
      const earthR = Math.min(W, H) * 0.055; // slightly larger for gorgeous details
      drawEarth(earthX, earthY, earthR, ts);

      // 3.1. Majestic Spiral Galaxy (as big as Saturn, positioned to the right of Earth)
      let galX = ((W * 2.42 - bgOffset * 0.22) % VW + VW) % VW - W * 1.2;
      const galY = H * 0.24;
      const galR = Math.min(W, H) * 0.125; // as big as Saturn
      drawSpiralGalaxy(galX, galY, galR, ts);
 
      // --- 3.5. DRAW POP CULTURE ICONS IN THE SKY (DISTRIBUTED BEAUTIFULLY) ---
      // Retro Rocket (Flies straight in the direction of its orientation at medium speed)
      const rocketAngle = -0.16; // tilted upwards-right
      const rSpeed = 0.09; // medium speed
      let rx = ((W * 2.7 + ts * rSpeed - bgOffset * 0.25) % VW + VW) % VW - W * 1.2;
      let ry = H * 0.24 + (rx / W) * (Math.sin(rocketAngle) * W);
      drawRocket(rx, ry, ts, rocketAngle);
 
      // USS Enterprise (Upper mid sky)
      let entX = ((W * 3.1 - bgOffset * 0.26) % VW + VW) % VW - W * 1.2;
      let entY = H * 0.20 + Math.sin(ts * 0.0006) * 15;
      drawEnterprise(entX, entY, ts);
 
      // Space Laser Battle (Mid sky dogfight! Positioned on the left virtual segment)
      let dogfightX = ((W * 0.6 - bgOffset * 0.28) % VW + VW) % VW - W * 1.2;
      let dogfightY = H * 0.38;
      drawSpaceDogfight(ts, dogfightX, dogfightY);
 
      // Sputnik (Lower mid sky - drifting slowly from left to right with no floating)
      let sputX = ((W * 1.5 + ts * 0.035 - bgOffset * 0.25) % VW + VW) % VW - W * 1.2;
      let sputY = H * 0.44;
      drawSputnik(sputX, sputY, ts);
 
      // Astronaut with Jetpack (Lowest sky object, floats just above the horizon so
      // the floating track drawn later does not cover him)
      let astX = ((W * 2.3 - bgOffset * 0.20) % VW + VW) % VW - W * 1.2;
      let astY = H * 0.49 + Math.cos(ts * 0.0008) * 18;
      drawAstronaut(astX, astY, ts);
      
      // 4. Occasional Meteorites/Shooting Stars!
      const meteorIndex = Math.floor(ts * 0.0004) % 3;
      const meteorTime = (ts * 0.0012) % 3.0;
      if (meteorTime < 1.0) {
          ctx.save();
          const startX = W * 0.4 + meteorIndex * W * 0.2;
          const startY = H * 0.05;
          const deltaX = -W * 0.2;
          const deltaY = H * 0.18;
          const currentX = startX + deltaX * meteorTime;
          const currentY = startY + deltaY * meteorTime;
          
          const mGrad = ctx.createLinearGradient(currentX, currentY, currentX - deltaX * 0.25, currentY - deltaY * 0.25);
          mGrad.addColorStop(0, '#ffffff');
          mGrad.addColorStop(0.2, 'rgba(0, 255, 255, 0.8)');
          mGrad.addColorStop(0.6, 'rgba(255, 0, 255, 0.4)');
          mGrad.addColorStop(1, 'rgba(255, 0, 255, 0)');
          
          ctx.strokeStyle = mGrad;
          ctx.lineWidth = 2.5;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(currentX, currentY);
          ctx.lineTo(currentX - deltaX * 0.35, currentY - deltaY * 0.35);
          ctx.stroke();
          ctx.restore();
      }
      ctx.restore();
  }

  // Stars fade in as night progresses (only after sunset)
  let nightFactor = 0;
  if (currentLevel === 2) {
    // Starts fading in from progressRatio = 0.6, fully faded in at 0.9
    nightFactor = clamp((progressRatio - 0.6) / 0.3, 0, 1.0);
  } else if (currentLevel === LEVEL_HILLS) {
    nightFactor = 0.18;
  } else if (currentLevel === LEVEL_DREAM) {
    const zone = getDreamWorld(startSegIdx);
    if (zone === 'steppe') nightFactor = 0.0;
    else if (zone === 'arctic') nightFactor = 1.0;
    else if (zone === 'dali') nightFactor = 0.8;
    else if (zone === 'underwater') nightFactor = 0.9;
    else nightFactor = 1.0;
  } else {
    nightFactor = 1.0;
  }

  for (const s of bgStars) {
    const starParallax = currentLevel === LEVEL_DREAM ? DREAM_PARALLAX.stars : (currentLevel === LEVEL_SPACE ? 0.05 : 0.01);
    let finalX = (s.x - bgOffset * starParallax) % W; if (finalX < 0) finalX += W;
    const twinkle = Math.sin(ts * 0.004 + s.t) * 0.5 + 0.5;
    const starAlpha = nightFactor * (0.05 + twinkle * 0.95);
    ctx.fillStyle = `rgba(255, 255, 255, ${starAlpha})`;
    
    let drawY;
    if (currentLevel === LEVEL_SPACE) {
      // Evenly distribute stars from top to bottom of the screen
      drawY = (s.y / (H * 0.45)) * H;
    } else {
      drawY = s.y + (horizonY - ~~(H * 0.5)) * 0.2;
    }
    ctx.fillRect(finalX, drawY, s.s, s.s);
  }

  // Celestial and atmospheric backdrops for Dream Odyssey zones
  if (currentLevel === LEVEL_DREAM) {
      const zone = getDreamWorld(startSegIdx);
      if (zone === 'arctic') {
          // 1. Green & Cyan Auroras waving slowly
          ctx.save();
          ctx.globalCompositeOperation = 'screen';
          const numWaves = 4;
          for (let w = 0; w < numWaves; w++) {
              ctx.beginPath();
              const points = [];
              const steps = 14;
              const yBase = H * 0.06 + w * H * 0.045;
              const amp = H * 0.04;
              const phase = ts * 0.0003 + w * Math.PI / 4 + bgOffset * DREAM_PARALLAX.atmosphere * Math.PI * 1.6 / (W * 1.3);
              for (let i = 0; i <= steps; i++) {
                  const x = -W * 0.15 + (i / steps) * W * 1.3;
                  const y = yBase + Math.sin((i / steps) * Math.PI * 1.6 + phase) * amp;
                  points.push({x, y});
              }
              ctx.moveTo(points[0].x, points[0].y);
              for (let i = 1; i < points.length; i++) {
                  ctx.lineTo(points[i].x, points[i].y);
              }
              const color = w % 2 === 0 ? '0, 255, 120' : '0, 210, 255';
              ctx.strokeStyle = `rgba(${color}, ${0.11 + Math.sin(ts * 0.0005 + w) * 0.04})`;
              ctx.lineWidth = H * 0.18;
              ctx.shadowColor = w % 2 === 0 ? '#00ff77' : '#00d2ff';
              ctx.shadowBlur = 40;
              ctx.stroke();
          }
          ctx.restore();
      } else if (zone === 'steppe') {
          // 2. A distant winter sun follows the turn more slowly than the hills.
          ctx.save();
          const cy = horizonY - H * 0.23;
          const rSun = Math.min(W, H) * 0.1;
          const cx = backdropX(W / 2, bgOffset * DREAM_PARALLAX.sun, rSun * 5.5);
          
          // Giant surrounding frost halo
          const sGrad = ctx.createRadialGradient(cx, cy, rSun * 0.1, cx, cy, rSun * 5.5);
          sGrad.addColorStop(0, 'rgba(235, 245, 255, 0.48)');
          sGrad.addColorStop(0.35, 'rgba(180, 220, 255, 0.18)');
          sGrad.addColorStop(1, 'rgba(180, 220, 255, 0)');
          ctx.fillStyle = sGrad;
          ctx.beginPath();
          ctx.arc(cx, cy, rSun * 5.5, 0, Math.PI * 2);
          ctx.fill();
          
          // Outer bright disk
          const diskGrad = ctx.createRadialGradient(cx, cy, rSun * 0.2, cx, cy, rSun);
          diskGrad.addColorStop(0, '#ffffff');
          diskGrad.addColorStop(0.5, '#e5f3ff');
          diskGrad.addColorStop(1, 'rgba(180, 220, 255, 0)');
          ctx.fillStyle = diskGrad;
          ctx.beginPath();
          ctx.arc(cx, cy, rSun, 0, Math.PI * 2);
          ctx.fill();
          
          // Intensely bright white core
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(cx, cy, rSun * 0.45, 0, Math.PI * 2);
          ctx.fill();
          
          ctx.restore();
      } else if (zone === 'dali') {
          // 3. Surreal melting red-gold Sun
          const cy = horizonY - H * 0.15;
          const rSun = Math.min(W, H) * 0.15;
          const cx = backdropX(W * 0.35, bgOffset * DREAM_PARALLAX.sun, rSun * 2.7);
          drawDaliSun(cx, cy, rSun, ts);
      } else if (zone === 'underwater') {
          // 4. Underwater Light Shafts and giant floating neon-bioluminescent Jellyfish!
          ctx.save();
          ctx.globalCompositeOperation = 'screen';
          
          // Draw 4 light shafts filtering from top
          for (let i = 0; i < 4; i++) {
              const startX = backdropX(W * (0.2 + i * 0.2) + Math.sin(ts * 0.0005 + i) * 50, bgOffset * DREAM_PARALLAX.atmosphere, H * 0.1 + 140);
              const angle = Math.sin(ts * 0.0002 + i) * 0.15;
              ctx.fillStyle = 'rgba(0, 245, 212, 0.05)';
              ctx.beginPath();
              ctx.moveTo(startX - 20, 0);
              ctx.lineTo(startX + 20, 0);
              ctx.lineTo(startX + Math.tan(angle) * H * 0.6 + 120, H * 0.6);
              ctx.lineTo(startX + Math.tan(angle) * H * 0.6 - 120, H * 0.6);
              ctx.closePath();
              ctx.fill();
          }
          
          // Draw 3 giant background jellyfish floating slowly in the upper ocean!
          for (let j = 0; j < 3; j++) {
              const jBaseY = H * 0.12 + Math.sin(ts * 0.001 + j) * 20;
              const r = 25 + j * 8;
              const jx = backdropX(W * (0.25 + j * 0.3), bgOffset * DREAM_PARALLAX.jellyfish, r * 1.5 + 20);
              const pulse = 1.0 + Math.sin(ts * 0.003 + j) * 0.15;
              
              // Jellyfish dome/umbrella (bioluminescent pink/cyan)
              ctx.fillStyle = j % 2 === 0 ? 'rgba(255, 0, 180, 0.4)' : 'rgba(0, 245, 212, 0.4)';
              ctx.beginPath();
              ctx.arc(jx, jBaseY, r * pulse, Math.PI, 0);
              ctx.bezierCurveTo(jx + r * pulse, jBaseY + 10, jx - r * pulse, jBaseY + 10, jx - r * pulse, jBaseY);
              ctx.closePath();
              ctx.fill();
              
              // Glowing edges
              ctx.strokeStyle = j % 2 === 0 ? '#ff00b4' : '#00ffd2';
              ctx.lineWidth = 1.5;
              ctx.stroke();
              
              // Drooping/waving tentacles
              ctx.strokeStyle = j % 2 === 0 ? 'rgba(255, 0, 180, 0.25)' : 'rgba(0, 245, 212, 0.25)';
              ctx.lineWidth = 2;
              for (let t = -3; t <= 3; t++) {
                  const tx = jx + t * (r * 0.25);
                  ctx.beginPath();
                  ctx.moveTo(tx, jBaseY + 5);
                  ctx.bezierCurveTo(
                      tx + Math.sin(ts * 0.004 + t) * 15, jBaseY + r * 1.5,
                      tx - Math.sin(ts * 0.004 + t) * 10, jBaseY + r * 2.5,
                      tx + Math.sin(ts * 0.004 + t) * 12, jBaseY + r * 3.5
                  );
                  ctx.stroke();
              }
          }

          ctx.restore();

          // --- Deep sea fauna ---
          // Wrapped over a span wider than the screen so each animal drifts in
          // and out rather than looping in place, slowest (and haziest) furthest
          // out, which is what separates the layers into depth.
          ctx.save();
          const VW = W * 3.2;
          const S = Math.min(W, H) / 460;
          const swim = (base, speed) => ((base - bgOffset * speed * DREAM_PARALLAX.faunaMultiplier) % VW + VW) % VW - W * 1.1;
          const haze = (alpha, fn) => { ctx.globalAlpha = alpha; fn(); ctx.globalAlpha = 1; };

          haze(0.62, () => drawWhale(swim(W * 1.5, 0.05), H * 0.31 + Math.sin(ts * 0.0006) * 12, S * 1.15, ts));
          haze(0.5, () => drawSeaSerpent(swim(W * 0.9, 0.06), H * 0.27 + Math.sin(ts * 0.0007) * 14, S * 0.75, ts));
          haze(0.72, () => drawSeaSerpent(swim(W * 2.6, 0.09), H * 0.15 + Math.sin(ts * 0.0009) * 10, S * 1.0, ts));
          haze(0.62, () => drawSquid(swim(W * 0.7, 0.10), H * 0.11 + Math.cos(ts * 0.0012) * 9, S * 0.7, ts));
          haze(0.7, () => drawReefShark(swim(W * 2.0, 0.12), H * 0.25 + Math.sin(ts * 0.0011) * 8, S * 0.85, ts));
          haze(0.8, () => drawReefShark(swim(W * 0.2, 0.14), H * 0.40 + Math.cos(ts * 0.0013) * 7, S * 0.6, ts));
          haze(0.78, () => drawSquid(swim(W * 1.15, 0.16), H * 0.35 + Math.sin(ts * 0.0015) * 8, S * 0.5, ts));
          haze(0.85, () => drawFishSchool(swim(W * 0.45, 0.20), H * 0.20, S * 0.55, ts, 1, 9));
          haze(0.92, () => drawFishSchool(swim(W * 1.8, 0.24), H * 0.34, S * 0.62, ts, 4, 8));
          haze(0.88, () => drawFishSchool(swim(W * 2.9, 0.28), H * 0.09, S * 0.48, ts, 7, 7));

          // Every so often one shark makes a close pass just outside the glass.
          // Drawn last and far larger than the backdrop animals, crossing the
          // whole view in one sweep — it stays behind the dome arches, so it
          // reads as passing outside the tunnel rather than inside it.
          const PASS_EVERY = 19000, PASS_TAKES = 5200;
          const pass = (ts % PASS_EVERY) / PASS_TAKES;
          if (pass < 1) {
            // Fade in and out at the screen edges so it never pops into view
            const edge = clamp(Math.min(pass, 1 - pass) / 0.12, 0, 1);
            ctx.save();
            ctx.globalAlpha = 0.95 * edge;
            // Sweep centred on the screen, not on x=0: starts a full body-length
            // clear of the right edge and ends the same clear of the left.
            const turnDrift = Math.sin(bgOffset * 0.001) * W * 0.05;
            ctx.translate(W * 1.5 - pass * (W * 2) - turnDrift, H * 0.30 - Math.sin(pass * Math.PI) * H * 0.05);
            ctx.rotate(Math.cos(pass * Math.PI) * 0.06);
            drawReefShark(0, 0, S * 2.7, ts);
            ctx.restore();
          }
          ctx.restore();
      }
  }

  // Birds flying (Only in Dream Odyssey Steppe)
  if (currentLevel === LEVEL_DREAM && getDreamWorld(startSegIdx) === 'steppe') {
      ctx.save();
      ctx.strokeStyle = '#5a5e65';
      ctx.lineWidth = 1.5;
      for (const b of bgBirds) {
          b.x = (b.x + b.speed * dt) % (W + 40);
          const birdX = backdropX(b.x, bgOffset * DREAM_PARALLAX.birds, 20);
          b.phase += dt * 8;
          const flap = Math.sin(b.phase) * (b.size * 0.45);
          
          ctx.beginPath();
          ctx.moveTo(birdX - b.size, b.y + flap);
          ctx.lineTo(birdX, b.y - flap * 0.2);
          ctx.lineTo(birdX + b.size, b.y + flap);
          ctx.stroke();
      }
      ctx.restore();
  }

  // Sun rendering (fully sets and fades out before moonrise) - skipped on Dream Odyssey and Space Wave
  if (currentLevel === LEVEL_HIGHWAY) {
    const moonX = backdropX(W * 0.74, bgOffset * 0.075, moonR * 1.6);
    ctx.save(); ctx.globalAlpha = 0.55;
    ctx.drawImage(moonCanvas, moonX - moonCanvas.width / 2, horizonY - H * 0.3 - moonCanvas.height / 2);
    ctx.restore();
  }
  if (currentLevel !== LEVEL_DREAM && currentLevel !== LEVEL_SPACE && currentLevel !== LEVEL_HIGHWAY) {
    const sunY = horizonY - H * 0.18 + (currentLevel === 2 ? progressRatio * H * 0.38 : 0);
    ctx.save();
    if (currentLevel === 2) {
      // Sun fades out to exactly 0 by progressRatio = 0.70 (earlier sunset!)
      ctx.globalAlpha = clamp((0.70 - progressRatio) / 0.70, 0, 1.0);
    }
    ctx.drawImage(sunCanvas, sunX - sunCanvas.width/2, sunY - sunCanvas.height/2);
    ctx.restore();
  }

  // Moon rendering (rises earlier in the final lap)
  let moonRatio = 0;
  let moonOpacity = 0;
  let moonX = 0, moonY = 0;
  const moonStartDist = 2.1 * TRACK_LENGTH;
  const moonEndDist = 2.8 * TRACK_LENGTH;
  if (currentLevel === 2 && progressDist >= moonStartDist) {
    moonRatio = clamp((progressDist - moonStartDist) / (moonEndDist - moonStartDist), 0, 1.0);
    // Moon fades in during the first half of its ascent/appearance
    moonOpacity = clamp(moonRatio / 0.5, 0, 1.0);
    
    // Position of the moon in the sky, wrapping with parallax
    const moonBuffer = moonR * 3, moonLoopW = W + moonBuffer * 2;
    let mx = (W * 0.68) - (bgOffset * 0.15);
    mx = ((mx + moonBuffer) % moonLoopW); if (mx < 0) mx += moonLoopW; mx -= moonBuffer;
    moonX = mx;
    
    // Rises from below the horizon up to a gorgeous placement in the upper sky
    moonY = horizonY + H * 0.1 - moonRatio * H * 0.38;

    // Draw a massive glowing radial backdrop in the sky around the moon
    if (moonRatio > 0) {
      ctx.save();
      const skyGlow = ctx.createRadialGradient(moonX, moonY, moonR * 0.5, moonX, moonY, moonR * 8.5);
      skyGlow.addColorStop(0, `rgba(34, 212, 253, ${0.12 * moonOpacity})`);
      skyGlow.addColorStop(0.5, `rgba(34, 212, 253, ${0.04 * moonOpacity})`);
      skyGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = skyGlow;
      ctx.beginPath();
      ctx.arc(moonX, moonY, moonR * 8.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
    
    // Draw the moon with its gorgeous crescent shape and aura glow
    ctx.save();
    ctx.globalAlpha = moonOpacity;
    ctx.drawImage(moonCanvas, moonX - moonCanvas.width / 2, moonY - moonCanvas.height / 2);
    ctx.restore();
  }

  // Shooting star (Sternschnuppe) during the last 200m (last ~4500 units) of Level 2
  const starZStart = 3 * TRACK_LENGTH - 4500;
  const starZEnd = 3 * TRACK_LENGTH - 500;
  if (currentLevel === 2 && progressDist >= starZStart && progressDist <= starZEnd) {
    const starRatio = (progressDist - starZStart) / (starZEnd - starZStart); // 0.0 to 1.0
    
    // Start top-left and streak down-right in the upper sky
    const startX = W * 0.22;
    const startY = H * 0.04;
    const endX = W * 0.48;
    const endY = H * 0.20;
    
    const headX = startX + (endX - startX) * starRatio;
    const headY = startY + (endY - startY) * starRatio;
    
    // Smooth trail that grows then shrinks at the end
    const trailOffset = Math.min(starRatio, 0.18, 1.0 - starRatio);
    const tailX = startX + (endX - startX) * (starRatio - trailOffset);
    const tailY = startY + (endY - startY) * (starRatio - trailOffset);
    
    ctx.save();
    const starGrad = ctx.createLinearGradient(tailX, tailY, headX, headY);
    starGrad.addColorStop(0, 'rgba(34, 212, 253, 0.0)');
    starGrad.addColorStop(0.4, 'rgba(34, 212, 253, 0.4)');
    starGrad.addColorStop(1, 'rgba(255, 255, 255, 1.0)');
    
    ctx.strokeStyle = starGrad;
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(tailX, tailY);
    ctx.lineTo(headX, headY);
    ctx.stroke();
    
    // Intense core bright spark with soft cyber glow
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = '#22d4fd';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(headX, headY, 1.8, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // Distant Mountains & Landscapes
  const mStroke = currentLevel === 2 ? interpolateColor('#2a0f62', '#120428', progressRatio) : (currentLevel === LEVEL_DREAM ? '#0c1a30' : '#2a0f62');
  if (currentLevel === LEVEL_HILLS || currentLevel === LEVEL_HIGHWAY) {
    drawChapterBackdrop(horizonY, ts);
  } else if (currentLevel === LEVEL_DREAM) {
    const zone = getDreamWorld(startSegIdx);
    if (zone === 'steppe') {
        // Treeless tundra: weathered ridges, pale frost and sparse low scrub.
        drawTile(bgOffset * DREAM_PARALLAX.landscape, horizonY, () => {
          // Draw 2 layers of rolling hills for depth
          for (let layer = 0; layer < 2; layer++) {
            const hOffset = layer * 15;
            ctx.fillStyle = layer === 0 ? '#adb3aa' : '#cbd0bf';
            ctx.strokeStyle = '#deded1';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(0, 40);
            
            // Plot a smooth wave path across BG_W width
            const numSteps = 40;
            const stepW = BG_W / numSteps;
            for (let s = 0; s <= numSteps; s++) {
              const x = s * stepW;
              const angle1 = (s / numSteps) * 2 * Math.PI;
              const angle2 = (s / numSteps) * 4 * Math.PI;
              const wave = Math.sin(angle1 + layer * 1.5) * 15 + Math.cos(angle2 - layer * 0.8) * 8;
              const y = -35 + wave - hOffset;
              ctx.lineTo(x, y);
            }
            ctx.lineTo(BG_W, 40);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            
            // Isolated wind-pruned bushes, leaving most of the horizon bare.
            ctx.fillStyle = layer === 0 ? '#747b64' : '#899175';
            for (let s = 3; s < numSteps - 2; s += 8) {
              const x = s * stepW + (layer * 12) % 30;
              const angle1 = (s / numSteps) * 2 * Math.PI;
              const angle2 = (s / numSteps) * 4 * Math.PI;
              const wave = Math.sin(angle1 + layer * 1.5) * 15 + Math.cos(angle2 - layer * 0.8) * 8;
              const y = -35 + wave - hOffset;
              
              // Low, irregular scrub rather than a forest of pointed trees.
              ctx.beginPath();
              ctx.ellipse(x, y - 1, 5.5, 2.5, -0.1, 0, Math.PI * 2);
              ctx.fill();
              ctx.beginPath(); ctx.ellipse(x + 4, y, 3, 1.5, 0, 0, Math.PI * 2); ctx.fill();
            }
          }
        });
    } else if (zone === 'arctic') {
        // Massive snow-capped peaks
        drawTile(bgOffset * DREAM_PARALLAX.mountains, horizonY, () => {
          for (const m of bgMountains) {
              // Dark winter mountain base
              ctx.fillStyle = '#0a1424';
              ctx.beginPath();
              ctx.moveTo(m.x, 0);
              ctx.lineTo(m.x + m.w / 2, -m.h);
              ctx.lineTo(m.x + m.w, 0);

              // Pure white snow-capped peak (top 38% of the mountain)

              const pL_y = -m.h * (1 - 0.38);
              const pR_x = m.x + m.w - (m.w / 2) * (1 - 0.38);

              ctx.beginPath();
              ctx.moveTo(pL_x, pL_y);

              ctx.lineWidth = 1.5;

    } else if (zone === 'dali') {

          ctx.lineWidth = 1.5;

            ctx.stroke();

    } else if (zone === 'underwater') {

          ctx.lineWidth = 2;
          ctx.fillStyle = 'rgba(5, 25, 35, 0.65)';

  } else {

          ctx.beginPath();
          ctx.moveTo(m.x, 0);

        ctx.fillRect(b.x, -b.h, b.w, b.h);

  } else if (currentLevel === LEVEL_DREAM) {

  const camZ = player.z, camX = player.x * ROAD_WIDTH * 0.82, camY = CAMERA_HEIGHT + playerY;

  const currentDrawDistance = currentLevel === LEVEL_SPACE ? 450 : DRAW_DISTANCE;

    const lapOffset = (currentLevel !== LEVEL_DREAM && segIdx < startSegIdx) ? TRACK_LENGTH : 0; const segWorldZ = seg.worldZ + lapOffset;

    seg.clipY = maxY;

    seg.proj_y1 = p1.y;

    seg.proj_rx2 = rx2;
    seg.proj_y2 = p2.y;
    seg.proj_w2 = p2.w;

      isStart: seg.isStart,
      isBridge: seg.isBridge,

    }

    if (currentLevel === LEVEL_HIGHWAY) {

        if (crossing) {

            s.type = 'highway_crossing'; s.x = rx2; s.y = p2.y; s.w = p2.w;

            s.depth = n; s.segIdx = segIdx; s.clipY = segmentClipY;
        }
        for (const car of highwayTraffic) {
            const trafficZ = car.z + (car.z < player.z ? TRACK_LENGTH : 0);
            if (trafficZ >= segWorldZ && trafficZ < segWorldZ + SEGMENT_LENGTH) {
                const s = getCleanSpriteFromPool(); s.type = 'oncoming_car';
                s.x = rx2 + car.x * p2.w; s.y = p2.y;

    if (seg.pylon && seg.pylon.active) { const s = getCleanSpriteFromPool(); s.type = 'pylon'; s.x = rx2 + seg.pylon.x * p2.w; s.y = p2.y; s.sc = Math.min(1.25, p2.scale * 2800) * responsiveFactor; s.depth = n; s.clipY = segmentClipY; s.segIdx = segIdx; }
    if (seg.barrier && seg.barrier.active) { const s = getCleanSpriteFromPool(); s.type = 'barrier'; s.x = rx2 + seg.barrier.x * p2.w; s.y = p2.y; s.sc = Math.min(1.25, p2.scale * 2800) * responsiveFactor; s.depth = n; s.blinkCount = seg.barrier.blinkCount; s.clipY = segmentClipY; s.segIdx = segIdx; }

  // Draw stays in the depth order of the road they cross, rather than at the
  // mast's single depth. This keeps their feet attached during the whole pass.
  const bridgeStays = new Map();
  if (currentLevel === 1) for (const mast of BRIDGE_MASTS) {
    if (!segments[mast]?.isPillar) continue;
    const mastZ = mast * SEGMENT_LENGTH, mastY = segments[mast].worldY;
    for (const d of BRIDGE_STAY_DISTANCES) for (const direction of [-1, 1]) {

      if (!anchor?.isBridge) continue;
      const anchorZ = anchorIndex * SEGMENT_LENGTH;
      const topY = mastY + 11500 * (0.35 + d / 28 * 0.52);
      const point = (z, side) => {
        const t = (z - mastZ) / (anchorZ - mastZ);

    const stays = bridgeStays.get(index);
    if (!stays) return;
    ctx.save();

      }

      ctx.strokeStyle = 'rgba(33,212,253,0.16)'; ctx.lineWidth = width * 3.5; ctx.stroke();
      ctx.strokeStyle = 'rgba(33,212,253,0.8)'; ctx.lineWidth = width; ctx.stroke();
      ctx.strokeStyle = 'rgba(230,255,255,0.9)'; ctx.lineWidth = Math.max(0.45, width * 0.35); ctx.stroke();
    }
    ctx.restore();
  };

  // Define the comprehensive helper to draw any sprite type
  function drawSprite(s) {
    if (['beverly_villa', 'beverly_palm', 'bougainvillea', 'beverly_sign', 'hills_lamp',
         'neon_tower', 'fantasy_sign', 'highway_lamp', 'oncoming_car', 'highway_crossing'].includes(s.type)) {

        else if (s.type === 'bougainvillea') drawBougainvillea(s.x, s.y, s.sc, s.segIdx);
        else if (s.type === 'beverly_sign') drawBeverlySign(s.x, s.y, s.sc);
        else if (s.type === 'hills_lamp' || s.type === 'highway_lamp') drawChapterLamp(s.x, s.y, s.sc, s.type === 'highway_lamp');
        else if (s.type === 'neon_tower') drawNeonTower(s.x, s.y, s.sc, s.segIdx, chapterTime);
        else if (s.type === 'fantasy_sign') drawFantasySign(s.x, s.y, s.sc, s.segIdx, chapterTime);
        else if (s.type === 'oncoming_car') drawOncomingCar(s.x, s.y, s.sc, s.color);

    }
    else if (s.type === 'tree') {
        ctx.save();
        if (s.clipY !== undefined) {
            ctx.beginPath(); ctx.rect(0, 0, W, s.clipY); ctx.clip();

    }
    else if (s.type === 'pillar') {
        const pSeg = segments[s.segIdx];
        if (!pSeg) return;
        const Z_p = s.worldZ !== undefined ? s.worldZ : s.segIdx * SEGMENT_LENGTH;
        const Y_road = pSeg.worldY, mastH = 11500, mastW = ROAD_WIDTH * 2.15;
        const pBaseL = project3D(-mastW, Y_road - 800, Z_p);
        const pTopL = project3D(-mastW, Y_road + mastH, Z_p);
        const pBaseR = project3D(mastW, Y_road - 800, Z_p);
        const pTopR = project3D(mastW, Y_road + mastH, Z_p);

        // The tower can be behind us while its forward stays are still visible.
        if (Z_p >= camZ + 64 && pBaseL && pTopL && pBaseR && pTopR) {
            ctx.save();
            if (s.clipY !== undefined) { ctx.beginPath(); ctx.rect(0, 0, W, s.clipY); ctx.clip(); }
            const mastThickness = Math.max(3, pBaseL.scale * W / 2 * 900);
            ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            ctx.strokeStyle = '#1d0c31'; ctx.lineWidth = mastThickness;
            ctx.beginPath();
            ctx.moveTo(pBaseL.x, pBaseL.y); ctx.lineTo(pTopL.x, pTopL.y);
            ctx.moveTo(pBaseR.x, pBaseR.y); ctx.lineTo(pTopR.x, pTopR.y); ctx.stroke();
            ctx.strokeStyle = '#58219c'; ctx.lineWidth = mastThickness * 0.22;
            ctx.beginPath();
            ctx.moveTo(pBaseL.x - mastThickness * 0.18, pBaseL.y); ctx.lineTo(pTopL.x - mastThickness * 0.18, pTopL.y);
            ctx.moveTo(pBaseR.x + mastThickness * 0.18, pBaseR.y); ctx.lineTo(pTopR.x + mastThickness * 0.18, pTopR.y); ctx.stroke();

            const topL = project3D(-mastW, Y_road + mastH * 0.88, Z_p);
            const topR = project3D(mastW, Y_road + mastH * 0.88, Z_p);
            const bottomL = project3D(-mastW, Y_road + mastH * 0.38, Z_p);
            const bottomR = project3D(mastW, Y_road + mastH * 0.38, Z_p);
            if (topL && topR && bottomL && bottomR) {
                ctx.strokeStyle = '#1d0c31'; ctx.lineWidth = mastThickness * 0.7;
                ctx.beginPath();
                ctx.moveTo(topL.x, topL.y); ctx.lineTo(topR.x, topR.y);
                ctx.moveTo(bottomL.x, bottomL.y); ctx.lineTo(bottomR.x, bottomR.y); ctx.stroke();
                ctx.strokeStyle = '#3d1666'; ctx.lineWidth = mastThickness * 0.35;
                ctx.beginPath();
                ctx.moveTo(bottomL.x, bottomL.y); ctx.lineTo(topR.x, topR.y);
                ctx.moveTo(bottomR.x, bottomR.y); ctx.lineTo(topL.x, topL.y); ctx.stroke();
            }
            ctx.restore();
        }


    }
  }

  // Group sprites from spritePool into those on visible road segments vs background/offscreen

  for (let i = 0; i < spriteCount; i++) {

      if (!spritesBySegment.has(s.segIdx)) {

  }

  // Draw background sprites (farthest first)
  backgroundSprites.sort((a, b) => b.depth - a.depth);
  for (const s of backgroundSprites) {

  }

  // Interleave Road Segments and Sprites back-to-front (Perfect painter's algorithm depth occlusion)
  for (let i = segmentsToDraw.length - 1; i >= 0; i--) {
    const roadSeg = segmentsToDraw[i];
    
    // 1. Draw the road segment (underlying pavement, barriers, cliffs, ocean, flora etc.)
    drawRoadSegment(roadSeg.rx1, roadSeg.y1, roadSeg.w1, roadSeg.rx2, roadSeg.y2, roadSeg.w2, roadSeg.color, roadSeg.isStart, roadSeg.isBridge, roadSeg.p1Scale, roadSeg.p2Scale, roadSeg.isPillar, roadSeg.segIdx, roadSeg.isVisible);
    
    // Cable slices share this segment's depth, including after a passed mast.
    if (roadSeg.isBridge) drawBridgeStays(roadSeg.segIdx);

    // 2. Draw any sprites positioned precisely on this segment index
    const segSprites = spritesBySegment.get(roadSeg.segIdx);
    if (segSprites) {
      segSprites.sort((a, b) => b.depth - a.depth);
      for (const s of segSprites) {
        drawSprite(s);
      }
    }
  }

  const steerVis = keys.left ? -1 : keys.right ? 1 : 0;
  const playerScreenX = clamp(W / 2 - lookOffset + player.curveAheadSmooth * W * 0.22 + player.x * W * 0.18 + steerVis * 5, W * 0.1, W * 0.9);
  playerLastScreenX = playerScreenX;
  const lean = clamp(player.steerLean * 0.12 - player.x * 0.018, -0.16, 0.16); const thrust = clamp(player.speed / player.maxSpeed, 0, 1);
  const bounceY = Math.max(0, -player.pitch * 0.5); 
  
  const shakeX = ((player.isBoosting || player.isChevronBoosting) ? (Math.random() - 0.5) * 6 : 0) + (player.isSparking ? (Math.random() - 0.5) * 8 : 0);
  const shakeY = ((player.isBoosting || player.isChevronBoosting) ? (Math.random() - 0.5) * 6 : 0) + (player.isSparking ? (Math.random() - 0.5) * 8 : 0);
  
  const playerScale = 1.64 * responsiveFactor;
  drawCarSprite(playerScreenX + shakeX, H - 76 + bounceY + shakeY, playerScale, '#ffe066', true, lean, thrust, player.hitFlash, player.isBoosting, player.finished || state === 'countdown' || state === 'intro', player.isChevronBoosting);

  const isPlayerStanding = (state === 'countdown' || state === 'intro' || (player.finished && player.speed < 50));
  if (isPlayerStanding && Math.random() < 0.12) {
      spawnExhaustSmoke(playerScreenX + shakeX, H - 76 + bounceY + shakeY, playerScale, true);
  }

  if (player.isSparking && player.speed > 0) {
      ctx.save();
      const sY = H - 76 + bounceY + shakeY;
      const xOffset = (player.x > 0 ? 120 : -120) * (playerScale / 1.64);
      for(let i=0; i<10; i++) {
          ctx.fillStyle = Math.random() > 0.5 ? '#fffaaa' : '#ffaa00';
          ctx.beginPath();
          let sX = playerScreenX + shakeX + xOffset + (Math.random()-0.5)*40;
          let sY_spark = sY - 5 + (Math.random()-0.5)*15;
          ctx.arc(sX, sY_spark, (1.5 + Math.random()*3) * (playerScale / 1.64), 0, Math.PI*2);
          ctx.fill();
      }
      ctx.restore();
  }

  for (let fp of activeFlyingPylons) drawPylonSprite(fp.x, fp.y, fp.scale, fp.rot);

  if (player.isChevronBoosting) {
      ctx.save();
      ctx.translate(W/2, H/2);
      // Epic pink hyperdrive warp lines - keeping the center completely open for visibility
      for(let i=0; i<60; i++) {
          let angle = Math.random() * Math.PI * 2;
          let dist = W * 0.32 + Math.random() * W * 0.45; 
          let len = 160 + Math.random() * 200;
          ctx.strokeStyle = ['#ff00ff', '#ffffff', '#ff007f', '#a300ff'][~~(Math.random()*4)];
          ctx.lineWidth = Math.random() * 4.5 + 1.5;
          ctx.globalAlpha = Math.random() * 0.75 + 0.25; 
          ctx.beginPath();
          ctx.moveTo(Math.cos(angle)*dist, Math.sin(angle)*dist);
          ctx.lineTo(Math.cos(angle)*(dist+len), Math.sin(angle)*(dist+len));
          ctx.stroke();
      }
      // Speed-sparks shooting outwards in the periphery only
      for(let i=0; i<25; i++) {
          let angle = Math.random() * Math.PI * 2;
          let dist = W * 0.3 + Math.random() * W * 0.45;
          let r = Math.random() * 3.5 + 1;
          ctx.fillStyle = Math.random() > 0.5 ? '#ffffff' : '#ff00ff';
          ctx.globalAlpha = Math.random() * 0.8;
          ctx.beginPath();
          ctx.arc(Math.cos(angle)*dist, Math.sin(angle)*dist, r, 0, Math.PI*2);
          ctx.fill();
      }
      ctx.restore();
  } else if (player.isBoosting) {
      ctx.save();
      ctx.translate(W/2, H/2);
      for(let i=0; i<30; i++) {
          let angle = Math.random() * Math.PI * 2;
          let dist = W * 0.3 + Math.random() * W * 0.5; 
          let len = 40 + Math.random() * 80;
          ctx.strokeStyle = ['#21d4fd', '#ffffff', '#ff4fd8'][~~(Math.random()*3)];
          ctx.lineWidth = Math.random() * 3 + 1;
          ctx.globalAlpha = (Math.random() * 0.6 + 0.2); 
          ctx.beginPath();
          ctx.moveTo(Math.cos(angle)*dist, Math.sin(angle)*dist);
          ctx.lineTo(Math.cos(angle)*(dist+len), Math.sin(angle)*(dist+len));
          ctx.stroke();
      }
      ctx.restore();
  } else {
      drawCruisingSpeedStream(chapterTime);
  }

  if (player.hitFlash > 0) { ctx.save(); ctx.globalAlpha = Math.min(0.3, player.hitFlash * 0.45); ctx.fillStyle = '#ff355e'; ctx.fillRect(0, 0, W, H); ctx.restore(); }
  ctx.fillStyle = vigGrad; ctx.fillRect(0, H*0.65, W, H*0.35);

  if (confettiParticles.length > 0) {
      for (let c of confettiParticles) {
          ctx.save();
          ctx.translate(c.x, c.y);
          ctx.rotate(c.rot);
          ctx.fillStyle = c.color;
          ctx.fillRect(-c.w/2, -c.h/2, c.w, c.h);
          ctx.restore();
      }
  }

  if (smokeParticles.length > 0) {
      ctx.save();
      for (let p of smokeParticles) {
          const progress = p.life / p.maxLife;
          ctx.globalAlpha = p.alpha * (1 - progress);
          
          if (p.isSparkle) {
              // Draw a beautiful 4-point sparkle star
              ctx.fillStyle = p.color;
              ctx.strokeStyle = p.color;
              ctx.lineWidth = 1.5;
              const size = p.size * (1 + progress * 1.5);
              ctx.beginPath();
              ctx.moveTo(p.x, p.y - size);
              ctx.lineTo(p.x + size * 0.25, p.y - size * 0.25);
              ctx.lineTo(p.x + size, p.y);
              ctx.lineTo(p.x + size * 0.25, p.y + size * 0.25);
              ctx.lineTo(p.x, p.y + size);
              ctx.lineTo(p.x - size * 0.25, p.y + size * 0.25);
              ctx.lineTo(p.x - size, p.y);
              ctx.lineTo(p.x - size * 0.25, p.y - size * 0.25);
              ctx.closePath();
              ctx.fill();
              
              // Draw a secondary bright center
              ctx.fillStyle = '#ffffff';
              ctx.beginPath();
              ctx.arc(p.x, p.y, size * 0.3, 0, Math.PI * 2);

          } else if (p.isChevronPlasma) {

              ctx.beginPath();
              ctx.arc(p.x, p.y, p.size * (1 + progress * 3.5), 0, Math.PI * 2);
              ctx.fill();
              
              // Core plasma circle
              ctx.fillStyle = p.color;
              ctx.beginPath();
              ctx.arc(p.x, p.y, p.size * (1 + progress * 2.0), 0, Math.PI * 2);
              ctx.fill();
              
              // Hot white inner core
              ctx.fillStyle = '#ffffff';
              ctx.beginPath();
              ctx.arc(p.x, p.y, p.size * 0.5 * (1 + progress * 1.2), 0, Math.PI * 2);
              ctx.fill();
          } else {
              ctx.fillStyle = p.color;
              ctx.beginPath();
              ctx.arc(p.x, p.y, p.size * (1 + progress * 2.5), 0, Math.PI * 2);
              ctx.fill();
          }
      }
      ctx.restore();
  }

  if (currentLevel === LEVEL_DREAM && weatherParticles.length > 0) {
      ctx.save();
      const zone = getDreamWorld(startSegIdx);
      // 0 inside a portal, ramping across its mouths, so weather is never
      // switched on in the frame you cross a zone edge.
      const weatherFade = getDreamWeatherFade(startSegIdx);
      for (let p of weatherParticles) {
          if (zone === 'arctic') {
              // Falling snow
              p.y += p.speedY * dt;
              p.x += (p.speedX + Math.sin(ts * 0.003 + p.phase) * 15) * dt;

              // Wrap around bounds
              if (p.y > H) { p.y = 0; p.x = Math.random() * W; }
              if (p.x < 0) p.x = W;
              if (p.x > W) p.x = 0;

              if (weatherFade <= 0) continue;
              ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha * weatherFade})`;
              ctx.beginPath();
              ctx.arc(p.x, p.y, p.size * 0.5, 0, Math.PI * 2);
              ctx.fill();
          } else if (zone === 'dali') {
              // Warm surreal heat dust / spark motes drifting upwards
              p.y -= p.speedY * 0.25 * dt;
              p.x += (p.speedX * 0.25 + Math.cos(ts * 0.002 + p.phase) * 10) * dt;
              
              // Wrap around bounds
              if (p.y < 0) { p.y = H; p.x = Math.random() * W; }
              if (p.x < 0) p.x = W;
              if (p.x > W) p.x = 0;

              if (weatherFade <= 0) continue;
              ctx.fillStyle = `rgba(244, 162, 97, ${p.alpha * 0.4 * weatherFade})`;
              ctx.beginPath();
              ctx.arc(p.x, p.y, p.size * 0.8, 0, Math.PI * 2);
              ctx.fill();
          }
      }
      ctx.restore();
  }

  if (activePopups.length > 0) {
      ctx.save();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (let p of activePopups) {
          const progress = p.life / p.maxLife;
          ctx.globalAlpha = p.alpha * (1 - progress);
          
          // Outer glow shadow
          ctx.shadowBlur = 10;
          ctx.shadowColor = p.shadowColor;
          
          // Setup font size with scaling factor
          const fontSize = Math.round(13 * p.scale);
          ctx.font = `bold ${fontSize}px 'Press Start 2P', monospace, sans-serif`;
          
          // Draw text shadow using filled black text underneath
          ctx.fillStyle = '#000000';
          ctx.fillText(p.text, p.x + 2, p.y + 2);
          
          // Draw actual text
          ctx.fillStyle = p.color;
          ctx.fillText(p.text, p.x, p.y);
      }
      ctx.restore();
  }
}

const PLACE_NAMES = ['1ST','2ND','3RD','4TH','5TH','6TH'];

function updateHUD(ts) {
  if (!placeEl) {
    placeEl = document.getElementById('placeVal'); lapEl = document.getElementById('lapVal'); spdEl = document.getElementById('spdVal');
    segmentEl = document.getElementById('segmentVal');
    b1El = document.getElementById('b1'); b2El = document.getElementById('b2'); b3El = document.getElementById('b3');

  }
  
  if (currentLevel === LEVEL_SPACE) {
    const ev = document.getElementById('energyVal');
    if (ev) ev.textContent = `${player.energyBallsCollected}/5`;
  }
  
  const curSeg = (~~(player.z / SEGMENT_LENGTH) % SEGMENT_COUNT + SEGMENT_COUNT) % SEGMENT_COUNT;

function interpolateColor(color1, color2, factor) {
  const getRGBA = (str) => {
    if (str.startsWith('#')) {
      const r = parseInt(str.substring(1, 3), 16);
      const g = parseInt(str.substring(3, 5), 16);
      const b = parseInt(str.substring(5, 7), 16);
      return [r, g, b, 1.0];
    } else {
      const parts = str.match(/[\d.]+/g);
      if (parts) {
        return [
          parseFloat(parts[0]),
          parseFloat(parts[1]),
          parseFloat(parts[2]),
          parts[3] !== undefined ? parseFloat(parts[3]) : 1.0
        ];
      }
      return [0, 0, 0, 1.0];
    }
  };
  
  const [r1, g1, b1, a1] = getRGBA(color1);
  const [r2, g2, b2, a2] = getRGBA(color2);
  
  const r = Math.round(r1 + (r2 - r1) * factor);
  const g = Math.round(g1 + (g2 - g1) * factor);
  const b = Math.round(b1 + (b2 - b1) * factor);
  const a = a1 + (a2 - a1) * factor;

  return `rgba(${r}, ${g}, ${b}, ${a})`;
}

// Restate a colour at a different opacity, keeping its brightness intact.
// (Fading via interpolateColor towards transparent would darken it as well.)
function withAlpha(color, alpha) {
  if (color.startsWith('#')) {
    const n = parseInt(color.slice(1), 16);
    return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${alpha})`;
  }
  const p = color.match(/[\d.]+/g);
  return p ? `rgba(${p[0]}, ${p[1]}, ${p[2]}, ${alpha})` : color;
}

function getRaceDistance(car) {
  return currentLevel === LEVEL_DREAM ? car.z : (car.lap - 1) * TRACK_LENGTH + car.z;

function getPlayerContactDistance() {
  const responsiveFactor = clamp(W / 1000, 0.85, 1.0);
  const playerScale = 1.64 * responsiveFactor;
  const horizonY = ~~(H * 0.5) + player.pitch * 1.5;
  const denom = Math.max(100, H - 76 - 12 * playerScale - horizonY);

}

// Intersect the whole movement with a contact rectangle, including lateral
// motion. Returns the first contact and its normal, or null for a clean miss.
function sweepContact(x0, z0, x1, z1, halfWidth, minZ, maxZ) {
  let enter = 0, exit = 1, axis = null, side = 0;
  for (const [name, from, to, min, max] of [['x', x0, x1, -halfWidth, halfWidth], ['z', z0, z1, minZ, maxZ]]) {
    const delta = to - from;
    if (Math.abs(delta) < 1e-9) {
      if (from < min || from > max) return null;
      continue;
    }
    const a = (min - from) / delta, b = (max - from) / delta;
    const near = Math.min(a, b), far = Math.max(a, b);
    if (near > enter) { enter = near; axis = name; side = delta > 0 ? -1 : 1; }
    exit = Math.min(exit, far);
    if (enter > exit) return null;
  }
  if (exit < 0 || enter > 1) return null;
  if (!axis) {
    // An existing overlap uses the nearest face, not the driver's keys/lean.
    const xDepth = (halfWidth - Math.abs(x0)) / halfWidth;
    const zDepth = Math.min(z0 - minZ, maxZ - z0) / ((maxZ - minZ) / 2);
    axis = xDepth < zDepth ? 'x' : 'z';
    const position = axis === 'x' ? x0 : z0 - (minZ + maxZ) / 2;
    const delta = axis === 'x' ? x1 - x0 : z1 - z0;
    side = Math.sign(position) || -Math.sign(delta) || 1;
  }
  return { time: enter, axis, side };
}

function getRoadLimits(z) {
  const segment = getSeg(z);
  const enclosed = segment.isBridge || (currentLevel === LEVEL_DREAM && segment.isTunnel);
  let left = enclosed ? 1.05 : 1.45, right = left;
  if (currentLevel === 2) left = 1.05;
  if (currentLevel === LEVEL_HIGHWAY) left = right = 0.88;
  if (currentLevel === LEVEL_SPACE) left = right = 0.98;
  if (currentLevel === LEVEL_DREAM && getDreamZone(segment.index) === 'underwater') left = right = UNDERWATER_WALL_LIMIT;
  return { left, right };
}

function loseCleanSpeed(severity) {
  // A graze loses part of the earned headroom; a substantial hit loses it all.
  // Boosts keep their existing collision response and absolute speed targets.
  player.cleanSpeedBonus = severity < 0.18 ? player.cleanSpeedBonus * 0.65 : 0;
  if (!player.isBoosting && !player.isChevronBoosting) {
    player.speed = Math.min(player.speed, player.maxSpeed * (1 + player.cleanSpeedBonus));
  }
}

function applyRoadContact(dt, lateralSpeed = 0) {
  const limits = getRoadLimits(player.z);
  const boundedX = clamp(player.x, -limits.left, limits.right);
  if (boundedX === player.x) {
    if (dt > 0 && player.x > -limits.left + 0.015 && player.x < limits.right - 0.015) player.wallContactSide = 0;
    return;
  }
  const side = player.x > boundedX ? 1 : -1;
  player.x = boundedX;
  if (player.wallContactSide !== side && player.wallHitCooldown <= 0) {
    const severity = clamp(Math.abs(lateralSpeed) / 3, 0, 1);
    player.speed *= 1 - (0.03 + severity * 0.12);
    loseCleanSpeed(severity);
    player.hitFlash = Math.max(player.hitFlash, 0.2 + severity * 0.3);
    player.wallHitCooldown = 0.2;
  }
  player.wallContactSide = side;
  // Rubbing is a drag per second, not another full impact on every frame.
  player.speed *= Math.exp(-0.9 * dt);
  player.isSparking ||= player.speed > 150;
}

function getTrackContacts(from, to, fields) {
  const contacts = [];
  const first = Math.floor(Math.min(from.z, to.z) / SEGMENT_LENGTH);
  const last = Math.floor(Math.max(from.z, to.z) / SEGMENT_LENGTH);
  for (let index = first; index <= last; index++) {
    if (currentLevel === LEVEL_DREAM && (index < 0 || index >= SEGMENT_COUNT)) continue;
    const segment = segments[(index % SEGMENT_COUNT + SEGMENT_COUNT) % SEGMENT_COUNT];
    for (const type of fields) {
      const object = segment[type];
      if (!object?.active || (type === 'barrier' && object.state !== 'idle')) continue;
      const halfWidth = type === 'barrier' ? 0.45 : type === 'lightning' ? 0.3 : 0.25;
      const hit = sweepContact(from.x - object.x, from.z, to.x - object.x, to.z, halfWidth, index * SEGMENT_LENGTH, (index + 1) * SEGMENT_LENGTH);
      if (hit) contacts.push({ ...hit, type, object });
    }
  }
  return contacts.sort((a, b) => a.time - b.time);
}

function hitBarrier(car, barrier) {

    const severity = clamp(car.speed / player.maxSpeed, 0, 1);
    car.speed *= 1 - (0.35 + severity * 0.35);
    car.collisionCooldown = 0.35 + severity * 0.15;
    car.isBoosting = car.isChevronBoosting = false;
    if (car === player) {
      loseCleanSpeed(1);
      player.hitFlash = Math.max(player.hitFlash, 0.45 + severity * 0.55);
    }

function checkOpponentCollision(previousPlayer, previousOpponents, dt) {
  if (player.finished) return;
  const playerVX = (player.x - previousPlayer.x) / dt;
  for (let i = 0; i < opponents.length; i++) {
    const opp = opponents[i], previous = previousOpponents[i];
    const playerVisualZ = getRaceDistance(player) + getPlayerContactDistance();
    const relX = opp.x - player.x, relZ = getRaceDistance(opp) - playerVisualZ;
    const hit = sweepContact(previous.x - previousPlayer.x, previous.z - previousPlayer.z, relX, relZ, COLLISION_X_RANGE, -COLLISION_Z_RANGE, COLLISION_Z_RANGE);
    if (!hit) {
      if (Math.abs(relX) > COLLISION_X_RANGE + 0.025 || Math.abs(relZ) > COLLISION_Z_RANGE + 10) opp.contactAxis = null;
      continue;
    }
    const oppVX = (opp.x - previous.x) / dt;
    const closing = Math.max(0, -hit.side * (hit.axis === 'x' ? oppVX - playerVX : opp.speed - player.speed));
    if (!opp.contactAxis && opp.collisionCooldown <= 0 && player.collisionCooldown <= 0 && closing > 0.01) {
      const severity = clamp(closing / (hit.axis === 'x' ? 3 : player.maxSpeed), 0, 1);
      if (hit.axis === 'x') {
