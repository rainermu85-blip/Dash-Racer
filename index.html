        const oppApproach = Math.max(0, -hit.side * oppVX);
        const responsibility = playerApproach / Math.max(0.01, playerApproach + oppApproach);
        const loss = 0.025 + severity * 0.12;
        player.speed *= 1 - loss * (0.35 + responsibility * 0.65);
        opp.speed *= 1 - loss * (1 - responsibility * 0.65);
        player.steerLean -= hit.side * (0.08 + severity * 0.12);
      } else {
        // Transfer longitudinal speed instead of teleporting the opponent or
        // imposing the same low speed on every kind of contact.
        const transfer = closing * 0.5;
        player.speed = Math.max(0, player.speed - hit.side * transfer);
        opp.speed = Math.max(0, opp.speed + hit.side * transfer);
        if (severity > 0.55) player.isBoosting = player.isChevronBoosting = false;
      }
      loseCleanSpeed(severity);
      player.hitFlash = Math.max(player.hitFlash, 0.15 + severity * 0.65);
      player.collisionCooldown = opp.collisionCooldown = 0.18 + severity * 0.22;
      opp.contactAxis = hit.axis; opp.contactSide = hit.side;
    }
    const axis = opp.contactAxis || hit.axis, side = opp.contactAxis ? opp.contactSide : hit.side;
    if (axis === 'x') {
      const separation = Math.max(0, COLLISION_X_RANGE - side * (opp.x - player.x));
      player.x -= side * separation * 0.5;
      opp.x += side * separation * 0.5;
      const pLimits = getRoadLimits(player.z), oLimits = getRoadLimits(opp.z);
      player.x = clamp(player.x, -pLimits.left, pLimits.right);
      opp.x = clamp(opp.x, -oLimits.left, oLimits.right);
      // A car pinned against a wall cannot take its half of the separation.
      // Give the remaining space to the other car instead of overlapping it.
      let remaining = Math.max(0, COLLISION_X_RANGE - side * (opp.x - player.x));
      opp.x = clamp(opp.x + side * remaining, -oLimits.left, oLimits.right);
      remaining = Math.max(0, COLLISION_X_RANGE - side * (opp.x - player.x));
      player.x = clamp(player.x - side * remaining, -pLimits.left, pLimits.right);
    } else if (Math.abs(relX) < COLLISION_X_RANGE) {
      const separation = Math.max(0, COLLISION_Z_RANGE - side * relZ);
      if (side > 0) player.z -= separation;
      else opp.z -= separation;
      // During protected contact, still match the closing speed. Otherwise a
      // car could display full speed while its position is held behind another.
      if (side * (opp.speed - player.speed) < 0) {
        player.speed = opp.speed = (player.speed + opp.speed) * 0.5;
      }
    }
  }
}

function loop(ts) {
  if (lastTime === 0) lastTime = ts;
  let rawDt = Math.min((ts - lastTime) / 1000, 0.05);
  lastTime = ts;
  
  // Smooth dt using a moving average low-pass filter to completely eliminate visual micro-stuttering especially visible during acceleration
  smoothedDt = smoothedDt * 0.82 + rawDt * 0.18;
  const dt = smoothedDt;

  if (paused) {
    render(ts);
    requestAnimationFrame(loop);
    return;
  }

  if (state === 'countdown') {
    cntTimer += dt;
    if (cntTimer > 1) { cntTimer = 0; cntVal--; if (cntVal < 0) { state = 'playing'; document.getElementById('cntNum').classList.remove('pop'); } else { popNum(cntVal); } }
  }

  if (state === 'playing') {
    // Render once, but advance contacts in short steps even on slower devices.
    const steps = Math.max(1, Math.ceil(dt / MAX_PHYSICS_STEP - 1e-8));
    const stepDt = dt / steps;
    for (let step = 0; step < steps; step++) {
    const dt = stepDt;
    const previousPlayer = { x: player.x, z: getRaceDistance(player) + getPlayerContactDistance() };
    const previousOpponents = opponents.map(opp => ({ x: opp.x, z: getRaceDistance(opp) }));
    updateChapterTraffic(dt);
    if (!player.finished) currentLapTime += dt * 1000;
    player.collisionCooldown = Math.max(0, player.collisionCooldown - dt); player.hitFlash = Math.max(0, player.hitFlash - dt * 2.6);
    player.wallHitCooldown = Math.max(0, player.wallHitCooldown - dt);

    if (keys.boost && player.boosts > 0 && !player.isBoosting && !player.isChevronBoosting && player.collisionCooldown <= 0 && !player.finished) {
        player.isBoosting = true;
        player.boostTimer = 1.2; 
        player.boosts--;
        keys.boost = false; 
    }

    if (player.isBoosting) {
        player.boostTimer -= dt;
        if (player.boostTimer <= 0) player.isBoosting = false;
    }

    if (player.isChevronBoosting) {
        player.chevronBoostTimer -= dt;
        if (player.chevronBoostTimer <= 0) player.isChevronBoosting = false;
    }

    let targetFov = player.isChevronBoosting ? -0.56 : (player.isBoosting ? -0.4 : 0);
    player.fovOffset += (targetFov - player.fovOffset) * dt * 3.0;

    const softLimit = 0.94; 
    const offroad = Math.abs(player.x) >= softLimit;
    const steerInput = player.finished ? 0 : ((keys.right ? 1 : 0) - (keys.left ? 1 : 0));
    player.steerLean += (steerInput - player.steerLean) * Math.min(1, dt * 9.5);
    
    const boosted = player.isBoosting || player.isChevronBoosting;
    const earnedMax = player.maxSpeed * (1 + player.cleanSpeedBonus);
    if (!player.finished && !boosted) {
      if (offroad || player.wallContactSide !== 0) {
        player.cleanSpeedBonus = Math.max(0, player.cleanSpeedBonus - CLEAN_SPEED_LIMIT / 3 * dt);
      } else if (player.collisionCooldown <= 0 && player.wallHitCooldown <= 0 &&
                 player.speed >= player.maxSpeed - 0.01 && player.speed <= earnedMax + 0.01) {
        player.cleanSpeedBonus = Math.min(CLEAN_SPEED_LIMIT,
          player.cleanSpeedBonus + CLEAN_SPEED_LIMIT / CLEAN_SPEED_BUILD_TIME * dt);
      }
    }
    // Both turbo targets remain relative to the original 335 km/h baseline.
    let currentMax = player.maxSpeed * (1 + player.cleanSpeedBonus);
    if (player.isChevronBoosting) {
        currentMax = player.maxSpeed * 2.31;
    } else if (player.isBoosting) {
        currentMax = player.maxSpeed * 1.65;
    }
    
    let targetSpeed = offroad ? currentMax * 0.36 : currentMax;
    if (player.finished) targetSpeed = 0;

    const speedRatio = player.speed / player.maxSpeed; 
    const accelMod = player.isChevronBoosting ? 7.0 : (player.isBoosting ? 5.0 : Math.max(0.5, 2.8 - speedRatio * 2.3)); 

    if (player.speed < targetSpeed) {
        const acceleration = !boosted && player.speed >= player.maxSpeed
          ? Math.min(player.accel * accelMod, player.maxSpeed * CLEAN_SPEED_LIMIT / CLEAN_SPEED_BUILD_TIME)
          : player.accel * accelMod;
        player.speed = Math.min(targetSpeed, player.speed + acceleration * dt);
    } else {
        const decelMod = (offroad ? 3.8 : 2.3) + (player.speed > player.maxSpeed ? 4.0 : 0);
        player.speed = Math.max(targetSpeed, player.speed - player.accel * decelMod * dt);
    }

    player.isSparking = (offroad && player.speed > 150);

    const currentSpeedRatio = Math.max(0, player.speed / player.maxSpeed);
    player.x += steerInput * STEER_SENSITIVITY * dt * (0.48 + currentSpeedRatio * 0.82);

    let curveAhead = 0, pitchAhead = 0;
    for (let i = 0; i < 20; i++) { 
        const lookSeg = getSeg(player.z + i * SEGMENT_LENGTH); 
        curveAhead += lookSeg.curve; 
        pitchAhead += lookSeg.hillDelta; 
    }
    curveAhead /= 20; pitchAhead /= 20; 
    
    player.curveAheadSmooth += (curveAhead - player.curveAheadSmooth) * dt * 4.0;
    bgOffset += curveAhead * player.speed * dt * 0.15; 
    
    player.x -= curveAhead * 0.5 * dt * (0.35 + currentSpeedRatio * 1.65); player.pitch += (pitchAhead - player.pitch) * Math.min(1, dt * 5.0);

    const over = Math.max(0, Math.abs(player.x) - softLimit);
    if (over > 0) { player.speed *= Math.exp(-(3.6 + over * 3.2) * dt); player.steerLean += (player.x > 0 ? -0.25 : 0.25) * Math.min(1, over) * dt; }
    applyRoadContact(dt, (player.x - previousPlayer.x) / dt);

    const nextContact = { x: player.x, z: getRaceDistance(player) + player.speed * dt + getPlayerContactDistance() };

    // Chevron boost checking
    if (currentLevel === LEVEL_SPACE) {
        const playerSegIdx = (~~(player.z / SEGMENT_LENGTH) % SEGMENT_COUNT + SEGMENT_COUNT) % SEGMENT_COUNT;
        let crossedChevronPanelIdx = -1;
        for (let pIdx = 0; pIdx < panelStarts.length; pIdx++) {
            const start = panelStarts[pIdx];
            if (playerSegIdx >= start && playerSegIdx < start + 6) {
                const side = (pIdx % 2 === 0) ? 'left' : 'right';
                const targetX = (side === 'left') ? -0.5 : 0.5;
                if (Math.abs(player.x - targetX) < 0.35) {
                    crossedChevronPanelIdx = pIdx;
                }
                break;
            }
        }
        
        if (crossedChevronPanelIdx !== -1) {
            if (player.lastChevronPanelIdx !== crossedChevronPanelIdx) {
                if (player.isChevronBoosting && player.chevronBoostTimer > 0) {
                    spawnPopupText("CHAINED!", "#ff00ff");
                } else {
                    spawnPopupText("CHEVRON TURBO!", "#ff00ff");
                }
                player.isChevronBoosting = true;
                player.chevronBoostTimer = 2.0; // Boost resets back to 2 seconds for chaining
                player.lastChevronPanelIdx = crossedChevronPanelIdx;
            }
        } else {
            let onAnyPanelRange = false;
            for (let pIdx = 0; pIdx < panelStarts.length; pIdx++) {
                const start = panelStarts[pIdx];
                if (playerSegIdx >= start && playerSegIdx < start + 6) {
                    onAnyPanelRange = true;
                    break;
                }
            }
            if (!onAnyPanelRange) {
                player.lastChevronPanelIdx = -1;
            }
        }
    }

    let playerTravel = player.speed * dt;
    const trackContacts = player.finished ? [] : getTrackContacts(previousPlayer, nextContact, ['lightning', 'pylon', 'barrier']);
    for (const contact of trackContacts) {
      const object = contact.object;
      if (contact.type === 'lightning') {
        object.active = false;
        if (player.boosts < 3) player.boosts++;
      } else if (contact.type === 'pylon') {
        object.active = false;
        if (currentLevel === LEVEL_SPACE) {
          player.energyBallsCollected = (player.energyBallsCollected || 0) + 1;
          if (player.energyBallsCollected === 1) {
            spawnPopupText("1/5 Turbo", "#00ffd2");
          } else if (player.energyBallsCollected === 2) {
            spawnPopupText("2/5 Turbo", "#00ffd2");
          } else if (player.energyBallsCollected === 3) {
            spawnPopupText("3/5 Turbo", "#00ffd2");
          } else if (player.energyBallsCollected === 4) {
            spawnPopupText("4/5 Turbo", "#00ffd2");
          } else if (player.energyBallsCollected >= 5) {
            player.energyBallsCollected = 0;
            if (player.boosts < 3) player.boosts++;
            spawnPopupText("Turbo Charged!", "#ff00ff");
          }
          activeFlyingPylons.push({
            x: W/2 + object.x * W * 0.55, y: H - 90,
            vx: steerInput * 1600 + (Math.random() - 0.5) * 800, 
            vy: -2000 - Math.random() * 600, 
            scale: 1.8, 
            rot: 0, rotSpeed: (Math.random()-0.5)*20
          });
        } else {
          player.speed *= 0.97; 
          activeFlyingPylons.push({
            x: W/2 + object.x * W * 0.55, y: H - 90,
            vx: steerInput * 1600 + (Math.random() - 0.5) * 800, 
            vy: -2000 - Math.random() * 600, 
            scale: 1.8, 
            rot: 0, rotSpeed: (Math.random()-0.5)*20
          });
        }
      } else {
        const impactSpeed = player.speed;
        hitBarrier(player, object);
        playerTravel -= (impactSpeed - player.speed) * dt * (1 - contact.time);
        break;
      }
    }

    player.z += playerTravel;

    const pTotal = getRaceDistance(player);
    for (let oppIndex = 0; oppIndex < opponents.length; oppIndex++) {
      const opp = opponents[oppIndex];
      opp.collisionCooldown = Math.max(0, opp.collisionCooldown - dt);
      const oTotal = getRaceDistance(opp);
      const dist = oTotal - pTotal;
      
      let rubberBandTarget = opp.maxSpeed;
      if (dist < -3500) rubberBandTarget *= 1.04; 
      if (dist > 4500) rubberBandTarget *= 0.96;  

      if (Math.abs(dist) < 4000 && Math.random() < 1 - Math.exp(-0.18 * dt) && opp.boostTimer <= 0 && !opp.isChevronBoosting) {
          opp.isBoosting = true;
          opp.boostTimer = 1.5;
      }

      if (opp.isChevronBoosting) {
          opp.chevronBoostTimer -= dt;
          if (opp.chevronBoostTimer <= 0) opp.isChevronBoosting = false;
          rubberBandTarget *= 2.31; 
      } else if (opp.isBoosting) {
          opp.boostTimer -= dt;
          if (opp.boostTimer <= 0) opp.isBoosting = false;
          rubberBandTarget *= 1.65; 
      }
      
      const oppAccelMod = opp.isChevronBoosting ? 2.1 : (opp.isBoosting ? 1.5 : 1.0);
      opp.speed += (rubberBandTarget - opp.speed) * dt * 1.5 * oppAccelMod;
      
      // Fahrspurwechsel-Logik:
      opp.timeInLane = (opp.timeInLane || 0) + dt;
      let switchChance = 0.005; // unwahrscheinlich in kurzen Abständen
      if (opp.timeInLane >= 6 && opp.timeInLane <= 10) {
          switchChance = 0.08;  // mittel-wahrscheinlich nach 6-10s
      } else if (opp.timeInLane > 10) {
          switchChance = 0.40;  // sehr wahrscheinlich nach >10s
      }
      if (Math.random() < switchChance * dt) {
          const lanes = [-0.55, 0.0, 0.55];
          const currentLane = opp.baseX;
          let closestLaneIdx = 1;
          let minDist = Infinity;
          for (let lIdx = 0; lIdx < lanes.length; lIdx++) {
              const d = Math.abs(lanes[lIdx] - currentLane);
              if (d < minDist) {
                  minDist = d;
                  closestLaneIdx = lIdx;
              }
          }
          const availableLanes = lanes.filter((_, idx) => idx !== closestLaneIdx);
          opp.baseX = availableLanes[Math.floor(Math.random() * availableLanes.length)];
          opp.timeInLane = 0;
      }
      
      let avoiding = false; let safeX = opp.baseX;
      const oppSegIdx = currentLevel === LEVEL_DREAM ? ~~(opp.z / SEGMENT_LENGTH) : ~~(opp.z / SEGMENT_LENGTH) % SEGMENT_COUNT;
      
      // KI schaut extrem weit voraus (40 Segmente) für butterweiches Ausweichen
      for(let i=1; i<40; i++) {
        let sIdx = currentLevel === LEVEL_DREAM ? (oppSegIdx + i) : (oppSegIdx + i) % SEGMENT_COUNT;
        let s = segments[sIdx] || segments[segments.length - 1];
        let obsX = null;
        if (s.pylon && s.pylon.active) obsX = s.pylon.x;
        else if (s.barrier && s.barrier.active) obsX = s.barrier.x;
        
        if (obsX !== null && Math.abs(opp.x - obsX) < 0.68) {
          avoiding = true;
          safeX = obsX < 0 ? 0.65 : -0.65;
          break; 
        }
      }

      let upcomingChevron = null;
      if (!avoiding && currentLevel === LEVEL_SPACE) {
          let upcomingChevronIdx = -1;
          for (let i = 1; i < 40; i++) {
              let sIdx = (oppSegIdx + i) % SEGMENT_COUNT;
              let panelSide = null;
              for (let pIdx = 0; pIdx < panelStarts.length; pIdx++) {
                  const start = panelStarts[pIdx];
                  if (sIdx >= start && sIdx < start + 6) {
                      panelSide = (pIdx % 2 === 0) ? 'left' : 'right';
                      upcomingChevronIdx = pIdx;
                      break;
                  }
              }
              if (panelSide) {
                  upcomingChevron = { side: panelSide, index: upcomingChevronIdx };
                  break;
              }
          }
      }

      if (avoiding) {
          opp.targetX = safeX;
      } else if (upcomingChevron) {
          const decisionKey = `${opp.lap}_${upcomingChevron.index}`;
          if (opp.chevronDecisions === undefined) opp.chevronDecisions = {};
          if (opp.chevronDecisions[decisionKey] === undefined) {
              const hitProbability = 0.2 + opp.oppIdx * 0.15; // 0.2, 0.35, 0.5, 0.65, 0.8
              opp.chevronDecisions[decisionKey] = Math.random() < hitProbability;
          }
          const willHit = opp.chevronDecisions[decisionKey];
          if (willHit) {
              opp.targetX = (upcomingChevron.side === 'left') ? -0.5 : 0.5;
          } else {
              opp.targetX = (upcomingChevron.side === 'left') ? 0.25 : -0.25;
          }
      } else {
          opp.targetX = opp.baseX + Math.sin(opp.z * 0.0015 + opp.color.charCodeAt(1)) * 0.15;
      }
      
      const steerSpd = avoiding ? 3.5 : (upcomingChevron ? 3.0 : 1.2);
      opp.x += (opp.targetX - opp.x) * dt * steerSpd;
      
      // Opponent Chevron crossing check
      if (currentLevel === LEVEL_SPACE) {
          let oppCrossedChevron = false;
          for (let pIdx = 0; pIdx < panelStarts.length; pIdx++) {
              const start = panelStarts[pIdx];
              if (oppSegIdx >= start && oppSegIdx < start + 6) {
                  const side = (pIdx % 2 === 0) ? 'left' : 'right';
                  const targetX = (side === 'left') ? -0.5 : 0.5;
                  if (Math.abs(opp.x - targetX) < 0.35) {
                      oppCrossedChevron = true;
                  }
                  break;
              }
          }
          if (oppCrossedChevron) {
              opp.isChevronBoosting = true;
              opp.chevronBoostTimer = 2.0; 
          }
      }

      const nextOpponent = { x: opp.x, z: getRaceDistance(opp) + opp.speed * dt };
      let opponentTravel = opp.speed * dt;
      for (const contact of getTrackContacts(previousOpponents[oppIndex], nextOpponent, ['pylon', 'barrier'])) {
        const object = contact.object;
        if (contact.type === 'pylon') {
         object.active = false;
         if (currentLevel === LEVEL_SPACE) {
            opp.energyBallsCollected = (opp.energyBallsCollected || 0) + 1;
            if (opp.energyBallsCollected >= 5) {
               opp.energyBallsCollected = 0;
               opp.isBoosting = true;
               opp.boostTimer = 1.5; 
            }
            activeFlyingPylons.push({
              x: W/2 + object.x * W * 0.55, y: H * 0.65,
              vx: (Math.random()-0.5)*800, vy: -1500, scale: 1.0, rot: 0, rotSpeed: 15
            });
         } else {
            opp.speed *= 0.97;
            activeFlyingPylons.push({
              x: W/2 + object.x * W * 0.55, y: H * 0.65,
              vx: (Math.random()-0.5)*800, vy: -1500, scale: 1.0, rot: 0, rotSpeed: 15
            });
         }
        } else {
          const impactSpeed = opp.speed;
          hitBarrier(opp, object);
          opponentTravel -= (impactSpeed - opp.speed) * dt * (1 - contact.time);
          opp.targetX = object.x > 0 ? -0.65 : 0.65;
          break;
        }
      }

      opp.z += opponentTravel;
    }

    checkOpponentCollision(previousPlayer, previousOpponents, dt);
    // Entry transitions and opponent pushes must respect the road's walls too.
    applyRoadContact(0, (player.x - previousPlayer.x) / dt);

    for (const opp of opponents) {
      if (opp.z >= TRACK_LENGTH) {
        if (currentLevel === LEVEL_DREAM) { if (opp.lap === 1) opp.lap++; }
        else { opp.z -= TRACK_LENGTH; opp.lap++; }
      }
    }

    // Finalize laps after contact resolution, so an impact at the line cannot
    // award a lap or finish a race before the movement is actually complete.
    if (player.z >= TRACK_LENGTH && !player.finished) {
      if (currentLevel !== LEVEL_DREAM) player.z -= TRACK_LENGTH;
      lapTimes[player.lap - 1] = currentLapTime;
      if (currentLapTime < bestLapTime) bestLapTime = currentLapTime;
      currentLapTime = 0; player.lap++;
      segments.forEach(s => {
        if (s.pylon) s.pylon.active = true;
        if (s.barrier) { s.barrier.active = true; s.barrier.state = 'idle'; s.barrier.blinkCount = 0; }
        if (s.lightning) s.lightning.active = true;
      });
      const maxLaps = currentLevel === LEVEL_DREAM ? 1 : 3;
      if (player.lap > maxLaps) {
        player.finished = true;
        const finalPlace = updateHUD(ts);
        spawnConfetti(finalPlace);
        resultTimer = setTimeout(() => { resultTimer = null; showResult(finalPlace); }, 1500);
      }
    }
    }
    updateHUD(ts);
  }

  for (let i = activeFlyingPylons.length - 1; i >= 0; i--) {
    let fp = activeFlyingPylons[i];
    fp.x += fp.vx * dt; fp.y += fp.vy * dt;
    fp.vy += 3200 * dt; 
    fp.scale = Math.max(0, fp.scale - dt * 1.1); 
    fp.rot += fp.rotSpeed * dt;
    if (fp.scale <= 0.05 || fp.y > H + 100) activeFlyingPylons.splice(i, 1);
  }

  for (let i = blinkingBarriers.length - 1; i >= 0; i--) {
    let b = blinkingBarriers[i];
    b.timer -= dt;
    if (b.timer <= 0) {
      b.timer = 0.15; b.blinkCount++;
      if (b.blinkCount >= 6) { 
        b.state = 'done'; b.active = false; blinkingBarriers.splice(i, 1);
      }
    }
  }

  for (let c of confettiParticles) {
      c.x += c.vx * dt;
      c.y += c.vy * dt;
      c.vy += 800 * dt; 
      c.vx *= Math.pow(0.8, dt);
      c.rot += c.rotV * dt;
  }

  for (let i = smokeParticles.length - 1; i >= 0; i--) {
      let p = smokeParticles[i];
      p.life += dt;
      if (p.life >= p.maxLife) {
          smokeParticles.splice(i, 1);
          continue;
      }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
  }

  for (let i = activePopups.length - 1; i >= 0; i--) {
      let p = activePopups[i];
      p.life += dt;
      if (p.life >= p.maxLife) {
          activePopups.splice(i, 1);
          continue;
      }
      p.y += p.vy * dt;
      p.vy *= Math.pow(0.85, dt); // Decelerate float upward speed
  }

  render(ts); requestAnimationFrame(loop);
}

function showMainMenu() {
  document.getElementById('introScreen').classList.add('hide');
  const ov = document.getElementById('overlay');
  buildMainMenu();
  ov.classList.remove('hide');
}

initBackground(); buildSegments(); initOpponents();

// Fix for displaying background image locally without web server
let introBg = './Welcome.png';
if (window.location.protocol === 'file:' && !window.location.pathname.includes('/dist/')) {
    introBg = './public/Welcome.png';
}
document.getElementById('introScreen').style.background = `#0a0410 url('${introBg}') center/contain no-repeat`;

buildMainMenu();
document.getElementById('resumeBtn').onclick = togglePause;
document.getElementById('exitRaceBtn').onclick = exitRace;

setTimeout(() => {
  document.getElementById('introBox').classList.add('show');
}, 1500);

document.getElementById('introBox').onclick = showMainMenu;
document.getElementById('introScreen').onclick = (e) => {
  if (document.getElementById('introBox').classList.contains('show')) {
    showMainMenu();
  }
};

requestAnimationFrame(loop);
</script>
