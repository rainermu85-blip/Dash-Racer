function drawRoadSegment(x1, y1, w1, x2, y2, w2, isAlt, isStart, isBridge, p1Scale, p2Scale, isPillar, segIdx, isVisible = true) {
    if (currentLevel === LEVEL_HILLS || currentLevel === LEVEL_HIGHWAY) {
        if (isVisible) drawChapterRoad(x1, y1, w1, x2, y2, w2, isAlt, isStart, segIdx);
        return;
    }
    if (currentLevel === LEVEL_DREAM) {
        // --- DREAM ODYSSEY: ARCTIC TUNNEL AND SNOW DESERT SURROUNDINGS & ROADBED ---
        const tun = getTunnelStyle(segIdx);

        if (tun) {
            // Tunnel cross-section: walls rise from the road edge (1.18) out to the
            // ceiling corner (1.35) at height 1.9. wallPt walks that profile so every
            // fitting below can be hung at a height fraction instead of hardcoded.
            const CEIL = 1.9, BASE = 1.18, TOP = 1.35;
            const wallPt = (x, w, y, h, side) => ({
                x: x + side * w * (BASE + (TOP - BASE) * h),
                y: y - w * CEIL * h
            });
            const drawPoly = (points, color) => {
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.moveTo(points[0].x, points[0].y);
                for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
                ctx.closePath();
                ctx.fill();
            };
            // Longitudinal band running the full length of the tunnel at height h.
            // Consecutive segments chain into one continuous line converging on the
            // vanishing point — this is what sells the sensation of gliding through.
            const conduit = (h, thick, color) => {
                for (let side = -1; side <= 1; side += 2) {
                    const a = wallPt(x1, w1, y1, h, side), b = wallPt(x2, w2, y2, h, side);
                    drawPoly([
                        { x: a.x, y: a.y },
                        { x: a.x, y: a.y + w1 * thick },
                        { x: b.x, y: b.y + w2 * thick },
                        { x: b.x, y: b.y }
                    ], color);
                }
            };

            const wallCol = isAlt ? interpolateColor(tun.wall, '#ffffff', 0.07) : tun.wall;
            const ceilCol = interpolateColor(tun.wall, '#000000', isAlt ? 0.3 : 0.4);
            const deepCol = interpolateColor(tun.wall, '#000000', 0.55);

            // Cavern void behind everything; the far end already carries the glow of
            // the world this portal opens into.
            if (isVisible) {
                ctx.fillStyle = interpolateColor('#06030c', tun.light, tun.exit * 0.2);
                ctx.fillRect(0, y2 - 1.2, W, y1 - y2 + 1.5);
            }

            if (isVisible) {
                // Outer margin slabs
                ctx.fillStyle = interpolateColor(isAlt ? '#1c1b26' : '#12121b', tun.wall, 0.4);
                trapezoid(x1 - w1 * 1.18, y1, x1 + w1 * 1.18, x2 - w2 * 1.18, y2, x2 + w2 * 1.18);

                // Asphalt
                ctx.fillStyle = isAlt ? '#0e0e15' : '#09090e';
                trapezoid(x1 - w1, y1, x1 + w1, x2 - w2, y2, x2 + w2);

                // Edge stripes in the portal's accent colour
                ctx.fillStyle = isAlt ? tun.accent : interpolateColor(tun.accent, '#000000', 0.45);
                const e1 = w1 * 0.038, e2 = w2 * 0.038;
                trapezoid(x1 - w1, y1, x1 - w1 + e1, x2 - w2, y2, x2 - w2 + e2);
                trapezoid(x1 + w1 - e1, y1, x1 + w1, x2 + w2 - e2, y2, x2 + w2);

                // Centre dashes
                if (!isAlt) {
                    ctx.fillStyle = interpolateColor(tun.light, '#000000', 0.3);
                    const d1 = w1 * 0.015, d2 = w2 * 0.015;
                    trapezoid(x1 - d1, y1, x1 + d1, x2 - d2, y2, x2 + d2);
                }

                // Lane separators
                ctx.fillStyle = interpolateColor(tun.accent, '#000000', 0.6);
                for (let l = 1; l < LANES; l++) {
                    const lr = l / LANES;
                    const lx1 = x1 - w1 + 2 * w1 * lr;
                    const lx2 = x2 - w2 + 2 * w2 * lr;
                    const lw1 = Math.max(1, w1 * 0.007);
                    const lw2 = Math.max(1, w2 * 0.007);
                    trapezoid(lx1 - lw1, y1, lx1 + lw1, lx2 - lw2, y2, lx2 + lw2);
                }
            }

            // Shell: left wall, right wall, ceiling
            drawPoly([
                { x: x1 - w1 * TOP, y: y1 - w1 * CEIL },
                { x: x1 - w1 * BASE, y: y1 },
                { x: x2 - w2 * BASE, y: y2 },
                { x: x2 - w2 * TOP, y: y2 - w2 * CEIL }
            ], wallCol);
            drawPoly([
                { x: x1 + w1 * BASE, y: y1 },
                { x: x1 + w1 * TOP, y: y1 - w1 * CEIL },
                { x: x2 + w2 * TOP, y: y2 - w2 * CEIL },
                { x: x2 + w2 * BASE, y: y2 }
            ], wallCol);
            drawPoly([
                { x: x1 - w1 * TOP, y: y1 - w1 * CEIL },
                { x: x1 + w1 * TOP, y: y1 - w1 * CEIL },
                { x: x2 + w2 * TOP, y: y2 - w2 * CEIL },
                { x: x2 - w2 * TOP, y: y2 - w2 * CEIL }
            ], ceilCol);

            // --- Rhythm layers, fastest to slowest ---
            // Far segments are only a few pixels wide, where this detail would just
            // alias, so it is skipped there rather than drawn sub-pixel.
            const fineDetail = w1 > 10;

            // Continuous: kerb line, guide rail, cable duct
            if (fineDetail) {
                conduit(0.04, 0.016, interpolateColor(tun.accent, '#000000', 0.35));
                conduit(0.50, 0.020, interpolateColor(tun.accent, tun.wall, 0.35));
                conduit(0.72, 0.045, deepCol);
            }

            // Every 3: wall panel seams
            if (fineDetail && segIdx % 3 === 0) {
                ctx.strokeStyle = deepCol;
                ctx.lineWidth = Math.max(1, w1 * 0.008);
                ctx.beginPath();
                for (let side = -1; side <= 1; side += 2) {
                    const b = wallPt(x1, w1, y1, 0, side), t = wallPt(x1, w1, y1, 1, side);
                    ctx.moveTo(b.x, b.y); ctx.lineTo(t.x, t.y);
                }
                ctx.stroke();
            }

            // Every 6: arch ribs
            if (segIdx % 6 === 0) {
                const bl = wallPt(x1, w1, y1, 0, -1), tl = wallPt(x1, w1, y1, 1, -1);
                const tr = wallPt(x1, w1, y1, 1, 1), br = wallPt(x1, w1, y1, 0, 1);
                ctx.strokeStyle = tun.accent;
                ctx.lineWidth = Math.max(2.5, w1 * 0.045);
                ctx.beginPath();
                ctx.moveTo(bl.x, bl.y); ctx.lineTo(tl.x, tl.y);
                ctx.lineTo(tr.x, tr.y); ctx.lineTo(br.x, br.y);
                ctx.stroke();
                ctx.strokeStyle = tun.light;
                ctx.lineWidth = Math.max(1, w1 * 0.012);
                ctx.stroke();
            }

            // Every 12: overhead light fixtures
            if (segIdx % 12 === 0) {
                const rxL1 = x1 - w1 * 0.28;
                const rxR1 = x1 + w1 * 0.28;
                const ry1  = y1 - w1 * CEIL;
                const rxL2 = x2 - w2 * 0.28;
                const rxR2 = x2 + w2 * 0.28;
                const ry2  = y2 - w2 * CEIL;
                // Volumetric beam cone onto the road
                ctx.save();
                const gGrad = ctx.createLinearGradient(0, ry1, 0, ry1 + w1 * 0.85);
                gGrad.addColorStop(0, withAlpha(tun.light, 0.22));
                gGrad.addColorStop(1, withAlpha(tun.light, 0));
                drawPoly([
                    { x: rxL1, y: ry1 },
                    { x: rxR1, y: ry1 },
                    { x: rxR1 + w1 * 0.12, y: ry1 + w1 * 0.85 },
                    { x: rxL1 - w1 * 0.12, y: ry1 + w1 * 0.85 }
                ], gGrad);
                ctx.restore();

                // Fixture casing
                drawPoly([
                    { x: rxL1 - w1 * 0.02, y: ry1 - 2 },
                    { x: rxR1 + w1 * 0.02, y: ry1 - 2 },
                    { x: rxR2 + w2 * 0.02, y: ry2 + 2 },
                    { x: rxL2 - w2 * 0.02, y: ry2 + 2 }
                ], '#1a1a1c');

                // Tube core + bloom
                drawPoly([
                    { x: rxL1, y: ry1 }, { x: rxR1, y: ry1 },
                    { x: rxR2, y: ry2 }, { x: rxL2, y: ry2 }
                ], '#ffffff');
                ctx.save();
                ctx.shadowColor = tun.light;
                ctx.shadowBlur = Math.max(15, w1 * 0.35);
                drawPoly([
                    { x: rxL1, y: ry1 }, { x: rxR1, y: ry1 },
                    { x: rxR2, y: ry2 }, { x: rxL2, y: ry2 }
                ], tun.light);
                ctx.restore();
            }

            // Every 24: service niche plate on the right wall — the slow beat that
            // makes the faster rhythms readable as distance covered.
            if (fineDetail && segIdx % 24 === 0) {
                const a = wallPt(x1, w1, y1, 0.30, 1), b = wallPt(x2, w2, y2, 0.30, 1);
                drawPoly([
                    { x: a.x, y: a.y },
                    { x: a.x, y: a.y + w1 * 0.16 },
                    { x: b.x, y: b.y + w2 * 0.16 },
                    { x: b.x, y: b.y }
                ], interpolateColor(tun.light, tun.wall, 0.35));
            }

            // Portal mouths: a bright ring of the world on that side of the tunnel
            const mouth = Math.max(tun.entry, tun.exit);
            if (mouth > 0.02) {
                const bl = wallPt(x1, w1, y1, 0, -1), tl = wallPt(x1, w1, y1, 1, -1);
                const tr = wallPt(x1, w1, y1, 1, 1), br = wallPt(x1, w1, y1, 0, 1);
                ctx.save();
                ctx.globalAlpha = mouth;
                ctx.strokeStyle = tun.light;
                ctx.lineWidth = Math.max(2, w1 * 0.05);
                ctx.beginPath();
                ctx.moveTo(bl.x, bl.y); ctx.lineTo(tl.x, tl.y);
                ctx.lineTo(tr.x, tr.y); ctx.lineTo(br.x, br.y);
                ctx.stroke();
                ctx.restore();
            }
        } else {
            // --- OUTSIDE THE TUNNEL: STEPPE, ARCTIC, DALI, OR UNDERWATER ---
            const zone = getDreamZone(segIdx);
            if (isVisible) {
                const snowHillL1 = x1 - w1 * 1.18;
                const snowHillR1 = x1 + w1 * 1.18;
                const snowHillL2 = x2 - w2 * 1.18;
                const snowHillR2 = x2 + w2 * 1.18;
                
                let grassColor, marginColor, roadColor, edgeColor, centerColor;
                
                if (zone === 'steppe') {
                    // Soft warm grassy-grey fields of the winter steppe
                    grassColor = isAlt ? '#a29a82' : '#978f77';
                    marginColor = isAlt ? '#6e6757' : '#635c4e';
                    roadColor = isAlt ? '#2c2b29' : '#232220';
                    edgeColor = '#ffffff';
                    centerColor = '#ffcc00';
                } else if (zone === 'arctic') {
                    // Soft snow-fields scrolling out to screen boundaries
                    grassColor = isAlt ? '#f0f5fa' : '#e6eef5';
                    marginColor = isAlt ? '#dce6f0' : '#d2dcf0';
                    roadColor = isAlt ? '#1d1c26' : '#14141c';
                    edgeColor = '#00ffd2';
                    centerColor = '#ffcc00';
                } else if (zone === 'dali') {
                    // Surreal warm amber/violet/gold desert sands
                    grassColor = isAlt ? '#e5989b' : '#b5828c'; // dusty rose/gold desert
                    marginColor = isAlt ? '#e07a5f' : '#f4f1de'; // terracotta & cream margins
                    roadColor = isAlt ? '#2d2d3a' : '#1f2026'; // dark asphalt with violet undertone
                    edgeColor = '#f4a261'; // glowing warm orange edges
                    centerColor = '#ff007f'; // melting neon pink dashes
                } else { // 'underwater'
                    // Deep sea floor with bioluminescent blue/teal ground
                    grassColor = isAlt ? '#051923' : '#001219'; // dark abyss base
                    marginColor = isAlt ? '#005f73' : '#0a9396'; // deep teal coral shelf
                    roadColor = isAlt ? '#111e25' : '#091116'; // slick deep-sea glass track
                    edgeColor = '#00f5d4'; // neon cyan edge guides
                    centerColor = '#7b2cbf'; // glowing violet dashes
                }

                // Draw the ground
                ctx.fillStyle = grassColor;
                trapezoid(0, y1, snowHillL1, 0, y2, snowHillL2);
                trapezoid(snowHillR1, y1, W, snowHillR2, y2, W);
                
                // Draw margins
                ctx.fillStyle = marginColor;
                trapezoid(x1 - w1 * 1.18, y1, x1 + w1 * 1.18, x2 - w2 * 1.18, y2, x2 + w2 * 1.18);
                
                // Draw road pavement
                ctx.fillStyle = roadColor;
                trapezoid(x1 - w1, y1, x1 + w1, x2 - w2, y2, x2 + w2);
                
                // Edge lines
                ctx.fillStyle = edgeColor;
                const e1 = w1 * 0.038, e2 = w2 * 0.038;
                trapezoid(x1 - w1, y1, x1 - w1 + e1, x2 - w2, y2, x2 - w2 + e2);
                trapezoid(x1 + w1 - e1, y1, x1 + w1, x2 + w2 - e2, y2, x2 + w2);
                
                // Center line
                if (!isAlt) {
                    ctx.fillStyle = centerColor;
                    const d1 = w1 * 0.015, d2 = w2 * 0.015;
                    trapezoid(x1 - d1, y1, x1 + d1, x2 - d2, y2, x2 + d2);
                }
                
                // Lane dividers
                ctx.fillStyle = zone === 'underwater' ? 'rgba(0, 245, 212, 0.25)' : (zone === 'dali' ? 'rgba(244, 162, 97, 0.25)' : 'rgba(255, 255, 255, 0.2)');
                for (let l = 1; l < LANES; l++) {
                    const lr = l / LANES;
                    const lx1 = x1 - w1 + 2 * w1 * lr;
                    const lx2 = x2 - w2 + 2 * w2 * lr;
                    const lw1 = Math.max(1, w1 * 0.007);
                    const lw2 = Math.max(1, w2 * 0.007);
                    trapezoid(lx1 - lw1, y1, lx1 + lw1, lx2 - lw2, y2, lx2 + lw2);
                }

                if (isStart) drawCheckeredLine(x1, y1, w1, x2, y2, w2, isAlt);
            }
            // Elevated structures remain visible over the exit crest even when
            // the road beneath them is hidden. Nearer road/tunnel segments still
            // occlude their bases through the normal back-to-front drawing.
            if (zone === 'underwater') {
                if (segIdx % 8 === 0 || segIdx === DREAM_TUNNELS[2].end) drawUnderwaterArch(x1, y1, w1);
                if (segIdx === SEGMENT_COUNT - 1) drawUnderwaterFinish(x2, y2, w2);
            }
        }
        return;
    }
    if (currentLevel === LEVEL_SPACE) {
        // --- SPACE WAVE: SPACE WAVE SURROUNDINGS ---
        // Do nothing! Let the beautiful starfield and planets remain visible on the sides.
    } else if (currentLevel === 2) {
        // --- LEVEL 2: COASTAL ROAD SURROUNDINGS ---
        // 1. Right side: Golden Sandy Beach (40m strip)
        const beachL1 = x1 + w1 * 1.15;
        const beachL2 = x2 + w2 * 1.15;
        const beachR1 = x1 + w1 * 3.8;
        const beachR2 = x2 + w2 * 3.8;
        
        ctx.fillStyle = isAlt ? '#eac68a' : '#dfbe81';
        trapezoid(beachL1, y1, beachR1, beachL2, y2, beachR2);
        
        // 2. Right side: Open Ocean (Sea beyond the beach extending off-screen)
        // Dynamically interpolated ocean color: beautiful, vibrant twilight indigo/sapphire fading to a deep, dark midnight blue!
        const seaAltCol = interpolateColor('#1a416b', '#060e18', currentProgressRatio);
        const seaStdCol = interpolateColor('#122d4f', '#040a12', currentProgressRatio);
        ctx.fillStyle = isAlt ? seaAltCol : seaStdCol;
        trapezoid(beachR1, y1, W, beachR2, y2, W);
        
        // Dynamic cyan sea wave foam highlights
        if (!isAlt && (segIdx % 12 === 0)) {
            ctx.fillStyle = 'rgba(33, 212, 253, 0.25)';
            const waveX1 = beachR1 + w1 * 0.25;
            const waveX2 = beachR2 + w2 * 0.25;
            const waveW1 = w1 * 0.45;
            const waveW2 = w2 * 0.45;
            trapezoid(waveX1, y1, waveX1 + waveW1, waveX2, y2, waveX2 + waveW2);
        }

        // 3. Left side: Steep Rocky Cliff (with robust off-screen expansion and scale capping to prevent full-screen flashes)
        const cliffR1 = x1 - w1 * 1.15;
        const cliffR2 = x2 - w2 * 1.15;
        const topL1 = x1 - w1 * 3.2;
        const topL2 = x2 - w2 * 3.2;
        const capP1Scale = Math.min(0.012, p1Scale);
        const capP2Scale = Math.min(0.012, p2Scale);
        const topY1 = y1 - capP1Scale * 6500 * (H / 2);
        const topY2 = y2 - capP2Scale * 6500 * (H / 2);
        
        // Rock wall face
        ctx.fillStyle = isAlt ? '#1a1220' : '#140d1a';
        ctx.beginPath();
        ctx.moveTo(cliffR1, y1);
        ctx.lineTo(topL1, topY1);
        ctx.lineTo(topL2, topY2 - 1.2);
        ctx.lineTo(cliffR2, y2 - 1.2);
        ctx.closePath();
        ctx.fill();
        
        // Fill everything to the left of the cliff edge to avoid gaps
        ctx.fillStyle = isAlt ? '#140c1a' : '#0f0814';
        ctx.beginPath();
        ctx.moveTo(topL1, topY1);
        ctx.lineTo(0, topY1);
        ctx.lineTo(0, topY2 - 1.2);
        ctx.lineTo(topL2, topY2 - 1.2);
        ctx.closePath();
        ctx.fill();

        // 4. Bushwork (organic climbing vines & flora lying perfectly flat on the slanted rock face!)
        const placementNoise = Math.sin(segIdx * 0.45) * Math.cos(segIdx * 0.17);
        if (placementNoise > 0.2) { // Organic, clumped distribution
            // Place the vine clump at an organic center offset on the wall (between 1.3 and 2.6)
            const centerOffset = 1.3 + Math.abs(Math.sin(segIdx * 0.73)) * 1.3;
            
            // The vine clump has a broader, highly visible width along the slope
            const halfWidth = 0.15 + Math.abs(Math.cos(segIdx * 1.1)) * 0.22;
            
            const offsetA = Math.max(1.15, centerOffset - halfWidth);
            const offsetB = Math.min(3.2, centerOffset + halfWidth);
            
            // Helper function to get 2D screen coordinates for a point on the slanted cliff wall of a segment
            const getWallPoint = (x, w, pScale, y, offset) => {
                const normOffset = (offset - 1.15) / (3.2 - 1.15);
                const hFactor = normOffset * 6500;
                const cappedScale = Math.min(0.012, pScale);
                return {
                    x: x - w * offset,
                    y: y - cappedScale * hFactor * (H / 2)
                };
            };
            
            // Get the 4 corners of the vine patch lying flat on the wall
            const ptA1 = getWallPoint(x1, w1, capP1Scale, y1, offsetA);
            const ptB1 = getWallPoint(x1, w1, capP1Scale, y1, offsetB);
            const ptA2 = getWallPoint(x2, w2, capP2Scale, y2, offsetA);
            const ptB2 = getWallPoint(x2, w2, capP2Scale, y2, offsetB);
            
            // Choose colors: a beautiful mix of synthwave cyber green, deep jungle green, and neon magenta flower blooms!
            const flowerBloom = Math.sin(segIdx * 2.3) > 0.45;
            
            // 55% of the pink clusters are replaced by a darker green shade
            const isPink = flowerBloom && (Math.sin(segIdx * 8.9) > 0.1);
            const isDarkGreen = flowerBloom && !isPink;
            
            let leafColors;
            if (isPink) {
                leafColors = ['#4a0033', '#7a005c', '#ad0072', '#e60087', '#ff33a3']; // Pink/Magenta
            } else if (isDarkGreen) {
                leafColors = ['#01140a', '#022111', '#04381c', '#065228', '#0b8f47']; // Darker Green shade
            } else {
                leafColors = ['#042114', '#063b21', '#0a5c32', '#108c4a', '#24c96e']; // Standard Green
            }
            
            // Draw thin organic vine stems climbing from bottom of segment (y1) to top (y2)
            ctx.strokeStyle = isPink ? '#26001a' : '#021a0f';
            ctx.lineWidth = Math.max(1.2, capP1Scale * 15);
            ctx.beginPath();
            
            const numStems = 2;
            for (let s = 0; s < numStems; s++) {
                const startOffset = offsetA + (offsetB - offsetA) * (0.2 + s * 0.6);
                const endOffset = offsetA + (offsetB - offsetA) * (0.1 + (1 - s) * 0.7);
                const cpOffset = startOffset + Math.sin(segIdx + s) * halfWidth * 0.5;
                
                const pStart = getWallPoint(x1, w1, capP1Scale, y1, startOffset);
                const pEnd = getWallPoint(x2, w2, capP2Scale, y2, endOffset);
                const pControl = getWallPoint(x1 + (x2 - x1) * 0.5, w1 + (w2 - w1) * 0.5, capP1Scale + (capP2Scale - capP1Scale) * 0.5, y1 + (y2 - y1) * 0.5, cpOffset);
                
                ctx.moveTo(pStart.x, pStart.y);
                ctx.quadraticCurveTo(pControl.x, pControl.y, pEnd.x, pEnd.y);
            }
            ctx.stroke();
            
            // Populate the vine with larger individual leafy blobs (layered from dark/large to light/small)
            const numLeaves = 24;
            for (let i = 0; i < numLeaves; i++) {
                const t = i / (numLeaves - 1); // vertical progression
                const horizontalOffset = offsetA + (offsetB - offsetA) * (0.1 + Math.abs(Math.sin(segIdx * 3 + i * 2.5)) * 0.8);
                const pt = getWallPoint(
                    x1 + (x2 - x1) * t, 
                    w1 + (w2 - w1) * t, 
                    capP1Scale + (capP2Scale - capP1Scale) * t, 
                    y1 + (y2 - y1) * t, 
                    horizontalOffset
                );
                
                const baseRadius = (13.5 + Math.abs(Math.sin(segIdx * 1.5 + i * 1.1)) * 27) * capP1Scale * 1050;
                if (baseRadius < 0.6) continue;
                
                if (isPink) {
                    // Pink remains circular
                    // Dark base shade
                    ctx.fillStyle = leafColors[0];
                    ctx.beginPath();
                    ctx.arc(pt.x, pt.y, baseRadius, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Medium shade
                    ctx.fillStyle = leafColors[2];
                    ctx.beginPath();
                    ctx.arc(pt.x - baseRadius * 0.15, pt.y - baseRadius * 0.15, baseRadius * 0.7, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Highlight shade
                    ctx.fillStyle = leafColors[4];
                    ctx.beginPath();
                    ctx.arc(pt.x - baseRadius * 0.25, pt.y - baseRadius * 0.25, baseRadius * 0.45, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    // Green and Darker Green are drawn as gorgeous digons!
                    const rot = -0.4 + Math.sin(segIdx * 1.3 + i * 0.7) * 0.4;
                    const rx = baseRadius * 1.35;
                    const ry = baseRadius * 0.72;
                    
                    const drawDigonLeaf = (cx, cy, lx, ly, fillStyle) => {
                        ctx.fillStyle = fillStyle;
                        ctx.save();
                        ctx.translate(cx, cy);
                        ctx.rotate(rot);
                        ctx.beginPath();
                        ctx.moveTo(-lx, 0);
                        // Upper curved arc
                        ctx.quadraticCurveTo(0, -ly * 1.8, lx, 0);
                        // Lower curved arc
                        ctx.quadraticCurveTo(0, ly * 1.8, -lx, 0);
                        ctx.closePath();
                        ctx.fill();
                        ctx.restore();
                    };
                    
                    // Dark base shade
                    drawDigonLeaf(pt.x, pt.y, rx, ry, leafColors[0]);
                    
                    // Medium shade
                    drawDigonLeaf(
                        pt.x - rx * 0.12 * Math.cos(rot - Math.PI/4), 
                        pt.y - ry * 0.12 * Math.sin(rot - Math.PI/4), 
                        rx * 0.72, 
                        ry * 0.72, 
                        leafColors[2]
                    );
                    
                    // Highlight shade
                    drawDigonLeaf(
                        pt.x - rx * 0.22 * Math.cos(rot - Math.PI/4), 
                        pt.y - ry * 0.22 * Math.sin(rot - Math.PI/4), 
                        rx * 0.45, 
                        ry * 0.45, 
                        leafColors[4]
                    );
                }
            }
            
            // Draw a glowing neon yellow flower bud accent
            if (isPink && capP1Scale > 0.003) {
                const budPt = getWallPoint(x1, w1, capP1Scale, y1, centerOffset);
                ctx.fillStyle = '#ffdf00';
                ctx.beginPath();
                ctx.arc(budPt.x, budPt.y, Math.max(3, capP1Scale * 65), 0, Math.PI * 2);
                ctx.fill();
            }
        }
    } else {
        // --- LEVEL 1: STANDARD CITY/BRIDGE VOID SURROUNDINGS ---
        if (isVisible) {
            if (isBridge) {
                ctx.fillStyle = '#0a1d33'; ctx.fillRect(0, y2 - 1.2, W, y1 - y2 + 1.5);
                ctx.fillStyle = 'rgba(33, 212, 253, 0.05)'; ctx.fillRect(0, y2 - 1.2, W, 1);
            } else {
                ctx.fillStyle = isAlt ? '#12071f' : '#0d0518'; ctx.fillRect(0, y2 - 1.2, W, y1 - y2 + 1.5); 
            }
        }
    }
    
    // --- DRAW ASPHALT ROADBED (only if segment road is actually visible on screen) ---
    if (isVisible) {
        if (isStart) {
            drawCheckeredLine(x1, y1, w1, x2, y2, w2, isAlt);
        } else {
            if (currentLevel === LEVEL_SPACE) {
                // Keep the road base perfectly clean and tight up to the exact edge
                ctx.fillStyle = '#05030d';
                trapezoid(x1 - w1 * 1.01, y1, x1 + w1 * 1.01, x2 - w2 * 1.01, y2, x2 + w2 * 1.01);
            } else if (isBridge) {
                ctx.fillStyle = '#030308';
                trapezoid(x1 - w1 * 1.33, y1, x1 + w1 * 1.33, x2 - w2 * 1.33, y2, x2 + w2 * 1.33);
            } else {
                // Rumble strips
                ctx.fillStyle = isAlt ? '#1d0e31' : '#150924';
                trapezoid(x1 - w1 * 1.18, y1, x1 + w1 * 1.18, x2 - w2 * 1.18, y2, x2 + w2 * 1.18);
            }
            
            ctx.fillStyle = isAlt ? '#15142a' : '#0f1022'; trapezoid(x1 - w1, y1, x1 + w1, x2 - w2, y2, x2 + w2);
            
            // Glowing cyan/magenta edge markings or lateral glowing light bands (Space Wave!)
            if (currentLevel === LEVEL_SPACE) {
                // Draw majestic upright light bands that glow inwards and outwards! (Bigger laser streams)
                const h1 = w1 * 0.16; // Double the height
                const h2 = w2 * 0.16; // Double the height
                
                // Perspective-scaled tube widths (wider/thicker close-up)
                const tw1 = Math.max(3.0, w1 * 0.024);
                const tw2 = Math.max(3.0, w2 * 0.024);
                
                const glowSpan = 0.25; // Wider glowing spread

                // --- LEFT LIGHT BAND (Neon Cyan) ---
                // Outward Glow (to the left)
                ctx.fillStyle = isAlt ? 'rgba(33, 212, 253, 0.45)' : 'rgba(33, 212, 253, 0.22)';
                trapezoid(x1 - w1 - w1 * glowSpan, y1 - h1 * 0.5, x1 - w1, x2 - w2 - w2 * glowSpan, y2 - h2 * 0.5, x2 - w2);
                // Inward Glow (to the right, onto the track)
                ctx.fillStyle = isAlt ? 'rgba(33, 212, 253, 0.55)' : 'rgba(33, 212, 253, 0.28)';
                trapezoid(x1 - w1, y1 - h1 * 0.5, x1 - w1 + w1 * glowSpan, x2 - w2, y2 - h2 * 0.5, x2 - w2 + w2 * glowSpan);
                // Solid bracket base
                ctx.fillStyle = '#08061a';
                trapezoid(x1 - w1 - tw1 - 1, y1, x1 - w1 + 1, x2 - w2 - tw2 - 1, y2, x2 - w2 + 1);
                // Optimized layered glow (No shadowBlur for 300x speedup!)
                // Wide soft bloom
                ctx.fillStyle = 'rgba(33, 212, 253, 0.15)';
                trapezoid(x1 - w1 - tw1 * 3.5, y1 - h1 * 1.1, x1 - w1 + tw1 * 3.5, x2 - w2 - tw2 * 3.5, y2 - h2 * 1.1, x2 - w2 + tw2 * 3.5);
                // Medium bright bloom
                ctx.fillStyle = 'rgba(33, 212, 253, 0.45)';
                trapezoid(x1 - w1 - tw1 * 2.0, y1 - h1 * 1.02, x1 - w1 + tw1 * 2.0, x2 - w2 - tw2 * 2.0, y2 - h2 * 1.02, x2 - w2 + tw2 * 2.0);
                // White hot core
                ctx.fillStyle = '#ffffff';
                trapezoid(x1 - w1 - tw1, y1 - h1, x1 - w1 + tw1, x2 - w2 - tw2, y2 - h2, x2 - w2 + tw2);
 
                // --- RIGHT LIGHT BAND (Neon Magenta) ---
                // Outward Glow (to the right)
                ctx.fillStyle = isAlt ? 'rgba(255, 79, 216, 0.45)' : 'rgba(255, 79, 216, 0.22)';
                trapezoid(x1 + w1, y1 - h1 * 0.5, x1 + w1 + w1 * glowSpan, x2 + w2, y2 - h2 * 0.5, x2 + w2 + w2 * glowSpan);
                // Inward Glow (to the left, onto the track)
                ctx.fillStyle = isAlt ? 'rgba(255, 79, 216, 0.55)' : 'rgba(255, 79, 216, 0.28)';
                trapezoid(x1 + w1 - w1 * glowSpan, y1 - h1 * 0.5, x1 + w1, x2 + w2 - w2 * glowSpan, y2 - h2 * 0.5, x2 + w2);
                // Solid bracket base
                ctx.fillStyle = '#08061a';
                trapezoid(x1 + w1 - 1, y1, x1 + w1 + tw1 + 1, x2 + w2 - 1, y2, x2 + w2 + tw2 + 1);
                // Optimized layered glow (No shadowBlur for 300x speedup!)
                // Wide soft bloom
                ctx.fillStyle = 'rgba(255, 79, 216, 0.15)';
                trapezoid(x1 + w1 - tw1 * 3.5, y1 - h1 * 1.1, x1 + w1 + tw1 * 3.5, x2 + w2 - tw2 * 3.5, y2 - h2 * 1.1, x2 + w2 + tw2 * 3.5);

                let panelSide = null;
                let panelOffset = -1;
                for (let pIdx = 0; pIdx < panelStarts.length; pIdx++) {
                    const start = panelStarts[pIdx];
                    if (segIdx >= start && segIdx < start + panelLength) {

                        panelOffset = segIdx - start;

                    }

function drawCoralSpireSprite(sx, sy, sc) {
  const h = Math.max(10, ~~(sc * 200));

  // Base coral branches

  ctx.quadraticCurveTo(5 * sc, -h * 0.85, 10 * sc, -h * 1.05); // another fork
  ctx.lineTo(16 * sc, -h * 1.05);
  ctx.quadraticCurveTo(12 * sc, -h * 0.7, 0, -h * 0.4);

  ctx.shadowColor = '#00ffd2';
  ctx.shadowBlur = 12 * sc;
  
  const polyps = [
    {x: -24 * sc, y: -h * 0.45},
    {x: -16 * sc, y: -h * 0.75},

function drawTubeSpongeSprite(sx, sy, sc) {
  ctx.save(); ctx.translate(sx, sy); ctx.scale(sc, sc);
  ctx.fillStyle = '#394848';
  ctx.beginPath(); ctx.ellipse(0, -3, 54, 12, 0, 0, Math.PI * 2); ctx.fill();
  for (const [x, height, radius] of [[-31, 69, 13], [26, 86, 15], [-3, 122, 17]]) {
    const body = ctx.createLinearGradient(x - radius, 0, x + radius, 0);
    body.addColorStop(0, '#986a28'); body.addColorStop(0.5, '#efbf57'); body.addColorStop(1, '#b88232');
    ctx.fillStyle = body;
    ctx.beginPath(); ctx.moveTo(x - radius * 0.8, -5);
    ctx.quadraticCurveTo(x - radius * 1.25, -height * 0.5, x - radius, -height);
    ctx.lineTo(x + radius, -height);
    ctx.quadraticCurveTo(x + radius * 1.25, -height * 0.5, x + radius * 0.8, -5);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#f9d984';
    ctx.beginPath(); ctx.ellipse(x, -height, radius, radius * 0.35, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#304250';
    ctx.beginPath(); ctx.ellipse(x, -height, radius * 0.62, radius * 0.22, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#956931';
    for (let pore = 0; pore < 7; pore++) {
      const px = x + Math.sin(pore * 2.4) * radius * 0.55;
      const py = -15 - pore * (height - 28) / 7;
      ctx.beginPath(); ctx.ellipse(px, py, 2, 3, 0, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.restore();
}

// --- DREAM ODYSSEY DEEP SEA FAUNA -------------------------------------------------
// All of these are drawn facing left (the direction the backdrop scrolls) and
// take a scale so the same sprite works as a distant silhouette or a close pass.

const TROPICAL_FISH_PALETTES = [
  { body: '#ffcc22', fin: '#ff7a00', stripe: '#1a1a2e' }, // butterflyfish
  { body: '#ff6b35', fin: '#ffffff', stripe: '#ffffff' }, // clownfish
  { body: '#2b8cff', fin: '#ffe066', stripe: '#0a2a5e' }, // regal tang
  { body: '#8f5cff', fin: '#00ffd2', stripe: '#2a0f52' }, // anthias
  { body: '#00e0a0', fin: '#ffe066', stripe: '#04503a' }  // parrotfish
];

function drawTropicalFish(x, y, sc, ts, idx) {
  const pal = TROPICAL_FISH_PALETTES[idx % TROPICAL_FISH_PALETTES.length];
  const wag = Math.sin(ts * 0.008 + idx * 1.7);
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(sc, sc);

  // Tail, hinged so it flicks
  ctx.save();
  ctx.translate(9, 0);
  ctx.rotate(wag * 0.5);
  ctx.fillStyle = pal.fin;
  ctx.beginPath();
  ctx.moveTo(0, 0); ctx.lineTo(9, -6); ctx.lineTo(7, 0); ctx.lineTo(9, 6);
  ctx.closePath(); ctx.fill();
  ctx.restore();

  // Dorsal + ventral fins
  ctx.fillStyle = pal.fin;
  ctx.beginPath(); ctx.moveTo(2, -5); ctx.lineTo(-2, -11); ctx.lineTo(-5, -4); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(1, 5); ctx.lineTo(-2, 10); ctx.lineTo(-4, 4); ctx.closePath(); ctx.fill();

  // Body
  ctx.fillStyle = pal.body;
  ctx.beginPath(); ctx.ellipse(0, 0, 10, 6, 0, 0, Math.PI * 2); ctx.fill();

  // Vertical stripes
  ctx.fillStyle = pal.stripe;
  ctx.globalAlpha = 0.85;
  for (let s = -1; s <= 1; s++) {
    ctx.beginPath();
    ctx.ellipse(s * 4.5 - 1, 0, 1.3, 5.4 - Math.abs(s) * 1.4, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Eye
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(-6, -1.5, 2, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#0a0a12';
  ctx.beginPath(); ctx.arc(-6.6, -1.5, 1, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

// A loose shoal: same fish repeated in a staggered formation, each on its own
// phase so the school ripples instead of moving as one rigid block.
function drawFishSchool(x, y, sc, ts, seed, count) {
  for (let i = 0; i < count; i++) {
    const a = seed * 2.3 + i * 1.9;
    const ox = Math.cos(a) * 46 + i * 13;
    const oy = Math.sin(a * 1.4) * 26 + Math.sin(ts * 0.002 + i) * 5;
    drawTropicalFish(x + ox * sc, y + oy * sc, sc * (0.65 + (i % 3) * 0.16), ts, seed + i);
  }
}

function drawSeaSerpent(x, y, sc, ts) {
  const SEGS = 26;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(sc, sc);

  const px = i => i * 15;
  const py = i => Math.sin(ts * 0.0016 + i * 0.42) * 22;

  // Dorsal frill, drawn first so the body overlaps its base
  ctx.fillStyle = 'rgba(120, 255, 120, 0.5)';
  ctx.beginPath();
  ctx.moveTo(px(0), py(0));
  for (let i = 0; i < SEGS; i++) ctx.lineTo(px(i), py(i) - (16 - i * 0.45));
  for (let i = SEGS - 1; i >= 0; i--) ctx.lineTo(px(i), py(i));
  ctx.closePath(); ctx.fill();

  // Body, tapering to the tail
  for (let i = SEGS - 1; i >= 0; i--) {
    const r = Math.max(1.5, 13 - i * 0.42);
    const shade = i / SEGS;
    ctx.fillStyle = interpolateColor('#2fbf5c', '#0d5c34', shade);
    ctx.beginPath(); ctx.arc(px(i), py(i), r, 0, Math.PI * 2); ctx.fill();
    // Bioluminescent spots along the flank
    if (i % 3 === 0) {
      ctx.fillStyle = 'rgba(180, 255, 210, 0.75)';
      ctx.beginPath(); ctx.arc(px(i), py(i) - r * 0.35, Math.max(0.8, r * 0.22), 0, Math.PI * 2); ctx.fill();
    }
  }

  // Head
  const hx = px(0), hy = py(0);
  ctx.fillStyle = '#39d768';
  ctx.beginPath(); ctx.ellipse(hx - 8, hy, 16, 11, 0, 0, Math.PI * 2); ctx.fill();
  // Jaw
  ctx.fillStyle = '#1f8f47';
  ctx.beginPath();
  ctx.moveTo(hx - 22, hy + 2); ctx.lineTo(hx - 4, hy + 4); ctx.lineTo(hx - 6, hy + 9);
  ctx.closePath(); ctx.fill();
  // Eye
  ctx.fillStyle = '#ffe066';
  ctx.beginPath(); ctx.arc(hx - 13, hy - 3, 3.4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#0a0a12';
  ctx.beginPath(); ctx.ellipse(hx - 13.6, hy - 3, 1.1, 3, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawSquid(x, y, sc, ts) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(sc, sc);
  const pulse = Math.sin(ts * 0.004);

  // Arms trailing behind the mantle
  ctx.strokeStyle = '#c2306f';
  ctx.lineCap = 'round';
  for (let a = -4; a <= 4; a++) {
    ctx.lineWidth = 3.2 - Math.abs(a) * 0.3;
    ctx.beginPath();
    ctx.moveTo(14, a * 2.2);
    ctx.bezierCurveTo(
      26, a * 3.6 + pulse * 4,
      38, a * 5.2 - pulse * 5,
      50 + Math.abs(a), a * 7 + Math.sin(ts * 0.005 + a) * 6
    );
    ctx.stroke();
  }
  // Two long hunting tentacles with paddles
  ctx.strokeStyle = '#e0508f';
  ctx.lineWidth = 2.2;
  for (const s of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(14, s * 4);
    ctx.bezierCurveTo(34, s * 8 + pulse * 6, 54, s * 4 - pulse * 8, 70, s * 12);
    ctx.stroke();
    ctx.fillStyle = '#ff7ab8';
    ctx.beginPath(); ctx.ellipse(70, s * 12, 5, 2.6, s * 0.5, 0, Math.PI * 2); ctx.fill();
  }

  // Mantle
  ctx.fillStyle = '#e0508f';
  ctx.beginPath();
  ctx.moveTo(-34, 0);
  ctx.quadraticCurveTo(-6, -13, 16, -7);
  ctx.lineTo(16, 7);
  ctx.quadraticCurveTo(-6, 13, -34, 0);
  ctx.closePath(); ctx.fill();

  // Swimming fins at the tip
  ctx.fillStyle = 'rgba(255, 150, 200, 0.85)';
  ctx.beginPath();
  ctx.moveTo(-30, -2);
  ctx.quadraticCurveTo(-44, -14 + pulse * 3, -50, -2);
  ctx.quadraticCurveTo(-44, 10 + pulse * 3, -30, 2);
  ctx.closePath(); ctx.fill();

  // Big squid eye
  ctx.fillStyle = '#ffe9a8';
  ctx.beginPath(); ctx.arc(8, -1, 5.4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#12060f';
  ctx.beginPath(); ctx.arc(6.6, -1, 2.6, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawReefShark(x, y, sc, ts) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(sc, sc);
  const sweep = Math.sin(ts * 0.0035);

  // A broad tail root overlaps the body, even at either extreme of the sweep.
  ctx.save();
  ctx.translate(28, 0);
  ctx.rotate(sweep * 0.23);
  const tailShade = ctx.createLinearGradient(0, -20, 0, 17);
  tailShade.addColorStop(0, '#6d869b'); tailShade.addColorStop(1, '#496477');
  ctx.fillStyle = tailShade;
  ctx.beginPath();
  ctx.moveTo(-5, -5);
  ctx.quadraticCurveTo(9, -5, 15, -11);
  ctx.quadraticCurveTo(23, -19, 29, -25);
  ctx.quadraticCurveTo(28, -11, 22, -2);
  ctx.quadraticCurveTo(24, 7, 28, 17);
  ctx.quadraticCurveTo(16, 13, 12, 6);
  ctx.quadraticCurveTo(5, 4, -5, 5);
  ctx.closePath(); ctx.fill();
  ctx.restore();

  // Body
  ctx.fillStyle = '#6d869b';
  ctx.beginPath();
  ctx.moveTo(-40, 0);
  ctx.bezierCurveTo(-24, -14, 1, -16, 22, -7);
  ctx.quadraticCurveTo(29, -4, 35, -3.5);
  ctx.lineTo(35, 3.5);
  ctx.bezierCurveTo(21, 7, 1, 14, -17, 8);
  ctx.quadraticCurveTo(-14, 12, -40, 0);
  ctx.closePath(); ctx.fill();

  // Pale underside
  ctx.fillStyle = '#c7d4dd';
  ctx.beginPath();
  ctx.moveTo(-34, 4);
  ctx.quadraticCurveTo(-8, 11, 30, 4.5);
  ctx.quadraticCurveTo(-8, 7, -34, 4);
  ctx.closePath(); ctx.fill();

  // Dorsal + pectoral fins
  ctx.fillStyle = '#5a7183';
  ctx.beginPath(); ctx.moveTo(2, -8); ctx.lineTo(10, -26); ctx.lineTo(16, -6); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-6, 5); ctx.lineTo(-2, 20); ctx.lineTo(10, 7); ctx.closePath(); ctx.fill();

  // Gills
  ctx.strokeStyle = 'rgba(30, 45, 60, 0.55)';
  ctx.lineWidth = 1.2;
  for (let g = 0; g < 5; g++) {
    ctx.beginPath();
    ctx.moveTo(-20 + g * 3.4, -5); ctx.lineTo(-21 + g * 3.4, 3);
    ctx.stroke();
  }

  // Eye and mouth
  ctx.fillStyle = '#0d1219';
  ctx.beginPath(); ctx.arc(-29, -2.5, 2.1, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(20, 30, 40, 0.7)';
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(-40, 3); ctx.quadraticCurveTo(-33, 6.5, -25, 5.5);
  ctx.stroke();
  ctx.restore();
}

function drawWhale(x, y, sc, ts) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(sc, sc);
  const glide = Math.sin(ts * 0.0012);

  // Fluke
  ctx.save();
  ctx.translate(72, 0);
  ctx.rotate(glide * 0.2);
  ctx.fillStyle = '#2c4a63';
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(22, -10, 40, -26);
  ctx.quadraticCurveTo(24, -8, 20, 0);
  ctx.quadraticCurveTo(24, 8, 40, 26);
  ctx.quadraticCurveTo(22, 10, 0, 0);
  ctx.closePath(); ctx.fill();
  ctx.restore();

  // Body
  ctx.fillStyle = '#38617f';
  ctx.beginPath();
  ctx.moveTo(-86, 4);
  ctx.quadraticCurveTo(-58, -34, 6, -30);
  ctx.quadraticCurveTo(58, -26, 74, -4);
  ctx.lineTo(74, 5);
  ctx.quadraticCurveTo(50, 26, -10, 30);
  ctx.quadraticCurveTo(-62, 30, -86, 4);
  ctx.closePath(); ctx.fill();

  // Pale belly with ventral grooves
  ctx.fillStyle = '#9fc0d2';
  ctx.beginPath();
  ctx.moveTo(-78, 8);
  ctx.quadraticCurveTo(-40, 28, -6, 27);
  ctx.quadraticCurveTo(40, 24, 66, 5);
  ctx.quadraticCurveTo(30, 14, -20, 14);
  ctx.quadraticCurveTo(-56, 14, -78, 8);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(45, 85, 110, 0.5)';
  ctx.lineWidth = 1.3;
  for (let g = 0; g < 7; g++) {
    ctx.beginPath();
    ctx.moveTo(-72 + g * 9, 10 + g * 0.7);
    ctx.quadraticCurveTo(-64 + g * 9, 20, -58 + g * 9, 25);
    ctx.stroke();
  }

  // Pectoral flipper
  ctx.fillStyle = '#2c4a63';
  ctx.save();
  ctx.translate(-24, 18);
  ctx.rotate(0.5 + glide * 0.18);
  ctx.beginPath(); ctx.ellipse(12, 0, 26, 7, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  // Eye and jawline
  ctx.fillStyle = '#0c1a24';
  ctx.beginPath(); ctx.arc(-64, 2, 3.2, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(20, 40, 55, 0.6)';
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  ctx.moveTo(-86, 6); ctx.quadraticCurveTo(-70, 12, -50, 13);
  ctx.stroke();
  ctx.restore();
}

function drawSputnik(x, y, ts) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(-40 * Math.PI / 180); // Tilt Sputnik by 40 degrees counter-clockwise
  
  // Define antennas: angles and lengths
  // Grouped in two pairs, starting from the surface of the sphere
  const rSphere = 11;
  const antennas = [
    { angle: Math.PI * 1.05, len: 54, socketColor: '#5a697f' },
    { angle: Math.PI * 1.10, len: 54, socketColor: '#5a697f' },
    { angle: Math.PI * 1.34, len: 54, socketColor: '#4e5b6e' },
    { angle: Math.PI * 1.39, len: 54, socketColor: '#4e5b6e' }
  ];

  for (let ant of antennas) {
    const cos = Math.cos(ant.angle);
    const sin = Math.sin(ant.angle);

    // 1. Draw mounting bracket sleeve (socket)
    ctx.strokeStyle = ant.socketColor;
    ctx.lineWidth = 2.8;
    ctx.beginPath();
    ctx.moveTo(cos * (rSphere - 1), sin * (rSphere - 1));
    ctx.lineTo(cos * (rSphere + 3.5), sin * (rSphere + 3.5));
    ctx.stroke();

    // 2. Draw the thin whip antenna extending outwards
    ctx.strokeStyle = '#c4ccd9';
    ctx.lineWidth = 1.0;
    ctx.beginPath();
    ctx.moveTo(cos * (rSphere + 3.5), sin * (rSphere + 3.5));
    ctx.lineTo(cos * (rSphere + ant.len), sin * (rSphere + ant.len));
    ctx.stroke();
    
    // Tiny tip of the antenna
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(cos * (rSphere + ant.len), sin * (rSphere + ant.len), 0.8, 0, Math.PI * 2);
    ctx.fill();
  }

  // Main Body Sphere with metallic satin gradient shading
  const grad = ctx.createRadialGradient(-3.5, -3.5, 1, 0, 0, rSphere);
  grad.addColorStop(0, '#ffffff');
  grad.addColorStop(0.35, '#a6b5c9');
  grad.addColorStop(0.75, '#5c6d84');
  grad.addColorStop(1, '#252f3d');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(0, 0, rSphere, 0, Math.PI * 2);
  ctx.fill();

  // Subtle metallic surface shine/seam across the middle (horizontal equator weld line)
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
  ctx.lineWidth = 0.8;
  ctx.beginPath();
  ctx.ellipse(0, 0, rSphere, rSphere * 0.25, -Math.PI * 0.15, 0, Math.PI * 2);
  ctx.stroke();

  // Blinking red transmitter light: off-centered, smaller, and less overwhelming
  const isLit = Math.floor(ts * 0.0018) % 2 === 0; // slower, more realistic beacon pulse
  if (isLit) {
    // Off-centered coordinates (placed beautifully on the front-right hemisphere)
    const lx = 4.0;
    const ly = 2.5;
    
    // Soft ambient glow
    ctx.fillStyle = 'rgba(255, 0, 85, 0.35)';
    ctx.beginPath();
    ctx.arc(lx, ly, 3.5, 0, Math.PI * 2);
    ctx.fill();
    
    // Intense core (smaller, 1.2px)
    ctx.fillStyle = '#ff3366';
    ctx.beginPath();
    ctx.arc(lx, ly, 1.2, 0, Math.PI * 2);
    ctx.fill();
  }
  
  ctx.restore();
}

function drawEarth(x, y, r, ts) {
  ctx.save();
  ctx.translate(x, y);

  // 1. Draw atmosphere outer corona glow
  const coronaGrad = ctx.createRadialGradient(0, 0, r * 0.9, 0, 0, r * 1.35);
  coronaGrad.addColorStop(0, 'rgba(0, 190, 255, 0.4)');
  coronaGrad.addColorStop(0.5, 'rgba(0, 140, 255, 0.15)');
  coronaGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = coronaGrad;
  ctx.beginPath();
  ctx.arc(0, 0, r * 1.35, 0, Math.PI * 2);
  ctx.fill();

  // 2. Base deep space back shadow (solid backing circle)
  ctx.fillStyle = '#05091a';
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fill();

  // 3. Create a clipping mask of Earth's sphere for rendering rotating contents
  ctx.save();
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.clip();

  // 3a. Deep ocean background gradient
  const oceanGrad = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.1, 0, 0, r);
  oceanGrad.addColorStop(0, '#1c88ff'); // bright royal blue ocean highlight
  oceanGrad.addColorStop(0.5, '#0c52eb'); // rich blue ocean body
  oceanGrad.addColorStop(1, '#02184a'); // deep shadowed navy ocean
  ctx.fillStyle = oceanGrad;
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fill();

  // 3b. Continents with continuous wrap-around rotation (Slowed down to 20% of original speed)
  const drift = (ts * 0.0024) % (r * 6.0);
  ctx.save();
  ctx.translate(-drift, 0);
  
  for (let cycle = 0; cycle <= 2; cycle++) {
    const ox = cycle * r * 3.0; // horizontal wrap distance

    // Americas-like landmass
    ctx.fillStyle = '#22c55e'; // emerald green
    ctx.beginPath();
    ctx.moveTo(ox - r * 0.8, -r * 0.6);
    ctx.bezierCurveTo(ox - r * 0.3, -r * 0.7, ox + r * 0.2, -r * 0.3, ox + r * 0.1, r * 0.1);
    ctx.bezierCurveTo(ox + r * 0.5, r * 0.3, ox - r * 0.1, r * 0.8, ox - r * 0.5, r * 0.5);
    ctx.bezierCurveTo(ox - r * 0.7, r * 0.2, ox - r * 1.1, -r * 0.2, ox - r * 0.8, -r * 0.6);
    ctx.closePath();
    ctx.fill();

    // Mountain/elevated terrain accent
    ctx.fillStyle = '#82a03c'; // olive/yellow-green
    ctx.beginPath();
    ctx.moveTo(ox - r * 0.4, -r * 0.4);
    ctx.lineTo(ox - r * 0.1, -r * 0.3);
    ctx.lineTo(ox - r * 0.2, 0);
    ctx.closePath();
    ctx.fill();

    // Europe & Africa-like landmass
    ctx.fillStyle = '#10b981'; // minty emerald green
    ctx.beginPath();
    ctx.moveTo(ox + r * 0.8, -r * 0.7);
    ctx.bezierCurveTo(ox + r * 1.4, -r * 0.5, ox + r * 1.5, r * 0.1, ox + r * 1.2, r * 0.4);
    ctx.bezierCurveTo(ox + r * 0.9, r * 0.8, ox + r * 0.6, r * 0.2, ox + r * 0.5, -r * 0.1);
    ctx.bezierCurveTo(ox + r * 0.4, -r * 0.4, ox + r * 0.6, -r * 0.6, ox + r * 0.8, -r * 0.7);
    ctx.closePath();
    ctx.fill();
    
    // Sandy dry desert region (Sahara)
    ctx.fillStyle = '#d4af37'; // gold
    ctx.beginPath();
    ctx.moveTo(ox + r * 0.8, -r * 0.4);
    ctx.bezierCurveTo(ox + r * 1.1, -r * 0.3, ox + r * 1.2, -r * 0.1, ox + r * 1.0, 0);
    ctx.closePath();
    ctx.fill();

    // Greenland/Arctic cold north ice cap
    ctx.fillStyle = '#f3f4f6'; // soft white
    ctx.beginPath();
    ctx.ellipse(ox + r * 0.2, -r * 0.85, r * 0.5, r * 0.15, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();

  // 3c. Atmospheric swirling clouds (drifting at slightly faster rate for dynamic parallax - slowed to 20% speed)
  const cloudDrift = (ts * 0.0036) % (r * 6.0);
  ctx.save();
  ctx.translate(-cloudDrift, 0);
  ctx.fillStyle = 'rgba(255, 255, 255, 0.52)';
  
  for (let cycle = 0; cycle <= 2; cycle++) {
    const ox = cycle * r * 3.0;
    
    // Cloud Band 1 (Northern Hemisphere swirl)
    ctx.beginPath();
    ctx.moveTo(ox - r * 1.2, -r * 0.35);
    ctx.bezierCurveTo(ox - r * 0.6, -r * 0.55, ox + r * 0.3, -r * 0.25, ox + r * 0.8, -r * 0.45);
    ctx.bezierCurveTo(ox + r * 0.5, -r * 0.15, ox - r * 0.2, -r * 0.15, ox - r * 1.0, -r * 0.25);
    ctx.closePath();
    ctx.fill();

    // Cloud Band 2 (Southern Hemisphere swirl)
    ctx.beginPath();
    ctx.moveTo(ox - r * 0.3, r * 0.35);
    ctx.bezierCurveTo(ox + r * 0.4, r * 0.55, ox + r * 1.1, r * 0.25, ox + r * 1.4, r * 0.45);
    ctx.bezierCurveTo(ox + r * 0.9, r * 0.75, ox + r * 0.1, r * 0.65, ox - r * 0.3, r * 0.45);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();

  ctx.restore(); // end of sphere clipping

  // 4. Shading terminator (3D spherical volume overlay)
  const shadowGrad = ctx.createLinearGradient(-r * 0.5, -r * 0.5, r * 0.8, r * 0.8);
  shadowGrad.addColorStop(0, 'rgba(0, 0, 0, 0)');
  shadowGrad.addColorStop(0.5, 'rgba(1, 8, 30, 0.15)');
  shadowGrad.addColorStop(1, 'rgba(0, 3, 15, 0.86)');
  ctx.fillStyle = shadowGrad;
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fill();

  // 5. Cinematic inner rim/atmospheric edge glow (cyan/blue)
  const rimGrad = ctx.createRadialGradient(0, 0, r * 0.84, 0, 0, r);
  rimGrad.addColorStop(0, 'rgba(120, 230, 255, 0)');
  rimGrad.addColorStop(0.5, 'rgba(120, 230, 255, 0.2)');
  rimGrad.addColorStop(1, 'rgba(100, 220, 255, 0.6)');
  ctx.fillStyle = rimGrad;
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function drawSpiralGalaxy(x, y, r, ts) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(-22 * Math.PI / 180); // Tilt the galaxy disk elegantly
  
  // 1. Draw background galactic haze / ambient glow
  const hazeGrad = ctx.createRadialGradient(0, 0, r * 0.1, 0, 0, r * 1.25);
  hazeGrad.addColorStop(0, 'rgba(130, 0, 190, 0.24)'); // deep violet core glow
  hazeGrad.addColorStop(0.4, 'rgba(0, 95, 210, 0.08)'); // cyan haze
  hazeGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = hazeGrad;
  ctx.beginPath();
  ctx.arc(0, 0, r * 1.25, 0, Math.PI * 2);
  ctx.fill();

  // 2. Slow majestic galactic rotation over time
  const rot = ts * 0.00005;

  // 3. Draw logarithmic spiral arms (2 main arms, tilted disk)
  const steps = 30;
  const numArms = 2;
  
  for (let arm = 0; arm < numArms; arm++) {
    const armOffset = arm * Math.PI;
    for (let i = 0; i < steps; i++) {
      // theta goes from 0 (core) to 2.2 * Math.PI (outer rim)
      const t = (i / steps) * 2.2 * Math.PI;
      const factor = i / steps; // 0 to 1
      
      // Logarithmic spiral distance scaling
      const dist = (0.12 + 0.88 * Math.pow(factor, 1.25)) * r;
      const angle = t + armOffset + rot;
      
      // Calculate coordinates (squashed vertically by 0.35 for stunning tilted aspect ratio)
      const gx = Math.cos(angle) * dist;
      const gy = Math.sin(angle) * dist * 0.35;
      
      // Wide soft gas cloud (magenta / violet)
      ctx.fillStyle = `rgba(230, 0, 255, ${0.10 * (1 - factor * 0.7)})`;
      ctx.beginPath();
      ctx.arc(gx, gy, r * (0.28 - factor * 0.18), 0, Math.PI * 2);
      ctx.fill();

      // Glowing star cluster nodes (cyan / blue)
      ctx.fillStyle = `rgba(0, 240, 255, ${0.21 * (1 - factor * 0.5)})`;
      ctx.beginPath();
      ctx.arc(gx, gy, r * (0.12 - factor * 0.07), 0, Math.PI * 2);
      ctx.fill();
      
      // Tiny hot-white star core dots
      if (i % 2 === 0) {
        ctx.fillStyle = `rgba(255, 255, 255, ${0.85 * (1 - factor * 0.4)})`;
        ctx.beginPath();
        ctx.arc(gx, gy, Math.max(0.6, 1.5 * (1 - factor * 0.6)), 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  // 4. Draw bright galaxy core
  const coreGrad = ctx.createRadialGradient(0, 0, 1, 0, 0, r * 0.24);
  coreGrad.addColorStop(0, '#ffffff'); // pure white-hot center
  coreGrad.addColorStop(0.2, '#ffe3b5'); // warm starburst glow
  coreGrad.addColorStop(0.5, 'rgba(255, 45, 145, 0.55)'); // hot pink/red transition
  coreGrad.addColorStop(1, 'rgba(70, 0, 190, 0)');
  ctx.fillStyle = coreGrad;
  ctx.save();
  ctx.scale(1.0, 0.42); // squash core to match the disk tilt
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.24, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  ctx.restore();
}

function getShip1Pos(t, centerX, centerY) {
  // Give them more space to roam around smoothly with larger Lissajous orbits
  const x = centerX + Math.cos(t * 0.55) * 165 + Math.sin(t * 1.1) * 45;
  const y = centerY + Math.sin(t * 1.3) * 70 + Math.cos(t * 0.4) * 20;
  return { x, y };
}

function getShip2Pos(t, centerX, centerY) {
  // Base chasing trajectory for Ship 2
  const base_x = centerX + Math.cos(t * 0.55 - 0.9) * 165 + Math.sin(t * 1.1 - 0.9) * 45 - Math.cos(t * 0.28) * 65;
  const base_y = centerY + Math.sin(t * 1.3 - 0.9) * 70 + Math.cos(t * 0.4 - 0.9) * 20 - Math.sin(t * 0.28) * 35;
  
  const s1 = getShip1Pos(t, centerX, centerY);
  let dx = base_x - s1.x;
  let dy = base_y - s1.y;
  let dist = Math.sqrt(dx * dx + dy * dy);
  
  // Strictly enforce a minimum distance of 85px to NEVER let them overlap!
  const minDist = 85;
  if (dist < minDist) {
    if (dist < 1) { dx = 1; dy = 0; dist = 1; }
    const push = minDist - dist;
    const px = (dx / dist) * push;
    const py = (dy / dist) * push;
    return { x: base_x + px, y: base_y + py };
  }
  return { x: base_x, y: base_y };
}

function drawLaserBolt(fromX, fromY, toX, toY, progress, isCyan) {
  // Projectiles disappear/fade out after traveling some distance (reaches 0.85)
  if (progress < 0 || progress > 0.85) return;
  
  const px = fromX + (toX - fromX) * progress;
  const py = fromY + (toY - fromY) * progress;
  const pAngle = Math.atan2(toY - fromY, toX - fromX);
  
  ctx.save();
  ctx.translate(px, py);
  ctx.rotate(pAngle);
  
  // Fade out elegantly near the end
  const alpha = progress < 0.6 ? 1.0 : (0.85 - progress) / 0.25;
  ctx.globalAlpha = alpha;
  
  // Shiny glowing double-layer laser design
  ctx.shadowBlur = 24; // Triple-strength bright neon glow
  if (isCyan) {
    ctx.strokeStyle = '#00ffff';
    ctx.shadowColor = '#00f0ff';
    ctx.lineWidth = 4.2;
    ctx.beginPath();
    ctx.moveTo(-11, 0);
    ctx.lineTo(11, 0);
    ctx.stroke();
    
    // Core white hot ray
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-9, 0);
    ctx.lineTo(9, 0);
    ctx.stroke();
  } else {
    ctx.strokeStyle = '#ff0055';
    ctx.shadowColor = '#ff0055';
    ctx.lineWidth = 4.2;
    ctx.beginPath();
    ctx.moveTo(-11, 0);
    ctx.lineTo(11, 0);
    ctx.stroke();
    
    // Core white hot ray
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-9, 0);
    ctx.lineTo(9, 0);
    ctx.stroke();
  }
  ctx.restore();
}

function drawSpaceDogfight(ts, centerX, centerY) {
  const t = ts * 0.001; // Time in seconds

  // Get precise smooth positions for both ships
  const s1 = getShip1Pos(t, centerX, centerY);
  const s2 = getShip2Pos(t, centerX, centerY);

  // Derive exact heading orientations using forward derivatives
  const dt_val = 0.04;
  const s1_next = getShip1Pos(t + dt_val, centerX, centerY);
  const angle1 = Math.atan2(s1_next.y - s1.y, s1_next.x - s1.x);

  const s2_next = getShip2Pos(t + dt_val, centerX, centerY);
  const angle2 = Math.atan2(s2_next.y - s2.y, s2_next.x - s2.x);

  // --- LASER PROJECTILE SYSTEM ---
  // Burst cycles of 4 seconds:
  // Phase 1 (0.0 to 1.5s): Ship 1 (Cyan) fires rapid-fire bursts
  // Phase 2 (2.0 to 3.5s): Ship 2 (Red) fires rapid-fire bursts
  const Cycle = 4.0;
  const cycleIndex = Math.floor(t / Cycle);
  const t_cycle = t % Cycle;
  const travelDuration = 0.55; // flight speed

  // Ship 1 (Cyan) rapid laser projectile burst (fires 3 times)
  const fireTimes1 = [0.25, 0.60, 0.95];
  for (let i = 0; i < 3; i++) {
    const t_fire = cycleIndex * Cycle + fireTimes1[i];
    if (t >= t_fire && t < t_fire + travelDuration) {
      const u = (t - t_fire) / travelDuration;
      
      // Sample positions and headings at the EXACT instant of firing
      const shooterPos = getShip1Pos(t_fire, centerX, centerY);
      const targetPos = getShip2Pos(t_fire, centerX, centerY);
      const sAngle = Math.atan2(getShip1Pos(t_fire + dt_val, centerX, centerY).y - shooterPos.y, getShip1Pos(t_fire + dt_val, centerX, centerY).x - shooterPos.x);
      
      // Dual wingtip fire origins (scaled by 0.75 for ship scale)
      const wL1x = shooterPos.x - 7.5 * Math.cos(sAngle) + 9.75 * Math.sin(sAngle);
      const wL1y = shooterPos.y - 7.5 * Math.sin(sAngle) - 9.75 * Math.cos(sAngle);
      const wR1x = shooterPos.x - 7.5 * Math.cos(sAngle) - 9.75 * Math.sin(sAngle);
      const wR1y = shooterPos.y - 7.5 * Math.sin(sAngle) + 9.75 * Math.cos(sAngle);
      
      drawLaserBolt(wL1x, wL1y, targetPos.x, targetPos.y, u, true);
      drawLaserBolt(wR1x, wR1y, targetPos.x, targetPos.y, u, true);
    }
  }

  // Ship 2 (Red) rapid laser projectile burst (fires 3 times)
  const fireTimes2 = [2.25, 2.60, 2.95];
  for (let i = 0; i < 3; i++) {
    const t_fire = cycleIndex * Cycle + fireTimes2[i];
    if (t >= t_fire && t < t_fire + travelDuration) {
      const u = (t - t_fire) / travelDuration;
      
      // Sample positions and headings at the EXACT instant of firing
      const shooterPos = getShip2Pos(t_fire, centerX, centerY);
      const targetPos = getShip1Pos(t_fire, centerX, centerY);
      const sAngle = Math.atan2(getShip2Pos(t_fire + dt_val, centerX, centerY).y - shooterPos.y, getShip2Pos(t_fire + dt_val, centerX, centerY).x - shooterPos.x);
      
      // Dual wingtip fire origins (scaled by 0.75 for ship scale)
      const wL2x = shooterPos.x - 9.0 * Math.cos(sAngle) + 13.5 * Math.sin(sAngle);
      const wL2y = shooterPos.y - 9.0 * Math.sin(sAngle) - 13.5 * Math.cos(sAngle);
      const wR2x = shooterPos.x - 9.0 * Math.cos(sAngle) - 13.5 * Math.sin(sAngle);
      const wR2y = shooterPos.y - 9.0 * Math.sin(sAngle) + 13.5 * Math.cos(sAngle);
      
      drawLaserBolt(wL2x, wL2y, targetPos.x, targetPos.y, u, false);
      drawLaserBolt(wR2x, wR2y, targetPos.x, targetPos.y, u, false);
    }
  }

  // --- DRAW SHIP 1: CYAN FAST INTERCEPTOR (Crisp, Sleek, 25% Smaller) ---
  ctx.save();
  ctx.translate(s1.x, s1.y);
  ctx.rotate(angle1);
  ctx.scale(0.75, 0.75); // Scaled down slightly to look incredibly detailed and fast
  
  // Glowing blue engine and wing-tips bloom
  ctx.shadowColor = '#00ffff'; ctx.shadowBlur = 12;
  
  // Wings (sleek double-layered design)
  ctx.fillStyle = '#0099b2';
  ctx.beginPath();
  ctx.moveTo(-16, -5);
  ctx.lineTo(-24, -20);
  ctx.lineTo(-8, -4);
  ctx.closePath();
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(-16, 5);
  ctx.lineTo(-24, 20);
  ctx.lineTo(-8, 4);
  ctx.closePath();
  ctx.fill();

  // Wing panels/weapons
  ctx.fillStyle = '#00f0ff';
  ctx.fillRect(-12, -18, 5, 2);
  ctx.fillRect(-12, 16, 5, 2);

  // Main Fuselage (polished spacecraft frame)
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.moveTo(25, 0);       // Sleek long nose cone
  ctx.lineTo(-16, -8);     // Rear left corner
  ctx.lineTo(-7, 0);       // Engine recess center
  ctx.lineTo(-16, 8);      // Rear right corner
  ctx.closePath();
  ctx.fill();

  // Cockpit canopy (neon cyber blue shield glass)
  ctx.fillStyle = '#00ffff';
  ctx.beginPath();
  ctx.moveTo(10, 0);
  ctx.lineTo(-3, -4);
  ctx.lineTo(-3, 4);
  ctx.closePath();
  ctx.fill();

  // Engine exhaust nozzle and glowing plume
  ctx.fillStyle = '#ffffff';
  const engineWiggle = Math.sin(ts * 0.05) * 4;
  ctx.beginPath();
  ctx.moveTo(-7, -3);
  ctx.lineTo(-26 - engineWiggle, 0);
  ctx.lineTo(-7, 3);
  ctx.closePath();
  ctx.fill();
  
  ctx.restore();

  // --- DRAW SHIP 2: RED MENACING FIGHTER (Crisp, Armored, 25% Smaller) ---
  ctx.save();
  ctx.translate(s2.x, s2.y);
  ctx.rotate(angle2);
  ctx.scale(0.75, 0.75); // Scaled down slightly to look compact and aggressive

  // Glowing red aura
  ctx.shadowColor = '#ff0055'; ctx.shadowBlur = 12;

  // Armored swept-forward combat wings
  ctx.fillStyle = '#aa0033';
  ctx.beginPath();
  ctx.moveTo(-10, -5);
  ctx.lineTo(-22, -22);
  ctx.lineTo(-1, -7);
  ctx.closePath();
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(-10, 5);
  ctx.lineTo(-22, 22);
  ctx.lineTo(-1, 7);
  ctx.closePath();
  ctx.fill();

  // Wingtip gun barrels
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(-15, -21, 6, 2.5);

function drawSpaceCrystalSprite(sx, sy, sc) {
  const h = ~~(sc * 180); if (h < 6) return;
  const w = ~~(h * 0.45);
  const cy = sy - h * 0.5; // vertical center of crystal
  
  ctx.save();
  // Floating animation: make the crystal float up and down slightly using ts/Date.now
  const floatOffset = Math.sin(Date.now() * 0.003 + sx * 0.05) * h * 0.08;
  const finalCy = cy + floatOffset;
  
  // Outer glowing aura
  drawGlowRect(sx - w*0.4, finalCy - h*0.2, w*0.8, h*0.4, '#00ffcc', 20, 0.25);
  
  // We'll draw 4 segments of a double octahedron (crystals)
  const topX = sx, topY = finalCy - h * 0.5;
  const botX = sx, botY = finalCy + h * 0.5;
  const midL_X = sx - w, midL_Y = finalCy;
  const midR_X = sx + w, midR_Y = finalCy;
  const midC_X = sx, midC_Y = finalCy - h * 0.05; // slightly raised center for 3D look
  
  // Left Top Face
  ctx.fillStyle = '#00f0ff';
  ctx.beginPath();
  ctx.moveTo(topX, topY);
  ctx.lineTo(midL_X, midL_Y);
  ctx.lineTo(midC_X, midC_Y);
  ctx.closePath();
  ctx.fill();
  
  // Right Top Face
  ctx.fillStyle = '#00aaff';
  ctx.beginPath();
  ctx.moveTo(topX, topY);
  ctx.lineTo(midR_X, midR_Y);
  ctx.lineTo(midC_X, midC_Y);
  ctx.closePath();
  ctx.fill();
  
  // Left Bottom Face
  ctx.fillStyle = '#0088cc';
  ctx.beginPath();
  ctx.moveTo(botX, botY);
  ctx.lineTo(midL_X, midL_Y);
  ctx.lineTo(midC_X, midC_Y);
  ctx.closePath();
  ctx.fill();
  
  // Right Bottom Face
  ctx.fillStyle = '#005599';
  ctx.beginPath();
  ctx.moveTo(botX, botY);
  ctx.lineTo(midR_X, midR_Y);
  ctx.lineTo(midC_X, midC_Y);
  ctx.closePath();
  ctx.fill();
  
  // Draw bright, sharp white neon edges
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = Math.max(1, ~~(sc * 3));
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(topX, topY); ctx.lineTo(midL_X, midL_Y); ctx.lineTo(botX, botY); ctx.lineTo(midR_X, midR_Y); ctx.closePath();
  ctx.moveTo(topX, topY); ctx.lineTo(midC_X, midC_Y); ctx.lineTo(botX, botY);
  ctx.moveTo(midL_X, midL_Y); ctx.lineTo(midC_X, midC_Y); ctx.lineTo(midR_X, midR_Y);
  ctx.stroke();
  
  // A glowing energy core floating inside
  ctx.fillStyle = '#ff00ff';
  ctx.beginPath();
  ctx.arc(sx, finalCy, w * 0.15, 0, Math.PI * 2);
  ctx.fill();
  
  ctx.restore();
}

function drawTreeSprite(sx, sy, sc) {
  const h = ~~(sc * 190); if (h < 6) return;
  const trunkH = ~~(h * 0.42), trunkW = Math.max(3, ~~(h * 0.06)), topY = sy - h;
  ctx.fillStyle = '#4b2243'; ctx.fillRect(sx - ~~(trunkW / 2), sy - trunkH, trunkW, trunkH);
  ctx.fillStyle = '#7b3c78'; for (let i = 0; i < 4; i++) ctx.fillRect(sx - ~~(trunkW / 2), sy - trunkH + i * Math.max(2, ~~(trunkH / 5)), trunkW, 1);
  const leafColors = ['#27d3ff', '#7a5cff', '#ff4fd8', '#27d3ff', '#7a5cff'];
  for (let i = 0; i < 5; i++) {
    ctx.strokeStyle = leafColors[i]; ctx.lineWidth = Math.max(2, ~~(sc * 4));
    ctx.beginPath(); ctx.moveTo(sx, sy - trunkH); const angle = (-80 + i * 40) * Math.PI / 180, len = h * (0.42 + (i % 2) * 0.05);
    ctx.lineTo(sx + Math.cos(angle) * len, topY + h * 0.38 + Math.sin(angle) * len * 0.3); ctx.stroke();
  }
}

function drawSnowTreeSprite(sx, sy, sc) {
  const h = ~~(sc * 250); if (h < 10) return;
  const trunkW = Math.max(4, ~~(sc * 18));
  const trunkH = ~~(h * 0.28);
  
  ctx.save();
  // Trunk
  ctx.fillStyle = '#2c1e1a';
  ctx.beginPath();
  ctx.moveTo(sx - trunkW / 2, sy);
  ctx.lineTo(sx + trunkW / 2, sy);
  ctx.lineTo(sx + trunkW * 0.3, sy - trunkH);
  ctx.lineTo(sx - trunkW * 0.3, sy - trunkH);
  ctx.closePath();
  ctx.fill();
  
  // Overlapping pine layers
  const numLayers = 4;
  for (let i = 0; i < numLayers; i++) {
      const layerY = sy - trunkH - i * (h * 0.18);
      const layerW = h * (0.42 - i * 0.08);
      const layerH = h * 0.3;
      
      const pL = sx - layerW / 2;
      const pR = sx + layerW / 2;
      const pT = sx;
      const pB = layerY - layerH;
      
      // Evergreen needles
      ctx.fillStyle = '#082a1c'; 
      ctx.beginPath();
      ctx.moveTo(pL, layerY);
      ctx.lineTo(pR, layerY);
      ctx.lineTo(pT, pB);
      ctx.closePath();
      ctx.fill();
      
      // Snowy blanket (ice blue shading)
      ctx.fillStyle = '#d2e3f5'; 
      ctx.beginPath();
      ctx.moveTo(sx, pB);
      ctx.lineTo(sx - layerW * 0.3, layerY - layerH * 0.3);
      ctx.quadraticCurveTo(sx, layerY - layerH * 0.05, sx + layerW * 0.3, layerY - layerH * 0.3);
      ctx.closePath();
      ctx.fill();
      
      // Pure white snow cap
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.moveTo(sx, pB);
      ctx.lineTo(sx - layerW * 0.18, layerY - layerH * 0.6);
      ctx.quadraticCurveTo(sx, layerY - layerH * 0.35, sx + layerW * 0.18, layerY - layerH * 0.6);
      ctx.closePath();
      ctx.fill();
  }
  ctx.restore();
}

function drawPalmTreeSprite(sx, sy, sc) {
  const h = ~~(sc * 240); if (h < 8) return;
  const trunkW = Math.max(3, ~~(sc * 14));
  
  ctx.save();
  ctx.strokeStyle = '#3d162f'; // Dark outline
  ctx.lineWidth = trunkW + 2;
  ctx.beginPath();
  ctx.moveTo(sx, sy);
  const topX = sx - sc * 35;
  const topY = sy - h * 0.85;
  ctx.quadraticCurveTo(sx + sc * 20, sy - h * 0.4, topX, topY);
  ctx.stroke();
  
  ctx.strokeStyle = '#9c246f'; // Glowing magenta inner trunk
  ctx.lineWidth = trunkW;
  ctx.stroke();
  
  ctx.strokeStyle = '#f32c91';
  ctx.lineWidth = Math.max(1, ~~(sc * 2));
  for (let t = 0.1; t < 0.9; t += 0.15) {
    const mt = 1 - t;
    const px = mt * mt * sx + 2 * mt * t * (sx + sc * 20) + t * t * topX;
    const py = mt * mt * sy + 2 * mt * t * (sy - h * 0.4) + t * t * topY;
    const dx = -2 * mt * sx + 2 * (sx + sc * 20) * (mt - t) + 2 * t * topX;
    const dy = -2 * mt * sy + 2 * (sy - h * 0.4) * (mt - t) + 2 * t * topY;
    const len = Math.sqrt(dx*dx + dy*dy);
    const nx = -dy / (len || 1) * (trunkW * 0.6);
    const ny = dx / (len || 1) * (trunkW * 0.6);
    ctx.beginPath();
    ctx.moveTo(px - nx, py - ny);
    ctx.lineTo(px + nx, py + ny);
    ctx.stroke();
  }

  const frondColors = ['#00ffd2', '#05ff82', '#ff00c1', '#00ffd2', '#05ff82', '#ff5a00'];
  const frondCount = 6;
  ctx.lineWidth = Math.max(2, ~~(sc * 5));
  for (let i = 0; i < frondCount; i++) {
    const angle = (-120 + i * 40) * Math.PI / 180;
    const length = h * 0.48;
    const endX = topX + Math.cos(angle) * length;
    const endY = topY + Math.sin(angle) * length + h * 0.12;
    
    ctx.strokeStyle = frondColors[i % frondColors.length];
    ctx.beginPath();
    ctx.moveTo(topX, topY);
    ctx.quadraticCurveTo(topX + Math.cos(angle) * length * 0.6, topY + Math.sin(angle) * length * 0.4 - h * 0.08, endX, endY);
    ctx.stroke();
    
    ctx.strokeStyle = frondColors[(i + 1) % frondColors.length];
    ctx.lineWidth = Math.max(1, ~~(sc * 2));
    for (let j = 0.2; j <= 1.0; j += 0.2) {
      const fx = topX + Math.cos(angle) * length * j;
      const fy = topY + Math.sin(angle) * length * j * 0.8;
      ctx.beginPath();
      ctx.moveTo(fx, fy);
      ctx.lineTo(fx + Math.sin(angle) * sc * 12, fy + sc * 18);
      ctx.stroke();
    }
  }
  ctx.restore();
}

function drawGnarledTreeSprite(sx, sy, sc) {
  const h = ~~(sc * 360); if (h < 12) return;
  const baseW = Math.max(8, ~~(sc * 42));

  ctx.save();
  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.beginPath();
  ctx.ellipse(sx, sy, baseW * 2.2, baseW * 0.5, 0, 0, Math.PI * 2);
  ctx.fill();

  // Draw majestic gnarled trunk and branches
  ctx.fillStyle = '#0f0417'; // very dark purple-black
  ctx.strokeStyle = '#2d143f'; // branch highlights
  ctx.lineWidth = Math.max(2, sc * 5);

  // Thick gnarled trunk base that tapers and splits
  ctx.beginPath();
  ctx.moveTo(sx - baseW * 0.7, sy);
  // curves representing the rugged trunk flare
  ctx.quadraticCurveTo(sx - baseW * 0.8, sy - h * 0.1, sx - baseW * 0.5, sy - h * 0.2);
  // branch splits
  ctx.bezierCurveTo(sx - baseW * 0.9, sy - h * 0.35, sx - baseW * 1.5, sy - h * 0.45, sx - baseW * 1.8, sy - h * 0.5); // far left branch
  ctx.lineTo(sx - baseW * 1.6, sy - h * 0.52);
  ctx.bezierCurveTo(sx - baseW * 1.3, sy - h * 0.47, sx - baseW * 0.8, sy - h * 0.4, sx - baseW * 0.4, sy - h * 0.3); // back to main
  
  // middle branch splits
  ctx.bezierCurveTo(sx - baseW * 0.6, sy - h * 0.5, sx - baseW * 0.8, sy - h * 0.65, sx - baseW * 0.5, sy - h * 0.75); // high left
  ctx.lineTo(sx - baseW * 0.3, sy - h * 0.77);
  ctx.bezierCurveTo(sx - baseW * 0.4, sy - h * 0.63, sx - baseW * 0.2, sy - h * 0.5, sx, sy - h * 0.4);

  // high right branch
  ctx.bezierCurveTo(sx + baseW * 0.2, sy - h * 0.55, sx + baseW * 0.4, sy - h * 0.7, sx + baseW * 0.7, sy - h * 0.72);
  ctx.lineTo(sx + baseW * 0.8, sy - h * 0.68);
  ctx.bezierCurveTo(sx + baseW * 0.5, sy - h * 0.6, sx + baseW * 0.3, sy - h * 0.45, sx + baseW * 0.4, sy - h * 0.35);

  // far right branch
  ctx.bezierCurveTo(sx + baseW * 0.9, sy - h * 0.4, sx + baseW * 1.6, sy - h * 0.43, sx + baseW * 1.9, sy - h * 0.45);
  ctx.lineTo(sx + baseW * 1.8, sy - h * 0.5);
  ctx.bezierCurveTo(sx + baseW * 1.3, sy - h * 0.46, sx + baseW * 0.8, sy - h * 0.35, sx + baseW * 0.6, sy - h * 0.22);
  ctx.quadraticCurveTo(sx + baseW * 0.8, sy - h * 0.1, sx + baseW * 0.7, sy);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // Draw wood grain lines for bark texture
  ctx.strokeStyle = '#230b35';
  ctx.lineWidth = Math.max(1, sc * 2.5);
  ctx.beginPath();
  ctx.moveTo(sx - baseW * 0.1, sy);
  ctx.quadraticCurveTo(sx - baseW * 0.2, sy - h * 0.15, sx - baseW * 0.3, sy - h * 0.25);
  ctx.moveTo(sx + baseW * 0.1, sy);
  ctx.quadraticCurveTo(sx + baseW * 0.3, sy - h * 0.1, sx + baseW * 0.2, sy - h * 0.22);
  ctx.stroke();

  // Smaller branchlets
  ctx.strokeStyle = '#0f0417';
  ctx.lineWidth = Math.max(1.5, sc * 3.5);
  ctx.beginPath();
  ctx.moveTo(sx - baseW * 1.7, sy - h * 0.51);
  ctx.quadraticCurveTo(sx - baseW * 2.1, sy - h * 0.55, sx - baseW * 2.3, sy - h * 0.53);
  ctx.moveTo(sx - baseW * 0.4, sy - h * 0.76);
  ctx.quadraticCurveTo(sx - baseW * 0.6, sy - h * 0.82, sx - baseW * 0.5, sy - h * 0.86);
  ctx.moveTo(sx + baseW * 0.75, sy - h * 0.70);
  ctx.quadraticCurveTo(sx + baseW * 1.0, sy - h * 0.75, sx + baseW * 0.9, sy - h * 0.80);
  ctx.moveTo(sx + baseW * 1.85, sy - h * 0.475);
  ctx.quadraticCurveTo(sx + baseW * 2.2, sy - h * 0.51, sx + baseW * 2.4, sy - h * 0.49);
  ctx.stroke();

  // Custom organic layered pine needle/foliage clusters
  const clusters = [
    { x: sx - baseW * 2.1, y: sy - h * 0.52, rx: h * 0.15, ry: h * 0.08, angle: -0.2 },
    { x: sx - baseW * 1.5, y: sy - h * 0.48, rx: h * 0.13, ry: h * 0.07, angle: -0.1 },
    { x: sx - baseW * 0.5, y: sy - h * 0.83, rx: h * 0.16, ry: h * 0.09, angle: 0.1 },
    { x: sx - baseW * 0.1, y: sy - h * 0.70, rx: h * 0.14, ry: h * 0.08, angle: 0 },
    { x: sx + baseW * 0.85, y: sy - h * 0.76, rx: h * 0.15, ry: h * 0.09, angle: -0.15 },
    { x: sx + baseW * 1.5, y: sy - h * 0.46, rx: h * 0.13, ry: h * 0.07, angle: 0.1 },
    { x: sx + baseW * 2.1, y: sy - h * 0.48, rx: h * 0.15, ry: h * 0.08, angle: 0.25 }
  ];

  for (const c of clusters) {
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(c.angle);
    
    // Layer 1: Dark pine shadow
    ctx.fillStyle = '#06171a';
    ctx.beginPath();
    ctx.ellipse(0, 0, c.rx, c.ry, 0, 0, Math.PI * 2);
    ctx.fill();

    // Layer 2: Medium cyber pine green
    ctx.fillStyle = '#0f4035';
    ctx.beginPath();
    ctx.ellipse(-c.rx * 0.1, -c.ry * 0.15, c.rx * 0.85, c.ry * 0.85, 0, 0, Math.PI * 2);
    ctx.fill();

    // Layer 3: Vibrant cyber green highlight
    ctx.fillStyle = '#107c57';
    ctx.beginPath();
    ctx.ellipse(c.rx * 0.1, -c.ry * 0.1, c.rx * 0.6, c.ry * 0.6, 0, 0, Math.PI * 2);
    ctx.fill();

    // Layer 4: Neon pine needle endpoints sticking out organic
    ctx.strokeStyle = '#00fca8';
    ctx.lineWidth = Math.max(1.2, sc * 1.8);
    ctx.beginPath();
    const numNeedles = 14;
    for (let i = 0; i < numNeedles; i++) {
      const theta = (i / numNeedles) * Math.PI * 2;
      const r_edge_x = Math.cos(theta) * c.rx;
      const r_edge_y = Math.sin(theta) * c.ry;
      ctx.moveTo(r_edge_x * 0.8, r_edge_y * 0.8);
      ctx.lineTo(r_edge_x * 1.15, r_edge_y * 1.15);
    }
    ctx.stroke();

    ctx.restore();
  }

  ctx.restore();
}
