function drawWindsurferSprite(sx, sy, sc, ts, seed = 0) {
  const wsc = sc * 0.45; // sleek and appropriately scaled relative to yacht/sailboat
  ctx.save();
  
  // Bobbing animation in waves
  const phase=seed*.73;
  const bobY=sy+Math.sin(ts*.001+phase)*sc*.25;
  const tilt=Math.cos(ts*.0007+phase)*.012;
  ctx.translate(sx, bobY);
  ctx.rotate(tilt);
  
  // 1. Foam trail behind board
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
  ctx.lineWidth = Math.max(1, wsc * 4);
  ctx.beginPath();
  ctx.moveTo(-wsc * 45, wsc * 5);
  ctx.lineTo(-wsc * 15, wsc * 2);
  ctx.stroke();
  
  // 2. Surfboard (sleek and colorful)
  ctx.fillStyle = '#ff00c1'; // Neon pink board
  ctx.strokeStyle = '#00ffd2'; // Neon cyan edge
  ctx.lineWidth = Math.max(1, wsc * 2);
  ctx.beginPath();
  ctx.moveTo(-wsc * 30, wsc * 2);
  ctx.quadraticCurveTo(0, -wsc * 1, wsc * 25, -wsc * 3); // nose curves up
  ctx.quadraticCurveTo(wsc * 32, -wsc * 4, wsc * 38, -wsc * 2);
  ctx.quadraticCurveTo(wsc * 30, wsc * 5, 0, wsc * 6);
  ctx.lineTo(-wsc * 28, wsc * 5);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  
  // 3. Mast and Boom
  const mastAngle = -0.15; // slightly tilted back
  ctx.save();
  ctx.translate(0, wsc * 1);
  ctx.rotate(mastAngle);
  
  // Mast (black carbon)
  ctx.strokeStyle = '#222';
  ctx.lineWidth = Math.max(1.5, wsc * 3);
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(0, -wsc * 60);
  ctx.stroke();
  
  // Translucent Neon Sail (glowing yellow)
  ctx.fillStyle = 'rgba(255, 224, 102, 0.85)';
  ctx.beginPath();
  ctx.moveTo(0, -wsc * 56);
  ctx.quadraticCurveTo(-wsc * 18, -wsc * 35, -wsc * 26, -wsc * 15);
  ctx.lineTo(-wsc * 2, -wsc * 12);
  ctx.closePath();
  ctx.fill();
  
  // Secondary Sail Accent (neon pink band)
  ctx.fillStyle = 'rgba(255, 0, 193, 0.9)';
  ctx.beginPath();
  ctx.moveTo(0, -wsc * 35);
  ctx.quadraticCurveTo(-wsc * 9, -wsc * 27, -wsc * 14, -wsc * 20);
  ctx.lineTo(-wsc * 1.5, -wsc * 17);
  ctx.closePath();
  ctx.fill();
  
  // Boom (wishbone)
  ctx.strokeStyle = '#888';
  ctx.lineWidth = Math.max(1, wsc * 2);
  ctx.beginPath();
  ctx.moveTo(0, -wsc * 18);
  ctx.quadraticCurveTo(-wsc * 12, -wsc * 16, -wsc * 22, -wsc * 18);
  ctx.stroke();
  
  ctx.restore();
  
  // 4. Surfer (leaning back)
  const surferX = -wsc * 8;
  const surferY = -wsc * 1;
  ctx.save();
  ctx.translate(surferX, surferY);
  
  // Leaning angle
  ctx.rotate(-0.25);
  
  // Body/Wetsuit (dark neon purple)
  ctx.fillStyle = '#120428';
  ctx.strokeStyle = '#00ffd2';
  ctx.lineWidth = Math.max(1, wsc * 1.5);
  ctx.beginPath();
  ctx.ellipse(-wsc * 5, -wsc * 12, wsc * 4, wsc * 10, 0.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  
  // Head/Helmet (white/silver)
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(-wsc * 7, -wsc * 24, wsc * 3.5, 0, Math.PI * 2);
  ctx.fill();
  
  // Arms holding the boom
  ctx.strokeStyle = '#ffcca3'; // skin tone
  ctx.lineWidth = Math.max(1, wsc * 2);
  ctx.beginPath();
  ctx.moveTo(-wsc * 5, -wsc * 17);
  ctx.lineTo(wsc * 6, -wsc * 16); // reaching forward to the boom
  ctx.stroke();
  
  ctx.restore();
  
  ctx.restore();
}

function drawBeachPerson(cx, cy, sc, pose, options = {}) {
  ctx.save();
  const skinColor = options.skin || '#ffcca3'; // retro tanned skin
  const clothingColor = options.clothing || '#ff00c1'; // neon pink or cyan
  const hairColor = options.hair || '#ffe259'; // neon yellow or dark
  const headR = sc * 6.5;
  
  if (pose === 'standing') {
    // Torso: stylized retro shirt / tank top
    ctx.fillStyle = clothingColor;
    ctx.beginPath();
    // Rounded shoulder width
    const torsoW = sc * 12;
    const torsoH = sc * 18;
    ctx.rect(cx - torsoW/2, cy - sc * 28, torsoW, torsoH);
    ctx.fill();
    
    // Shorts
    ctx.fillStyle = '#00ffd2';
    ctx.fillRect(cx - torsoW/2, cy - sc * 14, torsoW, sc * 6);
    
    // Head
    ctx.fillStyle = skinColor;
    ctx.beginPath();
    ctx.arc(cx, cy - sc * 33, headR, 0, Math.PI * 2);
    ctx.fill();
    
    // Hair / Cap
    ctx.fillStyle = hairColor;
    ctx.beginPath();
    ctx.arc(cx, cy - sc * 35, headR * 0.9, Math.PI, 0, false);
    ctx.fill();
    // Cap visor
    ctx.strokeStyle = clothingColor;
    ctx.lineWidth = Math.max(1.5, sc * 2);
    ctx.beginPath();
    ctx.moveTo(cx - headR, cy - sc * 35);
    ctx.lineTo(cx + headR * 1.3, cy - sc * 36);
    ctx.stroke();

    // Legs
    ctx.fillStyle = skinColor;
    ctx.fillRect(cx - sc * 5, cy - sc * 8, sc * 3.5, sc * 8);
    ctx.fillRect(cx + sc * 1.5, cy - sc * 8, sc * 3.5, sc * 8);
    
    // Feet/Shoes
    ctx.fillStyle = clothingColor;
    ctx.fillRect(cx - sc * 6, cy, sc * 4.5, sc * 2);
    ctx.fillRect(cx + sc * 1.5, cy, sc * 4.5, sc * 2);

    // Arms (holding a glass or waving)
    ctx.strokeStyle = skinColor;
    ctx.lineWidth = Math.max(2, sc * 4);
    ctx.lineCap = 'round';
    ctx.beginPath();
    if (options.wave) {
      // left arm waving
      ctx.moveTo(cx - sc * 6, cy - sc * 25);
      ctx.lineTo(cx - sc * 12, cy - sc * 38);
    } else {
      ctx.moveTo(cx - sc * 6, cy - sc * 25);
      ctx.lineTo(cx - sc * 10, cy - sc * 15);
    }
    // right arm holding drink
    ctx.moveTo(cx + sc * 6, cy - sc * 25);
    ctx.lineTo(cx + sc * 11, cy - sc * 22);
    ctx.lineTo(cx + sc * 13, cy - sc * 28);
    ctx.stroke();

    // Small cocktail glass
    if (!options.wave) {
      ctx.fillStyle = '#ff00c1';
      ctx.beginPath();
      ctx.moveTo(cx + sc * 11, cy - sc * 29);
      ctx.lineTo(cx + sc * 15, cy - sc * 29);
      ctx.lineTo(cx + sc * 13, cy - sc * 32);
      ctx.closePath();
      ctx.fill();
    }
  } 
  else if (pose === 'lying') {
    // Lying down horizontally or slightly propped up on a beach towel
    const length = sc * 40;
    const bodyY = cy - sc * 2;
    
    // Torso (bikini / swim shorts)
    ctx.fillStyle = clothingColor;
    ctx.beginPath();
    ctx.rect(cx - length * 0.2, bodyY - sc * 4, length * 0.4, sc * 7);
    ctx.fill();
    
    // Head & Neck
    ctx.fillStyle = skinColor;
    ctx.beginPath();
    ctx.arc(cx - length * 0.4, bodyY - sc * 3, headR, 0, Math.PI * 2);
    ctx.fill();
    
    // Sunglasses
    ctx.fillStyle = '#0a0512';
    ctx.fillRect(cx - length * 0.4 - sc * 1, bodyY - sc * 5, sc * 6, sc * 2.5);

    // Legs
    ctx.fillStyle = skinColor;
    ctx.fillRect(cx + length * 0.2, bodyY - sc * 3, length * 0.35, sc * 4);
    
    // Arms relaxed at sides
    ctx.strokeStyle = skinColor;
    ctx.lineWidth = Math.max(2, sc * 3.5);
    ctx.beginPath();
    ctx.moveTo(cx - length * 0.2, bodyY - sc * 3);
    ctx.lineTo(cx + length * 0.1, bodyY - sc * 3);
    ctx.stroke();
  }
  else if (pose === 'sitting') {
    // Sitting on a beach chair or propped up
    const bodyX = cx;
    const bodyY = cy;
    
    // Torso
    ctx.fillStyle = clothingColor;
    ctx.beginPath();
    ctx.rect(bodyX - sc * 5, bodyY - sc * 18, sc * 10, sc * 12);
    ctx.fill();
    
    // Head
    ctx.fillStyle = skinColor;
    ctx.beginPath();
    ctx.arc(bodyX, bodyY - sc * 23, headR, 0, Math.PI * 2);
    ctx.fill();
    
    // Hair
    ctx.fillStyle = hairColor;
    ctx.beginPath();
    ctx.arc(bodyX, bodyY - sc * 24, headR * 0.9, Math.PI, 0, false);
    ctx.fill();
    
    // Sunglasses
    ctx.fillStyle = '#0a0512';
    ctx.fillRect(bodyX - sc * 4, bodyY - sc * 24, sc * 7, sc * 2.5);

    // Sitting thighs and calves
    ctx.fillStyle = skinColor;
    // Thighs extending forward
    ctx.fillRect(bodyX - sc * 3, bodyY - sc * 6, sc * 12, sc * 4.5);
    // Calves going down
    ctx.fillRect(bodyX + sc * 6, bodyY - sc * 3, sc * 4, sc * 6);
    
    // Arms relaxed down
    ctx.strokeStyle = skinColor;
    ctx.lineWidth = Math.max(1.8, sc * 3);
    ctx.beginPath();
    ctx.moveTo(bodyX - sc * 3, bodyY - sc * 15);
    ctx.lineTo(bodyX + sc * 4, bodyY - sc * 10);
    ctx.stroke();
  }
  else if (pose === 'volleyball_player') {
    // Active volleyball player reaching/jumping
    const dir = options.isLeft ? 1 : -1;
    const isJumping = options.isJumping;
    const py = cy - (isJumping ? sc * 16 : 0);
    
    // Torso
    ctx.fillStyle = clothingColor;
    ctx.beginPath();
    ctx.rect(cx - sc * 5.5, py - sc * 25, sc * 11, sc * 14);
    ctx.fill();
    
    // Shorts
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(cx - sc * 5.5, py - sc * 13, sc * 11, sc * 4);

    // Head
    ctx.fillStyle = skinColor;
    ctx.beginPath();
    ctx.arc(cx, py - sc * 30, headR, 0, Math.PI * 2);
    ctx.fill();
    
    // Hair
    ctx.fillStyle = hairColor;
    ctx.beginPath();
    ctx.arc(cx, py - sc * 31, headR * 0.85, Math.PI, 0, false);
    ctx.fill();

    // Legs
    ctx.strokeStyle = skinColor;
    ctx.lineWidth = Math.max(2.2, sc * 4.5);
    ctx.lineCap = 'round';
    ctx.beginPath();
    if (isJumping) {
      // Bent legs for jumping
      ctx.moveTo(cx - sc * 3, py - sc * 9);
      ctx.lineTo(cx - sc * 5, py - sc * 3);
      ctx.lineTo(cx - sc * 10, py - sc * 4);
      
      ctx.moveTo(cx + sc * 3, py - sc * 9);
      ctx.lineTo(cx + sc * 5, py - sc * 3);
      ctx.lineTo(cx + sc * 8, py - sc * 5);
    } else {
      // Standing legs
      ctx.moveTo(cx - sc * 3, py - sc * 9);
      ctx.lineTo(cx - sc * 6, py);
      
      ctx.moveTo(cx + sc * 3, py - sc * 9);
      ctx.lineTo(cx + sc * 4, py);
    }
    ctx.stroke();

    // Arms reaching for the ball
    ctx.strokeStyle = skinColor;
    ctx.lineWidth = Math.max(1.8, sc * 3.8);
    ctx.beginPath();
    ctx.moveTo(cx - sc * 4, py - sc * 22);
    ctx.lineTo(cx + dir * sc * 8, py - sc * 32);
    ctx.moveTo(cx + sc * 4, py - sc * 22);
    ctx.lineTo(cx + dir * sc * 12, py - sc * 30);
    ctx.stroke();
  }
  
  ctx.restore();
}

function drawBeachVolleyballSprite(sx, sy, sc, ts) {
  const h = ~~(sc * 140); if (h < 5) return;
  
  ctx.save();
  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.ellipse(sx, sy, sc * 110, sc * 12, 0, 0, Math.PI * 2);
  ctx.fill();

  // Draw 2 Net Poles
  const poleL = sx - sc * 65;
  const poleR = sx + sc * 65;
  const poleH = sc * 95;
  
  ctx.strokeStyle = '#21d4fd'; // glowing cyan poles
  ctx.lineWidth = Math.max(1.5, sc * 4);
  
  ctx.beginPath();
  ctx.moveTo(poleL, sy);
  ctx.lineTo(poleL, sy - poleH);
  ctx.moveTo(poleR, sy);
  ctx.lineTo(poleR, sy - poleH);
  ctx.stroke();
  
  // Net
  ctx.fillStyle = 'rgba(33, 212, 253, 0.18)';
  ctx.fillRect(poleL, sy - poleH * 0.9, poleR - poleL, poleH * 0.5);
  
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
  ctx.lineWidth = Math.max(1, sc * 1.5);
  ctx.strokeRect(poleL, sy - poleH * 0.9, poleR - poleL, poleH * 0.5);
  
  // Net mesh lines
  ctx.strokeStyle = 'rgba(33, 212, 253, 0.35)';
  ctx.lineWidth = 0.8;
  const netYStart = sy - poleH * 0.9;
  const netHeight = poleH * 0.5;
  for (let x = poleL + sc * 10; x < poleR; x += sc * 12) {
    ctx.beginPath();
    ctx.moveTo(x, netYStart);
    ctx.lineTo(x, netYStart + netHeight);
    ctx.stroke();
  }
  for (let y = netYStart + sc * 8; y < netYStart + netHeight; y += sc * 8) {
    ctx.beginPath();
    ctx.moveTo(poleL, y);
    ctx.lineTo(poleR, y);
    ctx.stroke();
  }

  // Bouncing Ball
  const ballPhase = (ts * 0.0035) % (Math.PI * 2);
  const ballX = sx + Math.cos(ballPhase) * sc * 55;
  const ballY = sy - poleH * 0.75 - Math.abs(Math.sin(ballPhase)) * sc * 50;
  
  ctx.fillStyle = '#ffb24a'; // retro orange ball
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = Math.max(0.8, sc * 1.5);
  ctx.beginPath();
  ctx.arc(ballX, ballY, sc * 7.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  // Players
  const p1X = sx - sc * 95 + Math.sin(ts * 0.0022) * sc * 12;
  const p1Y = sy;
  const p1Jumping = Math.abs(Math.sin(ts * 0.0045)) > 0.75;
  
  const p2X = sx + sc * 95 + Math.sin(ts * 0.0026 + 2) * sc * 10;
  const p2Y = sy;
  const p2Jumping = Math.abs(Math.sin(ts * 0.0051 + 1)) > 0.75;

  // Draw Player 1 (Left)
  drawBeachPerson(p1X, p1Y, sc, 'volleyball_player', {
    skin: '#ffcca3',
    clothing: '#ff00c1',
    hair: '#ffe259',
    isLeft: true,
    isJumping: p1Jumping
  });

  // Draw Player 2 (Right)
  drawBeachPerson(p2X, p2Y, sc, 'volleyball_player', {
    skin: '#e0ae85',
    clothing: '#00ffd2',
    hair: '#ffe259',
    isLeft: false,
    isJumping: p2Jumping
  });

  ctx.restore();
}

function drawBeachJeepSprite(sx, sy, sc) {
  const w = ~~(sc * 150); if (w < 6) return;
  const h = ~~(sc * 100);
  
  ctx.save();
  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath();
  ctx.ellipse(sx, sy, sc * 85, sc * 12, 0, 0, Math.PI * 2);
  ctx.fill();

  // Wheels - bulky off-road tires
  const whRadius = sc * 18;
  const whYL = sy;
  const wheelLX = sx - sc * 43;
  const wheelRX = sx + sc * 43;
  
  const drawOffroadWheel = (wx) => {
    // Outer tire (dark black/purple)
    ctx.fillStyle = '#0a0512';
    ctx.strokeStyle = '#21d4fd'; // neon outer ring
    ctx.lineWidth = Math.max(1.5, sc * 3.5);
    ctx.beginPath();
    ctx.arc(wx, whYL, whRadius, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    
    // Chunky treads
    ctx.strokeStyle = 'rgba(33, 212, 253, 0.4)';
    ctx.lineWidth = Math.max(1, sc * 2);
    for (let a = 0; a < Math.PI * 2; a += Math.PI / 4) {
      ctx.beginPath();
      ctx.moveTo(wx + Math.cos(a) * (whRadius - sc * 3), whYL + Math.sin(a) * (whRadius - sc * 3));
      ctx.lineTo(wx + Math.cos(a) * whRadius, whYL + Math.sin(a) * whRadius);
      ctx.stroke();
    }

    // Inner rim (neon pink)
    ctx.fillStyle = '#ff007f';
    ctx.beginPath();
    ctx.arc(wx, whYL, whRadius * 0.55, 0, Math.PI * 2);
    ctx.fill();

    // Center hub cap (cyan)
    ctx.fillStyle = '#00ffd2';
    ctx.beginPath();
    ctx.arc(wx, whYL, whRadius * 0.25, 0, Math.PI * 2);
    ctx.fill();
  };

  drawOffroadWheel(wheelLX);
  drawOffroadWheel(wheelRX);

  // Buggy Body (Sleek synthwave offroad shape)
  // Coordinates are relative to sx (center), sy (ground)
  const bodyY = sy - sc * 14;
  
  ctx.fillStyle = '#ff007f';
  ctx.strokeStyle = '#ff00c1';
  ctx.lineWidth = Math.max(1.5, sc * 3);
  
  ctx.beginPath();
  // Front nose (left)
  ctx.moveTo(sx - sc * 65, bodyY);
  // Hood slanting up to windshield base
  ctx.lineTo(sx - sc * 24, bodyY - sc * 14);
  // Dashboard / dashboard top
  ctx.lineTo(sx - sc * 14, bodyY - sc * 14);
  // Cut down into cockpit
  ctx.lineTo(sx - sc * 14, bodyY - sc * 3);
  // Seating floor
  ctx.lineTo(sx + sc * 18, bodyY - sc * 3);
  // Up to back rear deck
  ctx.lineTo(sx + sc * 22, bodyY - sc * 18);
  // Rear deck / spoiler-like tail
  ctx.lineTo(sx + sc * 62, bodyY - sc * 18);
  // Down to rear bumper
  ctx.lineTo(sx + sc * 66, bodyY);
  // Bottom chassis line
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // Side decorative neon-cyan styling line/decal!
  ctx.strokeStyle = '#00ffd2';
  ctx.lineWidth = Math.max(1.2, sc * 2.2);
  ctx.beginPath();
  ctx.moveTo(sx - sc * 55, bodyY - sc * 3);
  ctx.lineTo(sx - sc * 26, bodyY - sc * 10);
  ctx.lineTo(sx + sc * 15, bodyY - sc * 10);
  ctx.lineTo(sx + sc * 55, bodyY - sc * 12);
  ctx.stroke();

  // Draw Driver in Cockpit
  // Let's draw a cool head & torso with sunglasses driving!
  const driverX = sx + sc * 2;
  const driverY = bodyY - sc * 3;
  const headR = sc * 6;
  
  ctx.save();
  // Driver body (neon clothing)
  ctx.fillStyle = '#00ffd2';
  ctx.beginPath();
  ctx.rect(driverX - sc * 5, driverY - sc * 12, sc * 10, sc * 12);
  ctx.fill();
  
  // Driver head
  ctx.fillStyle = '#ffcca3';
  ctx.beginPath();
  ctx.arc(driverX, driverY - sc * 17, headR, 0, Math.PI * 2);
  ctx.fill();
  
  // Cool sunglasses
  ctx.fillStyle = '#0a0512';
  ctx.fillRect(driverX - sc * 4.5, driverY - sc * 18, sc * 7.5, sc * 2.2);
  
  // Hair blowing in wind
  ctx.fillStyle = '#ffe259';
  ctx.beginPath();
  ctx.arc(driverX + sc * 2, driverY - sc * 18, headR * 0.9, Math.PI * 1.5, Math.PI * 0.5, false);
  ctx.lineTo(driverX + sc * 11, driverY - sc * 16);
  ctx.closePath();
  ctx.fill();

  // Steering wheel
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = Math.max(1, sc * 2.2);
  ctx.beginPath();
  ctx.arc(driverX - sc * 8, driverY - sc * 9, sc * 4, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();

  // Slanted Windshield
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = Math.max(1.2, sc * 2.5);
  ctx.beginPath();
  ctx.moveTo(sx - sc * 16, bodyY - sc * 14);
  ctx.lineTo(sx - sc * 5, bodyY - sc * 42); // Leaning back nicely
  ctx.stroke();
  
  // Windshield blue-cyan glass tint
  ctx.fillStyle = 'rgba(33, 212, 253, 0.22)';
  ctx.beginPath();
  ctx.moveTo(sx - sc * 16, bodyY - sc * 14);
  ctx.lineTo(sx - sc * 5, bodyY - sc * 42);
  ctx.lineTo(sx + sc * 5, bodyY - sc * 42);
  ctx.lineTo(sx - sc * 6, bodyY - sc * 14);
  ctx.closePath();
  ctx.fill();

  // Roll cage bar behind seating
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = Math.max(1.5, sc * 3);
  ctx.beginPath();
  ctx.moveTo(sx + sc * 20, bodyY - sc * 18);
  ctx.lineTo(sx + sc * 14, bodyY - sc * 44);
  ctx.lineTo(sx + sc * 8, bodyY - sc * 44);
  ctx.moveTo(sx + sc * 14, bodyY - sc * 44);
  ctx.lineTo(sx + sc * 28, bodyY - sc * 18);
  ctx.stroke();

  // Surfboard elegantly mounted diagonally on top!
  ctx.save();
  ctx.translate(sx + sc * 4, bodyY - sc * 42);
  ctx.rotate(-0.08); // Sleek slight angle
  
  ctx.fillStyle = '#00ffd2'; // Neon cyan main board
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = Math.max(1, sc * 2);
  ctx.beginPath();
  ctx.ellipse(0, 0, sc * 48, sc * 6.5, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  
  // Neon pink stringer/accent stripe down the center
  ctx.fillStyle = '#ff007f';
  ctx.beginPath();
  ctx.ellipse(0, 0, sc * 48, sc * 1.8, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Side exhaust pipe (rugged buggy detail)
  ctx.strokeStyle = '#e0e0e0';
  ctx.lineWidth = Math.max(1, sc * 2.5);
  ctx.beginPath();
  ctx.moveTo(sx - sc * 12, bodyY + sc * 2);
  ctx.lineTo(sx + sc * 40, bodyY + sc * 2);
  ctx.lineTo(sx + sc * 48, bodyY - sc * 3); // angled upward tip
  ctx.stroke();

  // Headlight glow
  ctx.save();
  const lightX = sx - sc * 65;
  const lightY = bodyY - sc * 7;
  const hGlow = ctx.createRadialGradient(lightX, lightY, 2, lightX - sc * 100, lightY + sc * 15, sc * 120);
  hGlow.addColorStop(0, 'rgba(255, 239, 140, 0.45)');
  hGlow.addColorStop(0.3, 'rgba(255, 239, 140, 0.15)');
  hGlow.addColorStop(1, 'rgba(255, 239, 140, 0)');
  ctx.fillStyle = hGlow;
  ctx.beginPath();
  ctx.moveTo(lightX, lightY);
  ctx.lineTo(lightX - sc * 130, lightY - sc * 45);
  ctx.lineTo(lightX - sc * 130, lightY + sc * 75);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  ctx.restore();
}

function drawIllegalBeachParty(sx, sy, sc, ts) {
  ctx.save();
  
  // Floor shadow / base darkness
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath();
  ctx.ellipse(sx, sy, sc * 130, sc * 16, 0, 0, Math.PI * 2);
  ctx.fill();

  // 1. Horizontal hugging ground glow (strobes pink, cyan, yellow) - no snowglobe!
  const pulseColors = ['rgba(255, 0, 193, 0.16)', 'rgba(33, 212, 253, 0.16)', 'rgba(255, 224, 102, 0.1)'];
  const pCol = pulseColors[~~(ts / 150) % pulseColors.length];
  
  const floorGlow = ctx.createRadialGradient(sx, sy, 5, sx, sy, sc * 125);
  floorGlow.addColorStop(0, pCol);
  floorGlow.addColorStop(0.6, pCol.replace('0.16', '0.06').replace('0.1', '0.04'));
  floorGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
  
  ctx.fillStyle = floorGlow;
  ctx.beginPath();
  ctx.ellipse(sx, sy, sc * 140, sc * 22, 0, 0, Math.PI * 2);
  ctx.fill();

  // 2. Translucent Flashing Laser Spotlights in the Night Sky (4 Rotating lasers!)
  const beamAngle1 = -Math.PI / 2.3 + Math.sin(ts * 0.0035) * 0.35;
  const beamAngle2 = -Math.PI * 1.3 / 2.3 + Math.cos(ts * 0.005) * 0.35;
  const beamAngle3 = -Math.PI / 1.8 + Math.cos(ts * 0.0028 + 1.2) * 0.4;
  const beamAngle4 = -Math.PI / 2.1 + Math.sin(ts * 0.0042 - 0.7) * 0.4;
  
  const drawLaserBeam = (bx, by, angle, color) => {
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    
    const grad = ctx.createLinearGradient(bx, by, bx + Math.cos(angle) * sc * 280, by + Math.sin(angle) * sc * 280);
    grad.addColorStop(0, color);
    grad.addColorStop(0.4, color.replace('0.45', '0.15').replace('0.35', '0.12'));
    grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
    
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(bx, by);
    // Draw a widening cone of light
    const coneAngle = 0.045;
    ctx.lineTo(bx + Math.cos(angle - coneAngle) * sc * 300, by + Math.sin(angle - coneAngle) * sc * 300);
    ctx.lineTo(bx + Math.cos(angle + coneAngle) * sc * 300, by + Math.sin(angle + coneAngle) * sc * 300);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  };
  
  // Left Speaker Top Laser
  if (ts % 500 < 400) {
    drawLaserBeam(sx - sc * 65, sy - sc * 42, beamAngle1, 'rgba(33, 212, 253, 0.45)');
  }
  // Right Speaker Top Laser
  if (ts % 700 < 550) {
    drawLaserBeam(sx + sc * 65, sy - sc * 42, beamAngle2, 'rgba(255, 0, 193, 0.45)');
  }
  // Left Stage Corner Laser
  if (ts % 600 < 480) {
    drawLaserBeam(sx - sc * 45, sy - sc * 18, beamAngle3, 'rgba(255, 224, 102, 0.35)');
  }
  // Right Stage Corner Laser
  if (ts % 900 < 700) {
    drawLaserBeam(sx + sc * 45, sy - sc * 18, beamAngle4, 'rgba(0, 255, 210, 0.35)');
  }

  // 3. The Stage / DJ Podium (glowing retro slab)
  const stageW = sc * 90;
  const stageH = sc * 15;
  const stageY = sy - sc * 3;
  
  ctx.fillStyle = '#0a0518';
  ctx.strokeStyle = '#ff00c1';
  ctx.lineWidth = Math.max(1.5, sc * 3);
  ctx.beginPath();
  ctx.rect(sx - stageW / 2, stageY - stageH, stageW, stageH);
  ctx.fill();
  ctx.stroke();

  // Glowing neon lights on stage front rim
  ctx.strokeStyle = (ts % 400 < 200) ? '#00ffd2' : '#ff00c1';
  ctx.lineWidth = Math.max(1, sc * 2);
  ctx.beginPath();
  ctx.moveTo(sx - stageW / 2, stageY - sc * 2);
  ctx.lineTo(sx + stageW / 2, stageY - sc * 2);
  ctx.stroke();

  // 4. DJ Booth (DJ Pult) on top of the stage
  const boothW = sc * 40;
  const boothH = sc * 20;
  const boothY = stageY - stageH;
  
  ctx.fillStyle = '#120224';
  ctx.strokeStyle = '#00ffd2';
  ctx.lineWidth = Math.max(1.2, sc * 2.5);
  ctx.fillRect(sx - boothW / 2, boothY - boothH, boothW, boothH);
  ctx.strokeRect(sx - boothW / 2, boothY - boothH, boothW, boothH);

  // Animated synth Equalizer display on DJ Booth front
  ctx.fillStyle = '#ff00c1';
  const numEqBars = 6;
  const eqBarW = sc * 4;
  for (let b = 0; b < numEqBars; b++) {
    const eqH = sc * (3 + Math.abs(Math.sin(ts * 0.016 + b * 1.2)) * 12);
    ctx.fillRect(sx - boothW / 2 + sc * 5 + b * sc * 6, boothY - sc * 2 - eqH, eqBarW, eqH);
  }

  // DJ Decks on top of booth
  ctx.fillStyle = '#05010a';
  ctx.fillRect(sx - boothW / 2 + sc * 2, boothY - boothH - sc * 1.5, boothW - sc * 4, sc * 1.5);

  // 5. The DJ behind the booth
  const djBobY = Math.sin(ts * 0.015) * sc * 2.5;
  const djX = sx;
  const djY = boothY - boothH;
  
  // DJ Torso
  ctx.fillStyle = '#ff007f';
  ctx.beginPath();
  ctx.ellipse(djX, djY + sc * 4, sc * 7.5, sc * 8.5, 0, 0, Math.PI, true);
  ctx.fill();

  // DJ Head
  ctx.fillStyle = '#ffcca3';
  ctx.beginPath();
  ctx.arc(djX, djY - sc * 5 + djBobY, sc * 5, 0, Math.PI * 2);
  ctx.fill();

  // DJ Sunglasses
  ctx.fillStyle = '#120224';
  ctx.fillRect(djX - sc * 4.5, djY - sc * 6.8 + djBobY, sc * 9, sc * 1.8);

  // Headphones
  ctx.strokeStyle = '#00ffd2';
  ctx.lineWidth = Math.max(1.5, sc * 2);
  ctx.beginPath();
  ctx.arc(djX, djY - sc * 5 + djBobY, sc * 6.2, Math.PI * 1.15, Math.PI * 1.85);
  ctx.stroke();

  // DJ Arms waving in the air / mixing!
  ctx.strokeStyle = '#ffcca3';
  ctx.lineWidth = Math.max(1.5, sc * 2.5);
  const leftArmAngle = -Math.PI / 2.8 + Math.sin(ts * 0.013) * 0.5;
  ctx.beginPath();
  ctx.moveTo(djX - sc * 5, djY + sc * 1);
  ctx.lineTo(djX - sc * 12 + Math.cos(leftArmAngle) * sc * 8, djY - sc * 3 + Math.sin(leftArmAngle) * sc * 8);
  ctx.stroke();

  const rightArmAngle = -Math.PI * 1.8 / 2.8 + Math.cos(ts * 0.015) * 0.5;
  ctx.beginPath();
  ctx.moveTo(djX + sc * 5, djY + sc * 1);
  ctx.lineTo(djX + sc * 12 + Math.cos(rightArmAngle) * sc * 8, djY - sc * 3 + Math.sin(rightArmAngle) * sc * 8);
  ctx.stroke();

  // 6. Huge Speaker Towers (Boxen) left & right of stage
  const drawSpeaker = (spX) => {
    const spW = sc * 17;
    const spH = sc * 42;
    const spY = sy - sc * 2;
    
    // Speaker cabinet
    ctx.fillStyle = '#05010c';
    ctx.strokeStyle = '#ff00c1';
    ctx.lineWidth = Math.max(1.5, sc * 2.8);
    ctx.fillRect(spX - spW / 2, spY - spH, spW, spH);
    ctx.strokeRect(spX - spW / 2, spY - spH, spW, spH);

    // Grill details
    ctx.strokeStyle = 'rgba(255, 0, 193, 0.15)';
    ctx.lineWidth = Math.max(0.5, sc * 1);
    ctx.beginPath();
    ctx.moveTo(spX - spW / 2 + sc * 2, spY - spH / 2);
    ctx.lineTo(spX + spW / 2 - sc * 2, spY - spH / 2);
    ctx.stroke();

    // Pulsating Subwoofer Cones!
    const beatScale = 1.0 + Math.sin(ts * 0.016) * 0.11;
    
    // Lower Woofer
    const w1Y = spY - sc * 11;
    const w1R = sc * 6.5 * beatScale;
    ctx.fillStyle = '#120224';
    ctx.strokeStyle = '#00ffd2';
    ctx.lineWidth = Math.max(1, sc * 1.8);
    ctx.beginPath();
    ctx.arc(spX, w1Y, w1R, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    // Center dust cap
    ctx.fillStyle = '#00ffd2';
    ctx.beginPath();
    ctx.arc(spX, w1Y, w1R * 0.3, 0, Math.PI * 2);
    ctx.fill();

    // Upper Tweeter
    const w2Y = spY - sc * 28;
    const w2R = sc * 4.5 * beatScale;
    ctx.fillStyle = '#120224';
    ctx.strokeStyle = '#00ffd2';
    ctx.beginPath();
    ctx.arc(spX, w2Y, w2R, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
  };

  drawSpeaker(sx - sc * 65);
  drawSpeaker(sx + sc * 65);

  // 7. Dancing People in front of the stage (Expanded crowd of 10 people!)
  const crowd = [
    { dx: -52, dy: 14, skin: '#ffcca3', clothing: '#00ffd2', hair: '#ff00c1', phase: 0 },
    { dx: -38, dy: 8, skin: '#e0ae85', clothing: '#ffe259', hair: '#00ffd2', phase: 1.8 },
    { dx: -24, dy: 13, skin: '#ffcca3', clothing: '#ff00c1', hair: '#ffe259', phase: 3.2 },
    { dx: -10, dy: 15, skin: '#e0ae85', clothing: '#00ffd2', hair: '#ff00c1', phase: 4.5 },
    { dx: 4, dy: 16, skin: '#ffcca3', clothing: '#ffe259', hair: '#00ffd2', phase: 0.9 },
    { dx: 18, dy: 11, skin: '#e0ae85', clothing: '#00ffd2', hair: '#ffe259', phase: 2.1 },
    { dx: 32, dy: 7, skin: '#ffcca3', clothing: '#ff00c1', hair: '#00ffd2', phase: 3.8 },
    { dx: 48, dy: 13, skin: '#e0ae85', clothing: '#ffe259', hair: '#ff00c1', phase: 1.2 },
    { dx: -14, dy: 6, skin: '#ffcca3', clothing: '#00ffd2', hair: '#ff00c1', phase: 2.7 },
    { dx: 16, dy: 7, skin: '#e0ae85', clothing: '#ff00c1', hair: '#00ffd2', phase: 0.4 }
  ];

  crowd.forEach(d => {
    // Dynamic bobbing and jumping heights
    const bobHeight = Math.abs(Math.sin(ts * 0.016 + d.phase)) * sc * 8.5;
    const px = sx + sc * d.dx;
    const py = sy + sc * d.dy - bobHeight;

    // Torso / dress
    ctx.fillStyle = d.clothing;
    ctx.beginPath();
    ctx.ellipse(px, py - sc * 9, sc * 5, sc * 8, 0, 0, Math.PI * 2);
    ctx.fill();

    // Head
    ctx.fillStyle = d.skin;
    ctx.beginPath();
    ctx.arc(px, py - sc * 20, sc * 4, 0, Math.PI * 2);
    ctx.fill();

    // Hair
    ctx.fillStyle = d.hair;
    ctx.beginPath();
    ctx.arc(px, py - sc * 21.2, sc * 4.2, Math.PI, 0);
    ctx.fill();

    // Dancing arms (waving wildly in the air!)
    ctx.strokeStyle = d.skin;
    ctx.lineWidth = Math.max(1, sc * 2);
    const leftArmY = py - sc * 26 + Math.sin(ts * 0.015 + d.phase) * sc * 3.5;
    const rightArmY = py - sc * 26 + Math.cos(ts * 0.015 + d.phase) * sc * 3.5;

    ctx.beginPath();
    ctx.moveTo(px - sc * 3.5, py - sc * 13);
    ctx.lineTo(px - sc * 9, leftArmY);
    ctx.moveTo(px + sc * 3.5, py - sc * 13);
    ctx.lineTo(px + sc * 9, rightArmY);
    ctx.stroke();
  });

  ctx.restore();
}

function drawBeachDanceSprite(sx,sy,sc,ts,seed) {
  if(sc<.035)return;
  beginChapterSprite(sx,sy,sc);
  const colors=['#fb3da0','#22dfcd','#ffd45d','#9676ec'];
  const count=Math.floor(seed/10)%2?4:3,phase=seed*.43,beat=ts*.0048+phase;
  // A small gathering on the sand: feet stay planted while hips and arms groove.
  for(let i=0;i<count;i++){
    const x=count===3?-39+i*39:-48+i*32,y=[-3,-9,-5,0][i];
    const sway=Math.sin(beat+i*1.4)*2.1,bend=(1+Math.sin(beat+i*.8))*.75;
    const hipX=x+sway*.55,hipY=y-17+bend,shoulderX=x+sway,shoulderY=y-37+bend;
    const skin=['#e8b38c','#925b43','#f5c6a0','#ba7955'][(i+seed)%4];
    const top=colors[(i+Math.floor(seed/5))%4];
    ctx.fillStyle='rgba(50,25,46,.2)';ctx.beginPath();ctx.ellipse(x,y+2,10,2.3,0,0,Math.PI*2);ctx.fill();
    const limb=(points,color,width)=>{
      ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();
      ctx.moveTo(...points[0]);for(let j=1;j<points.length;j++)ctx.lineTo(...points[j]);ctx.stroke();
    };
    for(const side of[-1,1]){
      limb([[hipX+side*3,hipY],[x+side*(4+bend),y-8],[x+side*6,y]],i%2? '#392d57':skin,4);
      limb([[x+side*6-2,y],[x+side*6+3,y]],'#ffe7c5',3);
    }
    ctx.fillStyle=top;ctx.beginPath();ctx.moveTo(shoulderX-7,shoulderY);
    ctx.lineTo(shoulderX+7,shoulderY);ctx.lineTo(hipX+5,hipY+1);ctx.lineTo(hipX-5,hipY+1);ctx.closePath();ctx.fill();
    ctx.fillStyle=i%2?'#6c5dd0':'#102f43';ctx.fillRect(hipX-6,hipY-2,12,6);
    ctx.fillStyle='#ffde9b';ctx.fillRect(shoulderX-5,shoulderY+3,10,2);
    const wave=Math.sin(beat+i*1.7)*3;
    if(i%2===0){
      limb([[shoulderX-6,shoulderY+3],[x-12,y-29],[x-17,y-34+wave]],skin,3.5);
      limb([[shoulderX+6,shoulderY+3],[x+12,y-43],[x+9,y-52+wave]],skin,3.5);
    }else{
      limb([[shoulderX-6,shoulderY+3],[x-13,y-29-wave],[x-9,y-22]],skin,3.5);
      limb([[shoulderX+6,shoulderY+3],[x+14,y-28+wave],[x+19,y-33]],skin,3.5);
    }
    const hx=shoulderX,hy=shoulderY-7;
    ctx.fillStyle=skin;ctx.beginPath();ctx.arc(hx,hy,5.2,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=i===1?'#2c1525':i===2?'#f4b85d':'#331a2e';ctx.beginPath();
    if(i===1){ctx.arc(hx,hy-3,6,Math.PI,Math.PI*2);ctx.lineTo(hx+6,hy);}
    else{ctx.arc(hx,hy-2,5.3,Math.PI,0);ctx.lineTo(hx+4,hy-3);}
    ctx.fill();
    if(i===0){ctx.fillStyle='#142033';ctx.fillRect(hx-5,hy-1,10,2.4);}
    if(i===3){ctx.fillStyle='#fb3da0';ctx.fillRect(hx-5,hy-4,10,1.8);}
  }
  // Silver twin-speaker cassette radio, resting on sand in front of the group.
  ctx.translate(0,8);
  ctx.fillStyle='rgba(50,25,46,.25)';ctx.beginPath();ctx.ellipse(0,1,27,3,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#263043';ctx.lineWidth=2.4;ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(-12,-22);ctx.lineTo(-12,-29);ctx.lineTo(12,-29);ctx.lineTo(12,-22);ctx.stroke();
  ctx.fillStyle='#697589';ctx.fillRect(-25,-22,50,23);
  ctx.fillStyle='#c7c9cf';ctx.fillRect(-25,-22,50,3);ctx.fillRect(-25,-19,2,19);
  ctx.fillStyle='#182030';ctx.fillRect(-23,-18,46,16);
  for(const x of[-16,16]){
    ctx.fillStyle='#89909f';ctx.beginPath();ctx.arc(x,-10,7.6,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#242c3e';ctx.beginPath();ctx.arc(x,-10,6.1+Math.sin(beat)*.2,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#454d62';ctx.lineWidth=1;ctx.beginPath();ctx.arc(x,-10,4,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle='#151b29';ctx.beginPath();ctx.arc(x,-10,2.2,0,Math.PI*2);ctx.fill();
  }
  ctx.fillStyle='#85909d';ctx.fillRect(-7,-14,14,10);
  ctx.fillStyle='#293247';ctx.fillRect(-5,-12,10,5);
  ctx.fillStyle='#d4d5cc';for(const x of[-3,3]){ctx.beginPath();ctx.arc(x,-9.5,1.3,0,Math.PI*2);ctx.fill();}
  for(let i=0;i<5;i++){ctx.fillStyle=i===0?'#f15b84':'#d8d7ca';ctx.fillRect(-6+i*3,-21,2,2);}
  ctx.strokeStyle='#a7acbc';ctx.lineWidth=.8;ctx.beginPath();ctx.moveTo(21,-23);ctx.lineTo(35,-43);ctx.stroke();
  // Two small drifting notes stay close to the stereo, with no scene-wide glow.
  for(let i=0;i<2;i++){
    const t=(ts*.00035+i*.5+phase)%1,nx=29+i*10+Math.sin(t*4)*2,ny=-23-t*18;
    ctx.globalAlpha=Math.sin(t*Math.PI)*.7;ctx.fillStyle=colors[(i+seed)%4];ctx.strokeStyle=ctx.fillStyle;ctx.lineWidth=1.3;
    ctx.beginPath();ctx.ellipse(nx,ny,2,1.4,-.3,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.moveTo(nx+1.5,ny);ctx.lineTo(nx+1.5,ny-7);ctx.lineTo(nx+5,ny-6);ctx.stroke();
  }
  ctx.restore();
}

function drawBeachDiver(x,y,t,line) {
      ctx.save();ctx.translate(x,y);ctx.rotate(Math.sin(t*Math.PI)*.55);
      const tuck=Math.sin(t*Math.PI)*6;
      line([[-5,-12],[-8-tuck,-7],[ -6-tuck,0]],'#e3ac84',5);
      line([[5,-12],[9+tuck,-7],[7+tuck,0]],'#e3ac84',5);
      ctx.fillStyle='#e3ac84';ctx.beginPath();ctx.ellipse(0,-28,12,17,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#ec548e';ctx.fillRect(-11,-17,22,8);
      ctx.fillStyle='#ffd785';ctx.fillRect(-11,-17,22,2);
      line([[-8,-36],[-16,-25+tuck],[-7,-22]],'#e3ac84',5);
      line([[8,-36],[16,-25+tuck],[7,-22]],'#e3ac84',5);
      ctx.fillStyle='#edbc91';ctx.beginPath();ctx.arc(0,-49,6,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#794b38';ctx.fillRect(-5,-51,1.5,5);ctx.fillRect(3.5,-51,1.5,5);
      ctx.restore();
}

function drawBeachActivitySprite(sx,sy,sc,ts,kind,shoreOffset=0,approach=0) {
  if(sc<.035)return;
  beginChapterSprite(sx,sy,sc);
  const poly=(points,color)=>paintOceanPolygon(points.map(([x,y])=>({x,y})),color);
  const line=(points,color,width=2)=>{
    ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();
    ctx.moveTo(...points[0]);for(let i=1;i<points.length;i++)ctx.lineTo(...points[i]);ctx.stroke();
  };
  if(kind==='frisbee'){
    const flight=(ts*.0003)%1;
    for(const [x,dir,skin,shirt]of[[-46,1,'#a46b50','#fa749b'],[46,-1,'#f2c49d','#4bd8ec']]){
      ctx.fillStyle='rgba(50,25,46,.2)';ctx.beginPath();ctx.ellipse(x,2,10,2,0,0,Math.PI*2);ctx.fill();
      line([[x-3,-15],[x-6,-8],[x-7,0]],skin,4);line([[x+3,-15],[x+5,-7],[x+7,0]],skin,4);
      line([[x-9,0],[x-4,0]],'#ffe1a4',3);line([[x+5,0],[x+10,0]],'#ffe1a4',3);
      ctx.fillStyle=shirt;ctx.fillRect(x-6,-36,12,22);
      ctx.fillStyle='#4c3b72';ctx.fillRect(x-7,-19,14,7);
      const reach=Math.sin(flight*Math.PI)*3;
      line([[x+dir*5,-33],[x+dir*13,-28-reach],[x+dir*19,-32-reach]],skin,3.5);
      line([[x-dir*5,-32],[x-dir*10,-23],[x-dir*7,-18]],skin,3.5);
      ctx.fillStyle=skin;ctx.beginPath();ctx.arc(x,-43,5.5,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=dir>0?'#352239':'#e6b151';ctx.beginPath();ctx.arc(x,-45,5.7,Math.PI,0);ctx.fill();
      ctx.fillStyle='#152a3b';ctx.fillRect(x-5,-43,10,2);
    }
    const x=-29+58*flight,y=-28-Math.sin(flight*Math.PI)*13;
    ctx.fillStyle='#ffc44b';ctx.beginPath();ctx.ellipse(x,y,5,1.9,Math.sin(flight*6)*.12,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#fff0b2';ctx.lineWidth=.8;ctx.stroke();
  }else if(kind==='sandcastles'){
    drawBeachPerson(-37,0,1.08,'sitting',{skin:'#c38863',clothing:'#9779ee',hair:'#37202c'});
    drawBeachPerson(49,1,.72,'standing',{skin:'#efc299',clothing:'#ffab48',hair:'#5c3540',wave:true});
    poly([[-11,4],[37,4],[31,-9],[-6,-9]],'#c69457');
    poly([[-7,-2],[29,-2],[26,-14],[-4,-14]],'#f0cf8c');
    for(const x of[-5,11,27]){
      ctx.fillStyle='#f3d79d';ctx.fillRect(x-5,-21,10,20);
      for(let j=0;j<3;j++)ctx.fillRect(x-5+j*4,-24,2.5,5);
      ctx.fillStyle='#b58a59';ctx.fillRect(x+2,-19,3,17);
    }
    ctx.fillStyle='#77503b';ctx.beginPath();ctx.arc(11,-4,3.8,Math.PI,0);ctx.lineTo(14.8,1);ctx.lineTo(7.2,1);ctx.fill();
    line([[27,-24],[27,-36]],'#8e6150',1);
    poly([[27,-36],[38,-33],[27,-29]],'#fb4b93');
    poly([[-23,2],[-14,2],[-13,-8],[-25,-8]],'#20bbcf');
    line([[-24,-8],[-25,-12],[-15,-12],[-14,-8]],'#b6eff1',1);
    const dig=Math.sin(ts*.002)*2;
    line([[-27,-14],[-15,-8+dig]],'#d49973',3);
    line([[-16,-9+dig],[-8,1]],'#845c44',1.5);
    poly([[-10,-2],[-5,-2],[-6,3],[-9,3]],'#f38fb0');
  }else if(kind==='diving'){
    // A three-metre platform on the shore; the board reaches beyond the waterline.
    const height=92,edge=shoreOffset,tip=edge+10;
    for(const x of[-13,edge-8]){
      line([[x,2],[x,-height]],'#516f7b',4);
      line([[x-1,1],[x-1,-height]],'#9ad9d1',1);
    }
    line([[-37,1],[-20,-height]],'#e3bd73',3);
    line([[-28,1],[-11,-height]],'#e3bd73',3);
    for(let j=1;j<9;j++){
      const y=-height*j/9,x=-37+17*j/9;line([[x,y],[x+9,y]],'#f4d49a',2);
    }
    poly([[-24,-height],[tip,-height],[tip,-height+5],[-24,-height+5]],'#dce2bd');
    poly([[-24,-height],[tip,-height],[tip-3,-height-3],[-23,-height-3]],'#57d2c9');
    line([[-20,-height],[-20,-height-22],[edge-9,-height-22],[edge-9,-height]],'#adcbc4',2);
    const t=clamp((36-approach)/20,0,1),landing=edge+35,waterY=-5;
    if(t<1){
      const x=tip-7+(landing-tip+7)*t,y=-height*(1-t)+waterY*t-Math.sin(t*Math.PI)*36;
      drawBeachDiver(x,y,t,line);
    }else{
      const fade=clamp(approach/25,0,1),wave=Math.sin(ts*.003)*.5;
      ctx.strokeStyle='rgba(169,236,244,.65)';ctx.lineWidth=1.5;ctx.beginPath();ctx.ellipse(landing,waterY+2,10+(1-fade)*14,2+(1-fade)*2,0,0,Math.PI*2);ctx.stroke();
      for(let i=0;i<7;i++){
        const dx=(i-3)*4;
        line([[landing+dx*.5,waterY+1],[landing+dx,waterY-fade*(11+((i*7)%13))]],`rgba(189,244,247,${fade*.8})`,1.7);
      }
      ctx.fillStyle='#edbc91';ctx.beginPath();ctx.arc(landing,waterY-3+wave,4,Math.PI,Math.PI*2);ctx.fill();
    }
  }
  ctx.restore();
}

function drawBeachPartySprite(sx, sy, sc, ts, nightParty = player.lap >= 3) {
  const h = ~~(sc * 120); if (h < 5) return;
  
  // Select the scene for this occurrence of the beach, including the next lap
  // already visible across the start line. Keep the night scene after finishing.
  if (currentLevel === 2 && nightParty) {
    drawIllegalBeachParty(sx, sy, sc, ts);
    return;
  }
  
  ctx.save();
  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath();
  ctx.ellipse(sx, sy, sc * 90, sc * 11, 0, 0, Math.PI * 2);
  ctx.fill();

  // Shaped fabric panels, scalloped edge and a warm pole replace the striped dome.
  const ux=sx-sc*16,uy=sy-sc*72;
  ctx.strokeStyle='#e8bf97';ctx.lineWidth=Math.max(.8,sc*2);
  ctx.beginPath();ctx.moveTo(ux,sy);ctx.lineTo(ux,uy-sc*25);ctx.stroke();
  const panel=(points,color)=>paintOceanPolygon(points.map(([x,y])=>({x:ux+x*sc,y:uy+y*sc})),color);
  panel([[-49,0],[-25,-17],[0,-28],[29,-18],[48,1]],'#ee619b');
  panel([[-49,0],[-25,-17],[0,-28],[-9,-2]],'#ffe4b4');
  panel([[-9,-2],[0,-28],[29,-18],[25,0]],'#21bab1');
  ctx.strokeStyle='#ffdec0';ctx.lineWidth=Math.max(.65,sc);
  ctx.beginPath();ctx.moveTo(ux-sc*49,uy);
  ctx.quadraticCurveTo(ux-sc*28,uy+sc*7,ux-sc*9,uy-sc*2);
  ctx.quadraticCurveTo(ux+sc*7,uy+sc*7,ux+sc*25,uy);
  ctx.quadraticCurveTo(ux+sc*37,uy+sc*7,ux+sc*48,uy+sc);ctx.stroke();

  // Towels
  const t1L = sx - sc * 53;
  const t1R = sx - sc * 5;
  ctx.fillStyle = '#00ffd2';
  ctx.strokeStyle = 'rgba(255,255,255,0.4)';
  ctx.lineWidth = Math.max(0.5, sc * 1);
  ctx.beginPath();
  ctx.moveTo(t1L, sy - sc * 3);
  ctx.lineTo(t1R, sy - sc * 3);
  ctx.lineTo(t1R - sc * 6, sy + sc * 5);
  ctx.lineTo(t1L - sc * 6, sy + sc * 5);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  const t2L = sx + sc * 30;
  const t2R = sx + sc * 60;
  ctx.fillStyle = '#ff00c1';
  ctx.strokeStyle = 'rgba(255,255,255,0.4)';
  ctx.lineWidth = Math.max(0.5, sc * 1);
  ctx.beginPath();
  ctx.moveTo(t2L, sy - sc * 3);
  ctx.lineTo(t2R, sy - sc * 3);
  ctx.lineTo(t2R - sc * 6, sy + sc * 5);
  ctx.lineTo(t2L - sc * 6, sy + sc * 5);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // Person 1: Tanning (laying on towel)
  drawBeachPerson(sx - sc * 32, sy + sc * 1, sc, 'lying', { skin: '#ffcca3', clothing: '#ff00c1', hair: '#ffe259' });

  // Person 2: Sitting on towel/lounger
  const bob = Math.sin(ts * 0.003) * sc * 1.5;
  drawBeachPerson(sx + sc * 36, sy + bob, sc, 'sitting', { skin: '#e0ae85', clothing: '#00ffd2', hair: '#ff00c1' });

  // Bonfire
  const fireX = sx + sc * 3;
  const fireY = sy - sc * 1;
  const fireGlow = ctx.createRadialGradient(fireX, fireY, 1, fireX, fireY, sc * 25);
  fireGlow.addColorStop(0, 'rgba(255, 90, 0, 0.45)');
  fireGlow.addColorStop(0.4, 'rgba(255, 90, 0, 0.15)');
  fireGlow.addColorStop(1, 'rgba(255, 90, 0, 0)');
  ctx.fillStyle = fireGlow;
  ctx.beginPath();
  ctx.arc(fireX, fireY, sc * 25, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = '#4b2243';
  ctx.lineWidth = Math.max(1, sc * 2);
  ctx.beginPath();
  ctx.moveTo(fireX - sc * 6, fireY + sc * 1);
  ctx.lineTo(fireX + sc * 6, fireY - sc * 1);
  ctx.moveTo(fireX + sc * 4, fireY + sc * 2);
  ctx.lineTo(fireX - sc * 4, fireY - sc * 2);
  ctx.stroke();

  // Animated Flames
  const flameW = sc * 4;
  for (let i = 0; i < 3; i++) {
    const fPhase = ts * 0.007 + i * 2.1;
    const flH = sc * (14 + Math.sin(fPhase) * 6);
    const flX = fireX + (i - 1) * sc * 4.5 + Math.cos(fPhase * 0.7) * sc * 2.2;
    ctx.fillStyle = i === 1 ? '#ffb24a' : '#ffe259';
    ctx.beginPath();
    ctx.moveTo(flX - flameW / 2, fireY);
    ctx.quadraticCurveTo(flX - flameW / 2, fireY - flH * 0.5, flX, fireY - flH);
    ctx.quadraticCurveTo(flX + flameW / 2, fireY - flH * 0.5, flX + flameW / 2, fireY);
    ctx.closePath();
    ctx.fill();
  }

  // Beach Ball
  const ballX = sx + sc * 12;
  const ballY = sy + sc * 3;
  ctx.fillStyle = '#ffe259';
  ctx.strokeStyle = '#ff00c1';
  ctx.lineWidth = Math.max(0.6, sc * 1.2);
  ctx.beginPath();
  ctx.arc(ballX, ballY, sc * 5.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  ctx.restore();
}

function drawBeachBarSprite(sx, sy, sc, ts) {
  const w = ~~(sc * 180); if (w < 8) return;
  const h = ~~(sc * 130);
  
  ctx.save();
  // Shadow on sand
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.ellipse(sx, sy, sc * 110, sc * 15, 0, 0, Math.PI * 2);
  ctx.fill();

  // Draw Tiki / Bamboo Pillars (4 pillars)
  ctx.strokeStyle = '#dfa15f'; // bamboo color
  ctx.lineWidth = Math.max(2, sc * 4.5);
  const leftX = sx - sc * 65;
  const rightX = sx + sc * 65;
  const midLeftX = sx - sc * 20;
  const midRightX = sx + sc * 20;
  const barTopY = sy - sc * 50;
  const roofBottomY = sy - sc * 80;
  
  // Pillars to roof
  ctx.beginPath();
  ctx.moveTo(leftX, sy); ctx.lineTo(leftX, roofBottomY);
  ctx.moveTo(rightX, sy); ctx.lineTo(rightX, roofBottomY);
  ctx.moveTo(midLeftX, sy); ctx.lineTo(midLeftX, roofBottomY);
  ctx.moveTo(midRightX, sy); ctx.lineTo(midRightX, roofBottomY);
  ctx.stroke();

  // Horizontal bamboo braces
  ctx.beginPath();
  ctx.moveTo(leftX - sc * 5, barTopY); ctx.lineTo(rightX + sc * 5, barTopY);
  ctx.moveTo(leftX - sc * 5, roofBottomY); ctx.lineTo(rightX + sc * 5, roofBottomY);
  ctx.stroke();

  // Bar counter base (enclosed front panel, beautiful neon synthwave style)
  ctx.fillStyle = '#140526';
  ctx.strokeStyle = '#00ffd2'; // neon cyan glowing rim
  ctx.lineWidth = Math.max(1.5, sc * 3);
  ctx.beginPath();
  ctx.moveTo(leftX, sy);
  ctx.lineTo(rightX, sy);
  ctx.lineTo(rightX - sc * 10, barTopY);
  ctx.lineTo(leftX + sc * 10, barTopY);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // Decorative diagonal neon stripes on the bar counter front panel!
  ctx.strokeStyle = '#ff00c1'; // neon pink accents
  ctx.lineWidth = Math.max(1, sc * 2);
  for (let offset = -40; offset <= 40; offset += 20) {
    ctx.beginPath();
    ctx.moveTo(sx + sc * offset - sc * 5, sy - sc * 5);
    ctx.lineTo(sx + sc * offset + sc * 5, barTopY + sc * 5);
    ctx.stroke();
  }

  // Bar Patrons (sitting on stools)
  // Let's draw 2 stools
  const stool1X = sx - sc * 40;
  const stool2X = sx + sc * 40;
  const stoolH = sc * 26;
  
  const drawStoolAndPatron = (stX, idx) => {
    // Stool legs
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = Math.max(1, sc * 2);
    ctx.beginPath();
    ctx.moveTo(stX - sc * 6, sy);
    ctx.lineTo(stX, sy - stoolH);
    ctx.moveTo(stX + sc * 6, sy);
    ctx.lineTo(stX, sy - stoolH);
    ctx.stroke();
    // Stool seat
    ctx.fillStyle = '#ff007f';
    ctx.fillRect(stX - sc * 8, sy - stoolH, sc * 16, sc * 3);
    
    // Draw Patron
    const patronOptions = idx === 0 
      ? { skin: '#ffcca3', clothing: '#00ffd2', hair: '#ffe259' }
      : { skin: '#ffcca3', clothing: '#ffe259', hair: '#ff00c1' };
    drawBeachPerson(stX, sy - stoolH + sc * 2, sc, 'sitting', patronOptions);
  };

  drawStoolAndPatron(stool1X, 0);
  drawStoolAndPatron(stool2X, 1);

  // Bartender behind the counter
  drawBeachPerson(sx, barTopY + sc * 30, sc, 'standing', { skin: '#e0ae85', clothing: '#ff00c1', hair: '#00ffd2', wave: true });

  // Thatched Tiki Roof (warm/glowing synthwave purple-magenta triangular thatch)
  ctx.fillStyle = '#ff007f';
  ctx.beginPath();
  ctx.moveTo(leftX - sc * 20, roofBottomY);
  ctx.lineTo(rightX + sc * 20, roofBottomY);
  ctx.lineTo(sx, sy - sc * 125);
  ctx.closePath();
  ctx.fill();
  
  // Roof texture strokes
  ctx.strokeStyle = '#ffe259';
  ctx.lineWidth = Math.max(1, sc * 2);
  ctx.beginPath();
  for (let r = -70; r <= 70; r += 14) {
    ctx.moveTo(sx + sc * r, roofBottomY);
    ctx.lineTo(sx + sc * r * 0.1, sy - sc * 120);
  }
  ctx.stroke();

  // Glowing "BAR" Neon Sign on the roof!
  ctx.fillStyle = '#140526';
  ctx.strokeStyle = '#ff00c1';
  ctx.lineWidth = Math.max(1, sc * 2.5);
  ctx.fillRect(sx - sc * 25, roofBottomY - sc * 24, sc * 50, sc * 15);
  ctx.strokeRect(sx - sc * 25, roofBottomY - sc * 24, sc * 50, sc * 15);

  ctx.fillStyle = (ts % 800 < 600) ? '#00ffd2' : '#304555'; // flashing neon effect
  ctx.font = `bold ${~~(sc * 11)}px "JetBrains Mono", sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText("BAR", sx, roofBottomY - sc * 16.5);

  ctx.restore();
}

function drawBeachIcecreamSprite(sx, sy, sc, ts) {
  const w = ~~(sc * 150); if (w < 8) return;
  const h = ~~(sc * 120);
  
  ctx.save();
  // Shadow on sand
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.ellipse(sx, sy, sc * 90, sc * 13, 0, 0, Math.PI * 2);
  ctx.fill();

  // Seller behind counter (drawn first so the counter covers their lower half)
  drawBeachPerson(sx, sy, sc, 'standing', { skin: '#ffcca3', clothing: '#ffe259', hair: '#00ffd2' });

  // Main Booth Counter Base (covers lower body of seller)
  const boothL = sx - sc * 50;
  const boothR = sx + sc * 50;
  const boothH = sc * 32;
  const boothY = sy - boothH;
  
  ctx.fillStyle = '#0a1d33';
  ctx.strokeStyle = '#ff00c1';
  ctx.lineWidth = Math.max(1.5, sc * 3);
  ctx.fillRect(boothL, boothY, sc * 100, boothH);
  ctx.strokeRect(boothL, boothY, sc * 100, boothH);

  // Pillars on left and right supporting the roof
  ctx.strokeStyle = '#ff00c1';
  ctx.lineWidth = Math.max(1.5, sc * 2.5);
  ctx.beginPath();
  ctx.moveTo(boothL + sc * 5, boothY);
  ctx.lineTo(boothL + sc * 5, sy - sc * 65);
  ctx.moveTo(boothR - sc * 5, boothY);
  ctx.lineTo(boothR - sc * 5, sy - sc * 65);
  ctx.stroke();

  // Striped Awning (Eisstand-Markise)
  const awnY = sy - sc * 72;
  const awnH = sc * 14;
  const numStripes = 8;
  const stripeW = sc * 100 / numStripes;
  
  for (let i = 0; i < numStripes; i++) {
    ctx.fillStyle = (i % 2 === 0) ? '#ff00c1' : '#ffffff';
    ctx.fillRect(boothL + i * stripeW, awnY, stripeW + 0.5, awnH);
  }
  
  // Awning scalloped bottom edge
  ctx.fillStyle = '#ff00c1';
  for (let i = 0; i < numStripes; i++) {
    ctx.beginPath();
    ctx.arc(boothL + i * stripeW + stripeW/2, awnY + awnH, stripeW/2, 0, Math.PI);
    ctx.fill();
  }

  // Giant Glowing Ice Cream Cone Mascot on Roof!
  const coneTopY = awnY - sc * 16;
  ctx.fillStyle = '#dfa15f'; // cone waffle color
  ctx.beginPath();
  ctx.moveTo(sx - sc * 10, coneTopY);
  ctx.lineTo(sx + sc * 10, coneTopY);
  ctx.lineTo(sx, coneTopY + sc * 18);
  ctx.closePath();
  ctx.fill();
  
  // Waffle grid lines
  ctx.strokeStyle = '#8b5a2b';
  ctx.lineWidth = 0.8;
  ctx.beginPath();
  ctx.moveTo(sx - sc*5, coneTopY); ctx.lineTo(sx + sc*5, coneTopY + sc*10);
  ctx.moveTo(sx + sc*5, coneTopY); ctx.lineTo(sx - sc*5, coneTopY + sc*10);
  ctx.stroke();

  // Ice Cream Scoops: 2 glowing scoops!
  const scoopR = sc * 9;
  // Lower scoop: pink/strawberry
  const scoopY1 = coneTopY - sc * 5;
  const gradPink = ctx.createRadialGradient(sx, scoopY1, 1, sx, scoopY1, scoopR);
  gradPink.addColorStop(0, '#ff33a3');
  gradPink.addColorStop(1, '#ff007f');
  ctx.fillStyle = gradPink;
  ctx.beginPath();
  ctx.arc(sx, scoopY1, scoopR, 0, Math.PI * 2);
  ctx.fill();
  
  // Upper scoop: cyan/mint
  const scoopY2 = scoopY1 - sc * 10;
  const gradCyan = ctx.createRadialGradient(sx - sc * 2, scoopY2 - sc * 2, 1, sx, scoopY2, scoopR * 0.8);
  gradCyan.addColorStop(0, '#00ffd2');
  gradCyan.addColorStop(1, '#00a896');
  ctx.fillStyle = gradCyan;
  ctx.beginPath();
  ctx.arc(sx - sc * 2, scoopY2, scoopR * 0.85, 0, Math.PI * 2);
  ctx.fill();

  // Customers in front of ice cream stand
  // Customer 1: standing and waiting for ice cream
  drawBeachPerson(sx - sc * 32, sy, sc, 'standing', { skin: '#e0ae85', clothing: '#00ffd2', hair: '#ff00c1' });
  // Customer 2: sitting nearby propped up on a beach chair eating ice cream
  ctx.fillStyle = '#ff00ffd2';
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = Math.max(1, sc * 2);
  // Beach chair line
  ctx.beginPath();
  ctx.moveTo(sx + sc * 22, sy);
  ctx.lineTo(sx + sc * 45, sy - sc * 15);
  ctx.lineTo(sx + sc * 55, sy);
  ctx.stroke();
  
  drawBeachPerson(sx + sc * 32, sy - sc * 1, sc, 'sitting', { skin: '#ffcca3', clothing: '#ff00c1', hair: '#ffe259' });

  // Lit-up "ICE" sign on the front counter base panel!
  ctx.fillStyle = '#140526';
  ctx.fillRect(sx - sc * 25, sy - sc * 22, sc * 50, sc * 14);
  ctx.strokeStyle = '#00ffd2';
  ctx.lineWidth = Math.max(1, sc * 2);
  ctx.strokeRect(sx - sc * 25, sy - sc * 22, sc * 50, sc * 14);
  
  ctx.fillStyle = (ts % 1000 < 800) ? '#ff00ffd2' : '#304555';
  ctx.font = `bold ${~~(sc * 10)}px "JetBrains Mono", sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText("ICE", sx, sy - sc * 15);

  ctx.restore();
}

function drawStrandedWhaleSprite(sx, sy, sc, ts, rx2 = null, w = null) {
  // Let's make the whale colossally large (Blue Whale!)
  const wsc = sc * 2.4;
  ctx.save();

  // Helper function to draw a retro beach person
  function drawWhaleHelper(x, y, action, bodyColor, key) {
    const hsc = sc * 1.85; // Scale the people up by 1.85x so they can be clearly seen!
    ctx.save();
    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath();
    ctx.ellipse(x, y + hsc * 1, hsc * 5, hsc * 1.5, 0, 0, Math.PI * 2);
    ctx.fill();

    // Body bobbing for cheering action
    let bob = 0;
    if (action === 'wave_cheer') {
      bob = -Math.abs(Math.sin(ts / 150 + key * 1.2)) * hsc * 4;
    }
    const py = y + bob;

    // Head
    ctx.fillStyle = '#ffcca3'; // tanned skin
    ctx.beginPath();
    ctx.arc(x, py - hsc * 14, hsc * 2.5, 0, Math.PI * 2);
    ctx.fill();

    // Body shirt
    ctx.fillStyle = bodyColor;
    ctx.fillRect(x - hsc * 2, py - hsc * 11.5, hsc * 4, hsc * 6);

    // Legs / Pants
    ctx.fillStyle = '#1c2833';
    ctx.fillRect(x - hsc * 1.8, py - hsc * 5.5, hsc * 1.5, hsc * 5.5);
    ctx.fillRect(x + hsc * 0.3, py - hsc * 5.5, hsc * 1.5, hsc * 5.5);

    // Arms
    ctx.strokeStyle = '#ffcca3';
    ctx.lineWidth = Math.max(1, hsc * 1.2);
    ctx.beginPath();

    if (action === 'push') {
      // Reaching forward towards whale
      ctx.moveTo(x - hsc * 1.5, py - hsc * 10);
      ctx.lineTo(x - hsc * 7, py - hsc * 9);
      ctx.moveTo(x + hsc * 1.5, py - hsc * 10);
      ctx.lineTo(x - hsc * 6, py - hsc * 7);
    } else if (action === 'splash') {
      // Swing arm with bucket
      const swing = Math.sin(ts / 200 + key) * 0.6;
      ctx.moveTo(x - hsc * 1.5, py - hsc * 10);
      ctx.lineTo(x - hsc * 5, py - hsc * 7);
      
      // Arm holding bucket
      const armEndX = x + hsc * 6 + swing * hsc * 3;
      const armEndY = py - hsc * 10 + swing * hsc * 4;
      ctx.moveTo(x + hsc * 1.5, py - hsc * 10);
      ctx.lineTo(armEndX, armEndY);
      ctx.stroke();

      // Draw grey bucket
      ctx.fillStyle = '#7f8c8d';
      ctx.beginPath();
      ctx.moveTo(armEndX - hsc * 1, armEndY - hsc * 3);
      ctx.lineTo(armEndX + hsc * 3, armEndY - hsc * 3);
      ctx.lineTo(armEndX + hsc * 2, armEndY + hsc * 1);
      ctx.lineTo(armEndX - hsc * 0.5, armEndY + hsc * 1);
      ctx.closePath();
      ctx.fill();

      // Draw active water splash stream from bucket to whale
      const splashCycle = (ts + key * 300) % 1200;
      if (splashCycle < 700) {
        const p = splashCycle / 700; // 0.0 to 1.0
        const startX = armEndX + hsc * 1;
        const startY = armEndY - hsc * 1;
        const endX = x - hsc * 15; // Splash lands on the whale
        const pathX = startX + (endX - startX) * p;
        const pathY = startY - Math.sin(p * Math.PI) * hsc * 18 + (y - hsc * 6 - startY) * p;

        ctx.fillStyle = 'rgba(174, 219, 255, 0.85)';
        ctx.strokeStyle = 'rgba(215, 239, 255, 0.6)';
        ctx.lineWidth = Math.max(1, hsc * 1.5);
        ctx.beginPath();
        ctx.moveTo(startX, startY);
        ctx.quadraticCurveTo(startX - hsc * 10, startY - hsc * 14, pathX, pathY);
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(pathX, pathY, hsc * (1.8 + Math.random() * 1.5), 0, Math.PI * 2);
        ctx.fill();
      }
    } else if (action === 'wave_cheer') {
      // Hands raised high, waving
      const waveL = Math.sin(ts / 100 + key) * hsc * 4;
      const waveR = Math.cos(ts / 100 + key) * hsc * 4;
      ctx.moveTo(x - hsc * 1.5, py - hsc * 10);
      ctx.lineTo(x - hsc * 6, py - hsc * 18 + waveL);
      ctx.moveTo(x + hsc * 1.5, py - hsc * 10);
      ctx.lineTo(x + hsc * 6, py - hsc * 18 + waveR);
      ctx.stroke();

      // Floating happy hearts rising above cheered helpers
      const heartAge = (ts + key * 500) % 2000;
      const heartP = heartAge / 2000;
      const hx = x + Math.sin(ts / 200 + key) * hsc * 5;
      const hy = py - hsc * 22 - heartP * hsc * 30;
      const hscH = hsc * (1.0 - heartP * 0.4);

      // Draw tiny vector heart
      ctx.fillStyle = '#ff00c1';
      ctx.beginPath();
      ctx.moveTo(hx, hy);
      ctx.bezierCurveTo(hx - hscH * 3, hy - hscH * 3, hx - hscH * 5, hy + hscH * 1, hx, hy + hscH * 5);
      ctx.bezierCurveTo(hx + hscH * 5, hy + hscH * 1, hx + hscH * 3, hy - hscH * 3, hx, hy);
      ctx.fill();
    } else {
      // Idle
      ctx.moveTo(x - hsc * 1.5, py - hsc * 10);
      ctx.lineTo(x - hsc * 4, py - hsc * 5);
      ctx.moveTo(x + hsc * 1.5, py - hsc * 10);
      ctx.lineTo(x + hsc * 4, py - hsc * 5);
      ctx.stroke();
    }

    ctx.restore();
  }

  // Determine current round state of the whale
  const isSaved = (player.lap === 3);

  if (!isSaved) {
    // ------------------ ROUND 1 & 2: STRANDED ON THE BEACH ------------------
    const cx = sx - wsc * 5;
    const cy = sy - sc * 15; // Lifted higher so the underbelly is fully visible
    const r = wsc * 0.95;

    // 0. Huge floor shadow on beach sand (kept low on the sand)
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.beginPath();
    ctx.ellipse(cx, sy + sc * 11, r * 42, r * 6.5, -0.01, 0, Math.PI * 2);
    ctx.fill();

    // 1. Back Flipper (behind the body)
    ctx.fillStyle = '#3a5975'; // Sleek dark slate blue shadow
    ctx.beginPath();
    ctx.ellipse(cx - r * 12, cy + r * 15, r * 7, r * 3.5, Math.PI / 6, 0, Math.PI * 2);
    ctx.fill();

    // 2. Main Body (Back and Head)
    ctx.beginPath();
    // Start at nose (middle-left)
    ctx.moveTo(cx - r * 35, cy + r * 2);
    // Head and Back curve
    ctx.bezierCurveTo(cx - r * 35, cy - r * 26, cx - r * 10, cy - r * 28, cx + r * 10, cy - r * 24);
    // Tail stem upper curve
    ctx.quadraticCurveTo(cx + r * 32, cy - r * 20, cx + r * 42, cy - r * 18);
    // Tail stem bottom curve
    ctx.quadraticCurveTo(cx + r * 36, cy - r * 5, cx + r * 25, cy + r * 6);
    // Bottom belly curve
    ctx.bezierCurveTo(cx + r * 5, cy + r * 18, cx - r * 25, cy + r * 18, cx - r * 35, cy + r * 2);
    ctx.closePath();
    ctx.fillStyle = '#547c9e'; // Premium steel/slate blue-grey back color
    ctx.fill();

    // 3. White Underbelly (Sophisticated light grey-blue off-white)
    ctx.beginPath();
    ctx.moveTo(cx - r * 35, cy + r * 2);
    ctx.quadraticCurveTo(cx - r * 20, cy + r * 8, cx - r * 5, cy + r * 10);
    ctx.quadraticCurveTo(cx + r * 12, cy + r * 11, cx + r * 25, cy + r * 6);
    ctx.bezierCurveTo(cx + r * 12, cy + r * 18, cx - r * 20, cy + r * 18, cx - r * 35, cy + r * 2);
    ctx.closePath();
    ctx.fillStyle = '#f3f7f9';
    ctx.fill();

    // 4. Belly Grooves (Parallel stripes on throat - soft tone)
    ctx.strokeStyle = '#cbdbe5';
    ctx.lineWidth = Math.max(1.0, r * 0.9);
    ctx.lineCap = 'round';
    for (let i = 0; i < 5; i++) {
      ctx.beginPath();
      const startX = cx - r * (30 - i * 4);
      const startY = cy + r * (4 + i * 1.5);
      const endX = cx - r * (25 - i * 5);
      const endY = cy + r * (15 - i * 0.5);
      ctx.moveTo(startX, startY);
      ctx.quadraticCurveTo((startX + endX) / 2 - r * 1.5, (startY + endY) / 2 + r * 1.5, endX, endY);
      ctx.stroke();
    }

    // 6. Symmetrical Tail Fluke Lobes (Schwanzflosse)
    ctx.save();
    ctx.translate(cx + r * 42, cy - r * 18);
    // Draw top lobe
    ctx.fillStyle = '#618cb0';
    ctx.beginPath();
    ctx.ellipse(r * 4, -r * 6, r * 9, r * 5, -Math.PI / 4, 0, Math.PI * 2);
    ctx.fill();
    // Draw bottom lobe
    ctx.fillStyle = '#496f90';
    ctx.beginPath();
    ctx.ellipse(r * 4, r * 3, r * 9, r * 5, Math.PI / 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // 7. Front Flipper
    ctx.save();
    ctx.translate(cx - r * 8, cy + r * 10);
    ctx.fillStyle = '#496f90';
    ctx.beginPath();
    ctx.ellipse(0, 0, r * 10, r * 5, Math.PI / 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // 8. Sad/Worried Eye - Sleek, sophisticated, no googly eyes!
    const eyeX = cx - r * 24;
    const eyeY = cy - r * 4;
    
    ctx.fillStyle = '#2d475e';
    ctx.beginPath();
    ctx.arc(eyeX, eyeY, r * 1.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(eyeX - r * 0.4, eyeY - r * 0.4, r * 0.5, 0, Math.PI * 2);
    ctx.fill();

    // Sad curved eyebrow
    ctx.strokeStyle = '#2d475e';
    ctx.lineWidth = Math.max(1, r * 0.85);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(eyeX, eyeY - r * 4.5, r * 2.8, Math.PI + 0.4, Math.PI * 2 - 0.4);
    ctx.stroke();

    // 9. Worried/Straight Mouth
    ctx.strokeStyle = '#2d475e';
    ctx.lineWidth = Math.max(1.2, r * 1.15);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(cx - r * 32, cy + r * 5);
    ctx.quadraticCurveTo(cx - r * 24, cy + r * 6, cx - r * 18, cy + r * 3);
    ctx.stroke();

    // 10. Warm Pink Blush Cheek
    ctx.fillStyle = 'rgba(255, 90, 150, 0.22)';
    ctx.beginPath();
    ctx.ellipse(cx - r * 14, cy + r * 1.5, r * 3, r * 2, 0, 0, Math.PI * 2);
    ctx.fill();

    // 11. Gloss Highlight on Back
    ctx.fillStyle = 'rgba(255, 255, 255, 0.32)';
    ctx.beginPath();
    ctx.ellipse(cx - r * 18, cy - r * 18, r * 6, r * 2, -Math.PI / 8, 0, Math.PI * 2);
    ctx.fill();

    // 12. Active Blowhole & Splash animation (even when stranded, splashing keeps him wet!)
    const bhX = cx - r * 10;
    const bhY = cy - r * 25;
    ctx.save();

      ctx.bezierCurveTo(r * 4.5, -sprayHeight, r * 3.5, -sprayHeight * 0.5, 0, -r * 1.5);
      ctx.fill();

      ctx.bezierCurveTo(-r * 4.5, -sprayHeight * 0.8, -r * 1.5, -sprayHeight * 0.4, -r * 1, -r * 1.5);

      ctx.beginPath();

      ctx.ellipse(-r * 5.5, -sprayHeight * 0.65, r * 0.7, r * 1.0, -Math.PI/6, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(r * 5.5, -sprayHeight * 0.65, r * 0.7, r * 1.0, Math.PI/6, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    // 13. Beach Helpers trying to save the whale (Round 1 & 2)

    drawWhaleHelper(sx - wsc * 18, sy + sc * 17, 'push', '#2a9d8f', 2);   // mid-left pushing
    drawWhaleHelper(sx + wsc * 6, sy + sc * 15, 'splash', '#f4a261', 3);   // mid-right splashing
    drawWhaleHelper(sx + wsc * 28, sy + sc * 13, 'push', '#457b9d', 4);   // rear tail pushing

  } else {

    // 3. White Underbelly

    ctx.quadraticCurveTo(oceanX - r * 20, oceanY + r * 8, oceanX - r * 5, oceanY + r * 10);
    ctx.quadraticCurveTo(oceanX + r * 12, oceanY + r * 11, oceanX + r * 25, oceanY + r * 6);
    ctx.bezierCurveTo(oceanX + r * 12, oceanY + r * 18, oceanX - r * 20, oceanY + r * 18, oceanX - r * 35, oceanY + r * 2);
    ctx.closePath();
    ctx.fillStyle = '#f3f7f9';
    ctx.fill();

    // 4. Belly Grooves
    ctx.strokeStyle = '#cbdbe5';
    ctx.lineWidth = Math.max(1.0, r * 0.9);
    ctx.lineCap = 'round';
    for (let i = 0; i < 5; i++) {
      ctx.beginPath();
      const startX = oceanX - r * (30 - i * 4);
      const startY = oceanY + r * (4 + i * 1.5);
      const endX = oceanX - r * (25 - i * 5);
      const endY = oceanY + r * (15 - i * 0.5);
      ctx.moveTo(startX, startY);
      ctx.quadraticCurveTo((startX + endX) / 2 - r * 1.5, (startY + endY) / 2 + r * 1.5, endX, endY);

    ctx.beginPath();
    ctx.ellipse(r * 4, -r * 6, r * 9, r * 5, -Math.PI / 4, 0, Math.PI * 2);

    // Draw bottom lobe
    ctx.fillStyle = '#496f90';
    ctx.beginPath();
    ctx.ellipse(r * 4, r * 3, r * 9, r * 5, Math.PI / 4, 0, Math.PI * 2);

    // 9. Gigantic Happy Smile Mouth

    ctx.beginPath();
    ctx.moveTo(oceanX - r * 32, oceanY + r * 3);
    ctx.quadraticCurveTo(oceanX - r * 22, oceanY + r * 10, oceanX - r * 14, oceanY + r * 3);
    ctx.lineTo(oceanX - r * 13, oceanY + r * 1.5);
    ctx.stroke();

    // 10. Warm Pink Blush Cheek
    ctx.fillStyle = 'rgba(255, 90, 150, 0.25)';
    ctx.beginPath();
    ctx.ellipse(oceanX - r * 14, oceanY + r * 1.5, r * 3.5, r * 2.3, 0, 0, Math.PI * 2);
    ctx.fill();

    // 11. Gloss Highlight on Back
    ctx.fillStyle = 'rgba(255, 255, 255, 0.32)';
    ctx.beginPath();
    ctx.ellipse(oceanX - r * 18, oceanY - r * 18, r * 6, r * 2, -Math.PI / 8, 0, Math.PI * 2);
    ctx.fill();

    // 12. Spouting Blowhole
    const bhX = oceanX - r * 10;
    const bhY = oceanY - r * 25;
    ctx.save();
    ctx.translate(bhX, bhY);
    ctx.fillStyle = '#2d475e';
    ctx.beginPath();
    ctx.ellipse(0, 0, r * 3, r * 1, 0, 0, Math.PI * 2);
    ctx.fill();

    const activeCycle = ts % 3000;
    if (activeCycle > 400 && activeCycle < 2000) {
      let blowProgress = 0;
      if (activeCycle < 1000) blowProgress = (activeCycle - 400) / 600;
      else if (activeCycle < 1400) blowProgress = 1.0;
      else blowProgress = 1.0 - (activeCycle - 1400) / 600;

      const sprayHeight = r * 14 * blowProgress;
      ctx.fillStyle = '#78c0ff';
      ctx.strokeStyle = '#a4d4ff';
      ctx.lineWidth = r * 0.8;

      // Center droplet
      ctx.beginPath();
      ctx.moveTo(0, -r * 1.5);
      ctx.bezierCurveTo(-r * 3.5, -sprayHeight * 0.5, -r * 4.5, -sprayHeight, 0, -sprayHeight);
      ctx.bezierCurveTo(r * 4.5, -sprayHeight, r * 3.5, -sprayHeight * 0.5, 0, -r * 1.5);
      ctx.fill();
      ctx.stroke();

      // Left curved droplet
      ctx.beginPath();
      ctx.moveTo(-r * 1, -r * 1.5);
      ctx.bezierCurveTo(-r * 6.5, -sprayHeight * 0.4, -r * 9, -sprayHeight * 0.7, -r * 7.5, -sprayHeight * 0.8);
      ctx.bezierCurveTo(-r * 4.5, -sprayHeight * 0.8, -r * 1.5, -sprayHeight * 0.4, -r * 1, -r * 1.5);
      ctx.fill();
      ctx.stroke();

      // Right curved droplet
      ctx.beginPath();
      ctx.moveTo(r * 1, -r * 1.5);
      ctx.bezierCurveTo(r * 6.5, -sprayHeight * 0.4, r * 9, -sprayHeight * 0.7, r * 7.5, -sprayHeight * 0.8);
      ctx.bezierCurveTo(r * 4.5, -sprayHeight * 0.8, r * 1.5, -sprayHeight * 0.4, r * 1, -r * 1.5);
      ctx.fill();
      ctx.stroke();

      // White highlights inside droplets
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.ellipse(0, -sprayHeight * 0.8, r * 0.9, r * 1.3, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(-r * 5.5, -sprayHeight * 0.65, r * 0.7, r * 1.0, -Math.PI/6, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(r * 5.5, -sprayHeight * 0.65, r * 0.7, r * 1.0, Math.PI/6, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    ctx.restore();

    // 13. Splashing water overlays around the happy swimming whale!
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
    ctx.lineWidth = Math.max(1.8, sc * 2.8);
    for (let i = -1.2; i <= 1.2; i += 0.4) {
      const wx = oceanX + i * r * 22;
      const wy = oceanY + r * 10 + Math.sin(ts / 200 + i * 4) * r * 2;
      ctx.beginPath();
      ctx.moveTo(wx - r * 14, wy);
      ctx.quadraticCurveTo(wx, wy - r * 3, wx + r * 14, wy);
      ctx.stroke();
    }

    // 14. Happy people cheering and waving from the Beach (at the original beach coordinates sx, shifted closer to water line)
    const helpersCenterX = (rx2 !== null && w !== null) ? (rx2 + 3.1 * w) : (sx + sc * 55);
    drawWhaleHelper(helpersCenterX - sc * 25, sy + sc * 12, 'wave_cheer', '#e63946', 1);
    drawWhaleHelper(helpersCenterX - sc * 8, sy + sc * 14, 'wave_cheer', '#2a9d8f', 2);
    drawWhaleHelper(helpersCenterX + sc * 8, sy + sc * 13, 'wave_cheer', '#f4a261', 3);
    drawWhaleHelper(helpersCenterX + sc * 25, sy + sc * 11, 'wave_cheer', '#457b9d', 4);
  }

  ctx.restore();
}

function drawPylonSprite(cx, cy, sc, rot = 0) {

      ctx.beginPath(); ctx.ellipse(0, 0, r * 1.6, r * 0.45, 0, 0, Math.PI * 2); ctx.fill();
    }
    // Hovering energy ball glow (centered around -h * 0.4)
    ctx.fillStyle = 'rgba(0, 240, 255, 0.35)';

    ctx.fillStyle = '#21d4fd';
    ctx.beginPath(); ctx.arc(0, -h * 0.4, r, 0, Math.PI * 2); ctx.fill();
    
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(0, -h * 0.4, r * 0.45, 0, Math.PI * 2); ctx.fill();
  } else {
    if (rot === 0) { ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.beginPath(); ctx.ellipse(0, 0, w*0.6, w*0.2, 0, 0, Math.PI*2); ctx.fill(); }
    ctx.fillStyle = '#ff6b35'; 
    ctx.beginPath(); ctx.moveTo(0, -h); ctx.lineTo(w*0.5, 0); ctx.lineTo(-w*0.5, 0); ctx.fill();

  }

}

function drawDetourBarrier(s){
  // Road-space scaling keeps the visible ends aligned with the collision box.
  const w=s.visualHalfWidth*2*s.roadHalf,h=s.roadHalf*.23;
  if(w<2)return;
  ctx.save();ctx.translate(s.x,s.y);
  sceneRect(-w*.5,-2,w,5,'#272233');
  for(const x of[-.45,0,.45]){sceneRect(x*w-w*.018,-h,w*.036,h,'#514755');sceneRect(x*w-w*.055,-3,w*.11,5,'#292632');}
  for(const y of[-h,-h*.43]){
    sceneRect(-w/2-1,y-1,w+2,h*.28+2,'#3a293a');
    for(let j=0;j<8;j++)sceneRect(-w/2+j*w/8,y,w/8+.5,h*.28,j%2?'#fff0d6':'#ff843b');
  }
  for(const [i,x]of[-.42,0,.42].entries()){
    const lit=(Math.floor(chapterTime/320)+i)%2===0,r=Math.max(1.5,h*.09);
    if(lit){const g=ctx.createRadialGradient(x*w,-h-r,0,x*w,-h-r,r*4);g.addColorStop(0,'#ffcf6bbb');g.addColorStop(1,'#ffb13000');sceneEllipse(x*w,-h-r,r*4,r*4,g);}
    sceneEllipse(x*w,-h-r,r,r,lit?'#fff4ad':'#a75c31');
  }
  ctx.restore();
}

function drawBarrierSprite(cx, cy, sc, blinkCount) {
  if (blinkCount % 2 !== 0) return; 
  const w = ~~(sc * 190), h = ~~(sc * 90); if (w < 4) return;
  ctx.save(); ctx.translate(cx, cy);
  ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(-w/2, -5, w, h*0.1); 
  ctx.fillStyle = '#555555'; 
  const postW = Math.max(2, w * 0.12);
  ctx.fillRect(-w*0.42, -h, postW, h); ctx.fillRect(w*0.42 - postW, -h, postW, h);
  const barH = Math.max(4, h * 0.28);
  const drawBar = (yOff) => {
    const sections = 4, secW = w / sections;
    for (let i=0; i<sections; i++) {
      ctx.fillStyle = i % 2 === 0 ? '#ff6b35' : '#ffffff'; 
      ctx.fillRect(-w/2 + i*secW, -h + yOff, secW, barH);

  drawBar(0); drawBar(h * 0.5);
  ctx.restore();
}

function drawLightningSprite(cx, cy, sc) {
  const w = ~~(sc * 28), h = ~~(sc * 60); if (w < 2) return;

  ctx.lineTo(-w*0.3, h/2); ctx.lineTo(w*0.5, -h*0.1); ctx.lineTo(w*0.1, -h*0.2);
